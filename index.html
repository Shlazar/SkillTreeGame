// ---------- what stands in each chunk (called by plan; put / take / rng are plan's own)
// The woods at the far sides (clumps on a loose grid), a grove or a lone tree out in the grass now
// and then (kept away from the rails), hay bales on the dirt fields, a wreck on a farm track, a
// broken fence by a track, crossing signs where a track crosses the line, and the poles.
function landPlan(pl, ci, cj, rng, put, take) {
  const X0 = ci * CH, Y0 = cj * CH;
  for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
    const x = X0 + gx * 32 + 6 + rng() * 20 + (gy & 1) * 10, y = Y0 + gy * 32 + 6 + rng() * 20;
    if (!inWoods(x, y, 14) || roadDist(x, y) < 16) continue;
    put(take(PROPS.wood), x, y);
  }
  for (let k = 0; k < 3; k++) {
    const x = X0 + rng() * CH, y = Y0 + rng() * CH, r = rng();
    if (inWoods(x, y, -24) || nearRail(x, y, 70) || roadDist(x, y) < 18 || fieldVal(x, y) > FIELD_T - 0.04) continue;
    if (r < 0.16) put(take(PROPS.grove), x, y);
    else if (r < 0.34) put(take(PROPS.tree1), x, y);
  }
  // hay bales in a row on a field
  if (rng() < 0.3) {
    const x = X0 + 20 + rng() * 88, y = Y0 + 20 + rng() * 88;
    if (fieldVal(x, y) > FIELD_T + 0.05 && !nearRail(x, y, 50) && roadDist(x, y) > 14) {
      for (let k = 0; k < 2 + ((rng() * 3) | 0); k++) put(PROPS.hay[0], x + k * 14 + rng() * 4, y + rng() * 5);
    }
  }
  // a wreck on a farm track (a third of them burning), a broken fence beside one
  if (rng() < 0.18) {
    for (let k = 0; k < 10; k++) {
      const x = X0 + 12 + rng() * (CH - 24), y = Y0 + 8 + rng() * (CH - 16);
      if (roadDist(x, y) > 3 || nearRail(x, y, 70)) continue;
      const burning = rng() < 0.3;
      put(take(burning ? PROPS.burnt : PROPS.wreck), x, y);
      if (burning) pl.fires.push({ x: Math.round(x) + 1, y: Math.round(y) - 7, seed: (rng() * 1000) | 0, big: true });
      break;
    }
  }
  if (PROPS.fence && rng() < 0.35) {
    for (let k = 0; k < 6; k++) {
      const x = X0 + rng() * CH, y = Y0 + rng() * CH, rd = roadDist(x, y);
      if (rd < 10 || rd > 13 || nearRail(x, y, 40) || inWoods(x, y, -10)) continue;
      put(take(PROPS.fence), x, y);
      break;
    }
  }
  // crossing signs on both sides of the rails where a farm track crosses them
  if (PROPS.sign) for (let y = Y0; y < Y0 + CH; y += 4) {
    const tx = trackX(y);
    if (roadDist(tx, y) > 1.5 || roadDist(tx, y - 4) < roadDist(tx, y)) continue;
    for (const s of [-1, 1]) {
      const x = tx + s * 19;
      if (x >= X0 && x < X0 + CH) put(PROPS.sign[2], x, y + s * 10);
    }
    y += 40;
  }
  // telegraph poles beside the railway, one every 72 px (the wires hang between them)
  for (let y = Math.ceil(Y0 / 72) * 72; y < Y0 + CH; y += 72) {
    const px = trackX(y) + 27;
    if (px >= X0 && px < X0 + CH) put(PROPS.pole[0], px, y);
  }
}

// ---------- the sprite atlas, filled at start-up
// Every small sprite made at start-up goes into the atlas now, before anything is drawn from it
// (a sprite added later costs a lot the first time, see atl in core.js). Walks any arrays and
// objects of sprites: the dead, the train (also red when hit), survivors, props, the station, the
// safe zone, and the glows of the usual light colours. The thermal sprites go last.
const GLOW_COLS = ['#fff1c2', '#ffb060', '#ffd27a', '#ffd24a', '#ff8a3a', '#ffb347', '#ffe2a0', '#ffc27a', '#ff9a4a',
  '#ffffff', '#fff6e0', '#fff1d8', '#ffd36a', '#ff9a3a', '#ff7a28', '#ff6a28', '#ff4a32', '#e3b04b'];
function warmAtlas() {
  const hot = [];
  const visit = (o, d) => {
    if (!o || d > 5) return;
    if (o instanceof HTMLCanvasElement) { atl(o); return; }
    if (Array.isArray(o)) { for (const v of o) visit(v, d + 1); return; }
    if (typeof o !== 'object') return;
    for (const k in o) {
      // (thermal sprites: h, hf, deadH, spinH, and the cars' h lists)
      if (k === 'h' || k === 'hf' || k === 'deadH' || k === 'spinH') { hot.push(o[k]); continue; }
      if (k !== 'pal') visit(o[k], d + 1);
    }
  };
  for (const t of TRAIN) for (let i = 0; i < ANG_N; i++) carRed(t, i);
  visit(ZS, 0);
  visit(TRAIN, 0);
  visit(FOOT, 0);
  visit(SURV, 0);
  for (const c of GLOW_COLS) atl(glow(c));
  for (const k in PROPS) for (const p of PROPS[k]) visit([p.spr, p.sh], 0);
  for (const g of [SCN, STATION, SAFE]) for (const k in g) if (g[k]) visit(g[k].spr ? [g[k].spr, g[k].sh] : g[k], 0);
  for (const h of hot) visit(h, 0);
}

// fx.js - the effects, in the Ball x Archers style: particles (dirt and blood land and stay on the
// ground as decal pixels), fire explosions made of pixel puffs, rings, glows, floating numbers,
// coins that fly to the cash counter, banners, screen shake and hit-stop, and the scorch marks.
// Positions are world pixels (x, y on the ground, z = height), except coins and banners (screen).

// ---------- shake, kick and hit-stop
const cam = { trauma: 0, t: 0, kx: 0, ky: 0 };
let shakeReq = 0, slowT = 0, slowK = 1;
// Ask for screen shake of strength a (weaker with reduced motion).
function addShake(a) {
  shakeReq = Math.max(shakeReq, a * (REDUCED ? 0.3 : 1));
}
// Slow motion for d seconds at time scale k (default 0.12). Off with reduced motion.
function hitStop(d, k) {
  if (REDUCED) return;
  slowT = Math.max(slowT, d);
  slowK = Math.min(slowK, k == null ? 0.12 : k);
}
// Knock the view by (x, y) pixels; it springs back fast. A gun's recoil.
function kick(x, y) {
  if (REDUCED) return;
  cam.kx = clamp(cam.kx + x, -3, 3);
  cam.ky = clamp(cam.ky + y, -3, 3);
}
function updateCam(dt) {
  cam.t += dt;
  cam.trauma = Math.min(1, cam.trauma + shakeReq * (1 - cam.trauma * 0.6));
  shakeReq = 0;
  cam.trauma = Math.max(0, cam.trauma - dt * 2);
  const k = Math.exp(-16 * dt);
  cam.kx *= k;
  cam.ky *= k;
}
// Screen shake offset [x, y]. Strength = trauma squared; two sine waves per axis, plus the kick.
function shakeOff() {
  const s = cam.trauma * cam.trauma * 5;
  return [Math.round((Math.sin(cam.t * 71.3) + Math.sin(cam.t * 37.9) * 0.6) * s * 0.6 + cam.kx),
    Math.round((Math.sin(cam.t * 53.1 + 1.3) + Math.sin(cam.t * 29.7) * 0.6) * s * 0.6 + cam.ky)];
}

// ---------- effect lists
const parts = [], lights = [], booms = [], rings = [], texts = [], banners = [], coins = [], flames = [];
function clearFX() {
  for (const a of [parts, lights, booms, rings, texts, banners, coins, flames]) a.length = 0;
  clearDecals();
}

// Add one particle (o itself becomes the particle). Returns null when a limit is hit: 2600
// particles in all and about 260 glowing ("add") ones. o = {x, y, z, vx, vy, vz, g (gravity),
// life, max, s (size), c (color), add (glows), land (1 = becomes a ground pixel when it lands),
// drag, grow, smoke (fades softly)}.
let ADD = 0;
function part(o) {
  if (parts.length >= 2600) return null;
  if (o.add) {
    if (ADD >= 260) return null;
    ADD++;
  }
  if (o.land === undefined) o.land = 0;
  parts.push(o);
  return o;
}

// A fire explosion: R = size in px, n puffs, T seconds, cap = biggest puff radius,
// delay = seconds before it starts.
function addBoom(x, y, R, n, T, cap, delay) {
  const pf = [];
  for (let i = 0; i < n; i++) pf.push({ a: i * TAU / n + rnd(-0.5, 0.5), d: rnd(0.2, 0.45), s: rnd(0.42, 0.6), up: rnd(0.3, 0.6) });
  booms.push({ x, y, r: R, t: -(delay || 0), T, cap: cap || 7, pf });
}

// A floating "+N" over (x, y) ("-N" when neg: damage). size can be a numeric text scale or the old
// small/large boolean. A nearby total of the same color adds up and keeps the larger scale.
function addTotal(x, y, v, c, size, neg) {
  const sign = neg ? '-' : '+';
  const scale = typeof size === 'number' ? Math.max(1, Math.round(size)) : size ? 2 : 1;
  const big = scale > 1;
  for (const t of texts) {
    if (t.tot && t.c === c && t.sign === sign && t.life > t.max * 0.35 && Math.abs(t.x - x) < 24 && Math.abs(t.y - y) < 18) {
      t.val += v;
      t.v = sign + fmt(t.val);
      t.life = t.max;
      t.hot = 0.05;
      t.s = Math.max(t.s, scale, t.val >= 20 ? 2 : 1);
      return;
    }
  }
  if (texts.length >= 40) return;
  texts.push({ tot: true, sign, x, y, z: 16, vz: big ? 40 : 28, vx: 0, s: scale, c, val: v, v: sign + fmt(v),
    life: big ? 1 : 0.75, max: big ? 1 : 0.75, hot: 0.06 });
}
// A word that floats up from (x, y), like OVERHEAT.
function floatText(x, y, s, c) {
  if (texts.length >= 40) return;
  texts.push({ x, y, z: 18, vz: 22, vx: 0, s: 1, c, v: s, life: 0.9, max: 0.9, hot: 0.05 });
}

// A big banner: a = title, b = subtitle, c = color. pri = priority: a newer banner does not
// replace a young one (under 0.6 s) with a higher priority.
function banner(a, b, c, pri) {
  pri = pri || 0;
  const o = banners[0];
  if (o && o.t < 0.6 && (o.pri || 0) > pri) return;
  banners.length = 0;
  banners.push({ a, b: b || '', c: c || U.ink, t: 0, T: 2.2, pri });
  SFX.banner();
}

// ---------- update
function updateFX(dt) {
  ADD = 0;
  // particles: gravity, drag, growth. A falling particle with land = 1 becomes a ground pixel
  // when it lands; the others stop and slide.
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) {
      parts[i] = parts[parts.length - 1];
      parts.pop();
      continue;
    }
    if (p.add) ADD++;
    p.vz -= (p.g || 0) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    if (p.drag) {
      const k = Math.exp(-p.drag * dt);
      p.vx *= k;
      p.vy *= k;
      if (!p.g) p.vz *= k;
    }
    if (p.grow) p.s += p.grow * dt;
    if (p.g > 0 && p.z <= 0 && p.vz < 0) {
      p.z = 0;
      if (p.land === 1) {
        stampPix(p.x, p.y, p.c, p.s | 0 || 1);
        parts[i] = parts[parts.length - 1];
        parts.pop();
        continue;
      }
      p.vz = 0;
      p.vx *= 0.6;
      p.vy *= 0.6;
    }
  }
  // lights, explosions and rings only age and go
  for (let i = lights.length - 1; i >= 0; i--) {
    lights[i].life -= dt;
    if (lights[i].life <= 0) {
      lights[i] = lights[lights.length - 1];
      lights.pop();
    }
  }
  for (let i = booms.length - 1; i >= 0; i--) {
    booms[i].t += dt;
    if (booms[i].t >= booms[i].T) booms.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].t += dt;
    if (rings[i].t >= rings[i].T) rings.splice(i, 1);
  }
  // floating texts rise and slow down
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    if (t.hot > 0) t.hot -= dt;
    t.z += t.vz * dt;
    t.vz -= 70 * dt;
    t.x += t.vx * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }
  // coins fly to the cash counter; when one gets there the counter jumps
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.t += dt;
    if (c.t >= c.T) {
      coins.splice(i, 1);
      if (G) G.cashPulse = 1;
      if (G && !G.demo) SFX.coin();
    }
  }
  // small fires left by the 105: tongues of flame, embers and smoke
  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];
    f.life -= dt;
    if (f.life <= 0) {
      flames.splice(i, 1);
      continue;
    }
    if (Math.random() < dt * 5) part({ x: f.x + rnd(-1.5, 1.5), y: f.y, z: rnd(2, 4), vx: rnd(-4, 4), vy: rnd(-2, 2), vz: rnd(14, 26),
      g: -4, life: rnd(0.4, 0.8), max: 0.8, s: 1, c: pick(['#ffc27a', '#ff8a3a', '#e2552f']), add: true, drag: 1.5 });
    if (Math.random() < dt * 1.6) part({ x: f.x + rnd(-1, 1), y: f.y, z: 5, vx: rnd(3, 8), vy: rnd(-2, 2), vz: rnd(7, 12),
      g: 0, life: rnd(1.4, 2.2), max: 2.2, s: rnd(2, 3), c: pick(['rgba(92,88,84,0.55)', 'rgba(120,116,110,0.45)']), grow: 2.5, drag: 0.4, smoke: true });
  }
}

// ---------- marks on the ground
// SCORCH[k]: a dark dithered ellipse, radius 4 (a 25mm round), 9, 16 and 24 (the 105 crater with
// a rim of thrown-up earth).
const SCORCH = [];
function bakeScorch() {
  SCORCH.length = 0;
  for (const R of [4, 9, 16, 24]) {
    const Ry = Math.round(R * FORE), rg = mulberry(R * 7 + 1), w = R * 2 + 3, h = Ry * 2 + 3;
    SCORCH.push(pix(w, h, (r) => {
      for (let y = -Ry - 1; y <= Ry + 1; y++) for (let x = -R - 1; x <= R + 1; x++) {
        const d = Math.hypot(x / R, y / Ry) + (rg() - 0.5) * 0.2, X = x + R + 1, Y = y + Ry + 1;
        if (d > 1.08) continue;
        if (d > 0.88) {
          if (R > 8 && rg() < 0.6) r(X, Y, 1, 1, rg() < 0.5 ? 'rgba(96,80,58,0.85)' : 'rgba(64,53,41,0.85)');
          continue;
        }
        if (R > 8 && d < 0.55) r(X, Y, 1, 1, d < 0.3 ? 'rgba(8,6,5,0.82)' : 'rgba(16,12,9,0.72)');
        else if ((1 - d) * 1.8 > bayer(X, Y) + 0.1) r(X, Y, 1, 1, d < 0.45 ? 'rgba(12,9,7,0.62)' : 'rgba(26,19,13,0.5)');
      }
    }));
  }
}
function stampScorch(x, y, k) {
  const s = SCORCH[k];
  stampSpr(s, x - (s.width >> 1), y - (s.height >> 1), 1);
}
// One of the 2 corpse images of zombie sprite set S, with its pool of blood.
function stampCorpse(S, x, y) {
  stampSpr(S.corpses[(Math.random() * 2) | 0], x - S.cax, y - S.cay, 0.9);
  bloodPool(x, y, S);
}

// ---------- drawing (world layer, under the camera transform)
// Explosion colors, from white hot through yellow and orange to grey smoke (5 to 7).
const BC = ['#ffffff', '#fff3b0', '#ffd25a', '#ffa23a', '#f0702a', '#8f8a83', '#aca79f', '#cac5bd'];

// Particles. add = true: only the glowing ones (drawn with 'lighter'), false: only the others.
function drawParts(add) {
  // (the alpha in eighths, and the colour and alpha only set when they change: most are drops of
  // blood and dirt at full alpha, so a thousand of them cost little)
  let la = -1, lc = '';
  for (const p of parts) {
    if (!!p.add !== add) continue;
    const a = add || p.smoke ? clamp(Math.ceil((p.smoke ? Math.min(1, p.life / p.max * 1.5) : p.life / p.max) * 8) / 8, 0, 1) : 1;
    if (a !== la) { ctx.globalAlpha = la = a; }
    if (p.c !== lc) { ctx.fillStyle = lc = p.c; }
    const s = Math.max(1, Math.round(p.s));
    // (a big puff of smoke is round)
    if (p.smoke && s >= 5) pcirc(p.x, p.y - p.z, s / 2, p.c);
    else ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - p.z - s / 2), s, s);
  }
  ctx.globalAlpha = 1;
}
// Fire explosions: a white flash with a yellow edge, then fat puffs (white hot in the middle,
// yellow and orange outside) that swell, rise and cool into grey smoke.
function drawBooms() {
  const many = booms.length > 10;
  for (const b of booms) {
    if (b.t < 0) continue;
    const u = b.t / b.T, e = 1 - Math.pow(1 - u, 3);
    if (u < 0.06) {
      const r = Math.min(b.cap, b.r * 0.45);
      pcirc(b.x, b.y - 3, r + 1, '#ffd25a');
      pcirc(b.x, b.y - 3, r, '#ffffff');
      continue;
    }
    const fade = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
    const n = many ? Math.min(3, b.pf.length) : b.pf.length;
    // three passes, so the puffs read as one ball: a deep orange rim under the fire (a soft grey
    // one under the smoke), the puffs (the outer ones cool first), then their lit tops with a
    // white-hot heart while it is young
    for (let pass = 0; pass < 3; pass++) for (let i = 0; i < n; i++) {
      const p = b.pf[i], k = 0.55 + 0.7 * e, ci = clamp((u * 10 + (p.d - 0.32) * 5) | 0, 0, 7);
      const px = b.x + Math.cos(p.a) * b.r * p.d * k,
        py = b.y - 3 + Math.sin(p.a) * b.r * p.d * k * FORE - b.r * p.up * e,
        pr = Math.min(b.cap, b.r * p.s * (0.55 + 0.35 * e)) * (0.6 + 0.4 * fade);
      if (pr < 1) continue;
      const fire = ci < 5;
      if (pass === 0) {
        ctx.globalAlpha = fire ? 1 : 0.3 * fade;
        pcirc(px + 1, py + 1, pr + 1, fire ? '#c2401a' : '#5e5a55');
      } else if (pass === 1) {
        ctx.globalAlpha = fire ? 1 : 0.7 * fade;
        pcirc(px, py, pr, BC[ci]);
      } else if (fire) {
        ctx.globalAlpha = 1;
        pcirc(px - pr * 0.3, py - pr * 0.35, pr * 0.55, BC[Math.max(0, ci - 1)]);
        if (ci < 3) pcirc(px - pr * 0.36, py - pr * 0.42, pr * 0.25, '#ffffff');
      } else {
        ctx.globalAlpha = 0.5 * fade;
        pcirc(px - pr * 0.3, py - pr * 0.35, pr * 0.5, BC[7]);
      }
    }
    ctx.globalAlpha = 1;
  }
}
// Rings that grow on the ground and fade (draw with 'lighter').
function drawRings() {
  for (const r of rings) {
    const u = r.t / r.T, rr = lerp(r.r0, r.r1, 1 - Math.pow(1 - u, 2));
    ctx.globalAlpha = 1 - u;
    pell(r.x, r.y, rr, rr * FORE, r.c);
    if (r.w > 1) pell(r.x, r.y, rr - 1, (rr - 1) * FORE, r.c);
  }
  ctx.globalAlpha = 1;
}
// Effect glows (draw with 'lighter').
function drawLights() {
  for (const l of lights) light(l.x, l.y - l.z, l.r, l.c, l.a * (l.life / l.max));
  ctx.globalAlpha = 1;
}
// Floating numbers and words.
function drawTexts() {
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life / t.max * 2, 0, 1);
    text(t.v, t.x, t.y - t.z, t.hot > 0 ? '#ffffff' : t.c, { align: 'center', scale: t.s });
  }
  ctx.globalAlpha = 1;
}
// A small fire: a flickering flame of a few pixels (big = a burning wreck).
function drawFlame(x, y, big, seed) {
  const f = Math.sin(realT * 19 + seed) * 0.5 + Math.sin(realT * 31 + seed * 1.7) * 0.5;
  const g = Math.sin(realT * 23 + seed * 3.1);
  x = Math.round(x);
  y = Math.round(y);
  if (big) {
    ctx.fillStyle = '#c9772f';
    ctx.fillRect(x - 4, y - 1, 9, 1);
    ctx.fillStyle = '#e2552f';
    ctx.fillRect(x - 3, y - 5, 7, 4);
    ctx.fillStyle = '#ff8a3a';
    ctx.fillRect(x - 2, y - 7 - (f > 0 ? 1 : 0), 5, 6);
    ctx.fillStyle = '#ffcf6a';
    ctx.fillRect(x - 1, y - 5, 3, 4);
    ctx.fillStyle = '#fff1c2';
    ctx.fillRect(x, y - 3, 1, 2);
    ctx.fillStyle = '#ff8a3a';
    ctx.fillRect(x - 1 + (f > 0.2 ? 1 : 0), y - 10 - (g > 0 ? 1 : 0), 2, 3);
    ctx.fillStyle = '#e2552f';
    ctx.fillRect(x + (f < -0.2 ? -2 : 2), y - 12 - (g > 0.5 ? 1 : 0), 1, 2);
    ctx.fillRect(x + (g < 0 ? -3 : 3), y - 8, 1, 1);
  } else {
    ctx.fillStyle = '#c9772f';
    ctx.fillRect(x - 2, y - 1, 5, 1);
    ctx.fillStyle = '#ffcf6a';
    ctx.fillRect(x - 1, y - 3, 3, 2);
    ctx.fillStyle = '#ff8a3a';
    ctx.fillRect(x - 1 + (f > 0.2 ? 1 : 0), y - 5 - (f > 0 ? 1 : 0), 2, 2);
    ctx.fillStyle = '#e2552f';
    ctx.fillRect(x + (f < -0.2 ? -1 : 1), y - 7, 1, 1);
  }
}

// ---------- drawing (screen layer)
function currencyCoins(cur, x, y, n) {
  for (let k = 0; k < n && coins.length < 60; k++) coins.push({ cur,
    x0: x - G.camX + rnd(-6, 6), y0: y - G.camY - 10 + rnd(-4, 4), t: -k * 0.05, T: rnd(0.5, 0.75) });
}
// Coins on a curve from where the zombie fell to the cash counter (top left).
function drawCoins() {
  for (const c of coins) {
    if (c.t < 0) continue;
    const cur = c.cur || 'scrap', target = currencyX(cur);
    if (target == null) continue;
    const u = ease(c.t / c.T);
    const x = lerp(c.x0, target, u) + Math.sin(u * Math.PI) * -20, y = lerp(c.y0, 8, u) - Math.sin(u * Math.PI) * 30;
    // one step in three the coin is drawn thin, so it seems to spin
    const wob = ((realT * 16 + c.x0) | 0) % 3;
    ctx.fillStyle = cur === 'gold' ? '#7a5a1c' : cur === 'surv' ? '#944723' : '#285573';
    ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, wob === 1 ? 1 : 3, 3);
    ctx.fillStyle = cur === 'gold' ? '#f6dc8e' : cur === 'surv' ? U.amber : U.blue;
    ctx.fillRect(Math.round(x) - (wob === 1 ? 0 : 1), Math.round(y) - 1, 1, 1);
  }
}
// Banners fade in and slide down, stay, then fade out (timed with the real frame time).
function drawBanners() {
  for (let i = banners.length - 1; i >= 0; i--) {
    const b = banners[i];
    b.t += frameDt;
    const u = b.t / b.T;
    if (u >= 1) {
      banners.splice(i, 1);
      continue;
    }
    const a = u < 0.1 ? u / 0.1 : u > 0.75 ? (1 - u) / 0.25 : 1;
    const dy = Math.round(u < 0.1 ? (1 - u / 0.1) * -6 : 0), y = 58 + dy, h = b.b ? 40 : 28;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,6,8,0.55)';
    ctx.fillRect(0, y, W, h);
    ctx.fillStyle = b.c;
    ctx.globalAlpha = a * 0.6;
    ctx.fillRect(0, y, W, 1);
    ctx.fillRect(0, y + h - 1, W, 1);
    ctx.globalAlpha = a;
    text(b.a, W / 2, y + 6, b.c, { align: 'center', scale: 2, drop: true });
    if (b.b) text(b.b, W / 2, y + 26, U.dim, { align: 'center' });
  }
  ctx.globalAlpha = 1;
}

// audio.js - all sound, made live with the Web Audio API (no sound files). The engine follows
// Ball x Archers: audioInit builds the graph (master -> compressor, plus a light reverb), voice and
// gap limit how often a sound can play, tone and nz make one synth note or one noise burst.
// SFX holds every game sound; drone() is the helicopter's rotor under everything.

const Au = { ctx: null, master: null, noise: null, muted: false, last: {}, hum: null, roar: null };

function audioInit() {
  if (Au.ctx) {
    if (Au.ctx.state === 'suspended') Au.ctx.resume();
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const a = new AC();
    Au.ctx = a;
    Au.master = a.createGain();
    Au.master.gain.value = 0.5;
    const comp = a.createDynamicsCompressor();
    Au.master.connect(comp);
    comp.connect(a.destination);
    comp.threshold.value = -16;
    comp.ratio.value = 4;
    // reverb: 1.3 s of fading noise as the impulse response
    const ir = a.createBuffer(2, a.sampleRate * 1.3 | 0, a.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    }
    const rv = a.createConvolver();
    rv.buffer = ir;
    const wet = a.createGain();
    wet.gain.value = 0.15;
    Au.master.connect(rv);
    rv.connect(wet);
    wet.connect(comp);
    // 1 second of white noise, shared by all noise sounds
    const b = a.createBuffer(1, a.sampleRate, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    Au.noise = b;
  } catch (e) {
    Au.ctx = null;
  }
}

// voice: at most max copies of sound id at once (each copy lasts dur seconds).
const VO = {};
function voice(id, max, dur) {
  const t = Au.ctx ? Au.ctx.currentTime : 0, a = (VO[id] || []).filter((x) => x > t);
  VO[id] = a;
  if (a.length >= max) return false;
  a.push(t + dur);
  return true;
}
// gap: sound id again only after ms milliseconds.
function gap(id, ms) {
  const t = performance.now();
  if (Au.last[id] && t - Au.last[id] < ms) return false;
  Au.last[id] = t;
  return true;
}

// One synth note: frequency f, duration d (s), wave type, volume v, optional slide to f2, delay (s).
function tone(f, d, type, v, f2, delay) {
  const a = Au.ctx;
  if (!a || Au.muted) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g);
  g.connect(Au.master);
  o.start(t);
  o.stop(t + d + 0.03);
}
// One noise burst: duration d, volume v, filter type ft at frequency f with Q q, optional filter
// sweep to f2, delay (s).
function nz(d, v, ft, f, q, f2, delay) {
  const a = Au.ctx;
  if (!a || Au.muted || !Au.noise) return;
  const t = a.currentTime + (delay || 0);
  const s = a.createBufferSource();
  s.buffer = Au.noise;
  const fl = a.createBiquadFilter();
  fl.type = ft || 'lowpass';
  fl.frequency.setValueAtTime(f || 1000, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d);
  fl.Q.value = q || 0.8;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl);
  fl.connect(g);
  g.connect(Au.master);
  s.start(t, Math.random() * 0.4, d + 0.05);
}

// The helicopter: rotor noise through a low-pass filter, chopped by the blades (an LFO on its
// loudness), and a faint turbine whine. v = loudness 0..1 (0 = silent); it glides to the new level.
// k = 0..1: how much higher it all plays (the Turbo Ram).
function drone(v, k) {
  const a = Au.ctx;
  if (!a || !Au.noise) return;
  if (!Au.hum) {
    try {
      const out = a.createGain(), chop = a.createGain(), f = a.createBiquadFilter(), src = a.createBufferSource();
      out.gain.value = 0;
      src.buffer = Au.noise;
      src.loop = true;
      f.type = 'lowpass';
      f.frequency.value = 340;
      f.Q.value = 0.9;
      chop.gain.value = 0.55;
      const lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = 6.4;
      lg.gain.value = 0.5;
      lfo.connect(lg);
      lg.connect(chop.gain);
      src.connect(f);
      f.connect(chop);
      chop.connect(out);
      const whine = a.createOscillator(), wg = a.createGain();
      whine.frequency.value = 1850;
      wg.gain.value = 0.01;
      whine.connect(wg);
      wg.connect(out);
      out.connect(Au.master);
      src.start();
      lfo.start();
      whine.start();
      Au.hum = out;
      Au.humP = [f.frequency, lfo.frequency, whine.frequency];
    } catch (e) {
      return;
    }
  }
  const t = a.currentTime;
  k = k || 0;
  Au.hum.gain.setTargetAtTime(Au.muted ? 0 : v * 0.18, t, 0.5);
  Au.humP[0].setTargetAtTime(340 * (1 + 0.7 * k), t, 0.25);
  Au.humP[1].setTargetAtTime(6.4 + 3.6 * k, t, 0.25);
  Au.humP[2].setTargetAtTime(1850 * (1 + 0.3 * k), t, 0.25);
}

// Every game sound, built from tone() and nz().
const SFX = {
  mg() {
    // the 25mm: a hard, punchy thump with a crack on top
    if (!gap('mg', 55)) return;
    nz(0.12, 0.1, 'lowpass', 2400, 0.9, 220);
    tone(150, 0.09, 'square', 0.032, 46);
    nz(0.025, 0.035, 'highpass', 3200);
  },
  rocket() {
    // A brief launch whoosh and a falling pitch keep the rocket distinct from the gun.
    if (!gap('rocket', 70)) return;
    nz(0.2, 0.09, 'bandpass', 1700, 0.8, 320);
    tone(360, 0.18, 'sawtooth', 0.025, 90);
  },
  pop() {
    // a 25mm round bursts on the ground
    if (!gap('pop', 32)) return;
    nz(0.13, 0.04, 'bandpass', rnd(480, 900), 1.1, 150);
    tone(rnd(160, 220), 0.06, 'triangle', 0.016, 70);
  },
  cannon() {
    // the 105 fires: a deep blast
    tone(64, 0.55, 'sine', 0.24, 28);
    nz(0.4, 0.17, 'lowpass', 750, 0.7, 90);
    nz(0.08, 0.06, 'highpass', 2600);
  },
  whistle(d) {
    // the shell falling
    tone(1700, d, 'sine', 0.009, 520);
  },
  boom() {
    if (!voice('boom', 3, 1)) return;
    const p = rnd(0.85, 1.15);
    nz(1.1, 0.27, 'lowpass', 1000 * p, 0.7, 45);
    tone(50 * p, 0.8, 'sine', 0.24, 24);
    nz(0.6, 0.05, 'highpass', 2600, 0.7, 900, 0.06);
  },
  splat() {
    // a kill: a wet smack and a short knock
    if (!gap('splat', 28)) return;
    nz(0.07, 0.05, 'bandpass', rnd(260, 520), 1.6, 140);
    tone(rnd(300, 360), 0.05, 'triangle', 0.02, 110);
  },
  hit() {
    if (!gap('hit', 45)) return;
    nz(0.04, 0.045, 'bandpass', rnd(650, 1100), 2, 260);
  },
  coin() {
    if (!gap('coin', 70)) return;
    const f = rnd(2500, 2900);
    tone(f, 0.05, 'sine', 0.012);
    tone(f * 1.49, 0.035, 'sine', 0.007, null, 0.012);
    nz(0.02, 0.01, 'highpass', 6500);
  },
  lock() {
    if (!gap('lock', 120)) return;
    tone(2300, 0.03, 'square', 0.007);
  },
  ready() {
    // the 105 is loaded again
    tone(1250, 0.04, 'square', 0.014);
    tone(1650, 0.05, 'square', 0.014, null, 0.05);
  },
  overheat() {
    tone(900, 0.35, 'square', 0.02, 300);
    nz(0.45, 0.04, 'highpass', 4000, 0.7, 1500);
  },
  ui() {
    tone(620, 0.035, 'square', 0.022);
  },
  banner() {
    tone(392, 0.14, 'triangle', 0.045);
    tone(587, 0.22, 'triangle', 0.045, null, 0.1);
  },
  fanfare() {
    tone(523, 0.1, 'triangle', 0.04);
    tone(659, 0.1, 'triangle', 0.04, null, 0.08);
    tone(784, 0.22, 'triangle', 0.045, null, 0.16);
  },
  warn() {
    // the train is nearly lost: two low, urgent notes
    if (!gap('warn', 250)) return;
    tone(196, 0.16, 'square', 0.03, 185);
    tone(196, 0.2, 'square', 0.03, 165, 0.2);
  },
  horn(k, delay, len) {
    // the train's horn: three sawtooth notes of a chord, a little flat at first, through a low-pass
    // filter. k = pitch (1 = normal), delay (s), len = how long it blows (s)
    const a = Au.ctx;
    if (!a || Au.muted) return;
    k = k || 1;
    len = len || 1.1;
    const t = a.currentTime + (delay || 0), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'lowpass';
    f.frequency.value = 1400 * k;
    f.Q.value = 0.8;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.08);
    g.gain.setValueAtTime(0.05, t + len - 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    for (const fr of [311, 370, 466]) {
      const o = a.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(fr * k * 0.97, t);
      o.frequency.linearRampToValueAtTime(fr * k, t + 0.12);
      o.connect(f);
      o.start(t);
      o.stop(t + len + 0.05);
    }
    f.connect(g);
    g.connect(Au.master);
  },
  ramGo(d) {
    // TURBO RAM: the horn twice (the second higher), a burst, and the roar for d s
    SFX.horn(1, 0, 0.45);
    SFX.horn(1.26, 0.42, 0.8);
    nz(0.7, 0.14, 'lowpass', 2400, 0.7, 160);
    SFX.roar(d, true);
  },
  roar(d, fresh) {
    // the Ram's roar for d s: it rises from low (fresh), or comes straight back at full pitch (after a
    // pause), holds, and dies away over its last second. Au.roar keeps it, so ramStop can cut it.
    SFX.ramStop(0.05);
    const a = Au.ctx;
    if (!a || Au.muted || d < 0.1) return;
    const t = a.currentTime, f = a.createBiquadFilter(), g = a.createGain(), os = [];
    const rise = fresh ? Math.min(1.4, d * 0.5) : 0.1, fall = Math.min(1, d * 0.5), hold = Math.max(rise, d - fall);
    f.type = 'lowpass';
    f.Q.value = 1.4;
    f.frequency.setValueAtTime(fresh ? 260 : 1300, t);
    f.frequency.exponentialRampToValueAtTime(1300, t + rise);
    f.frequency.setValueAtTime(1300, t + hold);
    f.frequency.exponentialRampToValueAtTime(300, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055, t + Math.min(0.25, rise));
    g.gain.setValueAtTime(0.055, t + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    for (const [fr, type] of [[46, 'sawtooth'], [69.5, 'square'], [92.5, 'sawtooth']]) {
      const o = a.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(fresh ? fr : fr * 2.2, t);
      o.frequency.exponentialRampToValueAtTime(fr * 2.2, t + rise);
      o.frequency.setValueAtTime(fr * 2.2, t + hold);
      o.frequency.exponentialRampToValueAtTime(fr * 1.2, t + d);
      o.connect(f);
      o.start(t);
      o.stop(t + d + 0.05);
      os.push(o);
    }
    f.connect(g);
    g.connect(Au.master);
    Au.roar = { g, os };
  },
  ramStop(fade) {
    // the roar fades out over fade s (the Ram was cut short, the game paused, the train was lost)
    const a = Au.ctx, R = Au.roar;
    if (!a || !R) return;
    Au.roar = null;
    const t = a.currentTime, p = R.g.gain, e = fade || 0.25;
    p.cancelScheduledValues(t);
    p.setValueAtTime(Math.max(0.0001, p.value), t);
    p.exponentialRampToValueAtTime(0.0001, t + e);
    for (const o of R.os) {
      try { o.stop(t + e + 0.05); } catch (err) { /* it has stopped already */ }
    }
  },
  crunch(n) {
    // the Ram smashes one: a crunch that climbs with the count
    if (!gap('crunch', 34)) return;
    const p = Math.min(2.4, 1 + n * 0.045);
    nz(0.12, 0.1, 'lowpass', 900 * p, 0.8, 150);
    tone(84 * p, 0.09, 'triangle', 0.06, 44 * p);
    nz(0.05, 0.05, 'bandpass', 620 * p, 1.6);
  },
  hiss() {
    // a long hiss of steam
    nz(1.6, 0.075, 'highpass', 4200, 0.7, 1800);
    nz(1.3, 0.04, 'bandpass', 2600, 0.6, 1400, 0.05);
  },
  ramReady() {
    // the Ram is full again: a rising beep and a chime
    tone(784, 0.07, 'square', 0.02);
    tone(1175, 0.1, 'square', 0.02, null, 0.08);
    tone(2349, 0.16, 'sine', 0.018, null, 0.17);
  },
  crack() {
    // the boiler cracks: a clank of metal, then steam
    tone(196, 0.3, 'square', 0.04, 82);
    nz(0.35, 0.09, 'bandpass', 1400, 3, 380);
    tone(1480, 0.12, 'triangle', 0.02, 1100, 0.04);
    nz(1.2, 0.05, 'highpass', 3600, 0.7, 1500, 0.15);
  },
  slow() {
    // time slows down (PRESS E!)
    tone(330, 0.7, 'sine', 0.06, 82);
    nz(0.6, 0.05, 'lowpass', 900, 0.7, 110);
  },
  rank(n) {
    // the Ram's rank: SMASH, RAMPAGE, UNSTOPPABLE (one more note for each)
    const notes = n >= 30 ? [523, 659, 784, 1047] : n >= 15 ? [523, 659, 784] : [523, 784];
    notes.forEach((f, i) => tone(f, 0.12 + (i === notes.length - 1 ? 0.18 : 0), 'triangle', 0.045, null, i * 0.08));
    tone(98, 0.35, 'sine', 0.07, 55);
  },
  gun() {
    // the flatcar gun: a light, dry knock
    if (!gap('gun', 60)) return;
    nz(0.05, 0.035, 'bandpass', 1500, 1.2, 600);
    tone(230, 0.04, 'square', 0.011, 120);
  },
  clack() {
    // the wheels over a rail joint
    nz(0.03, 0.02, 'bandpass', 2200, 3);
    nz(0.03, 0.016, 'bandpass', 1800, 3, null, 0.09);
  },
  crush(big) {
    // the engine runs one down
    if (!gap('crush', 40)) return;
    nz(0.14, big ? 0.12 : 0.07, 'lowpass', 600, 0.8, 120);
    tone(big ? 70 : 110, 0.1, 'triangle', 0.05, 50);
    nz(0.06, 0.04, 'bandpass', rnd(400, 700), 1.5);
  },
  saved() {
    // a survivor made it aboard: a bright double chime
    tone(988, 0.08, 'triangle', 0.035);
    tone(1319, 0.14, 'triangle', 0.035, null, 0.07);
  },
  radio() {
    // a burst of radio static and a beep
    nz(0.22, 0.03, 'bandpass', 1900, 2.5);
    tone(1000, 0.07, 'square', 0.012, null, 0.03);
  },
  tick() {
    // a row of the summary counts up
    if (!gap('tick', 40)) return;
    tone(1500, 0.025, 'square', 0.016);
    nz(0.015, 0.012, 'highpass', 5000);
  },
  total() {
    // the summary's total: a coin chime on a rising chord
    tone(659, 0.12, 'triangle', 0.04);
    tone(988, 0.16, 'triangle', 0.04, null, 0.07);
    tone(2637, 0.08, 'sine', 0.016, null, 0.14);
    tone(3520, 0.1, 'sine', 0.01, null, 0.17);
  },
  buy(big) {
    // a skill tree node bought: two rising notes and a coin (a big unlock adds a low thump and a
    // third note)
    tone(523, 0.09, 'triangle', 0.04);
    tone(784, 0.14, 'triangle', 0.045, null, 0.07);
    if (big) {
      tone(1047, 0.22, 'triangle', 0.04, null, 0.15);
      tone(98, 0.3, 'sine', 0.08, 55);
    }
    tone(2637, 0.06, 'sine', 0.016, null, 0.15);
    tone(3520, 0.09, 'sine', 0.011, null, 0.18);
    nz(0.03, 0.012, 'highpass', 6500, null, null, 0.15);
  },
  deny() {
    // that can't be done yet: a short low buzz
    if (!gap('deny', 150)) return;
    tone(150, 0.12, 'square', 0.025, 110);
  }
};

// game.js - escort the train for one leg of the fixed Farmlands line. The Viper fights by itself
// or where you send it. Zombies walk in, block the rails and climb onto the train. A run ends at
// the next station or when the train breaks; collected rewards are kept. The view follows the
// train. Behind the title and Depot, a separate demo battle runs without earning rewards.
// Units are world pixels and seconds; y on the ground is squashed by FORE; the train runs to -y.

const CFG = {
  // the line: px along the rails in 1 km (2 px = 1 m)
  line: { km: 2000 },
  // the train: top speed (px/s), how fast it gets back up to speed, how hard it brakes, its health,
  // and the health it loses for each zombie it runs over (a brute costs more)
  train: { cruise: 40, accel: 14, brake: 16, hp: 80, crush: 0.5, crushBig: 6 },
  // a helicopter: its top speed, how fast it gets there, how near loot must be to pick it up
  heli: { speed: 170, accel: 3.2, pickup: 14 },
  // 25mm: 4 rounds/s, flight seconds, spread px, burst radius px and most victims. (proposal)
  // The Viper fires continuously without overheating; legacy heat values stay zero.
  mg: { rate: 4, travel: 0.07, spread: 5, splash: 7, victims: 4, heatPer: 0, cool: 0.55 },
  // 105mm: reload, flight time, kill radius, hurt radius (a hurt walker dies too, a brute may not),
  // and how close to the train a blast hurts the train too
  he: { reload: 2.4, travel: 0.7, kill: 34, hurt: 56, close: 28 },
  // the horde: the most dead alive at once, and from how many km runners come and brutes stand on
  // the rails (how many come at each km is in HORDE, horde.js)
  pop: { max: 1100, runFrom: 0.3, bruteFrom: 0.6 },
  // a station stop: survivors waiting on a later visit (a first visit has the station's own number),
  // seconds between two setting off, their speed, the shortest stop, how long a zombie holds a
  // survivor before it is too late, how near the door the dead keep the survivors in (and for how
  // long, at most)
  station: { again: 3, gap: 1.1, run: 24, minStop: 12, grab: 1.4, clear: 34, wait: 8 },
  // Share of each zombie's scrap value paid now; fractions wait in the kill pot. (proposal)
  pay: { kill: 1 },
  // a Dead Wall: px along the rails it fills, px from the rail middle, how near the train comes
  // before it moves, how far ahead it is placed, how far ahead the warning comes (px)
  wall: { len: 120, half: 12, wake: 110, place: 600, warn: 300 },
  // bought in the skill tree. The rail cannon (cannon.js): seconds to reload, seconds each GUN SPEED
  // level takes off, px either side of its line that it kills, how fast its barrel turns (radians/s).
  gun: { reload: 4, fast: 0.5, hw: 5, turn: 7 },
  // The Turbo Ram: top speed (px/s), seconds at it, seconds to get up to it and to ease back, the
  // kill zone (px either side of the rail middle, px behind and ahead of the nose), kills to fill it
  // again, the next stop nearer than noStart px = it can't start, nearer than cut px = it ends
  // (250 and 200 m), px the camera leads, and its kills pay ×pay.
  ram: { speed: 120, dur: 3, rise: 0.4, ease: 1, band: 16, back: 10, front: 8, charge: 250, noStart: 500, cut: 400,
    lead: 40, pay: 2 },
  // Seconds the built-in winch needs over a survivor: about 2 s. (proposal)
  winch: { hover: 2 },
  // what one level of a skill tree node adds: train HP (ARMOR), the 25mm's heat per round is
  // multiplied (COOLING), 25mm rounds per second (FAST FEED), 25mm damage (HEAVY ROUNDS), 105mm
  // reload seconds taken off (FAST RELOAD), heli px/s (FAST ROTORS), px of pickup reach
  // (MAGNET), share of kill scrap (SCAVENGER), rounds per second (GUN SPEED)
  up: { armor: 10, cool: 0.8, feed: 1, heavy: 1, reload: 0.3, rotor: 25, magnet: 10, scav: 0.1, gun: 1 },
  // dps = damage to the train each second while it holds on
  types: [
    { hp: 2, speed: [15, 20], value: 1, dps: 0.25 },               // walker: 2 base gun hits (proposal)
    { hp: 1, speed: [42, 52], value: 1, dps: 0.3, run: true },     // runner
    { hp: 6, speed: [10, 13], value: 5, dps: 2, big: true }        // brute
  ]
};
// the cars: length on the ground, the gap between two, half the width, how many (TRAIN in sprites)
const CAR = { L: 28, gap: 4, half: 8, n: 5 };
const TRAIN_LEN = CAR.n * (CAR.L + CAR.gap) - CAR.gap;
const CAMS = ['COLOUR', 'WHITE HOT', 'BLACK HOT'];

// G = this run (or the demo behind the title and the Depot). mode = 'title', 'depot', 'play',
// 'ending' or 'summary'. thermal = camera: 0 colour, 1 white hot, 2 black hot.
let G = null, mode = 'title', paused = false, realT = 0, frameDt = 0, sumStart = 0, thermal = 0;

// ---------- the fixed line
// DEPOT_S = the Depot's place along the rails (it stands at y = 0). The rest of the line is counted
// in km from there: sAtKm(k) = the place k km up the line, kmAt(s) = how many km s is from the Depot.
const DEPOT_S = trackS(0);
const sAtKm = (k) => DEPOT_S - k * CFG.line.km;
const kmAt = (s) => (DEPOT_S - s) / CFG.line.km;
// DK() = how far the engine's nose is from the Depot, in km
const DK = () => kmAt(G.tr.s);
// km2(k) = k km cut down to the whole 10 m, the way every screen and the save show km (0.659 -> 0.65)
const km2 = (k) => Math.floor(k * 100 + 1e-6) / 100;
// The y on the ground where the distance along the rails is s, from any distance away.
const yOfS = (s) => yAtS(s, yAtS(s, s / 1.0354));

// ---------- what the skill tree changes
// Each number at level l of its node. The game reads them through G.up (set when a run starts) and
// the skill tree's info box shows the very same numbers, so the two always agree.
const UP = {
  hp: (l) => CFG.train.hp * (1 + 0.15 * l),
  pickup: (l) => CFG.heli.pickup * (1 + 0.25 * l)
};
// This run's numbers from the skill tree (they cannot change during a run). The demo behind the
// menus uses the plain numbers and shows off the Turbo Ram for now.
// The winch is built in. he and ram are weapons; gun is the rail cannon's reload (0 = none).
// One Viper flies, including in the demo.
// salvage is the extra share of every scrap reward; treeUp reads the crew's level.
function runUp(demo) {
  const L = demo ? () => 0 : lv;
  // (tree.js adds the newer nodes' numbers: treeUp)
  return treeUp(L, {
    hp: UP.hp(L('armor')), rate: CFG.mg.rate, heat: CFG.mg.heatPer, dmg: 1,
    he: false, reload: CFG.he.reload, fly: CFG.heli.speed, pickup: UP.pickup(L('magnet')),
    helis: 1,
    scav: 0, winch: true, gun: 0, ram: demo || L('ram') > 0,
    // Full-game plow and legacy gold spawns stay disabled; armor still dresses the engine.
    cow: false, gold: 0, armor: L('armor')
  });
}
// The train's full health.
function maxHP() {
  return UP.hp(lv('armor'));
}
// Loot and gold items' scrap alternatives share a fractional pot, separate from killAcc.
// Apply Salvage Crew once here; bankRun only stores the whole scrap already paid.
function payLootScrap(base) {
  if (!(base > 0)) return 0;
  G.lootAcc += base * (1 + G.up.salvage);
  const pay = Math.floor(G.lootAcc + 1e-9);
  G.lootAcc = Math.max(0, G.lootAcc - pay);
  G.cash += pay;
  G.pay.loot += pay;
  if (pay) G.cashPulse = 1;
  return pay;
}
// Scrap pops keep their old small/large size, plus one size when Salvage Crew is active.
function scrapPopScale(big) {
  return (big ? 2 : 1) + (G.up.salvage > 0 ? 1 : 0);
}

// ---------- a run
// demo = the battle behind the menus. A real ride starts 60 rail px after its departure stop.
function newGame(demo, number, replay) {
  const leg = demo ? null : legDef(number);
  const yd = Math.round(rnd(-40000, 40000));
  const s0 = demo ? trackS(yd) : stopRailS(leg.from) - 60;
  const y0 = demo ? yd : yOfS(s0), up = runUp(demo), hp = up.hp;
  const cars = [];
  for (let k = 0; k < CAR.n; k++) cars.push({ x0: 0, y0: 0, x1: 0, y1: 0, cx: 0, cy: 0, dx: 0, dy: -1, nx: 1, ny: 0, ang: 0, k: 0 });
  G = {
    demo: !!demo, leg: leg ? leg.n : 0, replay: !!replay, events: [], t: 0, run: 0, endT: 0, result: '', up,
    kills: 0, cash: 0, gold: 0, shownCash: 0, cashPulse: 0, killBump: 0, shots: 0, hits: 0, bestBlast: 0,
    // Legacy debug fields stay zero until the final cleanup; Salvage Crew uses the pay pots below.
    scavAcc: 0, scavPaid: 0,
    trigger: false, mgCd: 0, heat: 0, overheat: false, heReload: 0, heQueue: false, hitT: 0, muzzle: [0, 0],
    // the train: s = distance along the rails of the engine's nose (it falls as the train runs north),
    // v = speed, hp / max = its health now and when whole, hit[k] = car k flashes red, fx / fy = the
    // nose on the ground
    tr: { s: s0, startS: s0, v: CFG.train.cruise, hp, max: hp, hpShown: hp, hit: [0, 0, 0, 0, 0],
      clack: 0, smokeT: 0, hornT: 0, fx: trackX(y0), fy: y0, cars },
    // the helicopters (helis.js)
    helis: [],
    goalS: demo ? -1e12 : stopRailS(leg.to), goalY: -1e9,
    // the stops on this run (the Depot and the stations ahead), the stations alone, the one the
    // train goes to next (or stands at), and the Dead Walls ahead
    stops: [], stations: [], station: null, walls: [],
    camX: 0, camY: 0, aimSX: W / 2, aimSY: H / 2,
    lock: null, lockWait: false, box: null,
    zombies: [], bodies: [], rounds: [], timers: [], statics: [], people: [],
    // Fractions from boosted kills and finds carry forward to the next reward in that group.
    spawnCd: 0, waveCd: null, waves: 0, killAcc: 0, lootAcc: 0, railCd: rnd(4, 6), onTrain: 0, blocked: false, decalT: 0, sum: null,
    // this run's scrap by where it came from (the summary lists them), the survivors aboard, the px
    // the train has ridden, the furthest km, and what is already in the save
    pay: { kills: 0, loot: 0 }, stopNames: [], surv: 0, ride: 0, maxKm: 0, banked: { scrap: 0, surv: 0, gold: 0 },
    bot: false, botT: 0, botZ: null, hurt: { crush: 0, claw: 0, shell: 0 },
    // the rail cannon on the flatcar (cannon.js)
    gun: newCannon(),
    // the Turbo Ram: on = running, t = seconds since it started, dur = its seconds at top speed,
    // left = kills still needed to fill it (0 = full; every run starts full), kills / pay = this Ram's,
    // card = its card shows, flash = when it got full, msg = a line over its card, pop = scrap of
    // its kills not yet shown (popT = when the last +N popped)
    ram: { on: false, t: 0, dur: 0, left: 0, kills: 0, pay: 0, card: up.ram,
      hissed: false, flash: -9, killT: -9, msg: null, uses: 0, total: 0, pop: 0, popT: -9 },
    // the dead on the rails within 130 m ahead; px the camera is moved by (camLead)
    railAhead: 0, lead: [0, 0]
  };
  RADIO.q.length = 0;
  RADIO.cur = null;
  RAMCARD.on = false;
  SFX.ramStop(0.1);
  clearFX();
  clearBurn();
  clearStreams();
  GRID.clear();
  layoutTrain();
  makeHelis();
  if (!demo) {
    G.goalY = yOfS(G.goalS);
    G.maxKm = DK();
    buildLine(leg);
    rollLoot();
  }
  placeCamera();
  scatter(leg && leg.from !== DEPOT ? leg.from : null);
}
// Start the next leg, or a selected old leg. Replays cannot advance the route again.
function startGame(number, replay) {
  audioInit();
  number = Number.isInteger(number) ? clamp(number, 1, 12) : Math.min(SAVE.leg, 12);
  replay = !!replay || !!(SAVE.legs[number] && SAVE.legs[number].won);
  SAVE.runs++;
  saveSave();
  newGame(false, number, replay);
  mode = 'play';
  paused = false;
  const st = G.station;
  banner('LEG ' + number + ': ' + st.name, replay ? 'REPLAY: SCRAP ONLY' : 'ESCORT THE TRAIN TO THE NEXT STATION', U.gold);
  SFX.horn();
}
// Put what this run has earned so far in the save. You keep it all, whatever happens to the train.
function bankRun() {
  if (!G || G.demo) return;
  const sc = Math.floor(G.cash) - G.banked.scrap, sv = G.surv - G.banked.surv, gd = G.gold - G.banked.gold;
  SAVE.scrap += sc;
  SAVE.surv += sv;
  SAVE.gold += gd;
  G.banked.scrap += sc;
  G.banked.surv += sv;
  G.banked.gold += gd;
  saveSave();
}
// The run is over: bank it and build the summary (drawn by drawSummary).
function endGame() {
  mode = 'summary';
  sumStart = realT;
  G.trigger = false;
  // a mouse press from the run must not click TO THE DEPOT when it is let go
  M.px = M.py = -1e4;
  // where the run ended (the train may roll on a little after it is lost; that does not count)
  const k = G.maxKm;
  bankRun();
  G.sum = {
    leg: G.leg, destination: legDef(G.leg).to.name, replay: G.replay,
    stars: (SAVE.legs[G.leg]?.stars || [false, false, false]).slice(), hasStars: G.leg >= 3,
    result: G.result, kills: G.kills, pay: Object.assign({}, G.pay),
    scrap: Math.floor(G.cash), surv: G.surv, gold: G.gold,
    near: nearMiss(k), wall: wallStop(k), sounds: 0
  };
}
// "Mill Town was 380 m away!": the next station, when the train was lost on the way to it.
function nearMiss(k) {
  if (G.result !== 'lost') return '';
  const st = G.stations.find((s) => s.state === 'ahead' || s.state === 'braking');
  if (!st) return '';
  const m = kmAt(st.stopS) - k;
  return st.name + ' WAS ' + fmt(Math.max(10, Math.round(m * 100) * 10)) + ' M AWAY!';
}
// The summary's lines for a run lost at a Dead Wall, or after one that cost the train a quarter of
// its health or more (with no station since): what happened, and what gets you through (without the
// Turbo Ram: buy it; with it: save it for the wall, or more armor when it ran into the
// wall and the train still broke). [] for any other run.
function wallStop(k) {
  if (G.result !== 'lost') return [];
  let w = G.walls.find((x) => k > x.km - 0.04 && k < x.km + CFG.wall.len / CFG.line.km + 0.03), say = 'THE DEAD WALL STOPPED YOU.';
  if (!w) {
    w = G.walls.filter((x) => x.hpOut != null && x.km < k).pop();
    if (!w || w.hpIn - w.hpOut < G.tr.max * 0.25 || G.stations.some((st) => kmAt(st.s) > w.km && kmAt(st.s) < k)) return [];
    say = 'THE DEAD WALL COST THE TRAIN ' + Math.round(w.hpIn - w.hpOut) + ' HP.';
  }
  const tip = !G.up.ram ? 'TURBO RAM SMASHES THROUGH IT.' : w.rammed ? 'MORE ARMOR WOULD GET YOU THROUGH.'
    : w.ready ? 'RAM THE WALL TO BREAK THROUGH!' : 'SAVE YOUR TURBO RAM FOR IT.';
  return [[say, U.red], [tip, U.ink]];
}
// km as metres for the screen: 340 M (to the nearest 10 m), 1.25 KM from 1 km up
function fmtM(k) {
  return k >= 1 ? k.toFixed(2) + ' KM' : Math.round(k * 100) * 10 + ' M';
}
function toTitle() {
  if (!G || !G.demo) newGame(true);
  mode = 'title';
  paused = false;
}
const scoring = () => !G.demo && (mode === 'play' || mode === 'ending');
// Run f after t seconds of game time.
function later(t, f) {
  G.timers.push({ t, f });
}

// ---------- the train
// Place the cars along the curve: each car's front and back on the rails, its middle, its heading
// (dx, dy = unit vector to its front, nx, ny = to its right) and its depth for drawing.
function layoutTrain() {
  const tr = G.tr;
  let y = yAtS(tr.s, tr.fy);
  tr.fy = y;
  tr.fx = trackX(y);
  for (let k = 0; k < CAR.n; k++) {
    const c = tr.cars[k], s0 = tr.s + k * (CAR.L + CAR.gap);
    const y0 = k ? yAtS(s0, y + CAR.gap) : y, y1 = yAtS(s0 + CAR.L, y0 + CAR.L);
    const x0 = trackX(y0), x1 = trackX(y1), dx = x0 - x1, dy = y0 - y1, l = Math.hypot(dx, dy) || 1;
    c.x0 = x0; c.y0 = y0; c.x1 = x1; c.y1 = y1;
    c.cx = (x0 + x1) / 2; c.cy = (y0 + y1) / 2;
    c.dx = dx / l; c.dy = dy / l;
    c.nx = -c.dy; c.ny = c.dx;
    c.ang = Math.atan2(c.dx, -c.dy);
    c.k = Math.max(y0, y1) + 3;
    y = y1;
  }
}
// Distance from (x, y) to the segment a-b, with y squashed like the blasts measure it.
function segDist(px, py, ax, ay, bx, by) {
  py /= FORE; ay /= FORE; by /= FORE;
  const vx = bx - ax, vy = by - ay, t = clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy || 1), 0, 1);
  return Math.hypot(px - ax - vx * t, py - ay - vy * t);
}
// How far (x, y) on the ground is from the train (0 = on it); ahead = px the train will have moved on.
function trainDist(x, y, ahead) {
  const a = ahead || 0;
  let d = 1e9;
  for (const c of G.tr.cars) d = Math.min(d, segDist(x, y, c.x1 + c.dx * a, c.y1 + c.dy * a, c.x0 + c.dx * (a + 6), c.y0 + c.dy * (a + 6)));
  return Math.max(0, d - CAR.half);
}
// The car nearest (x, y).
function carNear(x, y) {
  let best = 0, bd = 1e9;
  G.tr.cars.forEach((c, k) => { const d = Math.hypot(c.cx - x, c.cy - y); if (d < bd) { bd = d; best = k; } });
  return best;
}
// The train takes a damage; car = the car hit (it flashes red); why = 'crush', 'claw' or 'shell' (the
// run adds up each kind in G.hurt, for tests and balance).
function hurtTrain(a, car, why) {
  if (G.demo || G.result) return;
  const tr = G.tr, was = tr.hp, low = tr.max * 0.35;
  if (why) G.hurt[why] += Math.min(a, tr.hp);
  tr.hp = Math.max(0, tr.hp - a);
  tr.hit[car] = 0.12;
  if (tr.hp <= 0) lose();
  else if (was >= low && tr.hp < low) {
    banner('TRAIN IN DANGER', 'CLEAR THE DEAD OFF IT', U.red, 4);
    SFX.warn();
  }
}
// The safe zone: a concrete wall right across the land, a gate for the railway, two watchtowers.
function buildSafeZone() {
  G.safeZone = true;
  const y = Math.round(G.goalY), gx = Math.round(trackX(G.goalY)), st = G.statics;
  for (let x = gx - 640; x <= gx + 640; x += 16) {
    if (Math.abs(x - gx) < 26) continue;
    st.push({ d: SAFE.blocks[mod(x >> 4, SAFE.blocks.length)], x, y, k: y });
  }
  for (const s of [-1, 1]) {
    st.push({ d: SAFE.pillar, x: gx + s * 20, y: y + 1, k: y + 1 });
    st.push({ d: SAFE.tower, x: gx + s * 50, y: y - 4, k: y - 4, tower: s });
  }
}
// Arrival wins this leg. The station guards clear the climbers while the short summary opens.
function arrive() {
  if (G.demo || G.result) return;
  G.result = 'won';
  G.tr.v = 0;
  G.tr.s = G.goalS;
  layoutTrain();
  if (!G.replay) {
    legSave(G.leg).won = true;
    SAVE.leg = Math.max(SAVE.leg, G.leg + 1);
    saveSave();
  }
  mode = 'ending';
  G.endT = 0;
  G.trigger = false;
  G.lock = null;
  banner('LEG WON!', G.station.name, U.gold, 3);
  SFX.horn();
  for (const z of G.zombies) if (z.st === 2) later(rnd(0.2, 1.4), () => {
    if (z.dead) return;
    lights.push({ x: z.x, y: z.y, z: 6, r: 10, c: '#ffb060', life: 0.08, max: 0.08, a: 0.8 });
    kill(z, 'mg', 0, 0, 0, true);
  });
}
// The dead have taken the train: the fuel tanker goes up, then the engine.
function lose() {
  G.result = 'lost';
  mode = 'ending';
  G.endT = 0;
  G.trigger = false;
  G.lock = null;
  banner('TRAIN LOST', 'YOU KEEP ALL YOUR SCRAP. RETRY THIS LEG.', U.red, 9);
  const blast = (k, big) => () => {
    const c = G.tr.cars[k], x = c.cx + rnd(-3, 3), y = c.cy;
    boomFx(x, y, big);
    for (const z of G.zombies) if (!z.dead && Math.hypot(z.x - x, (z.y - y) / FORE) < 30) kill(z, 'he', x, y, 10, true);
    addShake(big ? 0.8 : 0.4);
    SFX.boom();
  };
  later(0.15, blast(4, true));
  later(0.7, blast(2, false));
  later(1.3, blast(0, true));
}

// ---------- the dead
function makeZombie(x, y, type) {
  const T = CFG.types[type], sets = ZS[type];
  return silverRoll({
    x, y, type, S: sets[(Math.random() * sets.length) | 0], hp: T.hp, max: T.hp, value: T.value, run: !!T.run, big: !!T.big,
    sp: rnd(T.speed[0], T.speed[1]), dps: T.dps, wob: rnd(TAU), anim: rnd(2), left: Math.random() < 0.5,
    vx: 0, vy: 0, kbx: 0, kby: 0, flash: 0, pending: 0, block: [], blockT: rnd(0.5), dead: false, gone: false, qd: 0, k: y,
    // st: 0 walking, 1 on the rails ahead of the train, 2 holding on to the train
    st: 0, rx: rnd(-3, 3), side: 0, car: 0, al: 0, ox: 0, bang: 0, dmg: 0
  });
}
// The horde by distance (HORDE), the streams and waves that bring the dead in (spawn) and their
// step (updateZombies) are in horde.js.
// true when (x, y) is out of the camera's view by more than m px
const offView = (x, y, m) => x < G.camX - m || x > G.camX + W + m || y < G.camY - m || y > G.camY + H + m;
// One of the dead standing on the rails at s, u px right of the rail middle.
function railZombie(s, u, type) {
  const y = yOfS(s), z = makeZombie(trackX(y) + u, y, type);
  z.st = 1;
  z.rx = u;
  G.zombies.push(z);
  return z;
}
// A crowd standing on the rails ahead of the train, out of view (never in a Dead Wall's last 150 m).
function railGroup(n) {
  for (let i = 0; i < 4; i++) {
    const s = G.tr.s - rnd(230, 380) - i * 90, y = yAtS(s, G.tr.fy + (s - G.tr.s));
    if (y < G.goalY + 60) return;
    if (!offView(trackX(y), y, 16) || wallZone(s)) continue;
    for (let k = 0; k < n; k++) {
      const yy = y - k * rnd(2.5, 6), z = newDead(trackX(yy) + rnd(-4, 4), yy, pickType(true));
      z.st = 1;
      z.rx = z.x - trackX(yy);
      G.zombies.push(z);
    }
    return;
  }
}
// The start: packs on both sides of the railway, most of them ahead (10 behind the menus, 4 in a
// run), and at the Depot 5 of the dead on the rails just ahead. at = the station a run starts at.
function scatter(at) {
  for (let k = 0, n = G.demo ? 12 : 6; k < n; k++) {
    const s = G.tr.s - rnd(-40, 300), y = yAtS(s, G.tr.fy + (s - G.tr.s));
    pack(rndi(10, 22), trackX(y) + (Math.random() < 0.5 ? -1 : 1) * rnd(70, W / 2), y);
  }
  if (at) return;
  for (let k = 0; k < 5; k++) railZombie(G.tr.s - 110 - k * 6, rnd(-3, 3), 0);
}
// ---------- Dead Walls
// Before each station a crowd of the dead with brutes stands packed on the rails. It is placed when
// the train is 600 px away, stands still until the train is 110 px away, and comes back every run.
// km = where its front is; it fills 120 px of rails behind that.
const WALLS = [
  { km: 0.75, walkers: 40, brutes: 2 },
  { km: 1.75, walkers: 100, brutes: 6 }
];
// true when s (along the rails) is in a Dead Wall or in the 150 m in front of one
function wallZone(s) {
  for (const w of G.walls) if (s <= w.s + CFG.wall.warn && s >= w.s - CFG.wall.len - 30) return true;
  return false;
}
// true when the engine is less than d px before a Dead Wall (or in it)
function wallAhead(d) {
  for (const w of G.walls) if (G.tr.s - w.s < d && G.tr.s - w.s > -CFG.wall.len) return true;
  return false;
}
function placeWall(w) {
  w.placed = true;
  const c = CFG.wall;
  for (let i = 0; i < w.walkers + w.brutes; i++) {
    // anywhere in the wall, within c.half px of the rail middle (the brutes nearer to it)
    const big = i < w.brutes;
    const z = railZombie(w.s - rnd(0, c.len), rnd(-c.half, c.half) * (big ? 0.5 : 1), big ? 2 : 0);
    z.still = true;
    w.zs.push(z);
  }
}
// Place the walls coming up, warn of them, and wake them when the train is close.
function updateWalls() {
  const tr = G.tr, c = CFG.wall;
  for (const w of G.walls) {
    const d = tr.s - w.s;
    if (!w.placed && d < c.place && d > -c.len) placeWall(w);
    if (!w.warned && d < c.warn && d > 0) {
      w.warned = true;
      banner('DEAD WALL IN ' + Math.round(d / 2 / 10) * 10 + ' M', G.up.ram ? 'SAVE YOUR TURBO RAM!' : 'BRUTES ON THE TRACK', U.red, 3);
      SFX.warn();
    }
    if (w.placed && !w.awake && d < c.wake) {
      w.awake = true;
      w.hpIn = tr.hp;
      for (const z of w.zs) z.still = false;
    }
    // for the summary: the health the wall cost the train (from when it woke until the nose is 40 px
    // past its far end), the Turbo Ram ran into it, or was full near it and not used
    if (w.hpIn != null && w.hpOut == null && d < -c.len - 40) w.hpOut = tr.hp;
    if (d < c.wake && d > -c.len) {
      if (G.ram.on && d < 10) w.rammed = true;
      else if (ramState() === 'ready') w.ready = true;
    }
  }
}

// a grid of 16 px cells over the dead, for spacing and for finding who a round hits
const GC = 16, GRID = new Map();
const gk = (i, j) => (i + 40000) * 80000 + (j + 40000);
function gridBuild() {
  if (GRID.size > 3000) GRID.clear();
  for (const a of GRID.values()) a.length = 0;
  for (const z of G.zombies) {
    const k = gk(Math.floor(z.x / GC), Math.floor(z.y / GC));
    let a = GRID.get(k);
    if (!a) GRID.set(k, (a = []));
    a.push(z);
  }
}
// Call fn(z, d) for every living zombie within R of (x, y) on the ground (d = distance).
function queryEll(x, y, R, fn) {
  const i0 = Math.floor((x - R) / GC), i1 = Math.floor((x + R) / GC);
  const j0 = Math.floor((y - R * FORE) / GC), j1 = Math.floor((y + R * FORE) / GC);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const list = GRID.get(gk(i, j));
    if (!list) continue;
    for (const z of list) {
      if (z.dead) continue;
      const d = Math.hypot(z.x - x, (z.y - y) / FORE);
      if (d <= R) fn(z, d);
    }
  }
}

// The dead take hold of the train: side -1 / 1 = its left / right side, 0 = the engine's nose.
// ds = how far behind the nose (along the rails), u = how far right of the rails.
function attach(z, side, ds, u) {
  z.st = 2;
  z.side = side;
  z.dmg = 0;
  z.bang = rnd(TAU);
  z.kbx = z.kby = 0;
  if (side === 0) {
    z.car = 0;
    z.ox = clamp(u, -6, 6);
    z.left = u > 0;
  } else {
    z.car = clamp(Math.floor(ds / (CAR.L + CAR.gap)), 0, CAR.n - 1);
    z.al = CAR.L / 2 - clamp(ds - z.car * (CAR.L + CAR.gap), 4, CAR.L - 6);
    z.ox = rnd(0, 2);
    z.left = side > 0;
  }
}
// The engine runs one down: it dies, and the train loses speed and health (a red -2 over the nose).
// Not while the Turbo Ram runs: then it costs nothing.
function crush(z) {

  tr.v *= z.big ? 0.5 : 0.9;

  G.crushAcc = (G.crushAcc || 0) + dmg;
  const shown = Math.floor(G.crushAcc + 1e-9);
  G.crushAcc -= shown;
  if (!G.demo && !G.result && shown) addTotal(c.x0, c.y0 - 12, shown, U.red, z.big, true);
  hurtTrain(dmg, 0, 'crush');

      g: 140, life: rnd(0.2, 0.4), max: 0.4, s: 1, c: pick(['#ffe2a0', '#ffb347']), add: true, drag: 2 });
  }

// The nearest survivor out in the open (running, or held by the dead) within r of zombie z.
function preyNear(z, r) {
  let best = null, bd = r;
  for (const p of G.people) {
    if (p.st !== 'run' && p.st !== 'grab') continue;
    const d = Math.hypot(p.x - z.x, (p.y - z.y) / FORE);
    if (d < bd) { bd = d; best = p; }
  }

}
const TL = { u: 0, a: 0, c: 1 };

// The view: it follows the train, and is moved on by G.lead (camLead).

// the middle of the view before the lead: ahead of the train's middle car, so the train sits a

function camBase(o) {

// ---------- the Turbo Ram
// E (or a click on its card): the train runs at 120 px/s (3x its cruise) for 3 s and smashes every zombie in its way,
// brutes too, at no cost. Every run starts with it full; 250 kills (not its own) fill it again.
// What it can do now: 'none' (no card), 'lock' (the boiler cracked: buy TURBO RAM in the tree),
// 'on' (running), 'stop' (a station is too near), 'charge' (filling up) or 'ready'.
function ramState() {
  const r = G.ram;
  if (r.on) return 'on';
  if (!G.up.ram) return r.card ? 'lock' : 'none';
  if (G.result || nearStop(CFG.ram.noStart)) return 'stop';
  return r.left > 0 ? 'charge' : 'ready';
}
// 0..1: how full the Ram is
const ramCharge = () => 1 - G.ram.left / ramFill();
// kills to fill the Ram (RAM CHARGE takes some off)
const ramFill = () => CFG.ram.charge - (G.up.ramCharge || 0);
// true while the train brakes for a station or stands at one, or the next one is less than d px ahead
function nearStop(d) {
  const st = G.station;
  if (!st || st.state === 'done') return false;
  return st.state !== 'ahead' || G.tr.s - st.stopS < d;
}
// A kill (not the Ram's) fills the Ram a little, also while it runs; when it gets full: a beep and a
// gold flash on its card (once the Ram that runs is over).
function chargeRam() {
  const r = G.ram;
  if (r.left <= 0) return;
  r.left--;
  if (r.left <= 0 && !r.on) ramFull();
}
function ramFull() {
  if (!G.up.ram || G.demo) return;
  G.ram.flash = realT;
  SFX.ramReady();
}
// E or a click on the card. bot = the autopilot (it is not told no). True when the Ram starts.
function tryRam(bot) {

  const s = ramState(), r = G.ram;
  if (s === 'ready') {
    ramStart();
    return true;
  }
  if (bot || G.demo || s === 'on' || s === 'none') return false;
  // say why not, over the card
  const st = G.station, m = st ? Math.max(0, Math.round((G.tr.s - st.stopS) / 20) * 10) : 0;
  r.msg = { t: realT, s: s === 'lock' ? 'BUY TURBO RAM IN THE SKILL TREE.'
    : s === 'stop' ? (st && st.state === 'ahead' ? 'STATION IN ' + m + ' M. NO RAM UNDER ' + CFG.ram.noStart / 2 + ' M.' : 'NO RAM AT A STATION.')
      : 'KILL ' + r.left + ' MORE TO FILL IT.' };

  return false;
}
function ramStart() {

      life: rnd(1.6, 2.4), max: 2.4, s: rnd(3, 5), c: pick(['rgba(22,20,20,0.8)', 'rgba(34,31,30,0.75)']), grow: 5, drag: 1.1, smoke: true });
  }

    life: rnd(0.5, 0.9), max: 0.9, s: rnd(2, 3), c: pick(['rgba(240,240,232,0.8)', 'rgba(214,218,214,0.75)']), grow: 7, drag: 2.6, smoke: true });

// The scrap of the Ram's kills not shown yet pops off the engine's nose as one blue +N, thrown out
// to the left (the kill count is on the right). One each 0.2 s at most: the train leaves them
// behind in a neat line, never on top of each other.
const RAM_POP = 0.2;
function popRam() {
  const r = G.ram, c = G.tr.cars[0], v = '+' + r.pop;
  if (!r.pop) return;
  floatText(c.x0 - 6, c.y0 - 6, v, U.blue);
  const t = texts[texts.length - 1];
  if (t && t.v === v) {
    t.s = scrapPopScale(false);
    t.vx = -rnd(42, 58);
    t.vz = rnd(20, 28);
    t.life = t.max = 0.6;
  }

// The Ram kills z: twice the scrap, a crunch that climbs with the count, a small shake.
function ramKill(z) {
  const r = G.ram;
  r.kills++;
  r.total++;
  r.killT = realT;
  kill(z, 'ram', 0, 0, 0);

// Each step of the Ram: its time, the station rule, the hiss as it eases off, the end.
function updateRam(dt) {
  const r = G.ram;
  if (!r.on) return;
  if (G.result) {
    r.on = false;
    if (!G.demo) SFX.ramStop(0.4);
    return;
  }
  r.t += dt;
  // a station ahead: it ends now, so the train can brake in time
  if (nearStop(CFG.ram.cut)) {
    ramEnd(true);

  }
  if (r.t >= r.dur && !r.hissed) {
    r.hissed = true;
    if (!G.demo) SFX.hiss();

    return;

  return r.on ? (r.t < r.dur ? 1 : clamp(1 - (r.t - r.dur) / CFG.ram.ease, 0, 1)) : 0;

      c: Math.random() < 0.5 ? '#ffe2a0' : '#ff9a3a', add: true, drag: 1 });

      vx: c.nx * s * rnd(30, 60) + c.dx * tr.v * 0.9, vy: c.ny * s * rnd(30, 60) + c.dy * tr.v * 0.9, vz: rnd(6, 16), g: 0,
      life: rnd(0.4, 0.7), max: 0.7, s: rnd(2, 3), c: pick(['rgba(126,108,84,0.5)', 'rgba(104,90,70,0.5)']), grow: 5, drag: 3, smoke: true });

// The Ram is over (cut = a station is near: BRAKES!). Show its rank and what it paid.

// ---------- hits and kills
// Blood drops thrown away from the gun (up the screen) and to the sides; they stay on the ground.
function blood(x, y, n, zh) {
  for (let k = 0; k < n; k++) part({ x: x + rnd(-1, 1), y, z: rnd(3, zh), vx: rnd(-35, 35), vy: rnd(-45, 12), vz: rnd(15, 70),
    g: 240, life: 1.4, max: 1.4, s: 1, c: pick([P.bl0, P.bl1, P.bl2, P.bl2]), land: 1 });
}
// cause = 'mg' (a heli's nose gun round), 'gun' (the flatcar gun), 'he' (the 105 at (cx, cy), dist away),
// 'train' (run down) or 'ram' (the Turbo Ram). free = not the player's kill (no score).
function kill(z, cause, cx, cy, dist, free) {
  if (z.dead) return;
  if (typeof tutKill === 'function') tutKill(z, cause, free);
  z.dead = true;
  z.hp = 0;
  z.paid = 0;
  const sc = scoring() && !free, S = z.S, bs = G.bodies, room = bs.length < 160, ram = cause === 'ram';
  // every kill but the Ram's own fills the Ram again
  if (!ram && !free) chargeRam();
  // Its value (twice for the Ram) times kill pay, then Salvage Crew's extra share.
  // Whole scrap pays now; the fraction waits for the next scored kill.
  let pay = 0;
  if (sc) {
    const base = z.value * (ram ? CFG.ram.pay : 1) * (z.gold ? 1 : CFG.pay.kill);
    G.killAcc += base * (1 + G.up.salvage);
    pay = Math.floor(G.killAcc + 1e-9);
    G.killAcc -= pay;
    if (cause === 'gun') G.gun.kills++;
    if (!SAVE.flags.scrapEarned) { SAVE.flags.scrapEarned = true; saveSave(); }
    G.kills++;
    G.cash += pay;
    G.pay.kills += pay;
    G.killBump = 1;
  }
  if (cause === 'he') {
    // thrown away from the blast, turning over
    const dx = z.x - cx, dy = (z.y - cy) / FORE, l = Math.hypot(dx, dy) || 1, f = 1 - Math.min(1, dist / CFG.he.hurt);
    const v = (35 + f * 80) * (z.big ? 0.4 : 1) * rnd(0.8, 1.2);
    if (room) bs.push({ S, x: z.x, y: z.y, z: 2, vx: dx / l * v, vy: dy / l * v * FORE,
      vz: (50 + f * 130) * (z.big ? 0.5 : 1) * rnd(0.8, 1.2), spin: rnd(8, 16) * (dx < 0 ? -1 : 1), rot: 0, fall: false, age: 0 });
    else stampCorpse(S, z.x, z.y);
    blood(z.x, z.y, z.big ? 10 : 4, S.h * 0.5);
    if (Math.random() < 0.4) part({ x: z.x, y: z.y, z: rnd(4, 9), vx: rnd(-10, 10), vy: rnd(-5, 5), vz: rnd(12, 30), g: -6,
      life: rnd(0.4, 0.8), max: 0.8, s: 1, c: pick(['#ff8a3a', '#ffc27a']), add: true, drag: 1.5 });
  } else if (cause === 'train' || ram) {
    // run down: flung aside and ahead, a burst of blood. The Ram throws them twice as hard (and on
    // ahead of the speeding train), and each one pops its scrap
    const c = G.tr.cars[0], s = trackLocal(z.x, z.y, TL).u < 0 ? -1 : 1, k = ram ? 2 : 1;
    const v = rnd(40, 80) * k, f = rnd(15, 35) * k + (ram ? G.tr.v * 0.6 : 0);
    if (room) bs.push({ S, x: z.x, y: z.y, z: 2, vx: c.nx * s * v + c.dx * f, vy: c.ny * s * v + c.dy * f, vz: rnd(40, 80) * k,
      spin: rnd(10, 18) * s * k, rot: 0, fall: false, age: 0 });
    else stampCorpse(S, z.x, z.y);
    blood(z.x, z.y, z.big ? 16 : ram ? 14 : 10, S.h * 0.6);
    if (sc) {
      // (the Ram's kills pop their +2 in turn; the scrap of kills too close together goes into the
      // next one, so they never pile up)
      if (ram) {
        G.ram.pop += pay;
        if (G.t - G.ram.popT >= RAM_POP) popRam();
      } else if (pay) addTotal(z.x, z.y - S.h, pay, U.blue, scrapPopScale(!!z.gold));
    }
  } else if (z.st === 2 && room) {
    // shot off the train: knocked off its side (or off the nose), with the train's speed
    const c = G.tr.cars[z.car], s = z.side, v = rnd(25, 45), tv = G.tr.v * 0.6;
    bs.push(s ? { S, x: z.x, y: z.y, z: 3, vx: c.nx * s * v + c.dx * tv, vy: c.ny * s * v + c.dy * tv, vz: rnd(25, 45), spin: 0, rot: 0, fall: true, age: 0 }
      : { S, x: z.x, y: z.y, z: 3, vx: c.dx * (v + tv), vy: c.dy * (v + tv), vz: rnd(25, 45), spin: 0, rot: 0, fall: true, age: 0 });
    blood(z.x, z.y, z.big ? 14 : 8, S.h * 0.6);
    if (sc && pay) addTotal(z.x, z.y - S.h, pay, U.blue, scrapPopScale(!!z.gold));
    if (!G.demo) SFX.splat();
  } else {
    // a gun kill (a heli round, the flatcar gun, a blast of an explosive
    // zombie): the body bursts into a red splat that stays. In a horde only the big ones show
    // their scrap; the rest go to the counter as coins now and then.
    popKill(z, cause);
    if (sc && pay && (z.big || z.gold || z.silver)) addTotal(z.x, z.y - S.h, pay, U.blue, scrapPopScale(!!z.gold));
    if (!G.demo) SFX.splat();
  }
  z.paid = pay;
  if (cause === 'he' || cause === 'train' || ram || z.st === 2) juiceKill(z, cause, cx, cy);
  if (z.gold) goldKill(z, sc);
  if (z.silver) silverKill(z, sc);
  if (!free) boomRoll(z);
  if (sc && (Math.random() < 0.12 || z.big) && coins.length < 45) coins.push({ x0: z.x - G.camX, y0: z.y - G.camY - 8, t: 0, T: rnd(0.55, 0.8) });
  if (z.big && !G.demo) {
    addShake(0.15);
    hitStop(0.05, 0.3);
  }
}
// A 25mm hit: 1 base damage, more with Gun Damage (the demo hits for 1). Or a hit of dmg from another
// gun (cause 'gun' = the flatcar gun).
function hitZombie(z, dmg, cause) {
  z.hp -= dmg != null ? dmg : G.demo ? 1 : heliDmg();
  z.flash = z.big ? 0.16 : 0.1;
  juiceHit(z, cause);
  if (z.hp <= 0) {
    kill(z, cause || 'mg', 0, 0, 0);
    return true;
  }
  // A surviving target takes the hit: blood and a step back (unless it holds on to the train).
  blood(z.x, z.y, 4, z.S.h * 0.6);
  if (z.st !== 2) z.kby -= 12;
  if (!G.demo) SFX.hit();
  return false;
}
// A 25mm round lands: its locked target first, then the nearest round the burst. KILLED = the
// ones it killed for the hit-stop.
const NEAR = [], KILLED = [];
function mgImpact(r) {
  const x = r.bx, y = r.by, T = r.tgt, from = r.h ? [r.h.x, r.h.y] : null, dmg = r.dmg ?? heliDmg();
  let hits = 0;
  KILLED.length = 0;
  if (T) T.pending = Math.max(0, T.pending - dmg);
  if (T && !T.dead && Math.hypot(T.x - x, (T.y - y) / FORE) < 6) {
    JUICE.from = from; // the blood flies away from the heli that shot
    if (hitZombie(T, dmg)) KILLED.push(T);
    hits++;
  }
  NEAR.length = 0;
  queryEll(x, y, CFG.mg.splash, (z, d) => {
    if (z === T) return;
    z.qd = d;
    NEAR.push(z);
  });
  NEAR.sort((a, b) => a.qd - b.qd);
  for (const z of NEAR) {
    if (hits >= CFG.mg.victims) break;
    if (!z.dead) {
      JUICE.from = from;
      if (hitZombie(z, dmg)) KILLED.push(z);
      hits++;
    }
  }
  JUICE.from = null;
  if (hits && r.player) {
    G.hits++;
    G.hitT = 0.12;
  }
  if (r.player) roundKills(KILLED);
  // the round lands: a spark of light, a few sparks and a little dust (no mark: the ground stays
  // clean for the blood)
  hitSpark(x, y, r.kind === 'heli' ? dmg : 1);
  if (!G.demo) SFX.pop();
}
// The look of a big blast (no damage): flash, fireball, rings, smoke, earth, sparks, fires, a crater.
function boomFx(x, y, big) {
  lights.push({ x, y, z: 6, r: big ? 50 : 38, c: '#ff8a3a', life: 0.35, max: 0.35, a: 0.6 });
  lights.push({ x, y, z: 6, r: 20, c: '#fff6e0', life: 0.1, max: 0.1, a: 0.8 });
  addBoom(x, y, big ? 26 : 18, 7, 0.75, big ? 11 : 8);
  for (let k = 0; k < (big ? 4 : 2); k++) {
    const a = rnd(TAU), r = rnd(10, 22);
    addBoom(x + Math.cos(a) * r, y + Math.sin(a) * r * FORE, 12, 4, 0.5, 6, rnd(0.03, 0.15));
  }
  rings.push({ x, y, r0: 8, r1: CFG.he.kill * 1.25, t: 0, T: 0.3, c: '#ffd8a0', w: 2 });
  rings.push({ x, y, r0: 20, r1: CFG.he.hurt * 1.5, t: 0, T: 0.55, c: '#a89878' });
  for (let k = 0; k < 16; k++) part({ x: x + rnd(-14, 14), y: y + rnd(-8, 8), z: rnd(4, 18), vx: rnd(-14, 14) + 4, vy: rnd(-6, 6),
    vz: rnd(10, 34), g: 0, life: rnd(1.4, 2.8), max: 2.8, s: rnd(4, 8),
    c: pick(['rgba(96,92,88,0.7)', 'rgba(76,72,68,0.7)', 'rgba(124,120,114,0.6)']), grow: 6, drag: 1, smoke: true });
  for (let k = 0; k < 34; k++) {
    const a = rnd(TAU), s = rnd(30, 130);
    part({ x, y, z: 3, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(60, 170), g: 320, life: 2, max: 2,
      s: Math.random() < 0.3 ? 2 : 1, c: pick(['#4c4032', '#362d24', '#5e5140', '#2a241d']), land: 1 });
  }
  for (let k = 0; k < 18; k++) {
    const a = rnd(TAU), s = rnd(30, 120);
    part({ x, y, z: 5, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(30, 140), g: 140, life: rnd(0.4, 0.9), max: 0.9,
      s: 1, c: pick(['#ffe2a0', '#ffb347', '#ff6a28']), add: true, drag: 1.2 });
  }
  for (let k = 0; k < 3 && flames.length < 30; k++) {
    const a = rnd(TAU), r = rnd(6, 24);
    flames.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * FORE, life: rnd(3, 7), seed: rnd(100) });

  stampScorch(x, y, 3);
