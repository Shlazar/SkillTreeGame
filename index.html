// main.js - input (mouse, keys, wheel), the camera mode, the main loop (fixed steps with hit-stop)
// and the start-up (the save is read first). window.__sr is a small API for tests and the browser
// console.

// ---------- camera mode
function setThermal(k) {
  thermal = k;
  if (mode === 'play' || mode === 'ending') banner('CAMERA', CAMS[thermal], thermal ? '#e8e8e8' : U.ink, 3);
}

// ---------- input
// Browser pointer position -> game pixels.
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
});
cv.addEventListener('pointerleave', () => { M.inside = false; });
cv.addEventListener('pointerdown', (e) => {
  audioInit();
  try { cv.focus({ preventScroll: true }); } catch (_) { /* old browsers */ }
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
  if (e.button === 2) {
    if (mode === 'depot') M.rpressed = true;
    tryHE();
    return;
  }
  if (e.button !== 0) return;
  // a click on the Turbo Ram's card rams (it does not fire the 25mm)
  if (mode === 'play' && !paused && RAMCARD.on && inR(p.x, p.y, RAMCARD.x, RAMCARD.y, RAMCARD.w, RAMCARD.h)) {
    tryRam();
    return;
  }
  // with reduced motion, PRESS E! stops the game: a click on the field goes on without the Ram
  if (mode === 'play' && G.prompt && REDUCED) G.prompt = null;
  M.down = true;
  M.pressed = true;
  M.px = p.x;
  M.py = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* fine without */ }
  if (mode === 'summary' && realT - sumStart > 0.6) sumSkip();
  if (mode !== 'play' || p.y < 19) return;
  // a click on the field goes on after a pause; otherwise it is the trigger
  if (paused) {
    if (!pauseHit(p.x, p.y)) {
      setPaused(false);
      M.used = true;
    }
  } else G.trigger = true;
});
cv.addEventListener('pointerup', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  if (e.button !== 0) return;
  if (M.down) {
    M.down = false;
    M.released = true;
  }
  if (G) G.trigger = false;
});
cv.addEventListener('pointercancel', () => {
  M.down = false;
  if (G) G.trigger = false;
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());
// the wheel zooms in and out one step (bigger or smaller pixels)
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const z = clamp(zoomStep + (e.deltaY < 0 ? 1 : -1), -1, 1);
  if (z !== zoomStep) {
    zoomStep = z;
    onResize();
  }
}, { passive: false });

// KEYS[k] = true while key k is held. keyAxis() = the way WASD / the arrow keys push, [x, y].
const KEYS = {};
const keyName = (e) => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
function keyAxis() {
  return [(KEYS.d || KEYS.ArrowRight ? 1 : 0) - (KEYS.a || KEYS.ArrowLeft ? 1 : 0),
    (KEYS.s || KEYS.ArrowDown ? 1 : 0) - (KEYS.w || KEYS.ArrowUp ? 1 : 0)];
}
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = keyName(e);
  if (k === ' ' || k === 'Tab' || k.startsWith('Arrow')) e.preventDefault();
  KEYS[k] = true;
  if (e.repeat) return;
  audioInit();
  if (k === 'm') {
    Au.muted = !Au.muted;
    droneLevel = -1;
    if (Au.muted) SFX.ramStop(0.05);
    return;
  }
  if (k === 't') {
    setThermal((thermal + 1) % 3);
    return;
  }
  if (mode === 'play') {
    // (with reduced motion PRESS E! stops the game: any other key goes on without the Ram)
    if (G.prompt && REDUCED && k !== 'e') G.prompt = null;
    if (k === ' ') tryHE();
    else if (k === 'e') { if (!paused) tryRam(); }
    else if (k === 'f') G.heli.home = true;
    else if (k === 'Escape' || k === 'p') setPaused(!paused);
  } else if (mode === 'title') {
    if (k === 'Enter' || k === ' ') titleGo();
    else if (k === 'Escape') titleAsk = false;
  } else if (mode === 'depot') depotKey(k);
  else if (mode === 'summary') {
    // ENTER or ESC: show it all, then go to the Depot. Not SPACE (it fires the 105mm, and may still
    // be mashed as the train goes), and nothing in the first moment after the summary opens.
    if ((k === 'Enter' || k === 'Escape') && realT - sumStart > 0.6 && !sumSkip()) toDepot();
  }
});
addEventListener('keyup', (e) => { KEYS[keyName(e)] = false; });
// Pause a run or go on: the trigger is let go. The Turbo Ram's roar stops on pause and comes back
// (for the time the Ram has left) on going on.
function setPaused(p) {
  if (p === paused) return;
  paused = p;
  if (G) G.trigger = false;
  if (p) SFX.ramStop(0.15);
  else if (G && G.ram.on && !G.demo && mode === 'play') SFX.roar(G.ram.dur + CFG.ram.ease - G.ram.t, false);
}
// pause when the window loses focus or the tab is hidden; let go of every key and the trigger
function lostFocus() {
  for (const k in KEYS) KEYS[k] = false;
  if (G) G.trigger = false;
  M.down = false;
  if (mode === 'play') setPaused(true);
}
addEventListener('blur', lostFocus);
// the page is closed or left in the middle of a run: what the run earned so far is kept
addEventListener('pagehide', () => {
  if (mode === 'play' || mode === 'ending') bankRun();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) lostFocus(); });
function onResize() {
  if (resize()) {
    bakeOverlays();
    if (G) placeCamera();
  }
}
addEventListener('resize', onResize);

// ---------- main loop
// last = time of the last frame, acc = game time still to step. FPS = stats for the debug API.
// hold = time stands still (tests take close-up pictures this way)
let last = performance.now(), acc = 0, droneLevel = -1, hold = false;
// tests: a skill tree node the mouse stays on (__sr.hoverNode), even while the window settles
let testHover = null;
const FPS = { n: 0, sum: 0, worst: 0, t: 0, avg: 0, lastWorst: 0 };
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = (now - last) / 1000;
  last = now;
  FPS.n++;
  FPS.sum += rdt;
  FPS.worst = Math.max(FPS.worst, rdt);
  FPS.t += rdt;
  if (FPS.t > 1) {
    FPS.avg = FPS.n / FPS.sum;
    FPS.lastWorst = FPS.worst;
    FPS.n = FPS.sum = FPS.worst = FPS.t = 0;
  }
  oneFrame(Math.min(0.1, Math.max(0, rdt)));
}
// One frame of dt seconds: the game steps, the camera, the sound, the drawing, then the mouse
// clicks are used up.
function oneFrame(dt) {
  realT += dt;
  frameDt = dt;
  // hit-stop: slow motion while slowT lasts
  let ts = 1;
  if (slowT > 0) {
    slowT -= dt;
    ts = slowK;
    if (slowT <= 0) slowK = 1;
  }
  // PRESS E!: time at 25% for up to 3 s (with reduced motion it stands still until a key or a click)
  const pr = G.prompt;
  if (pr && mode === 'play' && !paused) {
    if (REDUCED) ts = 0;
    else {
      ts = Math.min(ts, 0.25);
      pr.left -= dt;
      if (pr.left <= 0) G.prompt = null;
    }
  }
  // fixed steps of STEP seconds, at most 8 a frame
  if (!(mode === 'play' && paused) && !hold) {
    acc += dt * ts;
    let n = 0;
    try {
      while (acc >= STEP && n < 8) {
        step(STEP);
        acc -= STEP;
        n++;
      }
    } catch (err) {
      acc = 0;
      if (!loop.errs) {
        loop.errs = 1;
        console.error(err);
      }
    }
    if (n >= 8) acc = 0;
  }
  // the view's lead glides in real time, also while time runs slow or stands still
  camLead(dt);
  placeCamera();
  updateCam(dt);
  G.shownCash = Math.abs(G.shownCash - G.cash) < 1 ? G.cash : lerp(G.shownCash, G.cash, 1 - Math.exp(-10 * dt));
  // the engine hum: loud in play, quiet behind the menus, higher while the Turbo Ram runs
  const live = mode === 'play' && !paused, dl = live ? 1 : mode === 'ending' ? 0.7 : 0.4;
  const dk = live && !G.demo ? Math.round(ramK() * 4) / 4 : 0;
  if (Au.ctx && dl + dk * 10 !== droneLevel) {
    droneLevel = dl + dk * 10;
    drone(dl, dk);
  }
  cursor = 'default';
  if (testHover && mode === 'depot') {
    const p = nodeXY(testHover);
    M.x = p.x;
    M.y = p.y;
    M.inside = true;
  }
  try {
    tutFrame(dt);
    render();
    drawUI();
    drawFade();
  } catch (err) {
    if (!loop.rerr) {
      loop.rerr = 1;
      console.error(err);
    }
  }
  // the game draws its own sight, so the mouse pointer hides in play
  cv.style.cursor = mode === 'play' && !paused && M.y >= 19 && cursor === 'default' ? 'none' : cursor;
  M.pressed = false;
  M.released = false;
  M.used = false;
  M.rpressed = false;
}

// ---------- start
function boot() {
  initSprites();
  bakeScorch();
  resize();
  bakeStatic();
  bakeOverlays();
  loadSave();
  newGame(true);
  mode = 'title';
  window.__sr = {
    get G() { return G; },
    get mode() { return mode; },
    get SAVE() { return SAVE; },
    FPS,
    CFG,
    // the horde by distance (rows of HORDE in game.js), for balance tests
    HORDE,
    // the sprites, for a test sheet
    art: () => ({ TRAIN, FOOT, HELI, STATION, SURV, ZS, ICON, TURRET }),
    // start(from): a run from 'depot' (the default) or a reached station ('farm', 'mill')
    start: (from) => startGame(from || 'depot'),
    title: toTitle,
    // depot(tab): the Depot screen with tab 'tree' or 'station' open
    depot: (tab) => toDepot(tab || 'tree'),
    // sim(sec): run the game for sec seconds at once, without drawing
    sim: (sec) => {
      const n = Math.round(sec / STEP);
      for (let i = 0; i < n; i++) {
        step(STEP);
        camLead(STEP);
      }
    },
    aim: (x, y) => {
      M.x = x;
      M.y = y;
      M.inside = true;
    },
    trigger: (on) => { G.trigger = !!on && mode === 'play'; },
    he: () => tryHE(),
    thermal: (k) => setThermal(k),
    // hp(v): set the train's health. jump(px): move the train on to px before where it brakes for
    // the next station (or, past the last one, before the safe zone); the dead are left behind.
    hp: (v) => { G.tr.hp = G.tr.hpShown = v; },
    jump: (px) => {
      const st = G.station, to = (st && st.state === 'ahead' ? st.stopS : G.goalS) + px;
      G.tr.s = Math.min(G.tr.s, to);
      for (const z of G.zombies) z.gone = true;
      layoutTrain();
      placeCamera();
    },
    // km(x): move the train to x km from the Depot (stations and walls behind it are passed by;
    // the dead are left behind; the move does not pay)
    km: (x) => {
      if (G.demo) return;
      const s = sAtKm(x), tr = G.tr;
      tr.s = s;
      tr.fy = yOfS(s);
      for (const st of G.stations) if (st.stopS > s + 1) st.state = 'done';
      for (const w of G.walls) if (w.s > s) w.placed = w.warned = w.awake = true;
      for (const z of G.zombies) z.gone = true;
      G.maxKm = Math.max(G.maxKm, x);
      layoutTrain();
      placeCamera();
    },
    // lose(): the train breaks now (the summary follows 3.4 s later)
    lose: () => { if (mode === 'play' && !G.result) lose(); },
    keys: (k, on) => { KEYS[k] = !!on; },
    // hit(z, dmg, cause): zombie z takes dmg (default 1) as from a gun ('mg', or 'gun' = the flatcar gun)
    hit: (z, dmg, cause) => hitZombie(z, dmg || 1, cause || 'mg'),
    // spawn(type, sx, sy): a zombie standing still at screen pixel (sx, sy): 0 walker, 1 runner, 2 brute
    spawn: (type, sx, sy) => {
      const z = makeZombie(G.camX + sx, G.camY + sy, type | 0);
      z.sp = 0;
      G.zombies.push(z);
      return z;
    },
    // press(k): a key goes down and up, as if typed (k = 'Enter', 'Tab', 'Escape', 'a'...)
    press: (k) => {
      dispatchEvent(new KeyboardEvent('keydown', { key: k }));
      dispatchEvent(new KeyboardEvent('keyup', { key: k }));
    },
    // hover(x, y) / click(x, y): the mouse over / a full click at game pixel (x, y); click draws
    // one frame so the button under it acts at once
    hover: (x, y) => {
      testHover = null;
      M.x = x;
      M.y = y;
      M.inside = true;
    },
    click: (x, y) => {
      M.x = M.px = x;
      M.y = M.py = y;
      M.inside = true;
      M.down = false;
      M.pressed = M.released = true;
      M.used = false;
      if (mode === 'summary') sumSkip();
      render();
      drawUI();
      M.pressed = M.released = false;
    },
    // frames(n, dt): n whole frames of dt s (default 1/60) at once, as the main loop runs them
    // (the clock, the game, the drawing, the clicks). Headless pages barely run their own frames.
    frames: (n, dt) => {
      for (let i = 0; i < (n || 1); i++) oneFrame(dt || 1 / 60);
    },
    // the Turbo Ram: ram() = press E (true when it starts), ramCharge(v) = fill it to v (0..1);
    // ramState() = 'none', 'lock', 'on', 'stop', 'charge' or 'ready'
    ram: () => tryRam(),
    ramCharge: (v) => {
      G.ram.left = Math.round((1 - clamp(+v || 0, 0, 1)) * CFG.ram.charge);
      return ramCharge();
    },
    ramState: () => ramState(),
    // sound: roar = the Ram's roar is playing (or set to play), ctx = the audio is on
    sound: () => ({ ctx: !!Au.ctx, roar: !!Au.roar, muted: Au.muted }),
    // bot(on): the autopilot plays (it aims and pulls the triggers)
    bot: (on) => { G.bot = !!on; if (!on) G.trigger = false; },
    pause: (p) => setPaused(!!p),
    hold: (h) => { hold = !!h; },
    // the save: give(scrap, surv) adds money, reach(id, held) marks a station reached (and held),
    // save() is a copy of it, load() reads it again from storage, reset() wipes it (to the title)
    give: (scrap, surv) => {
      SAVE.scrap = Math.max(0, SAVE.scrap + (scrap | 0));
      SAVE.surv = Math.max(0, SAVE.surv + (surv | 0));
      saveSave();
      return { scrap: SAVE.scrap, surv: SAVE.surv };
    },
    reach: (id, held) => {
      if (!STATIONS.some((d) => d.id === id)) return;
      if (!SAVE.reached.includes(id)) SAVE.reached.push(id);
      if (held && !SAVE.held.includes(id)) SAVE.held.push(id);
      saveSave();
    },
    // the skill tree: node(id, l) sets a level (no price), buy(id) buys one level as a click does
    // (true when bought), nodeAt(id) = where the node is on screen with the tree tab open,
    // hoverNode(id) puts the mouse on it, clickNode(id) clicks it, tree() = each node's level and state
    node: (id, l) => setNode(id, l),
    buy: (id) => buyNode(id),
    nodeAt: (id) => nodeXY(id),
    hoverNode: (id) => {
      testHover = NODE[id] ? id : null;
      const p = nodeXY(id);
      if (p) {
        M.x = p.x;
        M.y = p.y;
        M.inside = true;
      }
      return p;
    },
    clickNode: (id) => {
      const p = nodeXY(id);
      if (p) window.__sr.click(p.x, p.y);
      return p;
    },
    tree: () => Object.fromEntries(NODES.map((n) => [n.id, lv(n.id) + ' ' + nodeState(n)])),
    goal: () => summaryGoal(),
    // infoFit() = the info box lines that do not fit on one line of the box, at any level (none is
    // right), and the widest line's width next to the room there is
    infoFit: () => {
      const bad = [], inner = INFO_W - 14;
      let widest = 0;
      for (const n of NODES) {
        widest = Math.max(widest, tw(n.desc));
        if (tw(n.desc) > inner) bad.push(n.id + ': ' + n.desc);
        for (const s of [n.stat, n.stat2].filter(Boolean)) {
          for (let l = 0; l <= maxLv(n); l++) {
            const w = statSegs(s, l, l >= maxLv(n)).reduce((a, [t]) => a + tw(t) + 5, -5);
            widest = Math.max(widest, w);
            if (w > inner) bad.push(n.id + ' LV ' + l + ': ' + w);
          }
        }
      }
      return { bad, widest, inner };
    },
    save: () => JSON.parse(JSON.stringify(SAVE)),
    load: () => loadSave(),
    reset: () => {
      newSave();
      titleAsk = false;
      toTitle();
    },
    // bench(n): draw n frames at once; the average ms per frame
    bench: (n) => {
      const t = performance.now();
      for (let i = 0; i < n; i++) {
        render();
        drawUI();
      }
      return (performance.now() - t) / n;
    },
    stats: () => ({
      mode, result: G.result, km: G.demo ? 0 : +DK().toFixed(3), kills: G.kills, cash: Math.floor(G.cash), runSurv: G.surv,
      scrap: SAVE.scrap, survivors: SAVE.surv, best: SAVE.best, runs: SAVE.runs,
      pay: Object.assign({}, G.pay), hp: Math.round(G.tr.hp), max: G.tr.max, speed: +G.tr.v.toFixed(1),
      onTrain: G.onTrain, t: +G.run.toFixed(1), zombies: G.zombies.length, bodies: G.bodies.length, up: Object.assign({}, G.up),
      shots: G.shots, scavPaid: G.scavPaid, overheat: G.overheat, heReload: +G.heReload.toFixed(2), far: G.heli.far, hurt: Object.assign({}, G.hurt),
      station: G.station ? G.station.id + ' ' + G.station.state + ' ' + G.station.saved + '/' + G.station.people + ' lost ' + G.station.lost : '-',
      walls: G.walls.map((w) => w.km + (w.awake ? ' awake' : w.placed ? ' placed' : ' ahead')),
      heli: [Math.round(G.heli.ox), Math.round(G.heli.oy)],
      rounds: G.rounds.length, parts: parts.length, texts: texts.length, chunks: GROUND.size, decals: DECALS.size,
      W, H, SCALE, fps: Math.round(FPS.avg), worstMs: Math.round(FPS.lastWorst * 1000), lock: !!G.lock, heat: +G.heat.toFixed(2),
      gun: { rate: G.up.gun, shots: G.gun.shots, kills: G.gun.kills, ang: +G.gun.ang.toFixed(2), tgt: G.gun.tgt ? G.gun.tgt.st : -1 },
      ram: { state: ramState(), on: G.ram.on, t: +G.ram.t.toFixed(2), charge: +ramCharge().toFixed(3), kills: G.ram.kills, pay: G.ram.pay,
        uses: G.ram.uses, total: G.ram.total, taste: G.taste, prompt: !!G.prompt }
    })
  };
  requestAnimationFrame((t) => {
    last = t;
    requestAnimationFrame(loop);
  });
}
boot();

// loot.js - the finds you fly out from the train for: scrap piles on car wrecks, supply crates in
// burnt farms (the dead stand guard; they come only once the train has its flatcar gun), the golden
// crate (once per save) and the stranded survivor on a bus roof (SOS, once per save, after Farm Stop
// is held) that the Winch lifts. Fly so the heli's ground point (the middle of the view) is over a
// find: it flies up to the heli and pays. G.loot = this run's finds, rolled in newGame().

// pile: one spot every `every` px along the rails (100 m), `fill` of them have a pile (rolled again
// each run), `near` to `far` px from the rails. crate: its guards, how near the heli wakes them,
// how near the heli its edge arrow shows, how far along the rails ahead of the train its guards are
// placed. gold / sos: km, px from the rails, side (1 east, -1 west), how near the heli their arrow
// shows. sos.reach = px the heli must hover within for the Winch. fly = seconds a find takes to fly
// up to the heli. Past farKm (Farm Stop) piles and crates pay payFar. clear = no pile within this
// many px along the rails of a stop (so none lies in a station's grid).
const LOOT = {
  pile: { every: 200, fill: 0.6, near: 80, far: 260, pay: 15, payFar: 30 },
  crate: { pay: 50, payFar: 100, guards: 8, wake: 120, arrow: 450, place: 500 },
  gold: { km: 0.32, off: 410, side: -1, pay: 150, arrow: 700 },
  sos: { km: 1.2, off: 220, side: 1, reach: 20, arrow: 700 },
  fly: 0.3, farKm: 1, clear: 180
};
// the supply crates: [km, px from the rails, side]
const CRATES = [[0.12, 260, 1], [0.58, 300, -1], [1.30, 320, -1], [1.55, 300, 1], [1.90, 280, -1]];
// the find sprites (drawn once, on the first run)
const LART = {};
function lootArt() {
  if (LART.heap) return;
  // a small heap of scrap metal: plates, a pipe, a wheel rim, rust
  LART.heap = prop(outline(pix(13, 8, (r) => {
    r(1, 4, 11, 4, '#3b3f46'); r(0, 6, 13, 2, '#2d3038'); r(2, 2, 5, 3, '#626875'); r(2, 2, 5, 1, '#b4b9c1');
    r(7, 1, 4, 4, '#5a4a3a'); r(7, 1, 4, 1, '#a07040'); r(5, 0, 1, 4, '#d6cdb6'); r(9, 4, 3, 2, '#7a3a22');
    r(1, 5, 3, 1, '#8b919c'); r(11, 3, 1, 1, '#e8dfc8'); r(4, 6, 1, 1, '#1c1e23'); r(8, 6, 2, 1, '#1c1e23');
    r(3, 3, 2, 1, '#8b919c'); r(10, 6, 2, 1, '#626875');
  }), P.out), 0);
  // a supply crate: olive green, banded, a white stencil cross
  const crate = (c0, c1, c2, mark) => pix(12, 10, (r) => {
    r(0, 3, 12, 7, c1); r(0, 3, 2, 7, c2); r(11, 3, 1, 7, c0); r(0, 9, 12, 1, c0);
    r(0, 0, 12, 4, c2); r(0, 0, 12, 1, mark); r(0, 3, 12, 1, c0);
    r(3, 3, 1, 7, c0); r(8, 3, 1, 7, c0); r(5, 5, 2, 3, mark); r(4, 6, 4, 1, mark);
  });
  LART.crate = prop(outline(crate('#2a3320', '#46552f', '#63743f', '#d8dcc8'), P.out), 4);
  LART.gold = prop(outline(crate('#7a5a1c', '#c9952f', '#f0c85a', '#fff1c2'), P.out), 4);
  // a school bus seen from above and the side, rusty, its windows dark
  LART.bus = prop(pix(40, 16, (r) => {
    r(4, 12, 5, 4, '#101012'); r(30, 12, 5, 4, '#101012');
    r(0, 5, 40, 9, '#b88a22'); r(0, 5, 40, 1, '#e3b04b'); r(0, 13, 40, 1, '#5e4410'); r(0, 5, 1, 9, '#e3b04b');
    r(1, 0, 38, 6, '#d9a636'); r(1, 0, 38, 1, '#f0c85a'); r(38, 1, 1, 5, '#8a6418');
    for (let x = 3; x < 37; x += 5) r(x, 7, 3, 3, '#1a1c20');
    r(0, 10, 40, 1, '#2a2420'); r(37, 7, 2, 3, '#d8cfb6');
    r(12, 1, 6, 2, '#8a5a1c'); r(26, 3, 5, 2, '#6a3a18'); r(5, 11, 3, 2, '#6a3a18');
  }), 10);
}

// A point px from the rails at km k, on side (1 east, -1 west): {x, y, s}
function lootBeside(k, px, side) {
  const s = sAtKm(k), y = yOfS(s), fp = trackSlope(y), c = 1 / Math.sqrt(1 + fp * fp);
  return { x: Math.round(trackX(y) + c * px * side), y: Math.round(y - fp * c * px * side), s };
}
// Tell the tutorial (when it is built in).
function lootTut(name, data) {
  if (typeof tutEvent === 'function') tutEvent(name, data || {});
}
// A find of kind 'pile', 'crate', 'gold' or 'sos' at km k: its props stand in G.statics.
function addFind(kind, k, px, side, pay) {
  const p = lootBeside(k, px, side), f = { kind, km: k, off: px, side, x: p.x, y: p.y, s: p.s, pay, gone: false, seen: false, t: Math.random() * 6, props: [] };
  const put = (d, x, y) => {
    const o = { d, x: Math.round(x), y: Math.round(y), k: Math.round(y) };
    G.statics.push(o);
    f.props.push(o);
    return o;
  };
  if (kind === 'pile') {
    put(Math.random() < 0.5 ? PROPS.wreck[(Math.random() * PROPS.wreck.length) | 0] : PROPS.burnt[0], f.x - 9 * side, f.y - 3);
    f.top = put(LART.heap, f.x, f.y);
  } else if (kind === 'crate') {
    // a burnt farm: broken walls, a burnt car, a barrel
    put(PROPS.wall[0], f.x - 24, f.y - 14);
    put(PROPS.wall[3], f.x + 20, f.y - 18);
    put(PROPS.wall[5], f.x - 30, f.y + 12);
    put(PROPS.burnt[1], f.x + 26, f.y + 8);
    put(PROPS.barrel[0], f.x + 12, f.y - 6);
    f.top = put(LART.crate, f.x, f.y);
    f.zs = [];
  } else if (kind === 'gold') f.top = put(LART.gold, f.x, f.y);
  else {
    f.top = put(LART.bus, f.x, f.y);
    f.stage = 'wait';
    f.w = 0;
  }
  G.loot.push(f);
  return f;
}
// Roll this run's finds: the fixed ones, then the piles (from a seed that changes every run).
function rollLoot() {
  lootArt();
  G.loot = [];
  G.lootFly = [];
  G.lootFar = false;
  G.goldFar = false;
  const rng = mulberry(hash32(SAVE.runs * 7919 + 101)), k0 = kmAt(G.tr.startS), c = LOOT.pile;
  const gate = (k) => k > k0 - 0.05;
  if (!SAVE.flags.gold && gate(LOOT.gold.km)) addFind('gold', LOOT.gold.km, LOOT.gold.off, LOOT.gold.side, LOOT.gold.pay);
  if (SAVE.held.includes('farm') && !SAVE.flags.sos && gate(LOOT.sos.km)) addFind('sos', LOOT.sos.km, LOOT.sos.off, LOOT.sos.side, 0);
  if (G.up.gun) for (const [k, px, side] of CRATES) if (gate(k)) addFind('crate', k, px, side, k > LOOT.farKm ? LOOT.crate.payFar : LOOT.crate.pay);
  const stops = [0].concat(STATIONS.map((d) => d.km)), fixed = G.loot.slice();
  for (let i = 1; i * c.every < CFG.line.end * CFG.line.km; i++) {
    const k = i * c.every / CFG.line.km, side = rng() < 0.5 ? -1 : 1, px = Math.round(lerp(c.near, c.far, rng())), on = rng() < c.fill;
    if (!on || !gate(k) || stops.some((sk) => Math.abs(sk - k) * CFG.line.km < LOOT.clear)) continue;
    const p = lootBeside(k, px, side);
    if (fixed.some((f) => Math.hypot(f.x - p.x, f.y - p.y) < 70)) continue;
    addFind('pile', k, px, side, k > LOOT.farKm ? c.payFar : c.pay);
  }
}
// The heli's ground point (the middle of the view, less the camera's lead)
const LG = [0, 0];
function heliGround() {
  LG[0] = G.camX + W / 2 - G.lead[0];
  LG[1] = G.camY + H / 2 - G.lead[1];
  return LG;
}

// ---------- each step
function updateLoot(dt) {
  if (!G.loot) return;
  const h = G.heli, [gx, gy] = heliGround(), live = mode === 'play' && !G.result, hy = Math.round(H * 0.12);
  if (live && h.far && !G.lootFar) lootTut('range_limit');
  G.lootFar = h.far;
  for (const f of G.loot) {
    if (f.gone && f.kind !== 'sos') continue;
    f.t += dt;
    const d = Math.hypot(f.x - gx, f.y - gy);
    if (!f.seen && live && (!offView(f.x, f.y, -12) || (f.kind !== 'pile' && d < (LOOT[f.kind].arrow || 0)))) {
      f.seen = true;
      lootTut(f.kind + '_seen', f.kind === 'sos' ? { winch: !!G.up.winch } : {});
    }
    if (f.kind === 'crate') crateStep(f, d, dt);
    if (f.kind === 'sos') {
      sosStep(f, d, dt, live);
      continue;
    }
    // the golden crate out of reach: the heli is held at the end of its range, near it
    if (f.kind === 'gold' && live && h.far && !G.goldFar && d < 240) {
      const rd = Math.hypot(f.x - G.tr.fx, f.y - G.tr.fy - hy);
      if (rd > G.up.range + G.up.pickup) {
        G.goldFar = true;
        lootTut('gold_too_far');
      }
    }
    if (live && d <= G.up.pickup) takeLoot(f);
  }
  // finds flying up to the heli; they pay when they get there
  for (let i = G.lootFly.length - 1; i >= 0; i--) {
    const q = G.lootFly[i];
    q.t += dt;
    if (q.t >= q.T) {
      G.lootFly.splice(i, 1);
      if (q.f) lootPaid(q.f);
    }
  }
}
// A find is taken: it flies up to the heli (the pile's heap or the crate leaves the ground).
function takeLoot(f) {
  f.gone = true;
  const i = G.statics.indexOf(f.top);
  if (i >= 0) G.statics.splice(i, 1);
  G.lootFly.push({ f, spr: f.top.d, x0: f.x, y0: f.y, t: 0, T: LOOT.fly });
  SFX.lootUp();
}
// It reached the heli: the pay, a chime, coins to the counter.
function lootPaid(f) {
  const [gx, gy] = heliGround(), big = f.kind !== 'pile';
  G.cash += f.pay;
  G.pay.loot += f.pay;
  G.cashPulse = 1;
  addTotal(gx, gy - 14, f.pay, U.gold, big);
  const n = f.kind === 'gold' ? 14 : big ? 7 : 4;
  for (let k = 0; k < n && coins.length < 60; k++) coins.push({ x0: gx - G.camX + rnd(-6, 6), y0: gy - G.camY - 10 + rnd(-4, 4), t: -k * 0.05, T: rnd(0.5, 0.75) });
  if (f.kind === 'gold') {
    SFX.golden();
    for (let k = 0; k < 26; k++) part({ x: gx, y: gy, z: 12, vx: rnd(-50, 50), vy: rnd(-30, 30), vz: rnd(30, 90), g: 160, life: rnd(0.6, 1.1), max: 1.1, s: 1,
      c: pick(['#ffd36a', '#fff1c2', '#e3b04b']), add: true, drag: 1 });
    rings.push({ x: gx, y: gy, r0: 4, r1: 40, t: 0, T: 0.45, c: '#ffd36a', w: 2 });
    SAVE.flags.gold = true;
    bankRun();
  } else if (f.kind === 'crate') SFX.crate();
  else SFX.coin();
  lootTut(f.kind + '_taken', { pay: f.pay });
}
// The guards: placed when the train comes near, standing still until the heli is close (or one of
// them is shot).
function crateStep(f, d, dt) {
  const ds = G.tr.s - f.s;
  if (!f.placed && ds < LOOT.crate.place && ds > -300) {
    f.placed = true;
    for (let k = 0; k < LOOT.crate.guards; k++) {
      const a = k / LOOT.crate.guards * TAU + rnd(-0.3, 0.3), r = rnd(16, 32);
      const z = makeZombie(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r * FORE, 0);
      z.still = true;
      z.sp = rnd(5, 7);
      z.guard = true;
      G.zombies.push(z);
      f.zs.push(z);
    }
  }
  if (f.placed && !f.awake && (d < LOOT.crate.wake || f.zs.some((z) => z.dead || z.flash > 0))) {
    f.awake = true;
    for (const z of f.zs) z.still = false;
  }
  // a column of green smoke while it is near the view
  if (!f.gone && Math.abs(f.x - G.camX - W / 2) < W && Math.abs(f.y - G.camY - H / 2) < H) {
    f.smoke = (f.smoke || 0) - dt;
    if (f.smoke <= 0) {
      f.smoke = 0.12;
      part({ x: f.x + rnd(-1, 1), y: f.y - 2, z: 7, vx: rnd(-1.5, 1.5) + 2, vy: 0, vz: rnd(20, 26), g: 0, life: rnd(1.8, 2.3), max: 2.3, s: 2,
        c: pick(['rgba(120,230,110,0.62)', 'rgba(90,190,90,0.55)']), grow: 3, drag: 0.45, smoke: true });
    }
  }
}
// The stranded survivor: a flare every 6 s. With the Winch, hover over them for 1.5 s (leaving
// starts it again): the rope drops, they grab it and swing up under the heli: +1 survivor.
function sosStep(f, d, dt, live) {
  if (f.stage === 'done') return;
  if (f.stage === 'wait') {
    if (f.t >= 6) {
      f.t = 0;
      if (Math.abs(f.x - G.camX - W / 2) < W * 1.5 && Math.abs(f.y - G.camY - H / 2) < H * 1.5) SFX.flare();
    }
    if (live && !f.near && d < 70) {
      f.near = true;
      lootTut('sos_near', { winch: !!G.up.winch });
    }
    if (live && G.up.winch && d <= LOOT.sos.reach) {
      f.w += dt;
      if (f.w >= CFG.winch.hover) {
        f.stage = 'rope';
        f.u = 0;
        SFX.winch();
      }
    } else f.w = 0;
    return;
  }
  f.u += dt;
  if (f.stage === 'rope' && f.u >= 0.45) {
    f.stage = 'lift';
    f.u = 0;
    SFX.saved();
  } else if (f.stage === 'lift' && f.u >= 1.6) {
    f.stage = 'done';
    f.gone = true;
    G.surv++;
    SAVE.flags.sos = true;
    bankRun();
    const [gx, gy] = heliGround();
    G.lootFly.push({ surv: true, x0: gx - G.camX, y0: gy - G.camY - CFG.heli.alt + 36, t: 0, T: 0.8 });
    floatText(gx, gy - 20, '+1 SURVIVOR', U.green);
    lootTut('sos_lifted');
  }
}

// ---------- drawing (world layer, after everything on the ground)
function drawLoot() {
  if (!G.loot) return;
  const [gx, gy] = heliGround(), x0 = G.camX - 60, x1 = G.camX + W + 60, y0 = G.camY - 40, y1 = G.camY + H + 120;
  for (const f of G.loot) {
    if (f.x < x0 || f.x > x1 || f.y < y0 || f.y > y1) continue;
    if (f.kind === 'pile' && !f.gone) {
      // a white glint every 1.2 s
      const u = (realT + f.km * 7) % 1.2;
      if (u < 0.24) {
        const a = u < 0.08 || u > 0.16 ? 2 : 3, x = f.x + 1, y = f.y - 7;
        ctx.globalCompositeOperation = 'lighter';
        light(x, y, 7, '#fff1c2', 0.5);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - a, y, a * 2 + 1, 1);
        ctx.fillRect(x, y - a, 1, a * 2 + 1);
      }
    } else if (f.kind === 'gold' && !f.gone) {
      // a beam of gold light up from the crate
      const p = 0.75 + Math.sin(realT * 3) * 0.25;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#ffd36a';
      for (let z = 0; z < 120; z += 2) {
        const k = 1 - z / 120;
        ctx.globalAlpha = 0.22 * k * p;
        ctx.fillRect(f.x - 3, f.y - 8 - z, 7, 2);
        ctx.globalAlpha = 0.45 * k * p;
        ctx.fillRect(f.x - 1, f.y - 8 - z, 3, 2);
      }
      light(f.x, f.y - 5, 20, '#ffd36a', 0.55 * p);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if ((realT * 2 | 0) % 2 === 0) text('GOLD', f.x, f.y - 26, '#ffd36a', { align: 'center' });
    } else if (f.kind === 'sos' && f.stage !== 'done') drawSOS(f, gx, gy);
  }
  // finds flying up to the heli
  for (const q of G.lootFly) {
    if (q.surv) continue;
    const u = q.t / q.T, e = u * u, x = lerp(q.x0, gx, e), y = lerp(q.y0, gy, e) - e * 70;
    ctx.globalAlpha = 1 - u * 0.6;
    blit(q.spr.spr, Math.round(x - q.spr.ax), Math.round(y - q.spr.ay));
    ctx.globalAlpha = 1;
  }
}
// The bus with the survivor waving on its roof, the flare, the label, the Winch circle and the rope.
function drawSOS(f, gx, gy) {
  const sv = SURV[2], wave = (realT * 4 | 0) % 2;
  // the flare: up fast, then it hangs and falls slowly, red and bright
  if (f.stage === 'wait' && f.t < 3.2) {
    const t = f.t, z = t < 0.6 ? t / 0.6 * 80 : 80 - (t - 0.6) * 9, a = t < 2.6 ? 1 : (3.2 - t) / 0.6;
    ctx.globalCompositeOperation = 'lighter';
    light(f.x + 2, f.y - 14 - z, 26, '#ff4a32', 0.8 * a);
    light(f.x + 2, f.y - 14 - z, 5, '#fff1c2', 0.9 * a);
    ctx.fillStyle = '#ff6a4a';
    for (let k = 4; k < Math.min(z, 40); k += 3) {
      ctx.globalAlpha = 0.35 * a * (1 - k / 40);
      ctx.fillRect(Math.round(f.x + 2), Math.round(f.y - 14 - z + k), 1, 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (t < 0.6 && Math.random() < 0.5) part({ x: f.x + 2, y: f.y, z: 14 + z, vx: rnd(-3, 3), vy: 0, vz: 0, g: 0, life: 0.8, max: 0.8, s: 1,
      c: 'rgba(200,190,180,0.5)', grow: 2, drag: 1, smoke: true });
  }
  // the Winch circle on the ground round the survivor: it fills while the heli hovers in it
  const near = Math.hypot(f.x - gx, f.y - gy);
  if (f.stage === 'wait' && G.up.winch && near < 90) {
    const R = LOOT.sos.reach, n = 40, fill = f.w / CFG.winch.hover;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU - Math.PI / 2;
      ctx.fillStyle = i / n < fill ? '#ffffff' : 'rgba(255,255,255,0.35)';
      ctx.fillRect(Math.round(f.x + Math.cos(a) * R), Math.round(f.y + Math.sin(a) * R * FORE), 1, 1);
    }
    if (fill > 0) text(Math.round(fill * 100) + '%', f.x, f.y + 12, '#ffffff', { align: 'center' });
  }
  // the survivor: on the roof, on the rope, or swinging up under the heli
  // (the view looks down from the heli: the rope hangs from the view's middle, and the survivor
  // swings in to just under it, growing as they come up to the camera)
  let sx = f.x + 2, sy = f.y - 14, k = 1;
  const ax = Math.round(gx), ay = Math.round(gy - CFG.heli.alt);
  if (f.stage === 'lift') {
    const u = ease(f.u / 1.6);
    sx = lerp(f.x + 2, ax, u) + Math.sin(f.u * 5) * 14 * (1 - u * 0.6);
    sy = lerp(f.y - 14, ay + 44, u);
    k = u > 0.5 ? 2 : 1;
  }
  if (f.stage === 'rope' || f.stage === 'lift') {
    const e = f.stage === 'rope' ? Math.min(1, f.u / 0.45) : 1;
    pl(ctx, ax, ay, Math.round(lerp(ax, sx, e)), Math.round(lerp(ay, sy - 8 * k, e)), '#d6cdb6');
    ctx.fillStyle = '#8b919c';
    ctx.fillRect(ax - 1, ay - 1, 3, 2);
  }
  blit(thermal ? sv.h : sv.n, Math.round(sx - 2 * k), Math.round(sy - 7 * k), 4 * k, 7 * k);
  // an arm waving (or holding the rope)
  ctx.fillStyle = '#d8cfb6';
  if (f.stage === 'wait') ctx.fillRect(Math.round(sx - 3), Math.round(sy - 9 + wave), 1, 3);
  else ctx.fillRect(Math.round(sx), Math.round(sy - 9 * k), k, 2 * k);
  if (f.stage === 'wait') {
    const blink = (realT * 2 | 0) % 2 === 0;
    text('SOS', f.x + 2, f.y - 36, blink ? '#ffffff' : U.red, { align: 'center' });
    if (!G.up.winch && near < 90) text('NEEDS THE WINCH', f.x + 2, f.y + 8, U.amber, { align: 'center' });
    else if (G.up.winch && near < 90 && f.w <= 0) text('HOVER HERE', f.x + 2, f.y + 14, '#ffffff', { align: 'center' });
  }
}

// tut.js - the teaching layer and the frame polish: the tutorial prompts, the pause menu, the fades
// between screens and the end-of-build card. Features call tutEvent(name, data) at their moments;
// the rest is found here by looking at the game each frame. Prompts show in five channels, one at a
// time each (the rest wait in a queue): TASKS (a box at the top left, up to 3 lines with a check
// box), RADIO (radio() in ui.js), TIP (one gold line over the weapon cards with a blinking arrow
// toward the thing), BANNER (banner()) and TAG (a label with an arrow in the Depot). Each prompt
// shows once per save (SAVE.seen).

// tasks / taskQ = the task lines shown and waiting; tip / tipQ = the tip shown and waiting; banQ =
// banners waiting; labels = words over a zombie (BRUTE!); mode = the screen last frame (for the
// fades and for what a new run resets); fade = the black over the screen (1 = all black); fly = px
// flown this run; heR = the 105mm's reload last frame; heldFirst = this run held a station for the
// first time; cardAt / card = the end-of-build card (when it opens, and its numbers); after = Depot
// prompts to mark seen when the next run starts
const TUT = {
  tasks: [], taskQ: [], tip: null, tipQ: [], banQ: [], labels: [], mode: '', fade: 1, fadeK: 1, fly: 0, hx: 0, hy: 0,
  heR: 0, heldFirst: false, cardAt: 0, card: null, sum: [], after: new Set()
};
const seen = (k) => !!SAVE.seen[k];
// Mark prompt k as shown. True the first time.
function see(k) {
  if (SAVE.seen[k]) return false;
  SAVE.seen[k] = true;
  saveSave();
  return true;
}
// a real run is on (not the demo, not over)
const tutLive = () => G && !G.demo && mode === 'play' && !G.result;

// ---------- the channels
// A task: key (seen once done), the words, how many it needs (a count shows from 2 up), and what
// counts for it (tutCount(kind)).
function task(key, label, need, kind) {
  if (seen(key) || TUT.tasks.concat(TUT.taskQ).some((t) => t.key === key)) return;
  const t = { key, label, need: need || 1, kind, n: 0, t: 0, done: -1, bump: 0 };
  (TUT.tasks.length < 3 ? TUT.tasks : TUT.taskQ).push(t);
}
// n more of kind done: every task waiting for it counts up, and ticks off when full
function tutCount(kind, n) {
  for (const t of TUT.tasks.concat(TUT.taskQ)) {
    if (t.kind !== kind || t.done >= 0) continue;
    const was = Math.floor(t.n);
    t.n = Math.min(t.need, t.n + (n || 1));
    if (Math.floor(t.n) > was) t.bump = 0.25;
    if (t.n >= t.need) {
      t.done = 0;
      see(t.key);
      if (TUT.tasks.includes(t)) SFX.tick();
    }
  }
}
// A tip for 4 s: key (seen at once), the words, and where its arrow points (a function giving a
// point on the screen, or null for no arrow).
function tip(key, msg, at) {
  if (!see(key)) return;
  TUT.tipQ.push({ msg, at: at || null, t: 0 });
}
// A radio line, once per save.
function radioOnce(key, who, msg) {
  if (see(key)) radio(who, msg);
}
// A banner, once per save; it waits while one of ours still shows.
function bannerOnce(key, a, b, col) {
  if (see(key)) TUT.banQ.push([a, b, col || U.gold]);
}
// words over zombie z for 4 s
function label(z, s, col) {
  TUT.labels.push({ z, s, col, t: 0 });
}
// a zombie's place on the screen
const onScreen = (z) => [z.x - G.camX, z.y - G.camY];
const inView = (z) => {
  const [x, y] = onScreen(z);
  return x > 4 && x < W - 4 && y > 24 && y < H - 8;
};

// ---------- the events features send
// tutEvent(name, data): see the shared list (station, loot and shooting moments).
function tutEvent(name, d) {
  d = d || {};
  if (!G || G.demo || !(mode === 'play' || mode === 'ending')) return;
  const P = (o) => () => (o && o.x != null ? [o.x - G.camX, o.y - G.camY] : null);
  const ev = {
    pile_seen: () => task('t_piles', 'GRAB 3 SCRAP PILES', 3, 'pile'),
    pile_taken: () => tutCount('pile'),
    crate_seen: () => task('t_crate', 'GRAB THE SUPPLY CRATE', 1, 'crate'),
    crate_taken: () => tutCount('crate'),
    gold_too_far: () => bannerOnce('b_gold', 'GOLDEN CRATE', 'TOO FAR. BUY RADIO RANGE.'),
    sos_seen: () => { if (!d.winch) tip('p_sos', 'A SURVIVOR! YOU NEED THE WINCH.', P(d)); },
    sos_near: () => tip('p_lift', 'HOVER OVER THEM TO LIFT THEM UP.', P(d)),
    golden_seen: () => tip('p_golden', 'GOLDEN ZOMBIE! CATCH IT FOR ' + goldenPay(d) + ' SCRAP.', P(d.z || d)),
    chain_first: () => tip('p_chain', 'CHAIN SHOT! A KILL JUMPS TO MORE ZOMBIES.', null),
    // (station.js shows the AHEAD and HOLD banners itself)
    hold_start: () => { if (d.first) tip('p_nest', 'YOUR MG NEST SHOOTS BY ITSELF.', null); },
    survivor_grabbed: () => tip('p_grab', 'SHOOT THE ZOMBIE TO SAVE THEM.', P(d.x != null ? d : G.people.find((p) => p.st === 'grab'))),
    station_held: () => {
      if (d.first && d.id === STATIONS[0].id) TUT.heldFirst = true;
      if (d.first && d.id === 'mill' && !seen('endcard')) TUT.cardAt = realT + 1.6;
    }
  }[name];
  if (ev) ev();
}
// how many survivors wait at station d (the first hold's crowd, else what is left in its house)
function waiting(d) {
  if (!SAVE.held.includes(d.id)) return d.first.people;
  const h = SAVE.house[d.id];
  return typeof h === 'number' ? h : HOLD_LATER.people;
}
// what a golden zombie pays (from the event, else from the game's numbers)
function goldenPay(d) {
  const g = CFG.golden || (CFG.types && CFG.types.find((t) => t.golden));
  return d.value || d.pay || (g && (g.value || g.pay)) || 25;
}
// A zombie dies (called from kill()): the tasks that count shots.
function tutKill(z, cause, free) {
  if (!scoring() || free) return;
  if (z.st === 1) tutCount('track');
  if (z.st === 2) tutCount('climber');
  // (only your own shots count: not the flatcar gun, the MG nests, the ram or the train)
  if (cause !== 'gun' && cause !== 'nest' && cause !== 'ram' && cause !== 'train') tutCount('shoot');
}

// ---------- each frame
function tutFrame(dt) {
  // a new screen: fade in from black (lighter over the run that just ended); a new run starts clean
  const m = mode === 'ending' ? 'play' : mode;
  if (m !== TUT.mode) {
    TUT.fade = TUT.fadeK = m === 'summary' ? 0.5 : 1;
    if (m === 'play') tutNewRun();
    if (m === 'summary') tutSumOpen();
    if (TUT.mode === 'play') TUT.tasks.length = TUT.taskQ.length = TUT.tipQ.length = TUT.banQ.length = 0;
    TUT.mode = m;
  }
  TUT.fade = Math.max(0, TUT.fade - dt / 0.25 * TUT.fadeK);
  // the end-of-build card opens a moment after Mill Town is held
  if (TUT.cardAt && realT >= TUT.cardAt) {
    TUT.cardAt = 0;
    if (tutLive() && see('endcard')) {
      TUT.card = { t: realT, km: km2(G.maxKm), kills: G.kills, scrap: Math.floor(G.cash), surv: G.surv, time: G.run };
      setPaused(true);
      SFX.total();
    }
  }
  if (TUT.card && !paused) TUT.card = null;
  tutChannels(dt);
  if (tutLive() && !paused) tutLook(dt);
}
// a new run: the channels empty, the counters from zero; Depot prompts shown are now done
function tutNewRun() {
  TUT.tasks.length = TUT.taskQ.length = TUT.tipQ.length = TUT.banQ.length = TUT.labels.length = 0;
  TUT.tip = null;
  TUT.fly = 0;
  TUT.heldFirst = false;
  TUT.card = null;
  TUT.cardAt = 0;
  if (G) {
    TUT.hx = G.heli.ox;
    TUT.hy = G.heli.oy;
    TUT.heR = G.heReload;
  }
  for (const k of TUT.after) see(k);
  TUT.after.clear();
}
// the timers of the tasks, the tip, the banners and the labels
function tutChannels(dt) {
  const T = TUT;
  for (let i = T.tasks.length - 1; i >= 0; i--) {
    const t = T.tasks[i];
    t.t += dt;
    t.bump = Math.max(0, t.bump - dt);
    if (t.done >= 0) t.done += dt;
    if (t.done > 1.35) T.tasks.splice(i, 1);
  }
  while (T.tasks.length < 3 && T.taskQ.length) T.tasks.push(T.taskQ.shift());
  if (T.tip) {
    T.tip.t += dt;
    if (T.tip.t >= 4) T.tip = null;
  }
  if (!T.tip && T.tipQ.length) T.tip = T.tipQ.shift();
  if (T.banQ.length && !banners.some((b) => b.tut)) {
    const [a, b, c] = T.banQ.shift();
    banner(a, b, c, 2);
    if (banners[0] && banners[0].a === a) banners[0].tut = true;
  }
  for (let i = T.labels.length - 1; i >= 0; i--) {
    const l = T.labels[i];
    l.t += dt;
    if (l.t >= 4 || l.z.dead || l.z.gone) T.labels.splice(i, 1);
  }
}
// What the run shows now that has a prompt (the ones no feature sends an event for).
function tutLook(dt) {
  const h = G.heli, k = DK(), runs = SAVE.runs;
  // flying: px moved by the keys
  const [ax, ay] = keyAxis();
  if (ax || ay) tutCount('fly', Math.hypot(h.ox - TUT.hx, h.oy - TUT.hy));
  TUT.hx = h.ox;
  TUT.hy = h.oy;
  // a 105mm shell fired
  if (G.heReload > TUT.heR + 0.01) tutCount('he');
  TUT.heR = G.heReload;
  // the first things to learn, right after the first run's Ram taste (or a moment into a run)
  if (G.taste ? G.ram.crack > 0 && realT - G.ram.crack > 0.6 : G.run > 1.5) {
    task('t_fly', 'WASD: FLY', 120, 'fly');
    task('t_shoot', 'HOLD LEFT CLICK: SHOOT', 10, 'shoot');
  }
  if (G.overheat) tip('p_hot', 'TOO HOT! LET GO FOR A SECOND.', () => [52, cardsTop() + 13]);
  if (G.up.gun && G.run > 3) tip('p_gun', 'YOUR RAIL CANNON GUARDS THE TRAIN. GO EXPLORE!', () => {
    const [x, y] = gunXY();
    return [x - G.camX, y - G.camY];
  });
  // scrap piles: from 11 s into run 2 (once there is loot on the line)
  if (runs >= 2 && G.run > 11 && G.loot) task('t_piles', 'GRAB 3 SCRAP PILES', 3, 'pile');
  const F = STATIONS[0], M = STATIONS[1];
  if (k >= 0.55 && waiting(F)) radioOnce('r_farm', F.name, 'WE SEE YOUR SMOKE! ' + waiting(F) + ' OF US ARE WAITING.');
  if (k >= 1.5 && M && waiting(M)) radioOnce('r_mill', M.name, waiting(M) + ' OF US HERE. PLEASE HURRY!');
  // the dead in view: a crowd on the rails, one on the train, a runner, a brute
  let rail = 0, climb = null, runner = null, brute = null, railBrute = null;
  for (const z of G.zombies) {
    if (z.dead || !inView(z)) continue;
    if (z.st === 1) rail++;
    if (z.st === 2) climb = z;
    if (z.type === 1) runner = z;
    if (z.type === 2) {
      brute = brute || z;
      if (z.st === 1) railBrute = z;
    }
  }
  if (rail >= 3) {
    task('t_track', 'SHOOT THE DEAD ON THE TRACK', 5, 'track');
    if (G.up.he) task('t_he', 'RIGHT CLICK: 105MM', 1, 'he');
  }
  if (climb && runs >= 2) task('t_climb', 'SHOOT THE DEAD OFF THE TRAIN', 1, 'climber');
  if (runner && runs >= 2) bannerOnce('b_run', 'RUNNERS', 'FAST, BUT ONLY ' + CFG.types[1].hp + ' HP', U.amber);
  const at = (z) => () => onScreen(z);
  if (brute && !seen('p_brute')) {
    label(brute, 'BRUTE!', U.red);
    tip('p_brute', 'BRUTES HAVE ' + CFG.types[2].hp + " HP. THE TRAIN CAN'T PUSH THEM.", at(brute));
  }
  if (railBrute) tip('p_railbrute', 'BRUTE ON THE TRACK! USE THE 105MM OR THE RAM.', at(railBrute));
}

// ---------- drawing in the run
// the top of the weapon cards (the Ram's card can sit over the 25mm's on a narrow window)
const cardsTop = () => Math.min(H - 30, RAMCARD.on ? RAMCARD.y : H - 30);
// the task box: [right edge, bottom], or null while it is empty
function taskBox() {
  if (!TUT.tasks.length || mode !== 'play') return null;
  const w = Math.max(...TUT.tasks.map((t) => tw(taskText(t)))) + 19;
  return [4 + w, 22 + 5 + TUT.tasks.length * 10];
}
const taskText = (t) => t.label + (t.need > 1 && t.kind !== 'fly' ? ' (' + Math.floor(t.n) + '/' + t.need + ')' : '');
// Where the warnings under the top bar go (L = their lines): in the middle, or moved right of the
// task box, or under it when there is no room beside it. Returns [x of the middle, y].
function warnAt(L) {
  const b = taskBox();
  if (!b || !L.length) return [W / 2, 24];
  const ww = Math.max(...L.map(([t]) => tw(t)));
  const x = Math.max(W / 2, b[0] + 8 + ww / 2);
  return x + ww / 2 <= W - 4 ? [Math.round(x), 24] : [W / 2, b[1] + 4];
}
// room the tip takes over the weapon cards (the radio box goes above it)
const tipRoom = () => (TUT.tip && mode === 'play' ? 14 : 0);
// A small blinking triangle at (x, y), its tip toward (ux, uy).
function triangle(x, y, ux, uy, col) {
  for (const [c, g] of [['#07080a', 1], [col, 0]]) {
    ctx.fillStyle = c;
    for (let py = -5; py <= 5; py++) for (let px = -5; px <= 5; px++) {
      const a = px * ux + py * uy, b = -px * uy + py * ux;
      if (a <= 3 + g && a >= -2 - g && Math.abs(b) <= (3 - a) * 0.62 + g * 0.9) ctx.fillRect(x + px, y + py, 1, 1);
    }
  }
}
function drawTut() {
  if (mode !== 'play') return;
  drawTasks();
  if (!G.prompt) drawTipLine();     // (the PRESS E moment keeps the screen clear)
  for (const l of TUT.labels) {
    const [x, y] = onScreen(l.z), u = l.t;
    ctx.globalAlpha = u > 3.6 ? (4 - u) / 0.4 : 1;
    text(l.s, x, y - l.z.S.ay - 10 - (Math.floor(realT * 4) % 2), l.col, { align: 'center' });
    ctx.globalAlpha = 1;
  }
}
function drawTasks() {
  const b = taskBox();
  if (!b) return;
  const x = 4, y = 22, w = b[0] - x, h = b[1] - y;
  panel(x, y, w, h, 'rgba(10,11,14,0.86)');
  ctx.fillStyle = '#8a6a2a';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  TUT.tasks.forEach((t, i) => {
    const ry = y + 5 + i * 10, d = t.done;
    // done: green, then it fades after 1 s; a new one fades in
    ctx.globalAlpha = d > 1 ? Math.max(0, 1 - (d - 1) / 0.35) : Math.min(1, t.t / 0.2);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x + 4, ry, 7, 7);
    ctx.fillStyle = d >= 0 ? U.green : '#6a6f7b';
    ctx.fillRect(x + 5, ry + 1, 5, 5);
    if (d < 0) {
      ctx.fillStyle = '#16171c';
      ctx.fillRect(x + 6, ry + 2, 3, 3);
    }
    text(taskText(t), x + 14, ry, d >= 0 ? U.green : t.bump > 0 ? '#ffffff' : U.ink);
    ctx.globalAlpha = 1;
  });
}
function drawTipLine() {
  const t = TUT.tip;
  if (!t) return;
  const y = cardsTop() - 22, w = tw(t.msg), p = t.at && t.at();
  const aw = p ? 12 : 0, x = Math.round(W / 2 - (w + aw) / 2);
  ctx.globalAlpha = t.t < 0.15 ? t.t / 0.15 : t.t > 3.6 ? (4 - t.t) / 0.4 : 1;
  ctx.fillStyle = 'rgba(5,6,8,0.7)';
  ctx.fillRect(x - 5, y - 3, w + aw + 10, 13);
  text(t.msg, x + aw, y, U.gold);
  // the arrow toward the thing it means, blinking
  if (p && Math.floor(realT * 4) % 2 === 0) {
    const cx = x + 4, cy = y + 3, dx = p[0] - cx, dy = p[1] - cy, l = Math.hypot(dx, dy) || 1;
    triangle(cx, cy, dx / l, dy / l, U.gold);
  }
  ctx.globalAlpha = 1;
}

// ---------- the Depot: the hint bar and the tags
// The bottom bar's line for a lesson here, or null.
function tutHint() {
  const stars = NODES.filter((n) => n.star && !n.given && lv(n.id)).length;
  if (!seen('h_star')) {
    // * NODES: from the first time one can be bought, until one more is bought
    if (SAVE.seen.h_starAt == null && NODES.some((n) => n.star && nodeState(n) === 'buy')) {
      SAVE.seen.h_starAt = stars;
      saveSave();
    }
    if (SAVE.seen.h_starAt != null) {
      if (stars > SAVE.seen.h_starAt) see('h_star');
      else return ['* NODES ARE BIG UNLOCKS.', U.gold];
    }
  }
  if (lv('ram') && !seen('h_ram')) {
    TUT.after.add('h_ram');
    return ['E: TURBO RAM. SAVE IT FOR THE DEAD WALL.', U.gold];
  }
  if (startsOpen().length > 1 && !seen('h_start')) {
    if (SAVE.start !== 'depot') see('h_start');
    else {
      TUT.after.add('h_start');
      return ['START AT ' + STATIONS[0].name + ': YOUR TOWERS FIGHT FIRST.', U.gold];
    }
  }
  return null;
}
// a node by its name (other parts own the ids)
const nodeNamed = (name) => NODES.find((n) => n.name === name);
// The tag that shows now: [node id or 'start', words], or null.
function tutTag() {
  const tree = depotTab === 'tree';
  if (!lv('root')) return tree ? ['root', "CLICK THE TRAIN. IT'S FREE."] : null;
  if (!SAVE.runs) return ['start', 'PRESS START RUN.'];
  const ch = nodeNamed('CHAIN SHOT');
  if (ch && !seen('g_chain')) {
    TUT.after.add('g_chain');
    if (!lv(ch.id)) return tree && shownAs(ch) === 2 ? [ch.id, 'BUY CHAIN SHOT: KILLS JUMP TO MORE ZOMBIES. THEN PRESS START RUN.'] : null;
    return ['start', 'PRESS START RUN.'];
  }
  const he = NODE.he;
  if (tree && he && !lv('he') && stationOpen() && nodeState(he) === 'buy') return ['he', 'BUY THE 105MM WITH ' + he.cost[0] + ' SURVIVORS.'];
  const wi = NODE.winch;
  if (tree && wi && !lv('winch') && nodeState(wi) === 'buy') return ['winch', 'WINCH: SAVE SURVIVORS IN THE FIELD.'];
  return null;
}
function drawTutTags() {
  const g = tutTag();
  if (!g) return;
  const [id, msg] = g, L = tw(msg) > 190 ? wrap(msg, 190) : [msg];
  const w = Math.max(...L.map((l) => tw(l))) + 12, h = L.length * 10 + 6, bob = Math.round(Math.sin(realT * 6) * 1.5);
  let x, y, ux, uy, ax, ay;
  if (id === 'start') {
    // over START RUN, which pulses
    const bx = W - 106, by = H - 24;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(realT * 8);
    frame(bx - 2, by - 2, 104, 24, '#ffd36a');
    ctx.globalAlpha = 1;
    x = clamp(bx + 50 - w / 2, 4, W - w - 4);
    y = by - 12 - h + bob;
    [ax, ay, ux, uy] = [bx + 50, y + h + 4, 0, 1];
  } else {
    // beside the node: right, left, over or under it, on the side that covers the fewest other
    // nodes (and stays on the screen)
    const p = nodeXY(id), r = halfOf(NODE[id]) + 10, sides = [
      [p.x + r, p.y - h / 2, -1, 0], [p.x - r - w, p.y - h / 2, 1, 0], [p.x - w / 2, p.y - r - h, 0, 1], [p.x - w / 2, p.y + r + 12, 0, -1]];
    let best = 1e9;
    for (const [sx, sy, dx, dy] of sides) {
      let n = sx < 4 || sy < 22 || sx + w > W - 4 || sy + h > H - 32 ? 100 : 0;
      for (const o of NODES) {
        if (o.id === id || !shownAs(o)) continue;
        const q = nodeXY(o.id), a = halfOf(o) + 2;
        if (q.x + a > sx && q.x - a < sx + w && q.y + a + 12 > sy && q.y - a < sy + h) n++;
      }
      if (n < best) [best, x, y, ux, uy] = [n, sx, sy, dx, dy];
    }
    x += -ux * bob;
    y = clamp(Math.round(y - uy * bob), 22, H - 32 - h);
    ax = ux ? (ux < 0 ? x - 4 : x + w + 3) : p.x;
    ay = uy ? (uy < 0 ? y - 4 : y + h + 3) : p.y;
  }
  x = Math.round(x);
  panel(x, y, w, h, 'rgba(14,12,8,0.95)');
  frame(x, y, w, h, '#b8862f');
  L.forEach((l, i) => text(l, x + 6, y + 4 + i * 10, U.gold));
  triangle(Math.round(ax), Math.round(ay), ux, uy, U.gold);
}

// BACK TO DEPOT: the run ends here (no blast); what it earned is kept, and the summary shows it.
function quitRun() {
  if (mode !== 'play' || !G || G.demo || G.result) return;
  paused = false;
  G.result = 'quit';
  G.prompt = null;
  G.lock = null;
  banners.length = 0;
  SFX.ramStop(0.1);
  endGame();
}

// ---------- the end-of-build card

  const c = TUT.card, u = clamp((realT - c.t) / 0.3, 0, 1), m = Math.floor(c.time / 60), s = Math.floor(c.time % 60);

    ['SURVIVORS', '+' + c.surv, U.green], ['TIME', m + ':' + String(s).padStart(2, '0'), U.ink]];
  const w = 300, h = 96 + rows.length * 11 + 34, x = Math.round(W / 2 - w / 2), y = Math.max(20, Math.round((H + 19) / 2 - h / 2)), cx = x + w / 2;

  panel(x, y + Math.round((1 - u) * 8), w, h, '#0f1014');

    text(a, x + 40, y + 78 + i * 11, U.dim);

  if (button(cx - 128, by, 124, 20, 'KEEP PLAYING', { primary: true })) setPaused(false);

// cannon.js - the RAIL CANNON: the train's big gun on the flatcar (the tree node id is still gun). It shoots
// by itself, anything on the screen, once every few seconds (G.up.gun = its reload). Each shot goes
// straight from the cannon through its target to the edge of the screen and kills every zombie on
// that line, brutes too. It takes the line that kills the most, but the dead on the train come first.
// While it reloads its barrel glows hotter and the lights round its base fill up; when it is ready
// they flash once. The shot: a huge muzzle blast, the barrel kicks back, the flatcar jolts, a white
// beam, a row of blasts and dust along the line, bodies thrown off it, and a burnt line on the ground.

// ---------- the model
// Two piles of slices, like the cars: the turret (TURRET.n / h = normal / thermal, at CANNON_N
// headings, 0 = north, clockwise) and its long barrel (bn / bh), drawn apart so the barrel can kick
// back. glow[i] = the barrel lit orange (laid over it while it charges), white[i] = all white (the
// ready flash), both made when first needed. CB_Z = the barrel's height over the deck, CB_LEN = px
// from the cannon's middle to the muzzle, CB_H = the muzzle's height over the ground.
const TURRET = { n: [], h: [], bn: [], bh: [], glow: [], white: [], raw: [] };
const CANNON_N = 64, CB_Z = 3, CB_LEN = 25, CB_H = 8;
// one 22 x 22 turret slice / one 52 x 52 barrel slice (the middle is between pixels 10 and 11 / 25 and 26)
const tSl = (fn) => pix(22, 22, fn), bSl = (fn) => pix(52, 52, fn);
function tDisc(r, R, col) {
  for (let y = 0; y < 22; y++) for (let x = 0; x < 22; x++) if (Math.hypot(x + 0.5 - 11, y + 0.5 - 11) <= R) r(x, y, 1, 1, col);
}
// the turret's armored body: half its width on each row from the front (row 5) to the back (row 16)
const HULL = [4, 5, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6];
function tHull(r, col, inset) {
  for (let k = inset || 0; k < HULL.length - (inset || 0); k++) {
    const w = HULL[k] - (inset || 0);
    r(11 - w, 5 + k, w * 2, 1, col);
  }
}
function turretSlices() {
  // dark steel, with hazard yellow on the front plate and round the back
  const S = ['#1a1d22', '#262a31', '#353a43', '#474d58', '#5d6470', '#7b8390', '#a3abb7'], Y = '#d8a93a', K = '#16181c';
  return [
    // the turning ring under it, with eight bolts
    tSl((r) => tDisc(r, 6.6, '#121417')),
    tSl((r) => {
      tDisc(r, 6.6, '#2a2d34');
      for (let k = 0; k < 8; k++) r(Math.floor(11 + Math.sin(k * TAU / 8) * 5.6), Math.floor(11 - Math.cos(k * TAU / 8) * 5.6), 1, 1, '#6b707c');
    }),
    // the body, with armor skirts on both sides
    tSl((r) => { tHull(r, S[1]); r(4, 7, 1, 9, S[0]); r(17, 7, 1, 9, S[0]); }),
    tSl((r) => {
      tHull(r, S[2]);
      r(4, 7, 1, 9, S[3]); r(17, 7, 1, 9, S[2]);
      for (const y of [8, 11, 14]) { r(4, y, 1, 1, S[5]); r(17, y, 1, 1, S[1]); }
      // the mantlet the barrel comes out of
      r(9, 3, 4, 2, S[1]);
    }),
    tSl((r) => {
      tHull(r, S[3]);
      // the sloped front plate with hazard stripes
      r(7, 5, 8, 1, S[5]);
      for (let x = 6; x < 16; x++) r(x, 6, 1, 1, (x >> 1) & 1 ? Y : K);

// The barrel at heading i glowing hot (only its own pixels, not its outline): dark red at the

const HEAT = [[122, 26, 8], [226, 85, 47], [255, 154, 58], [255, 226, 160]];
function cbGlow(i) {

    g.drawImage(raw, 1, 1);

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

      const t = clamp(((x + 0.5 - px) * ux + (y + 1.5 - py) * uy - 8) / (CB_LEN - 8), 0, 1), j = Math.min(2, (t * 3) | 0), f = t * 3 - j;
      for (let q = 0; q < 3; q++) d[k + q] = HEAT[j][q] + (HEAT[j + 1][q] - HEAT[j][q]) * f;

// ---------- the state
// cd = seconds to ready, ready = loaded, ang = where its barrel points (0 = north, clockwise),
// plan = the line it wants {ang, tgt, n}, look = time to look again, rec = the barrel's kick (1 at
// a shot), jolt = the flatcar's jolt, readyT = the ready flash, smk = smoke from the barrel after a
// shot, beams = the shots' lines still fading, shots / kills = this run's.
function newCannon() {
  return { cd: 0, ready: true, ang: 0, plan: null, tgt: null, look: 0, rec: 0, recT: 9, jolt: 0, joltT: 9, ju: [0, 1],
    readyT: 0, smk: 0, beams: [], shots: 0, kills: 0, last: 0 };
}
// the reload's share done (0 just fired .. 1 ready)
const cannonK = () => (G.gun.ready ? 1 : 1 - G.gun.cd / G.up.gun);

// ---------- aiming
// The dead on the screen (the cannon reaches all of them).
const CVIS = [];
function cannonSeen() {
  CVIS.length = 0;
  const x0 = G.camX - 2, y0 = G.camY - 2, x1 = G.camX + W + 2, y1 = G.camY + H + 2;
  for (const z of G.zombies) if (!z.dead && !z.gone && z.x > x0 && z.x < x1 && z.y > y0 && z.y < y1) CVIS.push(z);
  return CVIS;
}
// How far along (ux, uy) from (x, y) the line leaves the screen (and a little past it).
function cannonReach(x, y, ux, uy) {
  let t = 2000;
  const x0 = G.camX - 30, y0 = G.camY - 30, x1 = G.camX + W + 30, y1 = G.camY + H + 30;
  if (ux > 1e-6) t = Math.min(t, (x1 - x) / ux); else if (ux < -1e-6) t = Math.min(t, (x0 - x) / ux);
  if (uy > 1e-6) t = Math.min(t, (y1 - y) / uy); else if (uy < -1e-6) t = Math.min(t, (y0 - y) / uy);
  return Math.max(0, t);
}
// Is zombie z on the line from (gx, gy) along (ux, uy), within reach L? Returns how far along, or -1.
function onLine(z, gx, gy, ux, uy, L) {
  const dx = z.x - gx, dy = z.y - 4 - gy, t = dx * ux + dy * uy;
  if (t < 3 || t > L) return -1;
  return Math.abs(dx * uy - dy * ux) <= CFG.gun.hw + (z.big ? 3 : 0) ? t : -1;
}
// The best line: through each one of the dead on the train (if any are), else through each one on the
// screen; the one that kills the most wins (the nearer target when they tie).
function cannonPlan(gx, gy) {
  const vis = cannonSeen();
  if (!vis.length) return null;
  const onTrain = vis.some((z) => z.st === 2);
  let best = null, bn = -1, bd = Infinity;
  for (const t of vis) {
    if (onTrain && t.st !== 2) continue;
    const dx = t.x - gx, dy = t.y - 4 - gy, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, L = cannonReach(gx, gy, ux, uy);
    let n = 1;
    for (const z of vis) if (z !== t && onLine(z, gx, gy, ux, uy, L) >= 0) n += z.big ? 1.5 : 1;
    if (n > bn || (n === bn && d < bd)) {
      bn = n;
      bd = d;
      best = { ang: Math.atan2(ux, -uy), tgt: t, n };
    }
  }
  return best;
}

// ---------- each step
function updateCannon(dt) {
  const g = G.gun, c = G.tr.cars[2], [gx, gy] = gunXY();
  // reload; the moment it is loaded the lights flash
  if (!g.ready) {
    g.cd -= dt;
    if (g.cd <= 0) {
      g.cd = 0;
      g.ready = true;
      g.readyT = 0.3;
      rings.push({ x: gx, y: gy, r0: 4, r1: 16, t: 0, T: 0.3, c: '#ffe2a0', w: 1 });
    }
  }
  g.readyT = Math.max(0, g.readyT - dt);
  g.recT += dt;
  g.joltT += dt;
  // look for the best line often (at once when its target is gone)
  g.look -= dt;
  if (g.look <= 0 || (g.plan && (g.plan.tgt.dead || g.plan.tgt.gone))) {
    g.plan = cannonPlan(gx, gy);
    g.look = g.ready ? 0.1 : 0.25;
  }
  const p = g.plan, live = p && !p.tgt.dead && !p.tgt.gone;
  g.tgt = live ? p.tgt : null;
  // the barrel turns to it, smoothly (back to the front of the train when there is nothing to shoot);
  // it follows a moving target, so the angle is worked out again each step
  const want = live ? Math.atan2(p.tgt.x - gx, -(p.tgt.y - 4 - gy)) : c.ang;
  const da = mod(want - g.ang + Math.PI, TAU) - Math.PI, turn = CFG.gun.turn * dt;
  g.ang = mod(g.ang + clamp(da * Math.min(1, dt * 9), -turn, turn), TAU);
  if (g.ready && live && Math.abs(da) < 0.05) cannonFire(gx, gy, want);
  // the flatcar jolts back from the shot (and the riders and the cannon with it)
  if (g.joltT < 0.5) {
    const k = Math.exp(-g.joltT * 9) * Math.cos(g.joltT * 34) * 2.4;
    c.cx -= g.ju[0] * k;
    c.cy -= g.ju[1] * k;
  }
  // smoke curls out of the hot barrel after a shot
  if (g.smk > 0) {
    g.smk -= dt;
    if (Math.random() < dt * 26 * g.smk) {
      const [mx, my] = cannonMuzzle();
      part({ x: mx + rnd(-1, 1), y: my, z: CB_H, vx: rnd(-3, 3), vy: rnd(-3, 1), vz: rnd(8, 16), g: 0, life: rnd(0.9, 1.6), max: 1.6,
        s: rnd(1, 2), c: pick(['rgba(70,64,58,0.55)', 'rgba(96,90,82,0.45)']), grow: 3, drag: 0.6, smoke: true });
    }
  }
  // near the end of the reload, sparks are drawn into the muzzle

  if (!g.ready && k > 0.6 && Math.random() < dt * 40 * (k - 0.5)) {
    const [mx, my] = cannonMuzzle(), a = rnd(TAU), r = rnd(6, 11);
    part({ x: mx + Math.cos(a) * r, y: my + Math.sin(a) * r * FORE, z: CB_H, vx: -Math.cos(a) * r * 4, vy: -Math.sin(a) * r * FORE * 4,
      vz: 0, g: 0, life: 0.22, max: 0.22, s: 1, c: pick(['#ffd27a', '#ff9a3a', '#fff1c2']), add: true });
  }
  for (let i = g.beams.length - 1; i >= 0; i--) if ((g.beams[i].t += dt) > 1.6) g.beams.splice(i, 1);
}
// The muzzle on the ground (its height is CB_H), with the barrel's kick.
function cannonMuzzle() {
  const g = G.gun, [gx, gy] = gunXY(), l = CB_LEN + 1 - cannonKick();

// px the barrel is pushed back: 5 at the shot, sliding home over half a second
const cannonKick = () => 5 * Math.pow(Math.max(0, 1 - G.gun.recT / 0.5), 2);

// ---------- the shot
function cannonFire(gx, gy, a) {

      vy: (ux * side * rnd(20, 60) + uy * rnd(10, 40)) * FORE, vz: rnd(10, 50), g: 160, life: rnd(0.2, 0.4), max: 0.4, s: 1,
      c: pick(['#fff1c2', '#ffd27a', '#ff9a3a']), add: true, drag: 1.5 });

      c: pick(['rgba(92,78,58,0.5)', 'rgba(70,60,46,0.55)', 'rgba(110,96,72,0.4)']), grow: 4, drag: 1.2, smoke: true });

        c: pick(['#3a2e22', '#4f3f2d', '#2a221a']), land: 1 });

  }

      life: rnd(0.15, 0.35), max: 0.35, s: k < 6 ? 2 : 1, c: pick(['#fff6e0', '#ffd27a', '#ff9a3a']), add: true, drag: 4 });
  }

      life: rnd(0.8, 1.2), max: 1.2, s: 2, c: pick(['rgba(200,190,170,0.5)', 'rgba(150,140,124,0.55)', 'rgba(110,104,96,0.55)']),
      grow: 4, drag: 3.2, smoke: true });
  }
  for (let k = 0; k < 6; k++) {

    life: 0.9, max: 0.9, s: 2, c: '#e3b04b' });
  if (!demo) {

}
// The groove the shot burns into the ground: a black core, earth thrown up on both sides, and scorch

function cannonScorch(gx, gy, ux, uy, L) {
  const nx = -uy, ny = ux;

    const x = gx + ux * s, y = gy + uy * s;
    if (Math.abs(x - trackX(y)) < 10) continue;
    const w = Math.sin(s * 0.37) > 0.3 ? 1 : 0;
    stampPix(x - nx * w, y - ny * w, (s | 0) % 5 ? 'rgba(12,9,7,0.95)' : 'rgba(36,24,15,0.95)', 2);
    for (const sd of [-1, 1]) if (Math.random() < 0.45) {
      const o = sd * rnd(2.2, 3.6);
      stampPix(x + nx * o, y + ny * o, pick(['rgba(84,64,42,0.9)', 'rgba(62,47,32,0.9)', 'rgba(40,30,20,0.85)']), 1);
    }

// ---------- drawing
// The cannon on the flatcar's deck (called from drawCar): the reload lights round its base, the
// turret, the barrel (behind the turret when it points away, in front when it points this way),
// the barrel's charge glow and the ready flash.
function drawCannon() {
  const g = G.gun, [gx, gy] = gunXY(), i = mod(Math.round(g.ang / TAU * CANNON_N), CANNON_N), x = Math.round(gx), y = Math.round(gy) - DECK;
  const kick = cannonKick(), bx = Math.round(gx - Math.sin(g.ang) * kick), by = Math.round(gy - DECK - CB_Z + Math.cos(g.ang) * kick);
  const body = (thermal ? TURRET.h : TURRET.n)[i], brl = (thermal ? TURRET.bh : TURRET.bn)[i], back = Math.cos(g.ang) > 0.15;
  drawCannonPips(gx, gy - DECK);
  const k = cannonK(), glowA = thermal ? 0 : g.ready ? 0.35 + 0.1 * Math.sin(realT * 6) : Math.pow(k, 2) * 0.85;
  const barrel = () => {
    blit(brl, bx - brl.ox, by - brl.oy);
    if (glowA > 0.02) {
      ctx.globalAlpha = glowA;
      const gl = cbGlow(i);
      blit(gl, bx - brl.ox, by - brl.oy);
      ctx.globalAlpha = 1;
    }
  };
  if (back) barrel();
  blit(body, x - body.ox, y - body.oy);
  if (!back) barrel();
  if (g.readyT > 0 && !thermal) {
    const [wb, wl] = cbWhite(i);
    ctx.globalAlpha = g.readyT / 0.3;
    blit(wb, x - body.ox, y - body.oy);
    blit(wl, bx - brl.ox, by - brl.oy);
    ctx.globalAlpha = 1;
  }

// A ring of lamps round the cannon's base, on the deck: it fills clockwise (amber) as the cannon

function drawCannonPips(x, y) {
  const g = G.gun, n = 40, lit = g.ready ? n : Math.floor(cannonK() * n), blink = Math.sin(realT * 20) > 0;
  ctx.fillStyle = '#100d0a';
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU;
    ctx.fillRect(Math.round(x + Math.sin(a) * 9 - 0.5), Math.round(y - Math.cos(a) * 9 - 0.5), 1, 1);
  }
  ctx.fillStyle = thermal ? '#ffffff' : g.readyT > 0 ? '#ffffff' : g.ready ? '#ffd36a' : '#ff8a3a';
  for (let k = 0; k < lit + (blink && !g.ready ? 1 : 0); k++) {
    const a = k / n * TAU;
    ctx.fillRect(Math.round(x + Math.sin(a) * 9 - 0.5), Math.round(y - Math.cos(a) * 9 - 0.5), 1, 1);
  }
}
// Over the world, in added light: the charge glow at the muzzle, the lit pips, the beams and the
// hot groove they leave.
function drawCannonFx() {
  if (!G.up.gun) return;
  const g = G.gun, [gx, gy] = gunXY(), k = cannonK(), [mx, my] = cannonMuzzle();
  // the barrel charging, then a slow pulse while it waits
  if (!thermal) {
    const a = g.ready ? 0.45 + 0.15 * Math.sin(realT * 6) : k * k * 0.6;
    light(mx, my - CB_H, 3 + k * 7, k > 0.85 ? '#ffd27a' : '#ff7a28', a);
    if (g.ready) light(gx, gy - DECK, 14, '#ffd27a', 0.18 + 0.06 * Math.sin(realT * 6));
    if (g.readyT > 0) light(gx, gy - DECK - 4, 22, '#fff1c2', g.readyT / 0.3 * 0.7);
  }
  for (const b of g.beams) drawBeam(b);
  ctx.globalAlpha = 1;
}
// One shot's line. The first 0.3 s: a white-hot beam that thins out and breaks up; then for 1.6 s
// a glowing groove on the ground that cools from orange to dark red.
function drawBeam(b) {
  const { x0, y0, ux, uy, L, t } = b, ex = x0 + ux * L, ey = y0 + uy * L;
  // the groove on the ground (from the flatcar's edge on)
  const u = t / 1.6, n = Math.floor(L / 2);
  ctx.globalAlpha = Math.pow(1 - u, 1.5) * 0.9;
  for (let s = 8; s < n; s++) {
    const h = (s * 7919 + b.seed) % 13;
    if (h < 4 + u * 9) continue;
    const d = s * 2, x = Math.round(x0 + ux * d), y = Math.round(y0 + uy * d);
    ctx.fillStyle = h > 11 && u < 0.4 ? '#ffd27a' : u < 0.5 ? '#ff7a28' : '#b8401c';
    ctx.fillRect(x, y, 1, 1);
  }
  if (t > 0.3) return;
  // the beam: its start at the muzzle (CB_H up), its end at chest height
  const v = t / 0.3, w = Math.round(3 * Math.pow(1 - v, 1.5)), sx = x0, sy = y0 - CB_H, fx = ex, fy = ey - 5;
  const steep = Math.abs(fy - sy) > Math.abs(fx - sx);
  for (let o = -w - 1; o <= w + 1; o++) {
    const ao = Math.abs(o), col = ao === 0 ? '#fff6e0' : ao <= w - 1 ? '#ffe2a0' : ao <= w ? '#ffb347' : '#e2552f';
    ctx.globalAlpha = (1 - v) * (ao > w ? 0.5 : 1);
    if (v > 0.45) {
      // breaking up into dashes as it fades
      const seg = 10, m = Math.ceil(L / seg);
      for (let q = 0; q < m; q++) {
        if (((q * 31 + b.seed) | 0) % 10 < (v - 0.45) * 20) continue;
        const a0 = q / m, a1 = (q + 0.6) / m;
        pl(ctx, lerp(sx, fx, a0) + (steep ? o : 0), lerp(sy, fy, a0) + (steep ? 0 : o), lerp(sx, fx, a1) + (steep ? o : 0), lerp(sy, fy, a1) + (steep ? 0 : o), col);
      }
    } else pl(ctx, sx + (steep ? o : 0), sy + (steep ? 0 : o), fx + (steep ? o : 0), fy + (steep ? 0 : o), col);
  }
  // a soft glow along it
  ctx.globalAlpha = 1;
  for (let d = 0; d < L; d += 30) light(lerp(sx, fx, d / L), lerp(sy, fy, d / L), 12 * (1 - v) + 4, '#ff9a3a', 0.5 * (1 - v));
}

cannonArt();

// ---------- test calls
// cannon() = its state; cannonReady() = load it now; cannonAim(a) = point it at a (radians).
Object.assign(window.__sr, {
  cannon: () => {
    const g = G.gun;
    return { reload: G.up.gun, cd: +g.cd.toFixed(2), ready: g.ready, ang: +g.ang.toFixed(2), shots: g.shots, kills: g.kills, last: g.last,
      beams: g.beams.length, plan: g.plan ? { n: g.plan.n, st: g.plan.tgt.st } : null };
  },
  cannonReady: () => {
    G.gun.cd = 0;
    G.gun.ready = true;
  },
  cannonAim: (a) => {
    G.gun.ang = a;
  }
});

// test_a.js - test calls for part A (skills.js), added to window.__sr once the game has booted.
// skills() = what the first ring does in this run; gold(sx, sy) = a golden zombie at screen pixel (sx, sy).
Object.assign(window.__sr, {
  skills: () => ({ chain: G.up.chain, cow: G.up.cow, gold: G.up.gold, armor: G.up.armor, zaps: zaps.length,
    golden: G.zombies.filter((z) => z.gold && !z.dead).length, goldSeen: !!G.goldSeen, chainSeen: !!G.chainSeen,
    lockWait: G.lockWait, kills: G.kills, cash: G.cash, hp: G.tr.hp, v: +G.tr.v.toFixed(1) }),
  gold: (sx, sy) => {
    const z = makeGold(makeZombie(G.camX + sx, G.camY + sy, 0));
    G.zombies.push(z);
    return z;
  }
});

})();
