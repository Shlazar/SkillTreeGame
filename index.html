}
// Bodies in the air: they fall, bounce once if they come down hard, then lie as corpses.
function updateBodies(dt) {
  const bs = G.bodies;
  for (let i = bs.length - 1; i >= 0; i--) {
    const b = bs[i];
    b.age += dt;
    b.vz -= 320 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    b.rot += b.spin * dt;
    if (b.z > 0) continue;
    b.z = 0;
    if (b.vz < -70) {
      b.vz *= -0.3;
      b.vx *= 0.5;
      b.vy *= 0.5;
      b.spin *= 0.5;
      part({ x: b.x, y: b.y, z: 0, vx: 0, vy: 0, vz: 4, g: 0, life: 0.5, max: 0.5, s: 3, c: 'rgba(90,80,64,0.45)', grow: 4, smoke: true });
    } else {
      stampCorpse(b.S, b.x, b.y);
      bs[i] = bs[bs.length - 1];
      bs.pop();
    }
  }
}
// Burning wrecks and farms in view: smoke columns and embers.
function updateFireSpots(dt) {
  const [i0, j0, i1, j1] = viewChunks();
  for (let j = j0 - 1; j <= j1 + 1; j++) for (let i = i0 - 1; i <= i1 + 1; i++) {
    for (const f of plan(i, j).fires) {
      const k = f.big ? 1 : 0.6;
      if (Math.random() < dt * 2.2 * k) part({ x: f.x + rnd(-2, 2), y: f.y + rnd(-1, 1), z: f.big ? 9 : 5, vx: rnd(4, 9), vy: rnd(-2, 1),
        vz: rnd(8, 14), g: 0, life: rnd(2.2, 3.6), max: 3.6, s: rnd(2, 4) * k + 1,
        c: pick(['rgba(44,40,38,0.6)', 'rgba(58,52,48,0.55)', 'rgba(36,33,31,0.6)']), grow: 3.5, drag: 0.35, smoke: true });
      if (Math.random() < dt * 5 * k) part({ x: f.x + rnd(-3, 3), y: f.y, z: rnd(4, 9), vx: rnd(-4, 6), vy: rnd(-2, 2), vz: rnd(14, 30),
        g: -4, life: rnd(0.5, 1.1), max: 1.1, s: 1, c: pick(['#ffc27a', '#ff8a3a', '#e2552f']), add: true, drag: 1.2 });
    }
  }
}
// The title screen: the gunship works the horde on its own.
function attract(dt) {
  const b = G.burst;
  if (b) {
    b.cd -= dt;
    while (b.cd <= 0 && b.n > 0) {
      fireMG(false, b.x, b.y);
      b.n--;
      b.cd += 1 / CFG.mg.rate;
    }
    if (b.n <= 0) G.burst = null;
  }
  G.attractT -= dt;
  if (G.attractT > 0 || !G.zombies.length) return;
  G.attractT = rnd(1.4, 3.2);
  const z = pick(G.zombies);
  if (Math.abs(z.x - G.T.x) > W * 0.35 || Math.abs(z.y - G.T.y) > H * 0.35) return;
  if (Math.random() < 0.4) fireHE(false, z.x, z.y);
  else G.burst = { x: z.x, y: z.y, n: 12, cd: 0 };
}

// ---------- one step of the game (STEP seconds)
function step(dt) {
  G.t += dt;
  updateCamera(dt);
  if (mode === 'play') {
    G.run += dt;
    G.fuel -= dt;
    findLock();
    // the 25mm heats up while it fires and cools when it rests; too hot and it stops for a moment
    G.heat = Math.max(0, G.heat - CFG.mg.cool * dt * (G.trigger && !G.overheat ? 0.25 : 1));
    if (G.overheat && G.heat < 0.35) G.overheat = false;
    if (G.trigger && !G.overheat) {
      G.mgCd -= dt;
      while (G.mgCd <= 0 && !G.overheat) {
        fireMG(true, G.camX + G.aimSX, G.camY + G.aimSY);
        G.mgCd += 1 / CFG.mg.rate;
        findLock();
        if (G.heat >= 1) {
          G.overheat = true;
          SFX.overheat();
          floatText(G.camX + G.aimSX, G.camY + G.aimSY + 8, 'OVERHEAT', U.red);
        }
      }
    } else G.mgCd = Math.max(0, G.mgCd - dt);
    if (G.heReload > 0) {
      G.heReload = Math.max(0, G.heReload - dt);
      if (G.heReload <= 0) {
        if (G.heQueue) {
          G.heQueue = false;
          fireHE(true, G.camX + G.aimSX, G.camY + G.aimSY);
        } else SFX.ready();
      }
    }
    if (G.fuel < 10) {
      G.warnT -= dt;
      if (G.warnT <= 0) {
        G.warnT = 2;
        SFX.warn();
      }
    }
    if (G.fuel <= 0) {
      G.fuel = 0;
      mode = 'ending';
      G.endT = 0;
      G.trigger = false;
      G.lock = null;
      banner('BINGO FUEL', 'RETURNING TO BASE', U.amber, 5);
      SFX.radio();
    }
  } else if (mode === 'title') attract(dt);
  else if (mode === 'ending') {
    G.endT += dt;
    if (G.endT > 2.6) endGame();
  }
  G.hitT = Math.max(0, G.hitT - dt);
  G.muzzle[0] = Math.max(0, G.muzzle[0] - dt);
  G.muzzle[1] = Math.max(0, G.muzzle[1] - dt);
  G.killBump = Math.max(0, G.killBump - dt * 6);
  G.cashPulse = Math.max(0, G.cashPulse - dt * 3);
  updateZombies(dt);
  updateRounds(dt);
  updateBodies(dt);
  updateFireSpots(dt);
  updateFX(dt);
  // every 3 s the marks on the ground fade a little
  G.decalT += dt;
  if (G.decalT > 3) {
    G.decalT = 0;
    const [i0, j0, i1, j1] = viewChunks();
    fadeDecals(i0, j0, i1, j1);
  }
}

// render.js - draws one frame of the world: ground and its marks, tufts, shadows, then trees,
// props and the dead sorted by depth (the dead behind a tree show through it), fires, particles,
// explosions, flying bodies, tracers and glows, the mist and cloud shadows, then the color grade
// and vignette, or the thermal camera look (grey, hot things white).

let VIG = null, GRADE = null, HAZE = null, SCAN = null, GRAIN = null, MIST = null, BODYSH = null;
const CLOUDSPR = [];

// Smooth noise on a grid of cell px from a seeded rng, for a w x h area (from Ball x Archers).
function makeNoise(rng, cell, w, h) {
  const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2, v = new Float32Array(gw * gh);
  for (let i = 0; i < v.length; i++) v[i] = rng();
  return (x, y) => {
    const fx = x / cell, fy = y / cell, ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty), o = iy * gw + ix;
    return lerp(lerp(v[o], v[o + 1], sx), lerp(v[o + gw], v[o + gw + 1], sx), sy);
  };
}
// Made once: the mist band, 2 cloud shadows, the shadow under a flying body.
function bakeStatic() {
  const fr = mulberry(404);
  let g;
  [MIST, g] = mk(640, 48);
  const nm = makeNoise(fr, 22, 1280, 48);
  g.fillStyle = '#8b9894';
  for (let y = 0; y < 48; y++) for (let x = 0; x < 640; x++) {
    // the noise wraps round at 640 px, so the band tiles without a seam
    const t = Math.sin(y / 48 * Math.PI), n = lerp(nm(x, y), nm(x + 640, y), x / 640);
    if ((n * 1.3 - 0.35) * t > bayer(x, y)) g.fillRect(x, y, 1, 1);
  }
  const cr = mulberry(21);
  CLOUDSPR.length = 0;
  for (let k = 0; k < 2; k++) {
    const cw = 200, ch = 110, n = makeNoise(cr, 18, cw, ch);
    const [cc, cg] = mk(cw, ch);
    cg.fillStyle = '#000';
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const dx = (x - cw / 2) / (cw / 2), dy = (y - ch / 2) / (ch / 2);
      if ((1 - Math.sqrt(dx * dx + dy * dy)) * 1.4 + n(x, y) * 0.8 - 0.55 > bayer(x, y)) cg.fillRect(x, y, 1, 1);
    }
    CLOUDSPR.push(cc);
  }
  BODYSH = shadowSpr(9);
}
// Made again for every size of the picture: vignette, color grade, sun haze, thermal grain and lines.
function bakeOverlays() {
  let g, gr;
  [VIG, g] = mk(W, H);
  gr = g.createRadialGradient(W * 0.5, H * 0.46, H * 0.3, W * 0.5, H * 0.5, Math.max(W, H) * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // warm top left to cool bottom right
  [GRADE, g] = mk(W, H);
  gr = g.createLinearGradient(0, 0, W, H);
  gr.addColorStop(0, 'rgba(255,186,120,1)');
  gr.addColorStop(0.45, 'rgba(128,128,128,1)');
  gr.addColorStop(1, 'rgba(70,96,150,1)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // warm sun haze from above the top edge
  [HAZE, g] = mk(W, H);
  gr = g.createRadialGradient(W * 0.47, -60, 10, W * 0.47, -60, Math.max(330, W * 0.52));
  gr.addColorStop(0, 'rgba(255,196,130,0.16)');
  gr.addColorStop(1, 'rgba(255,196,130,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // thermal: sensor noise and faint scan lines
  [GRAIN, g] = mk(W + 64, H + 64);
  const rg = mulberry(9);
  for (let i = 0; i < (W + 64) * (H + 64) * 0.18; i++) {
    g.fillStyle = rg() < 0.5 ? '#ffffff' : '#000000';
    g.fillRect((rg() * (W + 64)) | 0, (rg() * (H + 64)) | 0, 1, 1);
  }
  [SCAN, g] = mk(W, H);
  g.fillStyle = 'rgba(0,0,0,0.1)';
  for (let y = 0; y < H; y += 2) g.fillRect(0, y, W, 1);
}

// ---------- what is in view
const DL = [], TREES = [], VZ = [], FIRES = [];
const byY = (a, b) => a.y - b.y;
// Collect the props (from the chunk plans) and the living dead in view, sorted by depth.
function gather(ci0, cj0, ci1, cj1) {
  DL.length = 0;
  TREES.length = 0;
  VZ.length = 0;
  FIRES.length = 0;
  const x0 = G.camX - 8, x1 = G.camX + W + 8, y0 = G.camY - 8, y1 = G.camY + H + 8;
  for (let j = cj0 - 1; j <= cj1 + 1; j++) for (let i = ci0 - 1; i <= ci1 + 1; i++) {
    const pl = plan(i, j);
    for (const p of pl.props) {
      const d = p.d, l = p.x - d.ax, t = p.y - d.ay;
      if (l > x1 || l + d.spr.width < x0 || t > y1 || p.y + 1 < y0) continue;
      DL.push(p);
      if (d.tree) TREES.push(p);
    }
    for (const f of pl.fires) if (f.x > x0 - 30 && f.x < x1 + 30 && f.y > y0 - 30 && f.y < y1 + 30) FIRES.push(f);
  }
  for (const z of G.zombies) {
    if (z.dead || z.x < x0 - 10 || z.x > x1 + 10 || z.y < y0 || z.y > y1 + 24) continue;
    DL.push(z);
    VZ.push(z);
  }
  DL.sort(byY);
}

// ---------- pieces
function zImg(z) {
  const fr = z.S.walk[(z.anim | 0) & 1];
  if (z.flash > 0) return z.left ? fr.wf : fr.w;
  if (thermal) return z.left ? fr.hf : fr.h;
  return z.left ? fr.nf : fr.n;
}
function drawZombie(z) {
  const S = z.S;
  blit(zImg(z), Math.round(z.x - S.ax), Math.round(z.y - S.ay));
  if (z.big && z.hp < z.max) {
    const w = 14, x = Math.round(z.x - w / 2), y = Math.round(z.y - S.ay - 4);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x - 1, y - 1, w + 2, 4);
    ctx.fillStyle = '#3a1210';
    ctx.fillRect(x, y, w, 2);
    ctx.fillStyle = '#c8432e';
    ctx.fillRect(x, y, Math.max(1, Math.round(w * z.hp / z.max)), 2);
  }
}
// Grass tufts that sway a little.
function drawTufts(ci0, cj0, ci1, cj1) {
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) {
    for (const t of plan(i, j).tufts) {
      const sw = Math.round(Math.sin(realT * 1.6 + t.p + t.x * 0.03) * 0.8);
      ctx.fillStyle = t.c;
      ctx.fillRect(t.x, t.y - t.h + 1, 1, t.h);
      ctx.fillRect(t.x - 1 + sw, t.y - t.h, 1, 1);
      ctx.fillRect(t.x + 2, t.y - t.h + 2, 1, t.h - 1);
      ctx.fillRect(t.x + 2 + sw, t.y - t.h + 1, 1, 1);
    }
  }
}
// Bodies in the air: knocked over (fall) or thrown and turning (spin).
function drawBodies() {
  for (const b of G.bodies) {
    const S = b.S;
    if (b.fall) {
      if (b.age < 0.07) blit(S.walk[0].w, Math.round(b.x - S.ax), Math.round(b.y - S.ay - b.z));
      else blit(thermal ? S.deadH : S.dead, Math.round(b.x - S.dax), Math.round(b.y - S.day - b.z));
    } else {
      const img = (thermal ? S.spinH : S.spin)[mod(Math.round(b.rot / (TAU / 4)), 4)];
      blit(img, Math.round(b.x - img.width / 2), Math.round(b.y - b.z - 5 - img.height / 2));
    }
  }
}
// Where a 105 shell will land: a blinking ring that closes on the spot.
function drawShellMarks() {
  for (const r of G.rounds) {
    if (r.kind !== 'he' || !r.player) continue;
    const u = r.age / r.T, rr = lerp(CFG.he.kill * 1.5, CFG.he.kill, ease(u));
    ctx.globalAlpha = 0.35 + 0.3 * (Math.sin(realT * 22) > 0 ? 1 : 0);
    pell(r.bx, r.by, rr, rr * FORE, thermal ? '#ffffff' : '#ff6a28');
    ctx.fillStyle = thermal ? '#ffffff' : '#ff6a28';
    ctx.fillRect(Math.round(r.bx) - 1, Math.round(r.by), 3, 1);
    ctx.fillRect(Math.round(r.bx), Math.round(r.by) - 1, 1, 3);
  }
  ctx.globalAlpha = 1;
}
// Rounds in the air. They leave the gunship below the screen and fall into their spot: seen from
// the gun, a round streaks out fast, then shrinks to a point as it drops away (perspective).
const Z0 = 110, ZD = 1250;
const persp = (u) => (1 - u) * Z0 / (Z0 + u * (ZD - Z0));
// the gun's muzzle, below the bottom edge of the screen (25mm right, 105 left), in world px
const muzzleX = (side) => G.camX + W * (side > 0 ? 0.7 : 0.36);
const muzzleY = (side) => G.camY + H + (side > 0 ? 26 : 36);
const TRC = [['#fff1c2', '#ffd27a', '#ff9a3a', '#c9772f'], ['#fff6e0', '#ffd27a', '#ff9a3a', '#e2552f']];
function drawRounds() {
  for (const r of G.rounds) {
    const u = r.age / r.T, he = r.kind === 'he';
    const mx = muzzleX(r.side) + r.j * 8, my = muzzleY(r.side);
    const g1 = persp(u), g0 = persp(Math.max(0, u - (he ? 0.07 : 0.06)));
    const hx = r.bx + (mx - r.bx) * g1, hy = r.by + (my - r.by) * g1;
    const dx = (r.bx + (mx - r.bx) * g0) - hx, dy = (r.by + (my - r.by) * g0) - hy;
    const n = Math.min(160, Math.ceil(Math.hypot(dx, dy))), cols = TRC[he ? 1 : 0];
    for (let i = 1; i <= n; i++) {
      const f = i / n, w = he && f < 0.5 ? 2 : 1;
      ctx.globalAlpha = 1 - f * 0.75;
      ctx.fillStyle = cols[Math.min(3, (f * 4) | 0)];
      // near the camera the streak is wider
      const s = g1 + (g0 - g1) * f > 0.22 ? w + 1 : w;
      ctx.fillRect(Math.round(hx + dx * f), Math.round(hy + dy * f), s, s);
    }
    ctx.globalAlpha = 1;
    const s = he ? (g1 > 0.12 ? 3 : 2) : (g1 > 0.25 ? 2 : 1);
    ctx.fillStyle = '#fff6e0';
    ctx.fillRect(Math.round(hx - (s >> 1)), Math.round(hy - (s >> 1)), s, s);
    light(hx, hy, he ? 10 : 5, he ? '#ffd27a' : '#ffb347', he ? 0.7 : 0.45);
  }
  // the gun flashes below the screen edge
  if (G.muzzle[0] > 0) light(muzzleX(1), muzzleY(1) - 10, 46, '#ffc27a', G.muzzle[0] / 0.05 * 0.5);
  if (G.muzzle[1] > 0) light(muzzleX(-1), muzzleY(-1) - 14, 80, '#ffb060', G.muzzle[1] / 0.12 * 0.8);
  ctx.globalAlpha = 1;
}
// Two bands of mist that drift over the field (they belong to the ground and move with it).
function drawMist() {
  const k0 = Math.floor((G.camY - 48) / 300), k1 = Math.floor((G.camY + H) / 300), mw = MIST.width;
  for (let k = k0; k <= k1; k++) {
    const y = k * 300 + 80, odd = k & 1;
    const off = mod(k * 217 + realT * (odd ? 3 : -2), mw);
    ctx.globalAlpha = odd ? 0.09 : 0.06;
    for (let x = Math.floor((G.camX - off) / mw) * mw + off; x < G.camX + W; x += mw) ctx.drawImage(MIST, Math.round(x), y);
  }
  ctx.globalAlpha = 1;
}
// Cloud shadows that slide over the field.
function drawClouds() {
  const dx = realT * 5, CW = 520, CL = 380;
  const i0 = Math.floor((G.camX - dx) / CW) - 1, i1 = Math.floor((G.camX + W - dx) / CW);
  const j0 = Math.floor(G.camY / CL) - 1, j1 = Math.floor((G.camY + H) / CL);
  ctx.globalAlpha = 0.13;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    if (hrnd(i, j, 77) < 0.3) continue;
    const s = CLOUDSPR[hrnd(i, j, 78) < 0.5 ? 0 : 1];
    ctx.drawImage(s, Math.round(i * CW + dx + hrnd(i, j, 79) * (CW - s.width)), Math.round(j * CL + hrnd(i, j, 80) * (CL - s.height)));
  }
  ctx.globalAlpha = 1;
}

// ---------- the frame (world layer)
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#060708';
  ctx.fillRect(0, 0, W, H);
  const [sx, sy] = shakeOff();
  const ci0 = Math.floor((G.camX - 8) / CH), ci1 = Math.floor((G.camX + W + 8) / CH);
  const cj0 = Math.floor((G.camY - 8) / CH), cj1 = Math.floor((G.camY + H + 8) / CH);
  // the ground in view is baked now; one more chunk round it per frame, before it is needed
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) groundChunk(i, j, true);
  bakeSome(ci0, cj0, ci1, cj1, 1);
  gather(ci0, cj0, ci1, cj1);
  ctx.save();
  ctx.translate(sx - G.camX, sy - G.camY);
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) {
    ctx.drawImage(GROUND.get(ckey(i, j)), i * CH, j * CH);
    const d = DECALS.get(ckey(i, j));
    if (d) ctx.drawImage(d.c, i * CH, j * CH);
  }
  // the thermal camera sees the ground cooler than anything alive
  if (thermal) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(G.camX - 8, G.camY - 8, W + 16, H + 16);
  }
  drawTufts(ci0, cj0, ci1, cj1);
  drawShellMarks();
  // shadows of the dead, and of bodies in the air
  ctx.globalAlpha = thermal ? 0.2 : 0.32;
  for (const z of VZ) {
    const S = z.S, fr = S.walk[(z.anim | 0) & 1];
    blit(z.left ? fr.sf : fr.s, Math.round(z.x - S.ax), Math.round(z.y - 1 - S.shp));
  }
  ctx.globalAlpha = 0.25;
  for (const b of G.bodies) blit(BODYSH, Math.round(b.x - 4), Math.round(b.y - 2));
  ctx.globalAlpha = 1;
  // trees, props and the dead, back to front. A tree under the sight fades so you can see past it.
  const ax = G.camX + G.aimSX, ay = G.camY + G.aimSY, aiming = mode === 'play';
  for (const o of DL) {
    if (!o.d) {
      drawZombie(o);
      continue;
    }
    const d = o.d;
    if (aiming && d.tree && Math.abs(o.x - ax) < d.spr.width / 2 + 10 && ay > o.y - d.spr.height - 10 && ay < o.y + 6) {
      ctx.globalAlpha = 0.4;
      blit(d.spr, o.x - d.ax, o.y - d.ay);
      ctx.globalAlpha = 1;
    } else blit(d.spr, o.x - d.ax, o.y - d.ay);
  }
  // the dead behind a tree show through it, faintly
  if (TREES.length) {
    ctx.globalAlpha = thermal ? 0.6 : 0.45;
    for (const z of VZ) {
      const S = z.S, zl = z.x - S.ax, zt = z.y - S.ay, zw = S.walk[0].n.width;
      for (const t of TREES) {
        if (t.y <= z.y) continue;
        const d = t.d, tl = t.x - d.ax;
        if (zl + zw <= tl || zl >= tl + d.spr.width || zt >= t.y || z.y < t.y - d.ay) continue;
        blit(zImg(z), Math.round(zl), Math.round(zt));
        break;
      }
    }
    ctx.globalAlpha = 1;
  }
  // fires, smoke and dirt, explosions, flying bodies
  for (const f of FIRES) drawFlame(f.x, f.y, f.big, f.seed);
  for (const f of flames) drawFlame(f.x, f.y, false, f.seed);
  drawParts(false);
  drawBooms();
  drawBodies();
  // glows (added light)
  ctx.globalCompositeOperation = 'lighter';
  drawLights();
  for (const f of FIRES) light(f.x, f.y - (f.big ? 6 : 3), f.big ? 30 : 18, '#ff9a4a', 0.45 + Math.sin(realT * 13 + f.seed) * 0.08);
  for (const f of flames) light(f.x, f.y - 2, 10, '#ff8a3a', 0.35 * Math.min(1, f.life));
  ctx.globalAlpha = 1;
  drawRings();
  drawParts(true);
  drawRounds();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (!thermal) {
    drawMist();
    drawClouds();
  }
  drawTexts();
  ctx.restore();
  // the camera's look over everything
  if (!thermal) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(HAZE, 0, 0);
    ctx.globalCompositeOperation = 'soft-light';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(GRADE, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(VIG, 0, 0);
  } else {
    // grey (the color's saturation taken out), turned over for black hot, then grain and lines
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, W, H);
    if (thermal === 2) {
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.06;
    ctx.drawImage(GRAIN, -((Math.random() * 64) | 0), -((Math.random() * 64) | 0));
    ctx.globalAlpha = 1;
    ctx.drawImage(SCAN, 0, 0);
    ctx.drawImage(VIG, 0, 0);
  }
}

// ui.js - everything drawn over the world, in screen pixels: the gun sight and lock brackets, the
// top bar, the weapon cards, coins, banners, hints, the low fuel edge, and the screens (title,
// pause, summary). Buttons are drawn in the canvas too (from Ball x Archers).

// M = the mouse in game pixels. pressed / released are true for one frame; px, py = where the
// press started; used = this click was already handled; inside = the mouse is over the game.
const M = { x: -99, y: -99, down: false, pressed: false, released: false, px: 0, py: 0, used: false, inside: false };
let cursor = 'default';

// True when a button at (x, y, w, h) was clicked this frame.
function clicked(x, y, w, h) {
  if (M.released && !M.used && inR(M.px, M.py, x, y, w, h) && inR(M.x, M.y, x, y, w, h)) {
    M.used = true;
    SFX.ui();
    return true;
  }
  return false;
}
// Draw a button (o.primary = gold). Returns true when it is clicked.
function button(x, y, w, h, label, o) {
  o = o || {};
  const hov = inR(M.x, M.y, x, y, w, h), pr = hov && M.down;
  ctx.fillStyle = pr ? '#0b0c0f' : hov ? '#1d1f25' : '#131419';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, o.primary ? (hov ? '#f0c264' : '#b8862f') : (hov ? '#6a6f7b' : '#3a3e48'));
  ctx.fillStyle = o.primary ? 'rgba(227,176,75,0.12)' : '#22252c';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  text(label, x + w / 2, y + Math.round(h / 2) - 3 + (pr ? 1 : 0), o.primary ? U.gold : U.ink, { align: 'center' });
  if (hov) cursor = 'pointer';
  return clicked(x, y, w, h);
}

// ---------- the sight
// L-shaped corners round a box, with dark edges.
function corners(x, y, w, h, col) {
  const L = 3;
  ctx.fillStyle = '#07080a';
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w - 1, y, -1, 1], [x, y + h - 1, 1, -1], [x + w - 1, y + h - 1, -1, -1]]) {
    ctx.fillRect(Math.min(cx, cx + sx * (L - 1)) - 1, cy - 1, L + 2, 3);
    ctx.fillRect(cx - 1, Math.min(cy, cy + sy * (L - 1)) - 1, 3, L + 2);
  }
  ctx.fillStyle = col;
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w - 1, y, -1, 1], [x, y + h - 1, 1, -1], [x + w - 1, y + h - 1, -1, -1]]) {
    ctx.fillRect(Math.min(cx, cx + sx * (L - 1)), cy, L, 1);
    ctx.fillRect(cx, Math.min(cy, cy + sy * (L - 1)), 1, L);
  }
}
const TICKS = [[-8, 0, 5, 1], [4, 0, 5, 1], [0, -8, 1, 5], [0, 4, 1, 5]];
function drawSight() {
  const x = Math.round(G.aimSX), y = Math.round(G.aimSY);
  // lock brackets: they slide to the locked zombie and close round it
  const z = G.lock;
  if (z && !z.dead) {
    const S = z.S, w = S.walk[0].n.width + 4, h = S.h + 4;
    const tx = z.x - G.camX - S.ax - 2, ty = z.y - G.camY - S.ay - 2;
    const b = G.box || (G.box = { x: x - 14, y: y - 14, w: 28, h: 28 });
    const k = 1 - Math.exp(-frameDt * 28);
    b.x += (tx - b.x) * k;
    b.y += (ty - b.y) * k;
    b.w += (w - b.w) * k;
    b.h += (h - b.h) * k;
    corners(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h), thermal ? '#ffffff' : '#ff5a3a');
  } else G.box = null;
  // the sight: 4 ticks round a gap and a dot, with dark edges so it reads on any ground
  const col = G.overheat ? U.red : thermal ? '#f4f4f4' : '#e8dfc8';
  ctx.fillStyle = '#07080a';
  for (const t of TICKS) ctx.fillRect(x + t[0] - 1, y + t[1] - 1, t[2] + 2, t[3] + 2);
  ctx.fillRect(x - 1, y - 1, 3, 3);
  ctx.fillStyle = col;
  for (const t of TICKS) ctx.fillRect(x + t[0], y + t[1], t[2], t[3]);
  ctx.fillRect(x, y, 1, 1);
  // hit marker: a white X when rounds hit
  if (G.hitT > 0) {
    ctx.fillStyle = '#ffffff';
    for (const d of [2, 3]) {
      ctx.fillRect(x - d, y - d, 1, 1);
      ctx.fillRect(x + d, y - d, 1, 1);
      ctx.fillRect(x - d, y + d, 1, 1);
      ctx.fillRect(x + d, y + d, 1, 1);
    }
  }
  // the 105 is loaded: a gold pip at the top right of the sight
  if (G.heReload <= 0) {
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x + 6, y - 9, 4, 4);
    ctx.fillStyle = thermal ? '#ffffff' : U.gold;
    ctx.fillRect(x + 7, y - 8, 2, 2);
  }
  // gun heat: a small bar under the sight while the 25mm is warm
  if (G.heat > 0.15) {
    const hw = 13;
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x - 7, y + 11, hw + 2, 3);
    ctx.fillStyle = G.overheat ? U.red : G.heat > 0.75 ? U.amber : '#8b919c';
    ctx.fillRect(x - 6, y + 12, Math.round(hw * G.heat), 1);
  }
}

// ---------- in play
function card(x, y, w, h, icon, name, tag, tagc, f, fc) {
  ctx.fillStyle = 'rgba(12,13,17,0.86)';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, '#2e3139');
  ctx.fillStyle = '#1c1e24';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  ctx.drawImage(icon, x + 5, y + Math.round((h - icon.height) / 2));
  text(name, x + 17, y + 5, U.ink);
  text(tag, x + w - 5, y + 5, tagc, { align: 'right', outline: false });
  bar(x + 17, y + 16, w - 23, 4, f, '#1a1716', fc);
}
function drawHUD() {
  ctx.fillStyle = 'rgba(6,7,9,0.88)';
  ctx.fillRect(0, 0, W, 18);
  ctx.fillStyle = '#24272e';
  ctx.fillRect(0, 18, W, 1);
  // cash: the coin hops and the number flashes when cash comes in
  const cp = G.cashPulse;
  ctx.drawImage(ICON.coin, 5, 5 - (cp > 0.5 ? 1 : 0));
  text('$' + fmt(G.shownCash), 15, 6, cp > 0 ? '#ffe39a' : U.gold);
  // kills
  ctx.drawImage(ICON.skull, 80, 5);
  text(fmt(G.kills), 90, 6 - (G.killBump > 0.5 ? 1 : 0), U.ink);
  // fuel: red and blinking when it runs low
  const low = G.fuel < 10, fw = Math.min(180, W - 300), fx = Math.round(W / 2 - fw / 2);
  ctx.drawImage(ICON.fuel, fx - 12, 5);
  bar(fx, 6, fw, 6, G.fuel / CFG.fuel, '#1a1716', low ? '#b8402e' : '#b8862f', low ? '#e06a4f' : '#e3b04b');
  if (!low || Math.floor(realT * 4) % 2 === 0) text(Math.ceil(G.fuel) + 'S', fx + fw + 5, 6, low ? U.red : U.dim);
  // the horde
  ctx.drawImage(ICON.zed, W - 82, 5);
  text(fmt(G.zombies.length), W - 72, 6, U.dim);
  if (mode === 'play' && button(W - 23, 1, 21, 16, paused ? '>' : 'II')) paused = !paused;
  if (Au.muted) text('MUTE', W - 4, 22, U.faint, { align: 'right' });
  // kill streak: the count and the time left to keep it going
  const s = G.streak, st = G.t - s.t;
  if (s.n >= 3 && st < 1.6) {
    text('STREAK ' + s.n, 5, 24, s.n >= 25 ? '#ffd36a' : U.gold);
    bar(5, 33, 52, 2, 1 - st / 1.6, '#1a1716', '#e3b04b');
  }
}
function drawWeapons() {
  const y = H - 30, rdy = G.heReload <= 0;
  card(4, y, 96, 26, ICON.mg, '25MM', G.overheat ? 'OVERHEAT' : 'L-CLICK', G.overheat ? U.red : U.faint, G.heat,
    G.overheat ? '#b8402e' : G.heat > 0.75 ? U.amber : '#8b919c');

    rdy ? '#e3b04b' : '#7a6a50');
  text('CAMERA: ' + CAMS[thermal] + '  (T)', W - 5, H - 11, U.faint, { align: 'right' });
}
// first seconds of a sortie: how to play
function drawHint() {
  const a = clamp((9 - G.run) / 1.5, 0, 1);
  if (a <= 0 || G.run < 1.2) return;
  ctx.globalAlpha = a;
  text('HOLD LEFT CLICK: 25MM GUN.   RIGHT CLICK OR SPACE: 105MM CANNON.', W / 2, H - 58, U.ink, { align: 'center' });
  text('WASD OR THE SCREEN EDGE: MOVE.   T: THERMAL CAMERA.', W / 2, H - 47, U.dim, { align: 'center' });
  ctx.globalAlpha = 1;
}
// red screen edge while the fuel runs out
function drawTension() {
  if (mode !== 'play' || G.fuel >= 10) return;
  let a = 0.3 + 0.5 * (1 - G.fuel / 10);
  if (!REDUCED) a *= 0.7 + 0.3 * Math.sin(realT * 7);
  ctx.fillStyle = '#c0301f';
  for (let k = 0; k < 3; k++) {
    ctx.globalAlpha = a * (1 - k * 0.3);
    ctx.fillRect(k, k, W - 2 * k, 1);
    ctx.fillRect(k, H - 1 - k, W - 2 * k, 1);
    ctx.fillRect(k, k, 1, H - 2 * k);
    ctx.fillRect(W - 1 - k, k, 1, H - 2 * k);
  }
  ctx.globalAlpha = 1;
  if (Math.floor(realT * 2.5) % 2 === 0) text('BINGO FUEL', W / 2, 26, U.red, { align: 'center' });
}

// ---------- screens
function drawPause() {
  ctx.fillStyle = 'rgba(5,6,8,0.5)';
  ctx.fillRect(0, 19, W, H - 19);

}
function drawTitle() {

// After the fuel runs out: the numbers count up.
function drawSummary() {
  ctx.fillStyle = 'rgba(5,6,8,0.66)';
  ctx.fillRect(0, 0, W, H);
  const s = G.sum, w = 248, h = 206, x = Math.round(W / 2 - w / 2), y = Math.round(H / 2 - h / 2);
  panel(x, y, w, h, '#0f1014');
  text('MISSION OVER', x + w / 2, y + 12, U.ink, { align: 'center', scale: 2 });
  if (s.newBest) text('NEW BEST', x + w / 2, y + 30, U.gold, { align: 'center' });
  const k = ease(clamp((realT - sumStart - 0.3) / 1.4, 0, 1));
  const rows = [['ZOMBIES KILLED', fmt(Math.round(s.kills * k))], ['BEST STREAK', fmt(Math.round(s.streak * k))],
    ['BIGGEST BLAST', fmt(Math.round(s.blast * k))], ['ROUNDS ON TARGET', Math.round(s.acc * k) + '%']];
  rows.forEach((r, i) => {
    text(r[0], x + 20, y + 44 + i * 15, U.dim);
    text(r[1], x + w - 20, y + 44 + i * 15, U.ink, { align: 'right' });
  });
  ctx.fillStyle = '#2e3139';
  ctx.fillRect(x + 16, y + 107, w - 32, 1);
  ctx.drawImage(ICON.coin, x + 20, y + 115);
  text('CASH EARNED', x + 30, y + 116, U.ink);
  text('$' + fmt(Math.round(s.cash * clamp((realT - sumStart - 1.5) / 0.8, 0, 1))), x + w - 20, y + 116, U.gold, { align: 'right' });
  text('BEST ' + fmt(best.kills) + ' KILLS', x + w - 20, y + 130, U.faint, { align: 'right' });
  if (button(x + 16, y + h - 32, 104, 20, 'FLY AGAIN', { primary: true })) startGame();
  if (button(x + w - 120, y + h - 32, 104, 20, 'TITLE')) toTitle();
}

// ---------- the UI for the current mode
function drawUI() {
  if (mode === 'title') {
    drawTitle();
    drawBanners();
    return;
  }
  drawHUD();
  drawCoins();
  if (mode === 'play' || mode === 'ending') {
    drawWeapons();
    drawHint();
    drawBanners();
    if (mode === 'play' && !paused) drawSight();
    if (paused) drawPause();
    drawTension();
  } else if (mode === 'summary') drawSummary();
}

// main.js - input (mouse, keys, wheel), the camera mode, the main loop (fixed steps with hit-stop)
// and the start-up. window.__sr is a small API for tests and the browser console.

// ---------- camera mode
function setThermal(k) {
  thermal = k;
  if (mode === 'play' || mode === 'ending') banner('CAMERA', CAMS[thermal], thermal ? '#e8e8e8' : U.ink, 3);
}

// ---------- input
// Browser pointer position -> game pixels.
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
});
cv.addEventListener('pointerleave', () => { M.inside = false; });
cv.addEventListener('pointerdown', (e) => {
  audioInit();
  try { cv.focus({ preventScroll: true }); } catch (_) { /* old browsers */ }
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
  if (e.button === 2) {
    tryHE();
    return;
  }
  if (e.button !== 0) return;
  M.down = true;
  M.pressed = true;
  M.px = p.x;
  M.py = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* fine without */ }
  if (mode !== 'play' || p.y < 19) return;
  // a click on the field goes on after a pause; otherwise it is the trigger
  if (paused) {
    paused = false;
    M.used = true;
  } else G.trigger = true;
});
cv.addEventListener('pointerup', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  if (e.button !== 0) return;
  if (M.down) {
    M.down = false;
    M.released = true;
  }
  if (G) G.trigger = false;
});
cv.addEventListener('pointercancel', () => {
  M.down = false;
  if (G) G.trigger = false;
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());
// the wheel zooms in and out one step (bigger or smaller pixels)
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const z = clamp(zoomStep + (e.deltaY < 0 ? 1 : -1), -1, 1);
  if (z !== zoomStep) {
    zoomStep = z;
    onResize();
  }
}, { passive: false });

const KEYS = {};
const keyName = (e) => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = keyName(e);
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  KEYS[k] = true;
  if (e.repeat) return;
  audioInit();
  if (k === 'm') {
    Au.muted = !Au.muted;
    droneLevel = -1;
    return;
  }
  if (k === 't') {
    setThermal((thermal + 1) % 3);
    return;
  }
  if (mode === 'play') {
    if (k === ' ') tryHE();
    else if (k === 'Escape' || k === 'p') {
      paused = !paused;
      G.trigger = false;
    }
  } else if (mode === 'title') {
    if (k === 'Enter' || k === ' ') startGame();
  } else if (mode === 'summary') {
    if (k === 'Enter') startGame();
    else if (k === 'Escape') toTitle();
  }
});
addEventListener('keyup', (e) => { KEYS[keyName(e)] = false; });
// WASD or the arrow keys slide the view
function keyPan() {
  const x = (KEYS.d || KEYS.ArrowRight ? 1 : 0) - (KEYS.a || KEYS.ArrowLeft ? 1 : 0);
  const y = (KEYS.s || KEYS.ArrowDown ? 1 : 0) - (KEYS.w || KEYS.ArrowUp ? 1 : 0);
  const l = Math.hypot(x, y) || 1;
  G.pan[0] = mode === 'play' && !paused ? x / l : 0;
  G.pan[1] = mode === 'play' && !paused ? y / l : 0;
}
// pause when the window loses focus or the tab is hidden; let go of every key
function lostFocus() {
  for (const k in KEYS) KEYS[k] = false;
  if (G) G.trigger = false;
  M.down = false;
  if (mode === 'play') paused = true;
}
addEventListener('blur', lostFocus);
document.addEventListener('visibilitychange', () => { if (document.hidden) lostFocus(); });
function onResize() {
  if (resize()) {
    bakeOverlays();
    if (G) placeCamera();
  }
}
addEventListener('resize', onResize);

// ---------- main loop
// last = time of the last frame, acc = game time still to step. FPS = stats for the debug API.
// hold = time stands still (tests take close-up pictures this way)
let last = performance.now(), acc = 0, droneLevel = -1, hold = false;
const FPS = { n: 0, sum: 0, worst: 0, t: 0, avg: 0, lastWorst: 0 };
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = (now - last) / 1000;
  last = now;
  const dt = Math.min(0.1, Math.max(0, rdt));
  realT += dt;
  frameDt = dt;
  FPS.n++;
  FPS.sum += rdt;
  FPS.worst = Math.max(FPS.worst, rdt);
  FPS.t += rdt;
  if (FPS.t > 1) {
    FPS.avg = FPS.n / FPS.sum;
    FPS.lastWorst = FPS.worst;
    FPS.n = FPS.sum = FPS.worst = FPS.t = 0;
  }
  keyPan();
  // hit-stop: slow motion while slowT lasts
  let ts = 1;
  if (slowT > 0) {
    slowT -= dt;
    ts = slowK;
    if (slowT <= 0) slowK = 1;
  }
  // fixed steps of STEP seconds, at most 8 a frame
  if (!(mode === 'play' && paused) && !hold) {
    acc += dt * ts;
    let n = 0;
    try {
      while (acc >= STEP && n < 8) {
        step(STEP);
        acc -= STEP;
        n++;
      }
    } catch (err) {
      acc = 0;
      if (!loop.errs) {
        loop.errs = 1;
        console.error(err);
      }
    }
    if (n >= 8) acc = 0;
  }
  updateCam(dt);
  G.shownCash = Math.abs(G.shownCash - G.cash) < 1 ? G.cash : lerp(G.shownCash, G.cash, 1 - Math.exp(-10 * dt));
  // the engine hum: loud in play, quiet behind the menus
  const dl = mode === 'play' && !paused ? 1 : mode === 'ending' ? 0.7 : 0.4;
  if (Au.ctx && dl !== droneLevel) {
    droneLevel = dl;
    drone(dl);
  }
  cursor = 'default';
  try {
    render();
    drawUI();
  } catch (err) {
    if (!loop.rerr) {
      loop.rerr = 1;
      console.error(err);
    }
  }
  // the game draws its own sight, so the mouse pointer hides in play
  cv.style.cursor = mode === 'play' && !paused && M.y >= 19 && cursor === 'default' ? 'none' : cursor;
  M.pressed = false;
  M.released = false;
  M.used = false;
}

// ---------- start
function boot() {
  initSprites();
  bakeScorch();
  resize();
  bakeStatic();
  bakeOverlays();
  loadBest();
  newGame(true);
  mode = 'title';
  window.__sr = {
    get G() { return G; },
    get mode() { return mode; },
    FPS,
    CFG,
    start: startGame,
    title: toTitle,
    // sim(sec): run the game for sec seconds at once, without drawing
    sim: (sec) => {
      const n = Math.round(sec / STEP);
      for (let i = 0; i < n; i++) step(STEP);
    },
    aim: (x, y) => {
      M.x = x;
      M.y = y;
      M.inside = true;
    },
    trigger: (on) => { G.trigger = !!on && mode === 'play'; },
    he: () => tryHE(),
    thermal: (k) => setThermal(k),
    fuel: (f) => { G.fuel = f; },
    pause: (p) => { paused = !!p; },
    hold: (h) => { hold = !!h; },
    // bench(n): draw n frames at once; the average ms per frame
    bench: (n) => {
      const t = performance.now();
      for (let i = 0; i < n; i++) {
        render();
        drawUI();
      }
      return (performance.now() - t) / n;
    },
    stats: () => ({
      mode, kills: G.kills, cash: Math.round(G.cash), fuel: +G.fuel.toFixed(1), zombies: G.zombies.length, bodies: G.bodies.length,
      rounds: G.rounds.length, parts: parts.length, texts: texts.length, chunks: GROUND.size, decals: DECALS.size,
      W, H, SCALE, fps: Math.round(FPS.avg), worstMs: Math.round(FPS.lastWorst * 1000), lock: !!G.lock, heat: +G.heat.toFixed(2)
    })
  };
  requestAnimationFrame((t) => {
    last = t;
    requestAnimationFrame(loop);
  });
}
boot();

})();
</script>
