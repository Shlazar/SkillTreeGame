    const p = nodeXY(f.id), h = halfOf(NODE[f.id]), d = Math.round(ease(u) * 14);
    ctx.globalAlpha = u > 0.6 ? (1 - u) / 0.4 : 1;
    text(f.s, p.x, p.y - h - 12 - d, f.c, { align: 'center' });
    ctx.globalAlpha = 1;
  }
}

// ---------- the tooltip
// Split s into lines no wider than w px.
function wrap(s, w) {
  const out = [];
  let line = '';
  for (const word of s.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (line && tw(t) > w) {
      out.push(line);
      line = word;
    } else line = t;
  }
  if (line) out.push(line);
  return out;
}
// The NOW > NEXT line for stat [label, value at a level]: [[text, colour], ...] (just NOW when every
// level is bought, or when the next level does not change it)
function statSegs(stat, l, done) {
  const [label, val] = stat, now = String(val(l));
  if (done || now === String(val(l + 1))) return [[label, U.dim], [now, U.ink]];
  return [[label, U.dim], [now, now === 'NONE' ? U.faint : U.ink], ['>', U.faint], [String(val(l + 1)), U.green]];
}
// The tooltip for node n beside it: NAME and LEVEL x/y, a line in its colour, what it does, NOW >
// NEXT, then the price (red when you cannot pay) and what a click does.
const INFO_W = 216;
function drawInfo(n, st, y0, y1) {
  const K = NODE_KIND[n.k], l = lv(n.id), m = maxLv(n), tease = st === 'tease', lock = tease;
  const inner = INFO_W - 14;
  const desc = wrap(n.desc, inner);
  const vals = lock || !n.stat ? [] : [n.stat, n.stat2].filter(Boolean).map((s) => statSegs(s, l, l >= m));
  // the foot: [price text, colour, price icon, right text, colour]
  const surv = n.cur === 'surv', gold = n.cur === 'gold', pr = priceOf(n), have = SAVE[n.cur || 'scrap'];
  const icon = surv ? ICON.survS : gold ? ICON.goldS : ICON.boltS;
  const pcol = !canPay(n) ? U.red : surv ? U.amber : gold ? U.gold : U.blue;
  let foot;
  if (tease) foot = ['', U.faint, null, 'FULL GAME', U.dim];
  else if (st === 'max') foot = ['', U.dim, null, n.id === 'root' || m === 1 ? 'OWNED' : 'MAXED', K.c];
  else if (st === 'poor') foot = [fmt(pr), U.red, icon, 'NEED ' + fmt(pr - have) + ' MORE', U.red];
  else foot = pr ? [fmt(pr), pcol, icon, 'CLICK TO BUY', U.gold] : ['FREE', U.gold, null, 'CLICK TO TAKE IT', U.gold];
  const kindName = tease ? 'FULL GAME' : n.id === 'root' ? 'THE ROOT' : n.k === 'surv' ? 'NEW UNIT' : n.k === 'gold' ? 'SPECIAL' : 'UPGRADE';
  const w = INFO_W, h = 31 + desc.length * 10 + vals.length * 10 + 17;
  // beside the node (right, else left), kept on the panel
  const q = nodeXY(n.id), hn = halfOf(n);
  let x = q.x + hn + 10;
  if (x + w > W - 4) x = q.x - hn - 10 - w;
  if (x < 4) x = clamp(q.x - w / 2, 4, W - w - 4);
  let y = clamp(q.y - Math.round(h / 2), y0 + 22, y1 - h - 4);
  if (x === clamp(q.x - w / 2, 4, W - w - 4)) y = q.y + hn + 12 + h < y1 ? q.y + hn + 12 : q.y - hn - 12 - h;
  y = clamp(y, y0 + 22, y1 - h - 4);
  x = Math.round(x);
  y = Math.round(y);
  // the box: near black, a frame and a line under the head in the node's colour
  ctx.fillStyle = 'rgba(5,8,13,0.97)';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, lock ? '#2a3448' : K.m);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = K.g;
  ctx.fillRect(x + 1, y + 1, w - 2, 1);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  text(n.name, x + 7, y + 5, lock ? U.dim : '#ffffff');
  if (!tease) text(n.id === 'root' ? (l ? 'OWNED' : '0/1') : l + '/' + m, x + w - 7, y + 5, st === 'max' ? K.c : U.ink, { align: 'right' });
  text(kindName, x + 7, y + 14, tease ? U.dim : lock ? '#3c4658' : K.m, { outline: false });
  ctx.fillStyle = lock ? '#1c2434' : K.m;
  ctx.fillRect(x + 6, y + 23, w - 12, 1);
  let ty = y + 27;
  for (const d of desc) {
    text(d, x + 7, ty, lock ? U.faint : U.ink);
    ty += 10;
  }
  for (const segs of vals) {
    let tx = x + 7;
    for (const [s, c] of segs) tx += text(s, tx, ty, c) + 5;
    ty += 10;
  }
  ctx.fillStyle = '#161c28';
  ctx.fillRect(x + 6, ty + 1, w - 12, 1);
  ty += 5;
  const [lt, lc, li, rt, rc] = foot;
  let fx = x + 7;
  if (li) {
    blit(li, fx - 1, ty);
    fx += 7;
  }
  if (lt) text(lt, fx, ty, lc);
  if (rt) {
    const blink = rc === U.gold && Math.sin(realT * TAU) < -0.3;
    text(rt, x + w - 7, ty, blink ? '#ffe39a' : rc, { align: 'right' });
  }
}

// The world is not drawn (nor run) while the skill tree covers it.
const treeCovers = () => mode === 'depot' && depotTab === 'tree';


// planes.js - the STRAFING RUN: an attack jet you call in. Press Q (or click its card), then click
// the map: the jet comes in low across the screen through that point, along the rails (drag before
// you let go to aim it any way you like). Its big nose gun rakes a line of ground ahead of it: a row
// of bright hits and blasts that kills the dead in a band, and with BOMB RUN it drops three bombs at
// the end. G.up.strafe = runs per run (0 = locked), strafeW = half the band's width (px), strafeD =
// damage a hit, strafeBomb = bombs, twin = a second jet beside it.

// speed = px/s, alt = height (px) as it comes in, dive = px lower while it fires, len = px of
// ground it strafes, lead = px ahead of the jet its rounds land, step = px between two hits you see
// (a puff of fire every 3rd, a big blast every 8th), half / dmg = the band and the damage before upgrades, bombR = px
// a bomb kills round it
const JETC = { speed: 320, alt: 46, dive: 12, len: 230, lead: 44, step: 4, half: 13, dmg: 3, bombR: 34, N: 32 };

// ---------- the jet
// A twin-engine attack jet seen from right above, its nose up: straight wings with bombs under
// them, engines on the back of the body, a wide tail with a fin at each end.
const JET = { n: [], sh: [], icon: null, bomb: null };
function jetRaw() {
  return pix(62, 54, (r) => {
    const L = '#c3cad0', A = '#a1a9b1', B = '#848d96', D = '#636b74', E = '#454b53', K = '#18191c';
    // bombs under the wings (their noses show in front of the wing)
    for (const x of [9, 15, 45, 51]) {
      r(x - 1, 14, 2, 6, '#58603f');
      r(x - 1, 14, 1, 6, '#737c58');
      r(x - 1, 13, 2, 1, '#2d3036');
    }
    // the wings: a lit leading edge, darker towards the back, flaps, dark tips, the marks near them
    r(3, 19, 56, 1, L);
    r(2, 20, 58, 4, A);
    r(2, 24, 58, 1, B);
    r(2, 25, 58, 1, D);
    r(3, 26, 56, 1, E);
    for (const x of [8, 40]) r(x, 25, 14, 1, E);
    r(0, 20, 3, 6, D);
    r(59, 20, 3, 6, D);
    r(0, 20, 3, 1, B);
    r(59, 20, 3, 1, B);
    for (const x of [7, 52]) {
      r(x, 21, 3, 3, '#2c3a5a');
      r(x + 1, 22, 1, 1, '#e8e2cc');
    }
    // the tail plane and the two fins at its ends
    r(16, 44, 30, 1, L);
    r(16, 45, 30, 2, B);
    r(16, 47, 30, 1, D);
    for (const x of [14, 45]) {
      r(x, 40, 3, 13, D);
      r(x, 40, 1, 13, A);
      r(x, 40, 3, 1, L);
      r(x + 1, 52, 1, 1, '#c8432e');
    }
    // the body: lit on its left side, a dark nose with the big gun
    r(28, 4, 6, 48, B);
    r(28, 4, 1, 48, L);
    r(29, 4, 2, 48, A);
    r(33, 4, 1, 48, D);
    r(29, 1, 4, 3, D);
    r(29, 1, 1, 3, B);
    r(30, 0, 2, 2, K);
    r(30, 52, 2, 2, E);
    // the canopy, its frame and a glint
    r(28, 8, 6, 7, '#22384a');
    r(29, 9, 1, 3, '#c4ecf8');
    r(30, 9, 1, 1, '#c4ecf8');
    r(28, 12, 6, 1, D);
    // the engines on pylons: round pods, a dark intake in front, the exhaust behind
    for (const x of [19, 36]) {
      r(x, 29, 7, 11, B);
      r(x, 29, 1, 11, L);
      r(x + 1, 29, 2, 11, A);
      r(x + 6, 29, 1, 11, E);
      r(x, 29, 7, 1, K);
      r(x + 1, 30, 5, 1, E);
      r(x + 2, 30, 3, 1, '#2a2d33');
      r(x + 1, 40, 5, 1, '#2a2420');
    }
    r(26, 32, 2, 2, D);
    r(34, 32, 2, 2, D);
  });
}
// Build the jet at JETC.N headings (0 = nose up, clockwise), its shadow and its card icon. At startup.
function bakeJet() {
  const raw = jetRaw();
  JET.n.length = JET.sh.length = 0;
  for (let i = 0; i < JETC.N; i++) {
    const r = rotA(raw, i / JETC.N * TAU);
    JET.n.push(selOut(r));
    JET.sh.push(tint(r, '#000', 1, 'source-in'));
  }
  JET.bomb = outline(pix(3, 6, (r) => {
    r(0, 0, 3, 5, '#565c46');
    r(0, 0, 1, 5, '#7a8262');
    r(0, 5, 3, 1, '#2d3036');
  }), P.out);
  for (const c of [...JET.n, ...JET.sh, JET.bomb]) atl(c);
}
bakeJet();

// ---------- this run's strafing runs
// STRAF = g: the run it is for, left: runs still to use, arm: waiting for a click on the map, aim:
// where the press was (a drag aims), jets, bombs, embers = the holes that still glow, card = its card,
// msg = a short line over the card.
const STRAF = { g: null, left: 0, arm: false, aim: null, jets: [], bombs: [], embers: [], card: { x: 0, y: 0, w: 96, h: 26, on: false }, msg: null };
// A new run: it starts with all its runs, nothing in the air.
function srSync() {
  if (STRAF.g === G) return;
  STRAF.g = G;
  STRAF.left = G.up.strafe || 0;
  STRAF.arm = false;
  STRAF.aim = null;
  STRAF.jets.length = STRAF.bombs.length = STRAF.embers.length = 0;
  STRAF.msg = null;
}
// Q or a click on the card: get ready to pick a spot (again: put it away). True when it is ready.
function tryStrafe() {
  srSync();
  if (!G.up.strafe || G.result || mode !== 'play') return false;
  if (STRAF.arm) {
    strafeCancel();
    return false;
  }
  if (STRAF.left <= 0) {
    STRAF.msg = { t: realT, s: 'NO STRAFING RUNS LEFT THIS RUN.' };
    SFX.deny();
    return false;
  }
  STRAF.arm = true;
  HUI.arm = false;
  SFX.ui();
  return true;
}
function strafeCancel() {
  if (!STRAF.arm) return false;
  STRAF.arm = false;
  STRAF.aim = null;
  SFX.ui();
  return true;
}
// Left button down at screen (x, y): the card, or the spot when it is ready. True when used here.
function strafeDown(x, y) {
  srSync();
  const C = STRAF.card;
  if (C.on && inR(x, y, C.x, C.y, C.w, C.h)) {
    tryStrafe();
    return true;
  }
  if (STRAF.arm && y >= 19) {
    STRAF.aim = { x, y };
    return true;
  }
  return false;
}
// Left button up: the jet is called in through where the press was, along the drag (or the rails).
function strafeUp(x, y) {
  const a = STRAF.aim;
  if (!a) return false;
  STRAF.aim = null;
  STRAF.arm = false;
  const [ux, uy] = strafeDir(a.x, a.y, x, y);
  callStrafe(G.camX + a.x, G.camY + a.y, ux, uy);
  return true;
}
// The way the jet flies for a press at (ax, ay) let go at (bx, by): the drag, or the train's way.
function strafeDir(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  if (d >= 12) return [dx / d, dy / d];
  const c = G.tr.cars[0];
  return [c.dx, c.dy];
}
// Send the jet (two with TWIN JETS) through world point (px, py) flying along (ux, uy).
function callStrafe(px, py, ux, uy) {
  srSync();
  if (STRAF.left <= 0 && !G.demo) return false;
  if (!G.demo) STRAF.left--;
  // it comes in from just off the screen, and flies on until it is off the other side
  const half = G.up.strafeW || JETC.half, offs = G.up.twin ? [-(half + 2), half + 2] : [0];
  const back = Math.max(jetEdge(px, py, -ux, -uy) + 40, JETC.len / 2 + JETC.lead + 20), on = jetEdge(px, py, ux, uy) + 60;
  offs.forEach((o, i) => STRAF.jets.push({ px, py, ux, uy, o, s: -back - i * 26, end: Math.max(on, JETC.len / 2 + 40),
    front: -Infinity, half, dmg: G.up.strafeD || JETC.dmg, bomb: !!G.up.strafeBomb, dropped: false, fired: false, step: 0, blast: 0,
    smoke: 0, alt: JETC.alt }));
  if (!G.demo) STRAF.msg = { t: realT, s: G.up.twin ? 'TWO JETS INBOUND!' : 'JET INBOUND!' };
  return true;
}

// px from world point (x, y) along (ux, uy) to the edge of the view (the jet's sprite is half off it there)
function jetEdge(x, y, ux, uy) {
  let t = 2000;
  const x0 = G.camX - 30, y0 = G.camY - 30, x1 = G.camX + W + 30, y1 = G.camY + H + 30;
  if (ux > 1e-6) t = Math.min(t, (x1 - x) / ux); else if (ux < -1e-6) t = Math.min(t, (x0 - x) / ux);
  if (uy > 1e-6) t = Math.min(t, (y1 - y + 60) / uy); else if (uy < -1e-6) t = Math.min(t, (y0 - y - 60) / uy);
  return Math.max(0, t);
}

// ---------- each step
function updatePlanes(dt) {
  srSync();
  // the demo behind the title shows it off now and then, through a crowd near the train
  if (G.demo && mode === 'title') {
    STRAF.demoT = (STRAF.demoT ?? 6) - dt;
    if (STRAF.demoT <= 0 && !STRAF.jets.length) {
      STRAF.demoT = 16;
      // the thickest crowd on the right of the screen (the title box is on the left)
      let z = null, best = 0;
      for (const q of G.zombies) {
        if (q.dead || offView(q.x, q.y, -40) || q.x - G.camX < W * 0.6) continue;
        let n = 0;
        queryEll(q.x, q.y, 40, () => n++);
        if (n >= best) [z, best] = [q, n];
      }
      if (z) {
        const c = G.tr.cars[0];
        callStrafe(z.x, z.y, c.dx, c.dy);
      }
    }
  }
  for (let i = STRAF.jets.length - 1; i >= 0; i--) {
    const j = STRAF.jets[i];
    j.s += JETC.speed * dt;
    // lower while it fires
    const mid = Math.abs(j.s + JETC.lead - 0) / (JETC.len * 0.75);
    j.alt = JETC.alt - JETC.dive * Math.max(0, 1 - mid * mid);
    strafeFire(j);
    if (j.bomb && !j.dropped && j.s + JETC.lead >= JETC.len / 2) dropBombs(j);
    // a thin trail from the engines
    j.smoke -= dt;
    if (j.smoke <= 0) {
      j.smoke = 0.05;
      const [gx, gy] = jetGround(j);
      for (const sx of [-8, 8]) part({ x: gx - j.ux * 10 - j.uy * sx, y: gy - j.uy * 10 + j.ux * sx, z: j.alt + 2, vx: 0, vy: 0, vz: 0, g: 0,
        life: 0.5, max: 0.5, s: 1, c: 'rgba(210,214,220,0.35)', grow: 3, drag: 1, smoke: true });
    }
    if (j.s > j.end) STRAF.jets.splice(i, 1);
  }
  for (let i = STRAF.bombs.length - 1; i >= 0; i--) {
    const b = STRAF.bombs[i];
    b.t += dt;
    if (b.t >= b.T) {
      bombHit(b.x1, b.y1);
      STRAF.bombs.splice(i, 1);
    }
  }
  for (const j of STRAF.jets) if (j.last) j.last.t += dt;
  // the holes cool down (newest last, so the old ones go from the front)
  for (const e of STRAF.embers) e.t += dt;
  let n = 0;
  while (n < STRAF.embers.length && STRAF.embers[n].t > 1.6) n++;
  if (n) STRAF.embers.splice(0, n);
}
// Where jet j is over the ground.
function jetGround(j) {
  return [j.px + j.ux * j.s - j.uy * j.o, j.py + j.uy * j.s + j.ux * j.o];
}
// The gun: its rounds land JETC.lead px ahead of the jet. Every zombie in the band the hits swept over
// since the last step takes the hit; a hit flashes every JETC.step px, a blast every JETC.blast px.
function strafeFire(j) {
  const L = JETC.len / 2, a = Math.min(j.s + JETC.lead, L), a0 = Math.max(j.front, -L);
  j.front = Math.max(j.front, j.s + JETC.lead);
  if (a <= a0 || a < -L) return;
  if (!j.fired) {
    j.fired = true;
    if (!G.demo) addShake(0.3);
  }
  // the line's points: c = middle of what was swept, (ux, uy) along, (nx, ny) across
  const ux = j.ux, uy = j.uy, nx = -uy, ny = ux;
  const ox = j.px + nx * j.o, oy = j.py + ny * j.o, cm = (a0 + a) / 2;
  const cx = ox + ux * cm, cy = oy + uy * cm, R = ((a - a0) / 2 + j.half + 4) / FORE;
  const hit = [];
  queryEll(cx, cy, R, (z) => {
    const dx = z.x - ox, dy = z.y - oy, t = dx * ux + dy * uy, u = dx * nx + dy * ny;
    if (t >= a0 && t < a && Math.abs(u) <= j.half + (z.big ? 2 : 0)) hit.push(z);
  });
  for (const z of hit) {
    const ix = ox + ux * ((z.x - ox) * ux + (z.y - oy) * uy), iy = oy + uy * ((z.x - ox) * ux + (z.y - oy) * uy);
    if (z.hp <= j.dmg) kill(z, 'he', ix, iy, rnd(8, 20));
    else {
      JUICE.from = [ix, iy];
      hitZombie(z, j.dmg, 'strafe');
    }
  }
  // what you see: hits scattered across the band, puffs of fire and bigger blasts along it
  for (let s = Math.ceil(a0 / JETC.step) * JETC.step; s < a; s += JETC.step) {
    const u = rnd(-j.half, j.half), x = ox + ux * s + nx * u, y = oy + uy * s + ny * u;
    strafeHit(j, x, y);
    const k = Math.round(s / JETC.step);
    if (k % 3 === 0) {
      const v = rnd(-0.7, 0.7) * j.half;
      const bx = ox + ux * s + nx * v, by = oy + uy * s + ny * v;
      addBoom(bx, by, rnd(7, 9.5), 4, 0.6, 5);
      part({ x: bx, y: by, z: 3, vx: rnd(-6, 6), vy: rnd(-5, 3), vz: rnd(6, 14), g: 0, life: rnd(1.4, 2.2), max: 2.2, s: 3,
        c: pick(['rgba(70,64,58,0.5)', 'rgba(96,88,78,0.45)', 'rgba(52,48,44,0.55)']), grow: 6, drag: 1.4, smoke: true });
    }
    if (k % 8 === 0) strafeBlast(ox + ux * s + nx * rnd(-0.4, 0.4) * j.half, oy + uy * s + ny * rnd(-0.4, 0.4) * j.half);
  }
}
// A big blast on the line: a fat fireball, a flash of light, a white ring, a burnt crater.
function strafeBlast(x, y) {
  addBoom(x, y - 1, rnd(13, 17), 7, 0.8, 8);
  lights.push({ x, y, z: 4, r: rnd(44, 56), c: '#ffb060', life: 0.3, max: 0.3, a: 0.7 });
  rings.push({ x, y, r0: 4, r1: 26, t: 0, T: 0.22, c: '#fff1c2', w: 2 });
  for (let i = 0; i < 6; i++) {
    const a = rnd(TAU), v = rnd(40, 90);
    part({ x, y, z: 3, vx: Math.cos(a) * v, vy: Math.sin(a) * v * FORE, vz: rnd(30, 80), g: 200, life: rnd(0.3, 0.5), max: 0.5, s: 1,
      c: pick(['#fff6e0', '#ffd27a', '#ff9a3a']), add: true, drag: 1.5 });
  }
  stampScorch(x, y, 1);
  if (!G.demo) {
    addShake(0.08);
    if (Math.random() < 0.5) SFX.boom();
  }
}
// One round landing at (x, y): a white-hot flash, sparks, dirt thrown up, a hole that glows for a
// moment, a tracer from the jet.
function strafeHit(j, x, y) {
  j.n = (j.n || 0) + 1;
  if (j.n & 1) lights.push({ x, y, z: 2, r: rnd(14, 20), c: '#ffd27a', life: 0.14, max: 0.14, a: 0.85 });
  part({ x, y, z: 2, vx: rnd(-40, 40) + j.ux * 40, vy: rnd(-30, 30) + j.uy * 40, vz: rnd(20, 60), g: 160,
    life: rnd(0.15, 0.3), max: 0.3, s: 1, c: pick(['#fff6e0', '#ffd27a', '#ff9a3a']), add: true, drag: 2 });
  if (Math.random() < 0.5) part({ x, y, z: 1, vx: rnd(-10, 10), vy: rnd(-8, 4), vz: rnd(10, 25), g: 0, life: rnd(0.6, 1.1), max: 1.1, s: 2,
    c: pick(['rgba(150,128,96,0.55)', 'rgba(124,106,80,0.55)', 'rgba(96,82,62,0.6)']), grow: 5, drag: 2.5, smoke: true });
  part({ x, y, z: 1, vx: rnd(-25, 25), vy: rnd(-20, 20), vz: rnd(30, 70), g: 240, life: 1, max: 1, s: 1,
    c: pick(['#3a2e22', '#4f3f2d', '#2a221a']), land: 1 });
  stampScorch(x, y, 0);
  if (j.n & 1 && STRAF.embers.length < 200) STRAF.embers.push({ x: Math.round(x), y: Math.round(y), t: 0 });
  j.last = { x, y, t: 0 };
  if (!G.demo && Math.random() < 0.3) SFX.mg();
}
// BOMB RUN: three bombs leave the jet; they fly on ahead and fall.
function dropBombs(j) {
  j.dropped = true;
  const [gx, gy] = jetGround(j);
  for (let k = 0; k < 3; k++) {
    const d = 34 + k * 24, sd = (k - 1) * 6;
    STRAF.bombs.push({ x0: gx, y0: gy, x1: gx + j.ux * d - j.uy * sd, y1: gy + j.uy * d + j.ux * sd, z0: j.alt, t: -k * 0.08, T: 0.55, a: Math.atan2(j.ux, -j.uy) });
  }
}
// A bomb lands: the big blast, and every zombie near it dies (brutes too).
function bombHit(x, y) {
  juiceBoom(x, y, false);
  addBoom(x, y - 2, 24, 8, 0.9, 11);
  queryEll(x, y, JETC.bombR, (z, d) => kill(z, 'he', x, y, d));
  if (!G.demo) {
    addShake(0.45);
    hitStop(0.04, 0.3);
    SFX.boom();
  }
}

// ---------- drawing (world layer)
// The shadows on the ground (under everything standing), south-east of each jet by its height.
function drawPlaneShadows() {
  if (STRAF.g !== G) return;
  drawEmbers();
  ctx.globalAlpha = thermal ? 0.2 : 0.3;
  for (const j of STRAF.jets) {
    const [gx, gy] = jetGround(j), i = jetIdx(j), sh = JET.sh[i];
    blit(sh, Math.round(gx + j.alt * SUNX - sh.width / 2), Math.round(gy + j.alt * SUNY - sh.height / 2));
  }
  for (const b of STRAF.bombs) {
    if (b.t < 0) continue;
    const u = b.t / b.T, x = lerp(b.x0, b.x1, u), y = lerp(b.y0, b.y1, u);
    ctx.fillStyle = '#000';
    ctx.fillRect(Math.round(x - 1), Math.round(y), 3, 2);
  }
  ctx.globalAlpha = 1;
}
// The holes the rounds dug glow white, then orange, then dull red as they cool.
function drawEmbers() {
  if (!STRAF.embers.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const e of STRAF.embers) {
    const u = e.t / 1.6;
    ctx.globalAlpha = (1 - u) * 0.9;
    ctx.fillStyle = u < 0.12 ? '#fff6e0' : u < 0.35 ? '#ffb347' : u < 0.65 ? '#e2552f' : '#9a3320';
    ctx.fillRect(e.x, e.y, u < 0.35 ? 2 : 1, u < 0.35 ? 2 : 1);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
const jetIdx = (j) => mod(Math.round(Math.atan2(j.ux, -j.uy) / TAU * JETC.N), JETC.N);
// The jets in the air (over the helis), their gun's flash and tracers, and the falling bombs.
function drawPlanes() {
  if (STRAF.g !== G) return;
  if (!STRAF.jets.length && !STRAF.bombs.length) return;
  for (const b of STRAF.bombs) {
    if (b.t < 0) continue;
    const u = b.t / b.T, x = lerp(b.x0, b.x1, u), y = lerp(b.y0, b.y1, u), zz = b.z0 * (1 - u * u);
    blit(JET.bomb, Math.round(x - 2), Math.round(y - zz - 3));
  }
  for (const j of STRAF.jets) {
    const [gx, gy] = jetGround(j), spr = JET.n[jetIdx(j)];
    blit(spr, Math.round(gx - spr.width / 2), Math.round(gy - j.alt - spr.height / 2));
  }
  // the gun: a big flickering flash at the nose, tracers down to where the rounds land
  ctx.globalCompositeOperation = 'lighter';
  for (const j of STRAF.jets) {
    const firing = j.s + JETC.lead > -JETC.len / 2 && j.s + JETC.lead < JETC.len / 2;
    if (!firing) continue;
    const [gx, gy] = jetGround(j), nx = gx + j.ux * 28, ny = gy + j.uy * 28 - j.alt;
    const f = 0.7 + 0.3 * Math.random();
    light(nx, ny, 18 * f, '#ffb060', 0.9);
    light(nx + j.ux * 6, ny + j.uy * 6, 9 * f, '#fff1c2', 1);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(nx) - 1, Math.round(ny) - 1, 3, 3);
    // the flash's cone, pointing ahead
    ctx.fillStyle = '#ffe2a0';
    for (let k = 2; k < 9; k++) ctx.fillRect(Math.round(nx + j.ux * k + rnd(-1, 1)), Math.round(ny + j.uy * k + rnd(-1, 1)), 2, 2);
  }
  // (one tracer a jet: its newest hit)
  for (const j of STRAF.jets) {
    const h = j.last;
    if (!h || h.t > 0.06) continue;
    const [gx, gy] = jetGround(j);
    ctx.globalAlpha = 0.8 * (1 - h.t / 0.06);
    pl(ctx, Math.round(gx + j.ux * 28), Math.round(gy + j.uy * 28 - j.alt), Math.round(h.x), Math.round(h.y), '#ffd27a');
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- the UI (screen px)
// The STRAFE card, after the Ram's (rx, ry = where that one went; y = the cards' row): Q in gold while
// a run is left, CLICK! while it waits for the map, USED when none are left. The bar = runs left.
function drawStrafeCard(rx, ry, y) {
  srSync();
  const C = STRAF.card;
  C.on = !!G.up.strafe && !G.demo;
  if (!C.on) return;
  let x = RAMCARD.on ? rx + RAMCARD.w + 4 : rx, cy = ry;
  if (x + C.w > W - 82) [x, cy] = ry === y ? [4, y - 30] : [x, ry];
  C.x = x;
  C.y = cy;
  const n = G.up.strafe, flying = STRAF.jets.length > 0;
  const tag = STRAF.arm ? 'CLICK!' : flying ? 'GO!' : STRAF.left ? 'Q' + (STRAF.left > 1 ? ' ×' + STRAF.left : '') : 'USED';
  const tc = STRAF.arm ? (Math.floor(realT * 8) % 2 ? '#ffe39a' : U.amber) : flying ? U.amber : STRAF.left ? U.gold : U.faint;
  card(x, cy, C.w, C.h, NICON.strafe, 'STRAFE', tag, tc, STRAF.left / n, STRAF.left ? '#ff9a3a' : '#3a3e48', STRAF.left || flying ? U.ink : U.faint);
  if (STRAF.arm) frame(x - 1, cy - 1, C.w + 2, C.h + 2, Math.floor(realT * 8) % 2 ? '#ffd36a' : '#b8862f');
  else if (STRAF.left && !flying) frame(x, cy, C.w, C.h, '#b8862f');
  if (mode === 'play' && !paused && inR(M.x, M.y, x, cy, C.w, C.h)) cursor = 'pointer';
  const m = STRAF.msg, mt = m ? realT - m.t : 9;
  if (mt < 2) {
    ctx.globalAlpha = clamp((2 - mt) / 0.4, 0, 1);
    text(m.s, clamp(x, 4, W - tw(m.s) - 4), cy - 10, U.amber);
    ctx.globalAlpha = 1;
  }
  if (STRAF.arm && mode === 'play' && !paused) drawStrafeAim();
}
// While it waits for the map: the band the jet will strafe through the mouse (or from the press
// along the drag), an arrow for its way, and what to do.
function drawStrafeAim() {
  if (!M.inside || M.y < 19 || inR(M.x, M.y, STRAF.card.x, STRAF.card.y, STRAF.card.w, STRAF.card.h)) return;
  cursor = 'crosshair';
  const a = STRAF.aim || { x: M.x, y: M.y }, [ux, uy] = STRAF.aim ? strafeDir(a.x, a.y, M.x, M.y) : strafeDir(a.x, a.y, a.x, a.y);
  const nx = -uy, ny = ux, L = JETC.len / 2, hw = (G.up.strafeW || JETC.half) * (G.up.twin ? 2 : 1) + (G.up.twin ? 2 : 0);
  const on = Math.floor(realT * 6) % 2 ? 0.9 : 0.6;
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = '#ff9a3a';
  ctx.beginPath();
  ctx.moveTo(a.x - ux * L + nx * hw, a.y - uy * L + ny * hw);
  ctx.lineTo(a.x + ux * L + nx * hw, a.y + uy * L + ny * hw);
  ctx.lineTo(a.x + ux * L - nx * hw, a.y + uy * L - ny * hw);
  ctx.lineTo(a.x - ux * L - nx * hw, a.y - uy * L - ny * hw);
  ctx.fill();
  // the edges as dashes of pixels, and the arrow
  ctx.globalAlpha = on;
  ctx.fillStyle = '#ffb060';
  for (let s = -L; s <= L; s += 4) for (const sd of [-1, 1]) ctx.fillRect(Math.round(a.x + ux * s + nx * hw * sd), Math.round(a.y + uy * s + ny * hw * sd), 2, 1);
  for (let k = 0; k < 7; k++) {
    const s = L + 2 - k, w = k * 0.8;
    ctx.fillRect(Math.round(a.x + ux * s - nx * w), Math.round(a.y + uy * s - ny * w), Math.max(1, Math.round(w * 2)), 1);
  }
  ctx.globalAlpha = 1;
  const t = STRAF.aim ? 'LET GO: STRAFE' : 'CLICK: STRAFE HERE.  DRAG: AIM IT.', w = tw(t);
  text(t, Math.round(clamp(M.x, w / 2 + 3, W - w / 2 - 3)), Math.round(Math.min(M.y + 12, H - 44)), '#ffb060', { align: 'center' });
}

// main.js - input (mouse, keys, wheel), the camera mode, the main loop (fixed steps with hit-stop)
// and the start-up (the save is read first). window.__sr is a small API for tests and the browser
// console.

// ---------- camera mode
function setThermal(k) {
  thermal = k;
  if (mode === 'play' || mode === 'ending') banner('CAMERA', CAMS[thermal], thermal ? '#e8e8e8' : U.ink, 3);
}

// ---------- input
// Browser pointer position -> game pixels.
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
  M.right = !!(e.buttons & 2);
});
cv.addEventListener('pointerleave', () => { M.inside = false; });
cv.addEventListener('pointerdown', (e) => {
  audioInit();
  try { cv.focus({ preventScroll: true }); } catch (_) { /* old browsers */ }
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
  if (e.button === 2) {
    M.right = true;
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* release still reaches the window */ }
    if (mode === 'depot') M.rpressed = true;
    if (mode === 'play' && !paused && strafeCancel()) return;
    if (mode === 'play' && !paused && p.y >= 19) heliRight(p.x, p.y);
    return;
  }
  if (e.button !== 0) return;
  // the Strafing Run's card, and its aim on the map (planes.js)
  if (mode === 'play' && !paused && strafeDown(p.x, p.y)) return;
  // a click on the Turbo Ram's card rams (it does not fire the 25mm)
  if (mode === 'play' && !paused && RAMCARD.on && inR(p.x, p.y, RAMCARD.x, RAMCARD.y, RAMCARD.w, RAMCARD.h)) {
    tryRam();
    return;
  }
  // with reduced motion, PRESS E! stops the game: a click on the field goes on without the Ram
  M.down = true;
  M.pressed = true;
  M.px = p.x;
  M.py = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* fine without */ }
  if (mode === 'summary' && realT - sumStart > 0.6) sumSkip();
  if (mode !== 'play' || p.y < 19) return;
  // a click on the field goes on after a pause; otherwise it selects helis (helis.js)
  if (paused) {
    if (!pauseHit(p.x, p.y)) {
      setPaused(false);
      M.used = true;
    }
  } else heliDown(p.x, p.y, e.shiftKey);
});
cv.addEventListener('pointerup', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.right = !!(e.buttons & 2);
  if (e.button !== 0) return;
  if (M.down) {
    M.down = false;
    M.released = true;
  }
  if (mode === 'play' && !paused && strafeUp(p.x, p.y)) return;
  if (mode === 'play' && !paused) heliUp(p.x, p.y);
  else HUI.box = null;
});
cv.addEventListener('pointercancel', () => {
  M.down = M.right = false;
  if (G) G.trigger = false;
});
cv.addEventListener('lostpointercapture', () => { M.right = false; });
// A release can land outside the canvas, or arrive as a move when another button stays held.
addEventListener('pointerup', (e) => { if (!(e.buttons & 2)) M.right = false; });
addEventListener('pointermove', (e) => { if (!(e.buttons & 2)) M.right = false; });
addEventListener('pointercancel', () => { M.right = false; });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
// the wheel zooms in and out one step (bigger or smaller pixels)
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  // (over the skill tree it zooms the tree)
  if (treeCovers()) {
    treeWheel(e.deltaY);
    return;
  }
  const z = clamp(zoomStep + (e.deltaY < 0 ? 1 : -1), -1, 1);
  if (z !== zoomStep) {
    zoomStep = z;
    onResize();
  }
}, { passive: false });

// KEYS[k] = true while key k is held.
const KEYS = {};
const keyName = (e) => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = keyName(e);
  if (k === ' ' || k === 'Tab' || k.startsWith('Arrow')) e.preventDefault();
  KEYS[k] = true;
  if (e.repeat) return;
  audioInit();
  if (k === 'm') {
    Au.muted = !Au.muted;
    droneLevel = -1;
    if (Au.muted) SFX.ramStop(0.05);
    return;
  }
  if (k === 't') {
    setThermal((thermal + 1) % 3);
    return;
  }
  if (mode === 'play') {
    // (with reduced motion PRESS E! stops the game: any other key goes on without the Ram)
    if (k === 'e') { if (!paused) tryRam(); }
    else if (k === 'q') { if (!paused) tryStrafe(); }
    else if (k === 'Escape' || k === 'p') setPaused(!paused);
    else if (!paused) heliKey(k);
  } else if (mode === 'title') {
    if (k === 'Enter' || k === ' ') titleGo();
    else if (k === 'Escape') titleAsk = false;
  } else if (mode === 'depot') depotKey(k);
  else if (mode === 'summary') {
    // ENTER or ESC: show it all, then go to the Depot, after the opening moment.
    if ((k === 'Enter' || k === 'Escape') && realT - sumStart > 0.6 && !sumSkip()) toDepot();
  }
});
addEventListener('keyup', (e) => { KEYS[keyName(e)] = false; });
// Pause a run or go on: the trigger is let go. The Turbo Ram's roar stops on pause and comes back
// (for the time the Ram has left) on going on.
function setPaused(p) {
  if (p === paused) return;
  paused = p;
  if (G) G.trigger = false;
  if (p) SFX.ramStop(0.15);
  else if (G && G.ram.on && !G.demo && mode === 'play') SFX.roar(G.ram.dur + CFG.ram.ease - G.ram.t, false);
}
// pause when the window loses focus or the tab is hidden; let go of every key and the trigger
function lostFocus() {
  for (const k in KEYS) KEYS[k] = false;
  if (G) G.trigger = false;
  M.down = M.right = false;
  if (mode === 'play') setPaused(true);
}
addEventListener('blur', lostFocus);
// the page is closed or left in the middle of a run: what the run earned so far is kept
addEventListener('pagehide', () => {
  if (mode === 'play' || mode === 'ending') bankRun();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) lostFocus(); });
function onResize() {
  if (resize()) {
    bakeOverlays();
    if (G) placeCamera();
  }
}
addEventListener('resize', onResize);

// ---------- main loop
// last = time of the last frame, acc = game time still to step. FPS = stats for the debug API.
// hold = time stands still (tests take close-up pictures this way)
let last = performance.now(), acc = 0, droneLevel = -1, hold = false;
// tests: a skill tree node the mouse stays on (__sr.hoverNode), even while the window settles
let testHover = null;
const FPS = { n: 0, sum: 0, worst: 0, t: 0, avg: 0, lastWorst: 0 };
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = (now - last) / 1000;
  last = now;
  FPS.n++;
  FPS.sum += rdt;
  FPS.worst = Math.max(FPS.worst, rdt);
  FPS.t += rdt;
  if (FPS.t > 1) {
    FPS.avg = FPS.n / FPS.sum;
    FPS.lastWorst = FPS.worst;
    FPS.n = FPS.sum = FPS.worst = FPS.t = 0;
  }
  oneFrame(Math.min(0.1, Math.max(0, rdt)));
}
// One frame of dt seconds: the game steps, the camera, the sound, the drawing, then the mouse
// clicks are used up.
function oneFrame(dt) {
  realT += dt;
  frameDt = dt;
  // hit-stop: slow motion while slowT lasts
  let ts = 1;
  if (slowT > 0) {
    slowT -= dt;
    ts = slowK;
    if (slowT <= 0) slowK = 1;
  }
  // fixed steps of STEP seconds, at most 8 a frame
  if (!(mode === 'play' && paused) && !hold && !treeCovers()) {
    acc += dt * ts;
    let n = 0;
    try {
      while (acc >= STEP && n < 8) {
        step(STEP);
        acc -= STEP;
        n++;
      }
    } catch (err) {
      acc = 0;
      if (!loop.errs) {
        loop.errs = 1;
        console.error(err);
      }
    }
    if (n >= 8) acc = 0;
  }
  // the view's lead glides in real time, also while time runs slow or stands still
  camLead(dt);
  placeCamera();
  updateCam(dt);
  G.shownCash = Math.abs(G.shownCash - G.cash) < 1 ? G.cash : lerp(G.shownCash, G.cash, 1 - Math.exp(-10 * dt));
  // the engine hum: loud in play, quiet behind the menus, higher while the Turbo Ram runs
  const live = mode === 'play' && !paused, dl = live ? 1 : mode === 'ending' ? 0.7 : 0.4;
  const dk = live && !G.demo ? Math.round(ramK() * 4) / 4 : 0;
  if (Au.ctx && dl + dk * 10 !== droneLevel) {
    droneLevel = dl + dk * 10;
    drone(dl, dk);
  }
  cursor = 'default';
  if (testHover && mode === 'depot') {
    const p = nodeXY(testHover);
    M.x = p.x;
    M.y = p.y;
    M.inside = true;
  }
  try {
    tutFrame(dt);
    render();
    drawUI();
    drawFade();
  } catch (err) {
    if (!loop.rerr) {
      loop.rerr = 1;
      console.error(err);
    }
  }
  cv.style.cursor = cursor;
  M.pressed = false;
  M.released = false;
  M.used = false;
  M.rpressed = false;
}

// ---------- start
function boot() {
  initSprites();
  bakeScorch();
  resize();
  bakeStatic();
  bakeOverlays();
  loadSave();
  newGame(true);
  mode = 'title';
  window.__sr = {
    get G() { return G; },
    get mode() { return mode; },
    get SAVE() { return SAVE; },
    FPS,
    CFG,
    // the horde by distance (rows of HORDE in game.js), for balance tests
    HORDE,
    // the sprites, for a test sheet
    art: () => ({ TRAIN, FOOT, HSPR, ROTOR, STATION, SURV, ZS, ICON, TURRET }),
    // start(): ride the next leg; start(n) selects a leg for tests.
    start: (n) => startGame(n),
    title: toTitle,
    // depot(tab): the Depot screen with its tree tab open
    depot: (tab) => toDepot(tab || 'tree'),
    // sim(sec): run the game for sec seconds at once, without drawing
    sim: (sec) => {
      const n = Math.round(sec / STEP);
      for (let i = 0; i < n; i++) {
        step(STEP);
        camLead(STEP);
      }
    },
    aim: (x, y) => {
      M.x = x;
      M.y = y;
      M.inside = true;
    },
    trigger: (on) => { G.trigger = !!on && mode === 'play'; },
    he: () => tryHE(),
    thermal: (k) => setThermal(k),
    // hp(v): set health. jump(px): move to px before this leg's goal; leave the dead behind.
    hp: (v) => { G.tr.hp = G.tr.hpShown = v; },
    jump: (px) => {
      const to = G.goalS + Math.max(0, Number(px) || 0);
      G.tr.s = Math.min(G.tr.s, to);
      for (const z of G.zombies) z.gone = true;
      layoutTrain();
      placeCamera();
    },
    // km(x): move within this leg without paying. Arrival still goes through braking.
    km: (x) => {
      if (G.demo) return;
      const s = clamp(sAtKm(x), G.goalS, G.tr.startS), tr = G.tr;
      tr.s = s;
      tr.fy = yOfS(s);
      for (const w of G.walls) if (w.s > s) w.placed = w.warned = w.awake = true;
      for (const z of G.zombies) z.gone = true;
      G.maxKm = Math.max(G.maxKm, kmAt(s));
      layoutTrain();
      placeCamera();
    },
    // lose(): the train breaks now (the summary follows 3.4 s later)
    lose: () => { if (mode === 'play' && !G.result) lose(); },
    keys: (k, on) => { KEYS[k] = !!on; },
    // hit(z, dmg, cause): zombie z takes dmg (default 1) as from a gun ('mg', or 'gun' = the flatcar gun)
    hit: (z, dmg, cause) => hitZombie(z, dmg || 1, cause || 'mg'),
    // spawn(type, sx, sy): a zombie standing still at screen pixel (sx, sy): 0 walker, 1 runner, 2 brute
    spawn: (type, sx, sy) => {
      const z = makeZombie(G.camX + sx, G.camY + sy, type | 0);
      z.sp = 0;
      G.zombies.push(z);
      return z;
    },
    // press(k): a key goes down and up, as if typed (k = 'Enter', 'Tab', 'Escape', 'a'...)
    press: (k) => {
      dispatchEvent(new KeyboardEvent('keydown', { key: k }));
      dispatchEvent(new KeyboardEvent('keyup', { key: k }));
    },
    // hover(x, y) / click(x, y): the mouse over / a full click at game pixel (x, y); click draws
    // one frame so the button under it acts at once
    hover: (x, y) => {
      testHover = null;
      M.x = x;
      M.y = y;
      M.inside = true;
    },
    click: (x, y) => {
      M.x = M.px = x;
      M.y = M.py = y;
      M.inside = true;
      M.down = false;
      M.pressed = M.released = true;
      M.used = false;
      if (mode === 'summary') sumSkip();
      render();
      drawUI();
      M.pressed = M.released = false;
    },
    // frames(n, dt): n whole frames of dt s (default 1/60) at once, as the main loop runs them
    // (the clock, the game, the drawing, the clicks). Headless pages barely run their own frames.
    frames: (n, dt) => {
      for (let i = 0; i < (n || 1); i++) oneFrame(dt || 1 / 60);
    },
    // the Turbo Ram: ram() = press E (true when it starts), ramCharge(v) = fill it to v (0..1);
    // ramState() = 'none', 'lock', 'on', 'stop', 'charge' or 'ready'
    ram: () => tryRam(),
    ramCharge: (v) => {
      G.ram.left = Math.round((1 - clamp(+v || 0, 0, 1)) * CFG.ram.charge);
      return ramCharge();
    },
    ramState: () => ramState(),
    // sound: roar = the Ram's roar is playing (or set to play), ctx = the audio is on
    sound: () => ({ ctx: !!Au.ctx, roar: !!Au.roar, muted: Au.muted }),
    // bot(on): the autopilot plays (it aims and pulls the triggers)
    bot: (on) => { G.bot = !!on; if (!on) G.trigger = false; },
    pause: (p) => setPaused(!!p),
    hold: (h) => { hold = !!h; },
    // the save: give(scrap, surv, gold) adds money,
    // save() is a copy of it, load() reads it again from storage, reset() wipes it (to the title)
    give: (scrap, surv, gold) => {
      for (const [key, value] of [['scrap', scrap], ['surv', surv], ['gold', gold]]) {
        const amount = typeof value === 'number' && Number.isFinite(value) ? Math.trunc(value) : 0;
        SAVE[key] = clamp(SAVE[key] + amount, 0, Number.MAX_SAFE_INTEGER);
      }
      saveSave();
      return { scrap: SAVE.scrap, surv: SAVE.surv, gold: SAVE.gold };
    },
    // the skill tree: node(id, l) sets a level (no price), buy(id) buys one level as a click does
    // (true when bought), nodeAt(id) = where the node is on screen with the tree tab open,
    // hoverNode(id) puts the mouse on it, clickNode(id) clicks it, tree() = each node's level and state
    node: (id, l) => setNode(id, l),
    buy: (id) => buyNode(id),
    nodeAt: (id) => nodeXY(id),
    hoverNode: (id) => {
      testHover = NODE[id] ? id : null;
      const p = nodeXY(id);
      if (p) {
        M.x = p.x;
        M.y = p.y;
        M.inside = true;
      }
      return p;
    },
    clickNode: (id) => {
      const p = nodeXY(id);
      if (p) window.__sr.click(p.x, p.y);
      return p;
    },
    tree: () => Object.fromEntries(NODES.map((n) => [n.id, lv(n.id) + ' ' + nodeState(n)])),
    goal: () => summaryGoal(),
    // infoFit() = the info box lines that do not fit on one line of the box, at any level (none is
    // right), and the widest line's width next to the room there is
    infoFit: () => {
      const bad = [], inner = INFO_W - 14;
      let widest = 0;
      for (const n of NODES) {
        widest = Math.max(widest, tw(n.desc));
        if (tw(n.desc) > inner) bad.push(n.id + ': ' + n.desc);
        for (const s of [n.stat, n.stat2].filter(Boolean)) {
          for (let l = 0; l <= maxLv(n); l++) {
            const w = statSegs(s, l, l >= maxLv(n)).reduce((a, [t]) => a + tw(t) + 5, -5);
            widest = Math.max(widest, w);
            if (w > inner) bad.push(n.id + ' LV ' + l + ': ' + w);
          }
        }
      }
      return { bad, widest, inner };
    },
    save: () => JSON.parse(JSON.stringify(SAVE)),
    load: () => loadSave(),
    reset: () => {
      newSave();
      titleAsk = false;
      toTitle();
    },
    // bench(n): draw n frames at once; the average ms per frame
    bench: (n) => {
      const t = performance.now();
      for (let i = 0; i < n; i++) {
        render();
        drawUI();
      }
      return (performance.now() - t) / n;
    },
    stats: () => ({
      mode, result: G.result, km: G.demo ? 0 : +DK().toFixed(3), kills: G.kills, cash: Math.floor(G.cash), runSurv: G.surv,
      scrap: SAVE.scrap, survivors: SAVE.surv, gold: SAVE.gold, leg: G.leg, runs: SAVE.runs,
      pay: Object.assign({}, G.pay), hp: Math.round(G.tr.hp), max: G.tr.max, speed: +G.tr.v.toFixed(1),
      onTrain: G.onTrain, t: +G.run.toFixed(1), zombies: G.zombies.length, bodies: G.bodies.length, up: Object.assign({}, G.up),
      shots: G.shots, scavPaid: G.scavPaid, overheat: G.overheat, heReload: +G.heReload.toFixed(2), hurt: Object.assign({}, G.hurt),
      station: G.station ? G.station.id + ' ' + G.station.state : '-',
      walls: G.walls.map((w) => w.km + (w.awake ? ' awake' : w.placed ? ' placed' : ' ahead')),
      helis: G.helis.map((h) => [Math.round(h.x - G.tr.fx), Math.round(h.y - G.tr.fy)]),
      rounds: G.rounds.length, parts: parts.length, texts: texts.length, chunks: GROUND.size, decals: DECALS.size,
      W, H, SCALE, fps: Math.round(FPS.avg), worstMs: Math.round(FPS.lastWorst * 1000), heat: +G.heat.toFixed(2),
      gun: { rate: G.up.gun, shots: G.gun.shots, kills: G.gun.kills, ang: +G.gun.ang.toFixed(2), tgt: G.gun.tgt ? G.gun.tgt.st : -1 },
      ram: { state: ramState(), on: G.ram.on, t: +G.ram.t.toFixed(2), charge: +ramCharge().toFixed(3), kills: G.ram.kills, pay: G.ram.pay,

// loot.js - the finds you fly out from the train for: scrap piles on car wrecks, supply crates in
// burnt farms (kept for the coming leg events), the golden
// crate (once per save) and the stranded survivor on a bus roof (SOS, once per save, after Farm Stop
// is held) that the Winch lifts. Any heli that flies over a find (right click it to send one) takes
// it: it flies up to that heli and pays. G.loot = this run's finds, rolled in newGame().

// pile: one spot every `every` px along the rails (100 m), `fill` of them have a pile (rolled again
// each run), `near` to `far` px from the rails. crate: its guards, how near the heli wakes them,
// how near the heli its edge arrow shows, how far along the rails ahead of the train its guards are
// placed. gold / sos: km, px from the rails, side (1 east, -1 west), how near the heli their arrow
// shows. sos.reach = px the heli must hover within for the Winch. fly = seconds a find takes to fly
// up to the heli. Past farKm (Farm Stop) piles and crates pay payFar. clear = no pile within this
// many px along the rails of a stop (so none lies in a station's grid).
const LOOT = {
  pile: { every: 200, fill: 0.6, near: 80, far: 250, pay: 15, payFar: 30 },
  crate: { pay: 50, payFar: 100, guards: 8, wake: 120, arrow: 450, place: 500 },
  gold: { km: 0.32, off: 250, side: -1, pay: 150, arrow: 700 },
  sos: { km: 1.2, off: 220, side: 1, reach: 20, arrow: 700 },
  fly: 0.3, farKm: 1, clear: 180
};
// the supply crates: [km, px from the rails, side]
const CRATES = [[0.12, 240, 1], [0.58, 250, -1], [1.30, 250, -1], [1.55, 240, 1], [1.90, 250, -1]];
// the find sprites (drawn once, on the first run)
const LART = {};

  LART.bus = prop(pix(40, 16, (r) => {

    r(1, 0, 38, 6, '#d9a636'); r(1, 0, 38, 1, '#f0c85a'); r(38, 1, 1, 5, '#8a6418');

    r(12, 1, 6, 2, '#8a5a1c'); r(26, 3, 5, 2, '#6a3a18'); r(5, 11, 3, 2, '#6a3a18');

// A point px from the rails at km k, on side (1 east, -1 west): {x, y, s}
function lootBeside(k, px, side) {
  const s = sAtKm(k), y = yOfS(s), fp = trackSlope(y), c = 1 / Math.sqrt(1 + fp * fp);
  return { x: Math.round(trackX(y) + c * px * side), y: Math.round(y - fp * c * px * side), s };
}
// Tell the tutorial (when it is built in).
function lootTut(name, data) {
  if (typeof tutEvent === 'function') tutEvent(name, data || {});
}
// A find of kind 'pile', 'crate', 'gold' or 'sos' at km k: its props stand in G.statics.
function addFind(kind, k, px, side, pay) {
  const p = lootBeside(k, px, side), f = { kind, km: k, off: px, side, x: p.x, y: p.y, s: p.s, pay, gone: false, seen: false, t: Math.random() * 6, props: [] };
  const put = (d, x, y) => {
    const o = { d, x: Math.round(x), y: Math.round(y), k: Math.round(y) };
    G.statics.push(o);
    f.props.push(o);
    return o;
  };
  if (kind === 'pile') {
    put(Math.random() < 0.5 ? PROPS.wreck[(Math.random() * PROPS.wreck.length) | 0] : PROPS.burnt[0], f.x - 9 * side, f.y - 3);
    f.top = put(LART.heap, f.x, f.y);
  } else if (kind === 'crate') {
    // a burnt farm: broken walls, a burnt car, a barrel
    put(PROPS.wall[0], f.x - 24, f.y - 14);
    put(PROPS.wall[3], f.x + 20, f.y - 18);
    put(PROPS.wall[5], f.x - 30, f.y + 12);
    put(PROPS.burnt[1], f.x + 26, f.y + 8);
    put(PROPS.barrel[0], f.x + 12, f.y - 6);
    f.top = put(LART.crate, f.x, f.y);
    f.zs = [];
  } else if (kind === 'gold') f.top = put(LART.gold, f.x, f.y);
  else {
    f.top = put(LART.bus, f.x, f.y);
    f.stage = 'wait';
    f.w = 0;
  }
  G.loot.push(f);
  return f;
}
// Roll this run's finds: the fixed ones, then the piles (from a seed that changes every run).
function rollLoot() {
  lootArt();
  G.loot = [];
  G.lootFly = [];
  const rng = mulberry(hash32(SAVE.runs * 7919 + 101)), k0 = kmAt(G.tr.startS), k1 = kmAt(G.goalS), c = LOOT.pile;
  const gate = (k) => k > k0 && k < k1;
  if (!SAVE.flags.gold && gate(LOOT.gold.km)) addFind('gold', LOOT.gold.km, LOOT.gold.off, LOOT.gold.side, LOOT.gold.pay);
  if (!SAVE.flags.sos && gate(LOOT.sos.km)) addFind('sos', LOOT.sos.km, LOOT.sos.off, LOOT.sos.side, 0);
  const stops = [0].concat(STATIONS.map((d) => d.km)), fixed = G.loot.slice();
  for (let i = Math.floor(k0 * CFG.line.km / c.every) + 1; i * c.every < k1 * CFG.line.km; i++) {
    const k = i * c.every / CFG.line.km, side = rng() < 0.5 ? -1 : 1, px = Math.round(lerp(c.near, c.far, rng())), on = rng() < c.fill;
    if (!on || !gate(k) || stops.some((sk) => Math.abs(sk - k) * CFG.line.km < LOOT.clear)) continue;
    const p = lootBeside(k, px, side);
    if (fixed.some((f) => Math.hypot(f.x - p.x, f.y - p.y) < 70)) continue;
    addFind('pile', k, px, side, k > LOOT.farKm ? c.payFar : c.pay);
  }
}
// The middle of the view (less the camera's lead): how far the edge arrows reach is counted from it
const LG = [0, 0];
function heliGround() {
  LG[0] = G.camX + W / 2 - G.lead[0];
  LG[1] = G.camY + H / 2 - G.lead[1];
  return LG;
}
// The heli nearest find f, and how far its ground point is from it: [heli, px]
function lootHeli(f) {
  let best = null, bd = 1e9;
  for (const h of G.helis) {
    const d = Math.hypot(f.x - h.x, f.y - h.y);
    if (d < bd) { bd = d; best = h; }
  }
  return [best, bd];
}

// ---------- each step
function updateLoot(dt) {
  if (!G.loot) return;
  const live = mode === 'play' && !G.result;
  for (const f of G.loot) {
    if (f.gone && f.kind !== 'sos') continue;
    f.t += dt;
    const [h, d] = lootHeli(f);
    if (!f.seen && live && (!offView(f.x, f.y, -12) || (f.kind !== 'pile' && d < (LOOT[f.kind].arrow || 0)))) {
      f.seen = true;
      lootTut(f.kind + '_seen', f.kind === 'sos' ? { winch: !!G.up.winch } : { x: f.x, y: f.y });
    }
    if (f.kind === 'crate') crateStep(f, d, dt);
    if (f.kind === 'sos') {
      sosStep(f, d, dt, live, h);
      continue;
    }
    if (live && d <= G.up.pickup) takeLoot(f, h);
  }
  // finds flying up to the heli; they pay when they get there
  for (let i = G.lootFly.length - 1; i >= 0; i--) {
    const q = G.lootFly[i];
    q.t += dt;
    if (q.t >= q.T) {
      G.lootFly.splice(i, 1);
      if (q.f) lootPaid(q.f, q.h);
    }
  }
}
// A find is taken by heli h: it flies up to it (the pile's heap or the crate leaves the ground).
function takeLoot(f, h) {
  f.gone = true;
  const i = G.statics.indexOf(f.top);
  if (i >= 0) G.statics.splice(i, 1);
  G.lootFly.push({ f, h: h || G.helis[0], spr: f.top.d, x0: f.x, y0: f.y, t: 0, T: LOOT.fly });
  juicePop(f.x, f.y, f.kind !== 'pile');
  SFX.lootUp();
}
// It reached heli h: the pay, a chime, coins to the counter.
function lootPaid(f, h) {
  const gx = h.x, gy = h.y - h.alt + 14, big = f.kind !== 'pile';
  const pay = payLootScrap(f.pay);
  if (pay > 0) addTotal(gx, gy - 14, pay, U.blue, scrapPopScale(big));
  coinPop(gx, gy, f.kind === 'gold' ? 16 : big ? 8 : 4);
  const n = f.kind === 'gold' ? 14 : big ? 7 : 4;
  currencyCoins('scrap', gx, gy, n);
  if (f.kind === 'gold') {
    SFX.golden();
    for (let k = 0; k < 26; k++) part({ x: gx, y: gy, z: 12, vx: rnd(-50, 50), vy: rnd(-30, 30), vz: rnd(30, 90), g: 160, life: rnd(0.6, 1.1), max: 1.1, s: 1,
      c: pick(['#ffd36a', '#fff1c2', '#e3b04b']), add: true, drag: 1 });
    rings.push({ x: gx, y: gy, r0: 4, r1: 40, t: 0, T: 0.45, c: '#ffd36a', w: 2 });
    SAVE.flags.gold = true;
    bankRun();
  } else if (f.kind === 'crate') SFX.crate();
  else SFX.coin();
  lootTut(f.kind + '_taken', { pay });
}
// The guards: placed when the train comes near, standing still until the heli is close (or one of
// them is shot).
function crateStep(f, d, dt) {
  const ds = G.tr.s - f.s;
  if (!f.placed && ds < LOOT.crate.place && ds > -300) {
    f.placed = true;
    for (let k = 0; k < LOOT.crate.guards; k++) {
      const a = k / LOOT.crate.guards * TAU + rnd(-0.3, 0.3), r = rnd(16, 32);
      const z = makeZombie(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r * FORE, 0);
      z.still = true;
      z.sp = rnd(5, 7);
      z.guard = true;
      G.zombies.push(z);
      f.zs.push(z);
    }
  }
  if (f.placed && !f.awake && (d < LOOT.crate.wake || f.zs.some((z) => z.dead || z.flash > 0))) {
    f.awake = true;
    for (const z of f.zs) z.still = false;
  }
  // a column of green smoke while it is near the view
  if (!f.gone && Math.abs(f.x - G.camX - W / 2) < W && Math.abs(f.y - G.camY - H / 2) < H) {
    f.smoke = (f.smoke || 0) - dt;
    if (f.smoke <= 0) {
      f.smoke = 0.12;
      part({ x: f.x + rnd(-1, 1), y: f.y - 2, z: 7, vx: rnd(-1.5, 1.5) + 2, vy: 0, vz: rnd(20, 26), g: 0, life: rnd(1.8, 2.3), max: 2.3, s: 2,
        c: pick(['rgba(120,230,110,0.62)', 'rgba(90,190,90,0.55)']), grow: 3, drag: 0.45, smoke: true });
    }
  }
}
// The stranded survivor: a flare every 6 s. The built-in winch needs about 2 s of hovering
// (leaving starts it again): the rope drops, they grab it and swing up under that heli: +1 survivor.
function sosStep(f, d, dt, live, h) {
  if (f.stage === 'done') return;
  if (f.stage === 'wait') {
    if (f.t >= 6) {
      f.t = 0;
      if (Math.abs(f.x - G.camX - W / 2) < W * 1.5 && Math.abs(f.y - G.camY - H / 2) < H * 1.5) SFX.flare();
    }
    if (live && !f.near && d < 70) {
      f.near = true;
      lootTut('sos_near', { winch: !!G.up.winch });
    }
    if (live && G.up.winch && d <= LOOT.sos.reach) {
      f.h = h;
      f.w += dt;
      if (f.w >= CFG.winch.hover) {
        f.stage = 'rope';
        f.u = 0;
        SFX.winch();
      }
    } else f.w = 0;
    return;
  }
  f.u += dt;
  if (f.stage === 'rope' && f.u >= 0.45) {
    f.stage = 'lift';
    f.u = 0;
    SFX.saved();
  } else if (f.stage === 'lift' && f.u >= 1.6) {
    f.stage = 'done';
    f.gone = true;
    G.surv++;
    SAVE.flags.sos = true;
    bankRun();
    const q = f.h;
    G.lootFly.push({ surv: true, x0: q.x - G.camX, y0: q.y - q.alt - G.camY + 8, t: 0, T: 0.8 });
    floatText(q.x, q.y - q.alt, '+1 SURVIVOR', U.green);
    lootTut('sos_lifted');
  }
}

// ---------- drawing (world layer, after everything on the ground)
function drawLoot() {
  if (!G.loot) return;
  const [gx, gy] = heliGround(), x0 = G.camX - 60, x1 = G.camX + W + 60, y0 = G.camY - 40, y1 = G.camY + H + 120;
  for (const f of G.loot) {
    if (f.x < x0 || f.x > x1 || f.y < y0 || f.y > y1) continue;
    if (f.kind === 'pile' && !f.gone) {
      // a white glint every 1.2 s
      const u = (realT + f.km * 7) % 1.2;
      if (u < 0.24) {
        const a = u < 0.08 || u > 0.16 ? 2 : 3, x = f.x + 1, y = f.y - 7;
        ctx.globalCompositeOperation = 'lighter';
        light(x, y, 7, '#fff1c2', 0.5);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - a, y, a * 2 + 1, 1);
        ctx.fillRect(x, y - a, 1, a * 2 + 1);
      }
    } else if (f.kind === 'gold' && !f.gone) {
      // a beam of gold light up from the crate
      const p = 0.75 + Math.sin(realT * 3) * 0.25;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#ffd36a';
      for (let z = 0; z < 120; z += 2) {
        const k = 1 - z / 120;
        ctx.globalAlpha = 0.22 * k * p;
        ctx.fillRect(f.x - 3, f.y - 8 - z, 7, 2);
        ctx.globalAlpha = 0.45 * k * p;
        ctx.fillRect(f.x - 1, f.y - 8 - z, 3, 2);
      }
      light(f.x, f.y - 5, 20, '#ffd36a', 0.55 * p);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if ((realT * 2 | 0) % 2 === 0) text('GOLD', f.x, f.y - 26, '#ffd36a', { align: 'center' });
    } else if (f.kind === 'sos' && f.stage !== 'done') drawSOS(f, gx, gy);
  }
  // finds flying up to the heli that took them
  for (const q of G.lootFly) {
    if (q.surv) continue;
    const u = q.t / q.T, e = u * u, x = lerp(q.x0, q.h.x, e), y = lerp(q.y0, q.h.y - q.h.alt + 6, e);
    ctx.globalAlpha = 1 - u * 0.6;
    blit(q.spr.spr, Math.round(x - q.spr.ax), Math.round(y - q.spr.ay));
    ctx.globalAlpha = 1;
  }
}
// The bus with the survivor waving on its roof, the flare, the label, the Winch circle and the rope.
function drawSOS(f, gx, gy) {
  const sv = SURV[2], wave = (realT * 4 | 0) % 2;
  // the flare: up fast, then it hangs and falls slowly, red and bright
  if (f.stage === 'wait' && f.t < 3.2) {
    const t = f.t, z = t < 0.6 ? t / 0.6 * 80 : 80 - (t - 0.6) * 9, a = t < 2.6 ? 1 : (3.2 - t) / 0.6;
    ctx.globalCompositeOperation = 'lighter';
    light(f.x + 2, f.y - 14 - z, 26, '#ff4a32', 0.8 * a);
    light(f.x + 2, f.y - 14 - z, 5, '#fff1c2', 0.9 * a);
    ctx.fillStyle = '#ff6a4a';
    for (let k = 4; k < Math.min(z, 40); k += 3) {
      ctx.globalAlpha = 0.35 * a * (1 - k / 40);
      ctx.fillRect(Math.round(f.x + 2), Math.round(f.y - 14 - z + k), 1, 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (t < 0.6 && Math.random() < 0.5) part({ x: f.x + 2, y: f.y, z: 14 + z, vx: rnd(-3, 3), vy: 0, vz: 0, g: 0, life: 0.8, max: 0.8, s: 1,
      c: 'rgba(200,190,180,0.5)', grow: 2, drag: 1, smoke: true });
  }
  // the Winch circle on the ground round the survivor: it fills while a heli hovers in it
  const [hh, near] = lootHeli(f);
  if (f.stage === 'wait' && G.up.winch && near < 90) {
    const R = LOOT.sos.reach, n = 40, fill = f.w / CFG.winch.hover;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU - Math.PI / 2;
      ctx.fillStyle = i / n < fill ? '#ffffff' : 'rgba(255,255,255,0.35)';
      ctx.fillRect(Math.round(f.x + Math.cos(a) * R), Math.round(f.y + Math.sin(a) * R * FORE), 1, 1);
    }
    if (fill > 0) text(Math.round(fill * 100) + '%', f.x, f.y + 12, '#ffffff', { align: 'center' });
  }
  // the survivor: on the roof, on the rope from the heli's belly, or swinging up under it
  let sx = f.x + 2, sy = f.y - 14, k = 1;
  const lh = f.h || hh, ax = Math.round(lh.x), ay = Math.round(lh.y - lh.alt + 2);
  if (f.stage === 'lift') {
    const u = ease(f.u / 1.6);
    sx = lerp(f.x + 2, ax, u) + Math.sin(f.u * 5) * 10 * (1 - u);
    sy = lerp(f.y - 14, ay + 9, u);
  }
  if (f.stage === 'rope' || f.stage === 'lift') {
    const e = f.stage === 'rope' ? Math.min(1, f.u / 0.45) : 1;
    pl(ctx, ax, ay, Math.round(lerp(ax, sx, e)), Math.round(lerp(ay, sy - 8 * k, e)), '#d6cdb6');
    ctx.fillStyle = '#8b919c';
    ctx.fillRect(ax - 1, ay - 1, 3, 2);
  }
  blit(thermal ? sv.h : sv.n, Math.round(sx - 2 * k), Math.round(sy - 7 * k), 4 * k, 7 * k);
  // an arm waving (or holding the rope)
  ctx.fillStyle = '#d8cfb6';
  if (f.stage === 'wait') ctx.fillRect(Math.round(sx - 3), Math.round(sy - 9 + wave), 1, 3);
  else ctx.fillRect(Math.round(sx), Math.round(sy - 9 * k), k, 2 * k);
  if (f.stage === 'wait') {
    const blink = (realT * 2 | 0) % 2 === 0;
    text('SOS', f.x + 2, f.y - 36, blink ? '#ffffff' : U.red, { align: 'center' });
    if (near < 90 && f.w <= 0) text('HOVER HERE', f.x + 2, f.y + 14, '#ffffff', { align: 'center' });
  }
}

// ---------- the HUD: radar dots, edge arrows, the survivor icon flying to the counter
function lootRadar(dot) {
  if (!G.loot) return;
  const blink = (realT * 3 | 0) % 2 === 0;
  for (const f of G.loot) {
    if (f.gone) continue;
    if (f.kind === 'pile') dot(f.x, f.y, '#7a6330', 1);
    else if (f.kind === 'crate') dot(f.x - 1, f.y - 1, '#5fd16a', 2);
    else if (f.kind === 'gold') { if (blink) dot(f.x - 1, f.y - 1, '#ffd84a', 2); }
    else if (!blink) dot(f.x - 1, f.y - 1, '#ffffff', 2);
  }
}
function drawLootUI() {
  if (!G.loot) return;
  const [gx, gy] = heliGround();
  if (!G.result) for (const f of G.loot) {
    if (f.gone) continue;
    const d = Math.hypot(f.x - gx, f.y - gy);
    if (f.kind === 'crate' && d < LOOT.crate.arrow) edgeArrow(f.x, f.y - 4, '#7fe07f', 'CRATE ' + Math.round(d / 2 / 10) * 10 + 'M');
    else if (f.kind === 'gold' && d < LOOT.gold.arrow) edgeArrow(f.x, f.y - 4, '#ffd36a', 'GOLD');
    else if (f.kind === 'sos' && d < LOOT.sos.arrow) edgeArrow(f.x, f.y - 10, (realT * 2 | 0) % 2 ? '#ffffff' : U.red, 'SOS');
  }
  // the lifted survivor's icon flies to the survivor counter (top left)
  for (const q of G.lootFly) {
    if (!q.surv) continue;
    const u = ease(q.t / q.T);
    blit(ICON.surv, Math.round(lerp(q.x0, 58, u)), Math.round(lerp(q.y0, 5, u) - Math.sin(u * Math.PI) * 24));
  }
}

// tut.js - the teaching layer and the frame polish: the tutorial prompts, the pause menu, the fades
// between screens and the end-of-build card. Features call tutEvent(name, data) at their moments;
// the rest is found here by looking at the game each frame. Prompts show in five channels, one at a
// time each (the rest wait in a queue): TASKS (a box at the top left, up to 3 lines with a check
// box), RADIO (radio() in ui.js), TIP (one gold line over the weapon cards with a blinking arrow
// toward the thing), BANNER (banner()) and TAG (a label with an arrow in the Depot). Each prompt
// shows once per save (SAVE.seen).

// tasks / taskQ = the task lines shown and waiting; tip / tipQ = the tip shown and waiting; banQ =
// banners waiting; labels = words over a zombie (BRUTE!); mode = the screen last frame (for the
// fades and for what a new run resets); fade = the black over the screen (1 = all black);
// cardAt / card = the end-of-build card (when it opens, and its numbers); after = Depot
// prompts to mark seen when the next run starts
const TUT = {
  tasks: [], taskQ: [], tip: null, tipQ: [], banQ: [], labels: [], mode: '', fade: 1, fadeK: 1,
  cardAt: 0, card: null, sum: [], after: new Set()
};
const seen = (k) => !!SAVE.seen[k];
// Mark prompt k as shown. True the first time.
function see(k) {
  if (SAVE.seen[k]) return false;
  SAVE.seen[k] = true;
  saveSave();
  return true;
}
// a real run is on (not the demo, not over)
const tutLive = () => G && !G.demo && mode === 'play' && !G.result;

// ---------- the channels
// A task: key (seen once done), the words, how many it needs (a count shows from 2 up), and what
// counts for it (tutCount(kind)).
function task(key, label, need, kind) {
  if (seen(key) || TUT.tasks.concat(TUT.taskQ).some((t) => t.key === key)) return;
  const t = { key, label, need: need || 1, kind, n: 0, t: 0, done: -1, bump: 0 };
  (TUT.tasks.length < 3 ? TUT.tasks : TUT.taskQ).push(t);
}
// n more of kind done: every task waiting for it counts up, and ticks off when full
function tutCount(kind, n) {
  for (const t of TUT.tasks.concat(TUT.taskQ)) {
    if (t.kind !== kind || t.done >= 0) continue;
    const was = Math.floor(t.n);
    t.n = Math.min(t.need, t.n + (n || 1));
    if (Math.floor(t.n) > was) t.bump = 0.25;
    if (t.n >= t.need) {
      t.done = 0;
      see(t.key);
      if (TUT.tasks.includes(t)) SFX.tick();
    }
  }
}
// A tip for 4 s: key (seen at once), the words, and where its arrow points (a function giving a
// point on the screen, or null for no arrow).
function tip(key, msg, at) {
  if (!see(key)) return;
  TUT.tipQ.push({ msg, at: at || null, t: 0 });
}
// Currency lessons wait until they can actually be shown. A screen change may empty the queue,
// so their persistent event flags are the source of truth until promotion marks the lesson seen.
function currencyTips() {
  if (!['play', 'depot'].includes(mode) || (mode === 'play' && G.demo)) return;
  const lessons = [
    ['scrap', SAVE.flags.scrapEarned, 'KILLS GIVE SCRAP. SCRAP BUYS UPGRADES.'],
    ['surv', SAVE.flags.survShown, 'SURVIVORS CREW NEW UNITS. EACH NEW UNIT COSTS 1.'],
    ['gold', SAVE.flags.goldShown, 'GOLD BUYS SPECIAL NODES.']
  ];
  for (const [cur, due, msg] of lessons) {
    const key = 'currency_' + cur;
    if (!due || seen(key) || TUT.tip?.key === key || TUT.tipQ.some((t) => t.key === key)) continue;
    TUT.tipQ.push({ key, cur, msg, t: 0, at: () => [currencyX(cur), 8] });
  }
}
// A radio line, once per save.
function radioOnce(key, who, msg) {
  if (see(key)) radio(who, msg);
}
// A banner, once per save; it waits while one of ours still shows.
function bannerOnce(key, a, b, col) {
  if (see(key)) TUT.banQ.push([a, b, col || U.gold]);
}
// words over zombie z for 4 s
function label(z, s, col) {
  TUT.labels.push({ z, s, col, t: 0 });
}
// a zombie's place on the screen
const onScreen = (z) => [z.x - G.camX, z.y - G.camY];
const inView = (z) => {
  const [x, y] = onScreen(z);
  return x > 4 && x < W - 4 && y > 24 && y < H - 8;
};

// ---------- the events features send
// tutEvent(name, data): see the shared list (station, loot and shooting moments).
function tutEvent(name, d) {
  d = d || {};
  if (!G || G.demo || !(mode === 'play' || mode === 'ending')) return;
  const P = (o) => () => (o && o.x != null ? [o.x - G.camX, o.y - G.camY] : null);
  const ev = {
    pile_seen: () => {
      task('t_piles', 'GRAB 3 SCRAP PILES', 3, 'pile');
      tip('p_pile', 'RIGHT CLICK A SCRAP PILE TO SEND YOUR VIPER.', P(d));
    },
    pile_taken: () => tutCount('pile'),
    crate_seen: () => task('t_crate', 'GRAB THE SUPPLY CRATE', 1, 'crate'),
    crate_taken: () => tutCount('crate'),
    sos_seen: () => tip('p_sos', 'A SURVIVOR! FLY OVER THEM TO WINCH THEM UP.', P(d)),
    sos_near: () => tip('p_lift', 'HOLD YOUR VIPER OVER THEM FOR 2 SECONDS.', P(d)),
    golden_seen: () => tip('p_golden', 'GOLDEN ZOMBIE! CATCH IT FOR ' + goldenPay(d) + ' SCRAP.', P(d.z || d))
  }[name];
  if (ev) ev();
}
// what a golden zombie pays (from the event, else from the game's numbers)
function goldenPay(d) {
  const g = CFG.golden || (CFG.types && CFG.types.find((t) => t.golden));
  return d.value || d.pay || (g && (g.value || g.pay)) || 25;
}
// A zombie dies (called from kill()): the tasks that count shots.
function tutKill(z, cause, free) {
  if (!scoring() || free) return;
  if (z.st === 1) tutCount('track');
  if (z.st === 2) tutCount('climber');
  // (only your own shots count: not the flatcar gun, the ram or the train)
  if (cause !== 'gun' && cause !== 'ram' && cause !== 'train') tutCount('shoot');
}

// ---------- each frame
function tutFrame(dt) {
  // a new screen: fade in from black (lighter over the run that just ended); a new run starts clean
  const m = mode === 'ending' ? 'play' : mode;
  if (m !== TUT.mode) {
    TUT.fade = TUT.fadeK = m === 'summary' ? 0.5 : 1;
    if (m === 'play') tutNewRun();
    if (m === 'summary') tutSumOpen();
    if (TUT.mode === 'play') TUT.tasks.length = TUT.taskQ.length = TUT.tipQ.length = TUT.banQ.length = 0;
    TUT.mode = m;
  }
  TUT.fade = Math.max(0, TUT.fade - dt / 0.25 * TUT.fadeK);
  // The end card opens after its scheduled story moment.
  if (TUT.cardAt && realT >= TUT.cardAt) {
    TUT.cardAt = 0;
    if (tutLive() && see('endcard')) {
      TUT.card = { t: realT, km: km2(G.maxKm), kills: G.kills, scrap: Math.floor(G.cash), surv: G.surv, time: G.run };
      setPaused(true);
      SFX.total();
    }
  }
  if (TUT.card && !paused) TUT.card = null;
  currencyTips();
  tutChannels(dt);
  if (tutLive() && !paused) tutLook(dt);
}
// a new run: the channels empty, the counters from zero; Depot prompts shown are now done
function tutNewRun() {
  TUT.tasks.length = TUT.taskQ.length = TUT.tipQ.length = TUT.banQ.length = TUT.labels.length = 0;
  TUT.tip = null;
  TUT.card = null;
  TUT.cardAt = 0;
  for (const k of TUT.after) see(k);
  TUT.after.clear();
}
// the timers of the tasks, the tip, the banners and the labels
function tutChannels(dt) {
  const T = TUT;
  for (let i = T.tasks.length - 1; i >= 0; i--) {
    const t = T.tasks[i];
    t.t += dt;
    t.bump = Math.max(0, t.bump - dt);
    if (t.done >= 0) t.done += dt;
    if (t.done > 1.35) T.tasks.splice(i, 1);
  }
  while (T.tasks.length < 3 && T.taskQ.length) T.tasks.push(T.taskQ.shift());
  if (T.tip) {
    T.tip.t += dt;
    if (T.tip.t >= 4) T.tip = null;
  }
  if (!T.tip && T.tipQ.length) {
    T.tip = T.tipQ.shift();
    if (T.tip.key) see(T.tip.key);
  }
  if (T.banQ.length && !banners.some((b) => b.tut)) {
    const [a, b, c] = T.banQ.shift();
    banner(a, b, c, 2);
    if (banners[0] && banners[0].a === a) banners[0].tut = true;
  }
  for (let i = T.labels.length - 1; i >= 0; i--) {
    const l = T.labels[i];
    l.t += dt;
    if (l.t >= 4 || l.z.dead || l.z.gone) T.labels.splice(i, 1);
  }
}
// What the run shows now that has a prompt (the ones no feature sends an event for).
function tutLook(dt) {
  const runs = SAVE.runs;
  // The Viper fires by itself; right click gives it a target or a place to fly.
  if (G.run > 1.5) {
    task('t_attack', 'RIGHT CLICK A ZOMBIE TO ATTACK IT', 1, 'attack');
    const h = G.helis[0];
    if (h) tip('p_auto', 'YOUR VIPER FIGHTS BY ITSELF. RIGHT CLICK TO MOVE IT.', () => [h.x - G.camX, h.y - h.alt - G.camY]);
  }
  // scrap piles: from 11 s into run 2 (once there is loot on the line)
  if (runs >= 2 && G.run > 11 && G.loot) task('t_piles', 'GRAB 3 SCRAP PILES', 3, 'pile');
  // the dead in view: a crowd on the rails, one on the train, a runner, a brute
  let rail = 0, climb = null, runner = null, brute = null;
  for (const z of G.zombies) {
    if (z.dead || !inView(z)) continue;
    if (z.st === 1) rail++;
    if (z.st === 2) climb = z;
    if (z.type === 1) runner = z;
    if (z.type === 2) {
      brute = brute || z;
    }
  }
  if (rail >= 3) {
    task('t_track', 'SHOOT THE DEAD ON THE TRACK', 5, 'track');
  }
  if (climb && runs >= 2) task('t_climb', 'SHOOT THE DEAD OFF THE TRAIN', 1, 'climber');
  if (runner && runs >= 2) bannerOnce('b_run', 'RUNNERS', 'FAST, BUT ONLY ' + CFG.types[1].hp + ' HP', U.amber);
  const at = (z) => () => onScreen(z);
  if (brute && !seen('p_brute')) {
    label(brute, 'BRUTE!', U.red);
    tip('p_brute', 'BRUTES HAVE ' + CFG.types[2].hp + " HP. THE TRAIN CAN'T PUSH THEM.", at(brute));
  }
}

// ---------- drawing in the run
// the top of the weapon cards (the Ram's card can sit over the 25mm's on a narrow window)
const cardsTop = () => Math.min(H - 30, RAMCARD.on ? RAMCARD.y : H - 30);
// the task box: [right edge, bottom], or null while it is empty
function taskBox() {
  if (!TUT.tasks.length || mode !== 'play') return null;
  const w = Math.max(...TUT.tasks.map((t) => tw(taskText(t)))) + 19;
  return [4 + w, 22 + 5 + TUT.tasks.length * 10];
}
const taskText = (t) => t.label + (t.need > 1 ? ' (' + Math.floor(t.n) + '/' + t.need + ')' : '');
// Where the warnings under the top bar go (L = their lines): in the middle, or moved right of the
// task box, or under it when there is no room beside it. Returns [x of the middle, y].
function warnAt(L) {
  const b = taskBox();
  if (!b || !L.length) return [W / 2, 24];
  const ww = Math.max(...L.map(([t]) => tw(t)));
  const x = Math.max(W / 2, b[0] + 8 + ww / 2);
  return x + ww / 2 <= W - 4 ? [Math.round(x), 24] : [W / 2, b[1] + 4];
}
// room the tip takes over the weapon cards (the radio box goes above it)
const tipRoom = () => (TUT.tip && mode === 'play' ? 14 : 0);
// A small blinking triangle at (x, y), its tip toward (ux, uy).
function triangle(x, y, ux, uy, col) {
  for (const [c, g] of [['#07080a', 1], [col, 0]]) {
    ctx.fillStyle = c;
    for (let py = -5; py <= 5; py++) for (let px = -5; px <= 5; px++) {
      const a = px * ux + py * uy, b = -px * uy + py * ux;
      if (a <= 3 + g && a >= -2 - g && Math.abs(b) <= (3 - a) * 0.62 + g * 0.9) ctx.fillRect(x + px, y + py, 1, 1);
    }
  }
}
function drawTut() {
  if (mode !== 'play') return;
  drawTasks();
  drawTipLine();
  for (const l of TUT.labels) {
    const [x, y] = onScreen(l.z), u = l.t;
    ctx.globalAlpha = u > 3.6 ? (4 - u) / 0.4 : 1;
    text(l.s, x, y - l.z.S.ay - 10 - (Math.floor(realT * 4) % 2), l.col, { align: 'center' });
    ctx.globalAlpha = 1;
  }
}
function drawTasks() {
  const b = taskBox();
  if (!b) return;
  const x = 4, y = 22, w = b[0] - x, h = b[1] - y;
  panel(x, y, w, h, 'rgba(10,11,14,0.86)');
  ctx.fillStyle = '#8a6a2a';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  TUT.tasks.forEach((t, i) => {
    const ry = y + 5 + i * 10, d = t.done;
    // done: green, then it fades after 1 s; a new one fades in
    ctx.globalAlpha = d > 1 ? Math.max(0, 1 - (d - 1) / 0.35) : Math.min(1, t.t / 0.2);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x + 4, ry, 7, 7);
    ctx.fillStyle = d >= 0 ? U.green : '#6a6f7b';
    ctx.fillRect(x + 5, ry + 1, 5, 5);
    if (d < 0) {
      ctx.fillStyle = '#16171c';
      ctx.fillRect(x + 6, ry + 2, 3, 3);
    }
    text(taskText(t), x + 14, ry, d >= 0 ? U.green : t.bump > 0 ? '#ffffff' : U.ink);
    ctx.globalAlpha = 1;
  });
}
function drawTipLine() {
  const t = TUT.tip;
  if (!t) return;
  const L = wrap(t.msg, W - 36), w = Math.max(...L.map((l) => tw(l))), p = t.at && t.at();
  const y = (mode === 'depot' ? H - 60 : cardsTop() - 22) - (L.length - 1) * 10;
  const col = t.cur === 'scrap' ? U.blue : t.cur === 'surv' ? U.amber : U.gold;
  const aw = p ? 12 : 0, x = Math.round(W / 2 - (w + aw) / 2);
  ctx.globalAlpha = t.t < 0.15 ? t.t / 0.15 : t.t > 3.6 ? (4 - t.t) / 0.4 : 1;
  ctx.fillStyle = 'rgba(5,6,8,0.7)';
  ctx.fillRect(x - 5, y - 3, w + aw + 10, L.length * 10 + 3);
  L.forEach((l, i) => text(l, x + aw, y + i * 10, col));
  // the arrow toward the thing it means, blinking
  if (p && Math.floor(realT * 4) % 2 === 0) {
    const cx = x + 4, cy = y + 3, dx = p[0] - cx, dy = p[1] - cy, l = Math.hypot(dx, dy) || 1;
    triangle(cx, cy, dx / l, dy / l, col);
  }
  ctx.globalAlpha = 1;
}

// ---------- the Depot: the hint bar and the tags
// Currency tips own the lessons; treeHint supplies the ordinary bottom-bar guidance.
function tutHint() {
  return null;
}
// The tag that shows now: [node id or 'start', words], or null.
function tutTag() {
  if (depotTab !== 'tree' || NODES.some((n) => n.k === 'scrap' && lv(n.id) > 0)) return null;
  const first = NODES.find((n) => n.k === 'scrap' && nodeState(n) === 'buy');
  return first ? [first.id, 'CHOOSE ANY BLUE UPGRADE.'] : null;
}
function drawTutTags() {
  if (TUT.tip?.cur) { drawTipLine(); return; }
  const g = tutTag();
  if (!g) return;
  const [id, msg] = g, L = tw(msg) > 190 ? wrap(msg, 190) : [msg];
  const w = Math.max(...L.map((l) => tw(l))) + 12, h = L.length * 10 + 6, bob = Math.round(Math.sin(realT * 6) * 1.5);
  let x, y, ux, uy, ax, ay;
  if (id === 'start') {
    // over START RUN, which pulses
    const b = depotStartRect(), bx = b.x, by = b.y;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(realT * 8);
    frame(bx - 2, by - 2, b.w + 4, b.h + 4, '#ffd36a');
    ctx.globalAlpha = 1;
    x = clamp(bx + b.w / 2 - w / 2, 4, W - w - 4);
    y = by - 12 - h + bob;
    [ax, ay, ux, uy] = [bx + b.w / 2, y + h + 4, 0, 1];
  } else {
    // beside the node: right, left, over or under it, on the side that covers the fewest other
    // nodes (and stays on the screen)
    const p = nodeXY(id), r = halfOf(NODE[id]) + 10, sides = [
      [p.x + r, p.y - h / 2, -1, 0], [p.x - r - w, p.y - h / 2, 1, 0], [p.x - w / 2, p.y - r - h, 0, 1], [p.x - w / 2, p.y + r + 12, 0, -1]];
    let best = 1e9;
    for (const [sx, sy, dx, dy] of sides) {
      let n = sx < 4 || sy < TREE.y0 + 3 || sx + w > W - 4 || sy + h > TREE.y1 - 3 ? 100 : 0;
      for (const o of NODES) {
        if (o.id === id || !shownAs(o)) continue;
        const q = nodeXY(o.id), a = halfOf(o) + 2;
        if (q.x + a > sx && q.x - a < sx + w && q.y + a + 12 > sy && q.y - a < sy + h) n++;
      }
      if (n < best) [best, x, y, ux, uy] = [n, sx, sy, dx, dy];
    }
    x += -ux * bob;
    y = clamp(Math.round(y - uy * bob), TREE.y0 + 3, TREE.y1 - 3 - h);
    ax = ux ? (ux < 0 ? x - 4 : x + w + 3) : p.x;
    ay = uy ? (uy < 0 ? y - 4 : y + h + 3) : p.y;
  }
  x = Math.round(x);
  panel(x, y, w, h, 'rgba(14,12,8,0.95)');
  frame(x, y, w, h, '#b8862f');
  L.forEach((l, i) => text(l, x + 6, y + 4 + i * 10, U.gold));
  triangle(Math.round(ax), Math.round(ay), ux, uy, U.gold);
}

// ---------- the pause menu
// PAUSE = the menu's box (a click outside it goes on with the run)
const PAUSE = { x: 0, y: 0, w: 0, h: 0 };
// true when a click at (x, y) is on the pause menu or the end card (it does not go on)
const pauseHit = (x, y) => !!TUT.card || inR(x, y, PAUSE.x, PAUSE.y, PAUSE.w, PAUSE.h);
function drawPause() {
  ctx.fillStyle = 'rgba(5,6,8,0.6)';
  ctx.fillRect(0, 19, W, H - 19);
  if (TUT.card) {
    drawEndCard();
    return;

// cannon.js - the RAIL CANNON: the train's big gun on the flatcar (the tree node id is still gun). It shoots
// by itself, anything on the screen, once every few seconds (G.up.gun = its reload). Each shot goes
// straight from the cannon through its target to the edge of the screen and kills every zombie on
// that line, brutes too. It takes the line that kills the most, but the dead on the train come first.
// While it reloads its barrel glows hotter and the lights round its base fill up; when it is ready
// they flash once. The shot: a huge muzzle blast, the barrel kicks back, the flatcar jolts, a white
// beam, a row of blasts and dust along the line, bodies thrown off it, and a burnt line on the ground.

// ---------- the model
// Two piles of slices, like the cars: the turret (TURRET.n / h = normal / thermal, at CANNON_N
// headings, 0 = north, clockwise) and its long barrel (bn / bh), drawn apart so the barrel can kick
// back. glow[i] = the barrel lit orange (laid over it while it charges), white[i] = all white (the
// ready flash), both made when first needed. CB_Z = the barrel's height over the deck, CB_LEN = px
// from the cannon's middle to the muzzle, CB_H = the muzzle's height over the ground.
const TURRET = { n: [], h: [], bn: [], bh: [], glow: [], white: [], raw: [] };

// one 22 x 22 turret slice / one 52 x 52 barrel slice (the middle is between pixels 10 and 11 / 25 and 26)
const tSl = (fn) => pix(22, 22, fn), bSl = (fn) => pix(52, 52, fn);
function tDisc(r, R, col) {
  for (let y = 0; y < 22; y++) for (let x = 0; x < 22; x++) if (Math.hypot(x + 0.5 - 11, y + 0.5 - 11) <= R) r(x, y, 1, 1, col);
}
// the turret's armored body: half its width on each row from the front (row 5) to the back (row 16)
const HULL = [4, 5, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6];
function tHull(r, col, inset) {
  for (let k = inset || 0; k < HULL.length - (inset || 0); k++) {
    const w = HULL[k] - (inset || 0);
    r(11 - w, 5 + k, w * 2, 1, col);
  }
}
function turretSlices() {
  // dark steel, with hazard yellow on the front plate and round the back
  const S = ['#1a1d22', '#262a31', '#353a43', '#474d58', '#5d6470', '#7b8390', '#a3abb7'], Y = '#d8a93a', K = '#16181c';
  return [
    // the turning ring under it, with eight bolts
    tSl((r) => tDisc(r, 6.6, '#121417')),
    tSl((r) => {
      tDisc(r, 6.6, '#2a2d34');
      for (let k = 0; k < 8; k++) r(Math.floor(11 + Math.sin(k * TAU / 8) * 5.6), Math.floor(11 - Math.cos(k * TAU / 8) * 5.6), 1, 1, '#6b707c');
    }),
    // the body, with armor skirts on both sides
    tSl((r) => { tHull(r, S[1]); r(4, 7, 1, 9, S[0]); r(17, 7, 1, 9, S[0]); }),
    tSl((r) => {
      tHull(r, S[2]);
      r(4, 7, 1, 9, S[3]); r(17, 7, 1, 9, S[2]);
      for (const y of [8, 11, 14]) { r(4, y, 1, 1, S[5]); r(17, y, 1, 1, S[1]); }
      // the mantlet the barrel comes out of
      r(9, 3, 4, 2, S[1]);
    }),
    tSl((r) => {
      tHull(r, S[3]);
      // the sloped front plate with hazard stripes
      r(7, 5, 8, 1, S[5]);
      for (let x = 6; x < 16; x++) r(x, 6, 1, 1, (x >> 1) & 1 ? Y : K);
      r(5, 7, 12, 1, S[2]);
      r(4, 7, 1, 9, S[5]); r(17, 7, 1, 9, S[3]);
      r(9, 3, 4, 2, S[2]); r(9, 3, 4, 1, S[4]);
    }),
    // the roof: lit front and left edges, a hatch, a vent and a hazard stripe at the back
    tSl((r) => {
      tHull(r, S[4], 1); r(6, 7, 10, 1, S[6]); r(6, 7, 1, 8, S[5]); r(15, 8, 1, 7, S[3]);
      r(8, 4, 6, 3, S[3]); r(8, 4, 6, 1, S[6]);
      r(13, 12, 2, 2, S[1]); r(13, 12, 1, 1, S[5]);
      for (let x = 7; x < 11; x += 2) r(x, 11, 1, 3, S[1]);
      for (let x = 6; x < 16; x++) r(x, 15, 1, 1, (x >> 1) & 1 ? K : Y);
    }),
    // the cupola with its periscope
    tSl((r) => { r(12, 8, 3, 3, S[5]); r(12, 8, 3, 1, S[6]); r(13, 8, 1, 1, '#9fd3f2'); })

}
// the barrel: a long thin tube from a thick sleeve in the mantlet, a band, a muzzle brake with side vents
function barrelShape(r, col) {
  r(24, 17, 4, 5, col);
  r(25, 4, 2, 13, col);
  r(24, 1, 4, 3, col);
}
function barrelSlices() {
  return [
    bSl((r) => { barrelShape(r, '#24272d'); r(24, 2, 1, 1, '#0c0d10'); r(27, 2, 1, 1, '#0c0d10'); }),
    bSl((r) => {
      barrelShape(r, '#5a5f6b');
      r(25, 4, 1, 13, '#c3c8cf'); r(26, 4, 1, 13, '#7d838c'); r(25, 11, 2, 1, '#3d414b');
      r(24, 17, 1, 5, '#9aa0aa'); r(27, 17, 1, 5, '#3d414b'); r(25, 17, 2, 1, '#2a2d34');
      r(24, 1, 4, 1, '#d6d9de'); r(24, 2, 1, 2, '#8b919c'); r(27, 2, 1, 2, '#2a2d34'); r(25, 3, 2, 1, '#3d414b');
    })
