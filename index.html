// The 105 lands: everything near dies, the edge of the blast throws the rest back. Too close to
// the train, the blast hurts the train as well; it kills survivors on foot too.
function explode(x, y, player) {
  let killed = 0, value = 0;
  queryEll(x, y, CFG.he.hurt, (z, d) => {
    if (d >= CFG.he.kill) {
      z.hp -= 4;
      z.flash = 0.25;
      if (z.st !== 2) {
        const dx = z.x - x, dy = (z.y - y) / FORE, l = Math.hypot(dx, dy) || 1;
        z.kbx += dx / l * 60;
        z.kby += dy / l * 60 * FORE;
      }
      if (z.hp > 0) return;
    }
    killed++;
    kill(z, 'he', x, y, d);
    value += z.paid;
  });
  boomFx(x, y, true);
  if (!G.demo) {
    addShake(0.75);
    hitStop(killed >= 12 ? 0.1 : 0.04, 0.25);
    SFX.boom();
  }
  for (const p of G.people) if ((p.st === 'run' || p.st === 'grab') && Math.hypot(p.x - x, (p.y - y) / FORE) < CFG.he.kill) catchPerson(p);
  const td = trainDist(x, y);
  if (player && td < CFG.he.close && !G.demo && !G.result) {
    const a = Math.round(14 * (1 - td / CFG.he.close)) + 3, k = carNear(x, y), c = G.tr.cars[k];
    hurtTrain(a, k, 'shell');
    floatText(c.cx, c.cy - 8, '-' + a, U.red);
    banner('CHECK FIRE!', 'YOUR SHELL HIT THE TRAIN', U.red, 3);
    SFX.radio();
  }
  if (player && scoring()) {
    G.bestBlast = Math.max(G.bestBlast, killed);
    if (killed) addTotal(x, y - 10, value, U.gold, true);
    if (killed >= 4) {
      const name = killed >= 25 ? 'MASSACRE' : killed >= 12 ? 'CARNAGE' : 'MULTI KILL';
      banner(name + ' ×' + killed, '+' + value + ' SCRAP', killed >= 12 ? '#ff7a4a' : U.amber, 2);
    }
  }
}
// Bodies in the air: they fall, bounce once if they come down hard, then lie as corpses.
function updateBodies(dt) {
  const bs = G.bodies;
  for (let i = bs.length - 1; i >= 0; i--) {
    const b = bs[i];
    b.age += dt;
    b.vz -= 320 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    b.rot += b.spin * dt;
    if (b.z > 0) continue;
    b.z = 0;
    if (b.vz < -70) {
      b.vz *= -0.3;
      b.vx *= 0.5;
      b.vy *= 0.5;
      b.spin *= 0.5;
      part({ x: b.x, y: b.y, z: 0, vx: 0, vy: 0, vz: 4, g: 0, life: 0.5, max: 0.5, s: 3, c: 'rgba(90,80,64,0.45)', grow: 4, smoke: true });
    } else {
      stampCorpse(b.S, b.x, b.y);
      bs[i] = bs[bs.length - 1];
      bs.pop();
    }
  }
}
// Burning wrecks and farms in view: smoke columns and embers.
function updateFireSpots(dt) {
  const [i0, j0, i1, j1] = viewChunks();
  for (let j = j0 - 1; j <= j1 + 1; j++) for (let i = i0 - 1; i <= i1 + 1; i++) {
    for (const f of plan(i, j).fires) {
      const k = f.big ? 1 : 0.6;
      if (Math.random() < dt * 2.2 * k) part({ x: f.x + rnd(-2, 2), y: f.y + rnd(-1, 1), z: f.big ? 9 : 5, vx: rnd(4, 9), vy: rnd(-2, 1),
        vz: rnd(8, 14), g: 0, life: rnd(2.2, 3.6), max: 3.6, s: rnd(2, 4) * k + 1,
        c: pick(['rgba(44,40,38,0.6)', 'rgba(58,52,48,0.55)', 'rgba(36,33,31,0.6)']), grow: 3.5, drag: 0.35, smoke: true });
      if (Math.random() < dt * 5 * k) part({ x: f.x + rnd(-3, 3), y: f.y, z: rnd(4, 9), vx: rnd(-4, 6), vy: rnd(-2, 2), vz: rnd(14, 30),
        g: -4, life: rnd(0.5, 1.1), max: 1.1, s: 1, c: pick(['#ffc27a', '#ff8a3a', '#e2552f']), add: true, drag: 1.2 });
    }
  }
}

// ---------- the autopilot (the title demo, and tests through window.__sr.bot)
// It shoots the dead on the train first, then the ones near the survivors, then the ones on the
// rails nearest the engine, then whoever is nearest the train; the 105 goes to a crowd on the rails
// well ahead of the train, and the Turbo Ram to a Dead Wall or a crowd on the rails.
function autopilot(dt) {
  G.botT -= dt;
  if (G.botT <= 0 || !G.botZ || G.botZ.dead) {
    G.botT = 0.2;
    let bestZ = null, bs = 1e9;
    for (const z of G.zombies) {
      // (the dead at the Depot gate in the first run are left for the Ram taste)
      if (z.dead || z.gate && (!G.ram.uses || G.ram.on)) continue;
      const sx = z.x - G.camX, sy = z.y - G.camY;
      if (sx < 6 || sx > W - 6 || sy < 26 || sy > H - 6) continue;
      let s;
      const prey = preyNear(z, 50);
      if (prey && prey.by === z) s = -100;
      else if (z.st === 2) s = 0;
      else if (prey) s = 100;
      else if (z.st === 1) s = 300 + Math.max(0, trackLocal(z.x, z.y, TL).a - G.tr.s + 400);
      else s = 900 + trainDist(z.x, z.y);
      if (s < bs) { bs = s; bestZ = z; }
    }
    G.botZ = bestZ;
  }
  let he = null;
  for (const q of G.zombies) {
    if (q.dead || q.st !== 1 || q.y - G.camY < 24 || q.y - G.camY > H) continue;
    if (G.tr.s - trackLocal(q.x, q.y, TL).a > 110) { he = q; break; }
  }
  // the Turbo Ram: at a Dead Wall, at PRESS E!, or when 6 or more dead stand on the rails ahead (but
  // not when a Dead Wall is less than 600 m ahead: it saves the Ram for that)
  if (ramState() === 'ready' && (G.prompt || wallAhead(130) || G.railAhead >= 6 && !wallAhead(1200))) tryRam(true);
  return { z: G.botZ && !G.botZ.dead ? G.botZ : null, he };
}
// the title demo: bursts of 25mm and a 105 now and then
function attract(dt) {
  const b = autopilot(dt);
  G.mgCd -= dt;
  if (b.z && G.t % 1.8 < 1.1) {
    while (G.mgCd <= 0) {
      fireMG(false, b.z.x + b.z.vx * CFG.mg.travel + rnd(-2, 2), b.z.y + b.z.vy * CFG.mg.travel + rnd(-2, 2));
      G.mgCd += 1 / CFG.mg.rate;
    }
  } else G.mgCd = Math.max(0, G.mgCd);
  G.heReload -= dt;
  if (b.he && G.heReload <= 0) {
    fireHE(false, b.he.x + b.he.vx * CFG.he.travel, b.he.y + b.he.vy * CFG.he.travel);
    G.heReload = 3.5;
  }
}
// in play with the bot on: it moves the sight and pulls the triggers
function botPlay(dt) {
  const b = autopilot(dt);
  if (b.z) {
    M.x = b.z.x - G.camX;
    M.y = b.z.y - G.camY - b.z.S.h * 0.5;
    M.inside = true;
  }
  G.trigger = !!b.z;
  if (b.he && G.up.he && G.heReload <= 0) fireHE(true, b.he.x + b.he.vx * CFG.he.travel, b.he.y + b.he.vy * CFG.he.travel);
}

// ---------- the ride
// The train has ridden d px further: it pays 1 scrap every CFG.pay.dist px (20 m), and passing the
// best km of all runs shows NEW BEST.
function ride(d) {
  G.ride += d;
  const due = Math.floor(G.ride / CFG.pay.dist) - G.pay.dist;
  if (due > 0) {
    G.cash += due;
    G.pay.dist += due;
  }
  G.maxKm = Math.max(G.maxKm, DK());
  if (!G.newBest && G.oldBest > 0 && km2(G.maxKm) > G.oldBest) {
    G.newBest = true;
    banner('NEW BEST', 'PAST ' + G.oldBest.toFixed(2) + ' KM. KEEP GOING!', U.gold, 1);
    SFX.fanfare();
  }
}

// ---------- one step of the game (STEP seconds)
function step(dt) {
  G.t += dt;
  const tr = G.tr, st = G.station;
  // the train gets back up to speed after every bump. It brakes for the station and waits there;
  // lost, it stops; safe, it rolls on until the whole train is inside the wall, then brakes.
  if (G.result === 'lost') tr.v = Math.max(0, tr.v - 30 * dt);
  else if (G.result === 'safe' && tr.s + TRAIN_LEN < G.goalS - 14) tr.v = Math.max(0, tr.v - 12 * dt);
  else if (st && st.state === 'braking') {
    tr.v = Math.min(tr.v, Math.sqrt(2 * CFG.train.brake * Math.max(0, tr.s - st.stopS)) + 1.5);
    if (tr.s - st.stopS < 0.6) {
      tr.v = 0;
      trainStops(st);
    }
  } else if (st && st.state === 'hold') tr.v = 0;
  else {
    // the Turbo Ram: up to its top speed in 0.4 s, then back down to the cruise over 1 s (also after
    // a Ram cut short). Otherwise the train gets back up to its cruise.
    const R = CFG.ram, cr = CFG.train.cruise, up = (R.speed - cr) / R.rise, down = (R.speed - cr) / R.ease;
    if (G.ram.on && G.ram.t < G.ram.dur) tr.v = Math.min(R.speed, tr.v + up * dt);
    else if (tr.v > cr) tr.v = Math.max(cr, tr.v - down * dt);
    else tr.v = Math.min(cr, tr.v + CFG.train.accel * dt);
  }
  updateRam(dt);
  tr.s -= tr.v * dt;
  layoutTrain();
  if (!G.demo && !G.result) ride(tr.v * dt);
  for (let k = 0; k < CAR.n; k++) if (tr.hit[k] > 0) tr.hit[k] -= dt;
  tr.hpShown = Math.max(tr.hp, tr.hpShown - dt * 12);
  // the little fires it runs over go out
  for (const f of flames) if (Math.abs(f.x - trackX(f.y)) < CAR.half + 2 && trainDist(f.x, f.y) < 1) f.life = 0;
  // wheels over the rail joints, and smoke from the stack
  tr.clack += tr.v * dt;
  if (tr.clack > 30) {
    tr.clack -= 30;
    if (!G.demo && mode !== 'summary') SFX.clack();
  }
  tr.smokeT -= dt;
  if (tr.smokeT <= 0 && G.result !== 'lost') {
    // (the Turbo Ram: thick black smoke, fast)
    const c = tr.cars[0], k = ramK();
    tr.smokeT = tr.v > 1 ? 0.16 - k * 0.11 : 0.4;
    part({ x: c.x0 - c.dx * 15 + rnd(-1, 1), y: c.y0 - c.dy * 15, z: 10, vx: rnd(-3, 3) + 3 + k * rnd(8, 16), vy: rnd(-2, 2), vz: rnd(14, 22) + k * 18, g: 0,
      life: rnd(1.6, 2.6) - k * 0.6, max: 2.6, s: rnd(2, 3) + k, c: k > 0.5 ? pick(['rgba(20,18,18,0.7)', 'rgba(32,30,28,0.65)'])
        : pick(['rgba(40,38,36,0.6)', 'rgba(56,52,48,0.55)']), grow: 3 + k * 2, drag: 0.8, smoke: true });
  }
  updateHeli(dt);
  placeCamera();
  if (G.up.gun && !G.result) updateCannon(dt);
  for (let i = G.timers.length - 1; i >= 0; i--) {
    const tm = G.timers[i];
    tm.t -= dt;
    if (tm.t <= 0) {
      G.timers.splice(i, 1);
      tm.f();
    }
  }
  if (mode === 'play') {
    G.run += dt;
    if (G.bot) botPlay(dt);
    G.aimSX = clamp(M.x, 0, W - 1);
    G.aimSY = clamp(M.y, 0, H - 1);
    findLock();
    // the 25mm heats up while it fires and cools when it rests; too hot and it stops for a moment
    G.heat = Math.max(0, G.heat - CFG.mg.cool * dt * (G.trigger && !G.overheat ? 0.25 : 1));
    if (G.overheat && G.heat < 0.35) G.overheat = false;
    if (G.trigger && !G.overheat) {
      G.mgCd -= dt;
      while (G.mgCd <= 0 && !G.overheat) {
        // (only a zombie already done for under the sight: wait, the round would be wasted)
        if (G.lockWait) {
          G.mgCd = 0;
          break;
        }
        fireMG(true, G.camX + G.aimSX, G.camY + G.aimSY);
        G.mgCd += 1 / G.up.rate;
        findLock(true);
        if (G.heat >= 1) {
          G.overheat = true;
          SFX.overheat();
          floatText(G.camX + G.aimSX, G.camY + G.aimSY + 8, 'OVERHEAT', U.red);
        }
      }
    } else G.mgCd = Math.max(0, G.mgCd - dt);
    if (G.heReload > 0) {
      G.heReload = Math.max(0, G.heReload - dt);
      if (G.heReload <= 0) {
        if (G.heQueue) {
          G.heQueue = false;
          fireHE(true, G.camX + G.aimSX, G.camY + G.aimSY);
        } else SFX.ready();
      }
    }
    if (!G.result && tr.s <= G.goalS) arrive();
  } else {
    G.aimSX = W / 2;
    G.aimSY = H / 2;
    if (mode === 'title' || mode === 'depot') attract(dt);
    else if (mode === 'ending') {
      G.endT += dt;
      if (G.endT > 3.4 && (G.result !== 'safe' || tr.v < 0.5) || G.endT > 14) endGame();
    }
  }
  G.hitT = Math.max(0, G.hitT - dt);
  G.muzzle[0] = Math.max(0, G.muzzle[0] - dt);
  G.muzzle[1] = Math.max(0, G.muzzle[1] - dt);
  G.killBump = Math.max(0, G.killBump - dt * 6);
  G.cashPulse = Math.max(0, G.cashPulse - dt * 3);
  updateStation(dt);
  if (!G.demo) updateWalls();
  updateZombies(dt);
  updateRounds(dt);
  updateBodies(dt);
  updateFireSpots(dt);
  updateSkills(dt);
  if (!G.demo) updateLoot(dt);
  updateFX(dt);
  // every 3 s the marks on the ground fade a little
  G.decalT += dt;
  if (G.decalT > 3) {
    G.decalT = 0;
    const [i0, j0, i1, j1] = viewChunks();
    fadeDecals(i0, j0, i1, j1);
  }
}

// station.js - the stops on the fixed line: the Depot where every run from home starts, and the
// stations further up, each at its own km. At a station the train stops with its passenger car at
// the station house and HOLDS: for a set time the dead come out of the corn in waves, the survivors
// run from the house to the train, and the towers you built there (towers.js) fight beside you.
// Each survivor aboard is +1 survivor to keep; the hold pays scrap too.

// The station grid: 14 columns (0 = west) x 9 rows (0 = north, the way the train goes). One tile is
// 16 x 16 world px. = rails (the parked train), P platform, L lamp, ~ the door path, H the house,
// . free to build on. Farm Stop has its house east; Mill Town is the mirror of it.
const GRID_C = 14, GRID_R = 9, TILE = 16;
const FARM_MAP = [
  '......==......',
  '......==P.....',
  '......==L.....',
  '......==P~~HH.',
  '......==P~~HH.',
  '......==P.....',
  '......==L.....',
  '......==P.....',
  '......==......'
];
const mirrorMap = (m) => m.map((r) => r.split('').reverse().join(''));
// a later visit (and a run that starts at the station): 25 s, 3 survivors (they leave the house at
// 2, 8 and 14 s), the 20 dead waiting there, waves that start at the near edge of the corn (px from
// the rail middle). Wave side: -1 = the side away from the house, 1 = the house side, 0 = both.
// w / r / b = walkers, runners, brutes. brute = px out on the house side where the brute starts.
const HOLD_LATER = {
  T: 25, people: 3, outs: [2, 8, 14], dead: 20, far: [120, 140], brute: 120,
  waves: [{ t: 0, side: -1, w: 30, r: 0, b: 0 }, { t: 6, side: 1, w: 32, r: 6, b: 0 }, { t: 11, side: 0, w: 42, r: 8, b: 1 }]
};
const DEPOT = { id: 'depot', name: 'DEPOT', km: 0 };
// side = where the house is (1 = east of the rails). kit = the free towers the people there built:
// [type, column, row]. first = the first hold (out0 + i x gap = when survivor i leaves the house).
const STATIONS = [
  { id: 'farm', name: 'FARM STOP', km: 1, side: 1, map: FARM_MAP,
    kit: [['nest', 4, 4], ['bag', 2, 0], ['bag', 2, 1], ['bag', 2, 2], ['bag', 2, 6], ['bag', 2, 7], ['bag', 2, 8]],
    first: { T: 40, people: 8, out0: 2, gap: 4.5, dead: 20, far: [150, 200], brute: 140,
      waves: [{ t: 0, side: -1, w: 35, r: 0, b: 0 }, { t: 10, side: 1, w: 39, r: 6, b: 0 }, { t: 20, side: 0, w: 52, r: 8, b: 1 }] },
    later: HOLD_LATER },
  { id: 'mill', name: 'MILL TOWN', km: 2, side: -1, map: mirrorMap(FARM_MAP),
    kit: [['nest', 9, 4], ['bag', 11, 0], ['bag', 11, 1], ['bag', 11, 2], ['bag', 11, 6], ['bag', 11, 7], ['bag', 11, 8]],
    first: { T: 50, people: 10, out0: 2, gap: 4.5, dead: 20, far: [150, 200], brute: 140,
      waves: [{ t: 0, side: -1, w: 44, r: 0, b: 0 }, { t: 12, side: 1, w: 49, r: 8, b: 0 }, { t: 24, side: 0, w: 65, r: 10, b: 1 }] },
    later: HOLD_LATER }
];
// the rows the dead walk in on (the lanes), how near the door the dead keep a survivor inside (px)
// and for how long at most (s), how long the train waits for the last survivors after the time is
// up (s), the HP the crew repairs on stopping, the scrap a hold pays (first / later), px from the
// stop where the dead waiting there are placed and where they start to walk, the seconds after a
// wave starts when its runners step out of the corn
const HOLD = { runners: [3, 6], lanes: [1, 7], clear: 34, wait: 3, extra: 8, repair: 20, pay: 50, payAgain: 25, place: 600, walk: 200 };
// px from a stop's house (along the rails) to where the engine's nose stops: the passenger car
// (car 1) then stands at the house
const STOP_OFF = CAR.L + CAR.gap + CAR.L / 2;
// a stop by its id ('depot' too)
const stopDef = (id) => (id === 'depot' ? DEPOT : STATIONS.find((d) => d.id === id) || null);
// what is on tile (c, r) of station def: '=', 'P', 'L', '~', 'H' or '.' ('#' = off the grid)
const tileAt = (def, c, r) => (c < 0 || r < 0 || c >= GRID_C || r >= GRID_R ? '#' : def.map[r][c]);
const sideName = (s) => (s < 0 ? 'WEST' : s > 0 ? 'EAST' : 'BOTH');

// Tile (c, r) of the station whose house is at s along the rails -> the world. The rails run
// between columns 6 and 7; the coach door is between rows 3 and 4. c, r may be fractions (tile
// middles are at whole numbers). The grid bends with the rails.
function gridToWorld(c, r, s) {
  const a = s + (r - 3.5) * TILE, y0 = yAtS(a, yOfS(a)), fp = trackSlope(y0), k = 1 / Math.sqrt(1 + fp * fp);
  const u = (c - 6.5) * TILE;
  return { x: trackX(y0) + k * u, y: y0 - fp * k * u };
}

// The stops of a real run that starts at station at (or at the Depot when at is null): the Depot
// beside the train, every station from the start on, and the Dead Walls ahead.
function buildLine(at) {
  const k0 = at ? at.km : 0;
  G.trounds = [];
  if (!at) {
    const dp = buildStop(DEPOT, DEPOT_S + STOP_OFF, 1, 0, null);
    dp.state = 'done';
  }
  for (const d of STATIONS) {
    if (d.km < k0) continue;
    // a run that starts here, and every visit once it is held, gets the later hold
    const start = at === d, first = !start && !SAVE.held.includes(d.id), h = SAVE.house[d.id];
    const n = first ? d.first.people : typeof h === 'number' ? clamp(h | 0, 0, HOLD_LATER.people) : HOLD_LATER.people;
    const st = buildStop(d, sAtKm(d.km), d.side, n, first ? d.first : d.later);
    st.first = first;
    st.start = start;
    buildTowers(st);
    G.stations.push(st);
  }
  G.station = G.stations[0] || null;
  for (const w of WALLS) if (w.km > k0) G.walls.push({ km: w.km, walkers: w.walkers, brutes: w.brutes, s: sAtKm(w.km), placed: false, warned: false, awake: false, zs: [] });
}
// A stop with its house at s along the rails: a platform, the house and two lamps on one side of
// the rails (side 1 = east, -1 = west), and n survivors waiting by the door. hold = its hold plan.
function buildStop(def, s, side, n, hold) {
  const y = yOfS(s), col = (c) => 6.5 + side * (c - 6.5);
  const hp = gridToWorld(col(11.5), 4.1, s), hx = hp.x, hy = hp.y;
  const st = {
    def, id: def.id, name: def.name, s, stopS: s - STOP_OFF, y, side, state: 'ahead', t: 0, warned: false, first: false,
    start: false, hold, people: n, saved: 0, lost: 0, blockedT: 0, house: { x: hx, y: hy }, door: { x: hx, y: hy + 3 },
    wave: 0, waveT: -9, waveSide: 0, queue: [], deadPlaced: false, deadZs: [], awake: false, towers: [], nests: [], bags: [], wires: [], perfect: false
  };
  // the platform slabs (column 8, rows 1 to 7) and the lamps (rows 2 and 6)
  for (let r = 0.75; r <= 7.3; r += 0.75) {
    const p = gridToWorld(col(8), r, s);
    G.statics.push({ d: STATION.slab, x: Math.round(p.x), y: Math.round(p.y), k: Math.round(p.y) - 4 });
  }
  for (const r of [2, 6]) {
    const p = gridToWorld(col(8), r, s);
    G.statics.push({ d: STATION.lamp, x: Math.round(p.x), y: Math.round(p.y), k: Math.round(p.y), lamp: true });
  }
  G.statics.push({ d: STATION.house, x: Math.round(hx), y: Math.round(hy), k: Math.round(hy) });
  const go = (i) => (!hold ? 0.6 + i : hold.outs ? hold.outs[i] : hold.out0 + i * hold.gap);
  for (let i = 0; i < n; i++) {
    G.people.push({ person: true, stop: st, x: hx + rnd(-8, 8), y: hy + rnd(2, 5), st: 'wait', go: go(i),
      sv: SURV[i % SURV.length], anim: rnd(2), left: Math.random() < 0.5, k: 0, by: null, gt: 0 });
  }
  if (def !== DEPOT) buildCorn(st);
  G.stops.push(st);
  return st;
}
// true when (x, y) is on a station's ground (its grid and the corn round it): no trees or poles there
const SZ = { u: 0, a: 0, c: 1 };
function stationZone(x, y) {
  for (const d of STATIONS) {
    const s = sAtKm(d.km);
    if (d.y0 == null) d.y0 = yOfS(s);
    if (Math.abs(y - d.y0) > 150) continue;
    trackLocal(x, y, SZ);
    if (Math.abs(SZ.a - s) < 112 && Math.abs(SZ.u) < 214) return true;
  }
  return false;
}

// ---------- the hold
// The train has stopped at station st: the crew repairs it, the station counts as reached, and the
// hold begins.
function trainStops(st) {
  st.state = 'hold';
  st.t = 0;
  st.awake = true;
  const tr = G.tr;
  tr.hp = Math.min(tr.max, tr.hp + HOLD.repair);
  tr.hpShown = Math.max(tr.hpShown, tr.hp);
  floatText(tr.cars[0].cx, tr.cars[0].cy - 18, '+' + HOLD.repair + ' HP REPAIRED', U.green);
  if (!SAVE.reached.includes(st.id)) {
    SAVE.reached.push(st.id);
    saveSave();
  }
  const T = st.hold.T;
  banner('HOLD THE STATION', T + ' SECONDS. ' + (st.people ? 'SAVE THE SURVIVORS.' : 'THE HOUSE IS EMPTY.'), U.green, 3);
  SFX.bell();
  if (typeof tutEvent === 'function') tutEvent('hold_start', { id: st.id, first: st.first });
}
// The hold is over: the stop pays, PERFECT HOLD when no survivor was lost, and the train leaves.
function trainLeaves(st) {
  st.state = 'done';
  // anyone still out there is left behind; anyone still in the house waits for the next train
  let home = 0;
  for (const p of G.people) {
    if (p.stop !== st) continue;
    if (p.st === 'run' || p.st === 'grab') {
      p.st = 'dead';
      st.lost++;
    } else if (p.st === 'wait') home++;
  }
  SAVE.house[st.id] = home;
  const firstHeld = !SAVE.held.includes(st.id), pay = st.first ? HOLD.pay : HOLD.payAgain, c = G.tr.cars[1];
  G.cash += pay;
  G.pay.stop += pay;
  G.stopNames.push(st.name);
  addTotal(c.cx, c.cy - 16, pay, U.gold, true);
  st.perfect = st.people > 0 && st.lost === 0 && st.saved === st.people;
  if (firstHeld) SAVE.held.push(st.id);
  saveSave();
  banner('STATION HELD!', (st.people ? st.saved + ' OF ' + st.people + ' SURVIVORS ABOARD.  ' : '') + '+' + pay + ' SCRAP', U.green, 3);
  SFX.horn();
  if (st.perfect) {
    G.surv++;
    later(2.3, () => {
      banner('PERFECT HOLD!', '+1 SURVIVOR. NOBODY WAS LOST.', U.gold, 3);
      SFX.saved();
      floatText(G.tr.cars[1].cx, G.tr.cars[1].cy - 20, '+1 SURVIVOR', U.gold);
    });
  }
  if (firstHeld) later(st.perfect ? 4.6 : 2.3, () => banner(st.name + ' IS YOURS', 'BUILD ITS TOWERS IN THE DEPOT.', U.teal, 3));
  if (typeof tutEvent === 'function') tutEvent('station_held', { id: st.id, first: st.first, perfect: st.perfect, saved: st.saved, total: st.people });
}
// At the end of a run. A hold cut short leaves its house with the survivors still inside. After a
// run that rode 0.5 km or more, every station house reached fills up to 3 survivors again.
function refillHouses() {
  if (!G || G.demo) return;
  const st = G.station;
  if (st && st.state === 'hold') SAVE.house[st.id] = G.people.filter((p) => p.stop === st && p.st === 'wait').length;
  if (G.ride >= CFG.line.km * 0.5) {
    for (const id of SAVE.reached) SAVE.house[id] = Math.max(SAVE.house[id] | 0, HOLD_LATER.people);
  }
  saveSave();
}

// ---------- the dead at a station
// The dead who wait at the station: they stand about the grid until the train comes near.
function placeStationDead(st) {
  st.deadPlaced = true;
  if (st.start) return;
  for (let i = 0; i < st.hold.dead; i++) {
    const p = gridToWorld(6.5 + (Math.random() < 0.5 ? -1 : 1) * rnd(2.2, 6), rnd(-0.3, 8.3), st.s);
    const z = makeZombie(p.x, p.y, 0);
    z.still = true;
    G.zombies.push(z);
    st.deadZs.push(z);
  }
}
// Wave n out of the corn: its walkers, runners and brute walk in along the two lanes (rows 1 and
// 7) of its side, or of both sides. They step out of the corn over a few seconds (the walkers
// first, the runners a little after, while the survivors are on their way).
function laneWave(st, w, n) {
  const H0 = st.hold, side = w.side * st.side, q = st.queue;
  const one = (type, sd, far, d) => q.push({ t: st.t + d, type, sd, far });
  const sideOf = (i) => side || (i & 1 ? 1 : -1);
  for (let i = 0; i < w.w; i++) one(0, sideOf(i), rnd(H0.far[0], H0.far[1]), rnd(0, 3));
  for (let i = 0; i < w.r; i++) one(1, sideOf(i), rnd(H0.far[0], H0.far[1]), rnd(HOLD.runners[0], HOLD.runners[1]));
  for (let i = 0; i < w.b; i++) one(2, st.side, H0.brute, 1);
  st.wave = n;
  st.waveT = st.t;
  st.waveSide = side;
  const sub = w.b ? 'A BRUTE IS COMING!' : w.r ? 'RUNNERS GO FOR THE SURVIVORS!' : w.w + ' DEAD OUT OF THE CORN';
  banner('WAVE ' + n + '  ' + (side < 0 ? '< WEST' : side > 0 ? 'EAST >' : '< BOTH >'), sub, U.red, 2);
  SFX.wave();
  if (typeof tutEvent === 'function') tutEvent('wave', { n, side: sideName(side) });
}

// ---------- the survivors
// A zombie gets hold of a survivor: shoot it in time and the survivor runs on.
function grabPerson(p, z) {
  if (p.st !== 'run') return;
  p.st = 'grab';
  p.by = z;
  p.gt = CFG.station.grab;
  p.stop.grabs = (p.stop.grabs | 0) + 1;
  if (!G.demo) {
    floatText(p.x, p.y - 8, 'HELP!', U.red);
    SFX.hit();
    if (typeof tutEvent === 'function') tutEvent('survivor_grabbed', {});
  }
}
function catchPerson(p) {
  if (p.st !== 'run' && p.st !== 'grab') return;
  p.st = 'dead';
  p.stop.lost++;
  blood(p.x, p.y, 10, 5);
  stampPix(p.x, p.y, P.bl1, 2);
  if (!G.demo) {
    floatText(p.x, p.y - 6, 'SURVIVOR DOWN', U.red);
    SFX.splat();
    if (typeof tutEvent === 'function') tutEvent('survivor_lost', {});
  }
}
// The next stop: the dead waiting there, the warning, the braking point, and the hold.
function updateStation(dt) {
  if (G.demo) return;
  updateTowers(dt);
  let st = G.station;
  if (st && st.state === 'done') st = G.station = G.stations.find((s) => s.state !== 'done') || null;
  if (!st) return;
  const tr = G.tr, d = tr.s - st.stopS;
  if (!st.deadPlaced && d < HOLD.place) placeStationDead(st);
  if (st.deadZs.length && d < HOLD.walk) {
    for (const z of st.deadZs) z.still = false;
    st.deadZs.length = 0;
  }
  if (st.state === 'ahead') {
    if (!st.warned && d < 260) {
      st.warned = true;
      banner(st.name + ' AHEAD', st.towers.length ? 'YOUR TOWERS ARE READY.' : st.people + ' SURVIVORS WAIT THERE', U.blue, 3);
      if (typeof tutEvent === 'function') tutEvent('station_ahead', { id: st.id });
    }
    // brake to stop with the passenger car at the house
    if (d < tr.v * tr.v / (2 * CFG.train.brake) + 1) st.state = 'braking';
  } else if (st.state === 'hold') updateHold(st, dt);
  for (const p of G.people) p.k = p.y;
}
function updateHold(st, dt) {
  st.t += dt;
  const H0 = st.hold, ws = H0.waves;
  if (st.wave < ws.length && st.t >= ws[st.wave].t) laneWave(st, ws[st.wave], st.wave + 1);
  for (let i = st.queue.length - 1; i >= 0; i--) {
    const o = st.queue[i];
    if (st.t < o.t) continue;
    st.queue.splice(i, 1);
    const p = gridToWorld(6.5 + o.sd * o.far / TILE, pick(HOLD.lanes) + rnd(-0.45, 0.45), st.s);
    G.zombies.push(makeZombie(p.x, p.y, o.type));
  }
  const c = G.tr.cars[1], door = { x: c.cx + c.nx * (CAR.half + 2) * st.side, y: c.cy + c.ny * (CAR.half + 2) * st.side };
  // the next survivor runs once the way out of the door is clear (or after 3 s anyway)
  let near = false;
  queryEll(st.door.x, st.door.y, HOLD.clear, () => { near = true; });
  let out = 0, waiting = false;
  for (const p of G.people) {
    if (p.stop !== st) continue;
    if (p.st === 'wait') {
      if (st.t >= p.go) {
        if (!near || st.blockedT > HOLD.wait) {
          p.st = 'run';
          st.blockedT = 0;
          out++;
        } else waiting = true;
      }
      continue;
    }
    if (p.st === 'grab') {
      out++;
      if (p.by.dead) p.st = 'run';
      else if ((p.gt -= dt) <= 0) catchPerson(p);
      continue;
    }
    if (p.st !== 'run') continue;
    out++;
    const dx = door.x - p.x, dy = door.y - p.y, dd = Math.hypot(dx, dy);
    if (dd < 3) {
      p.st = 'in';
      st.saved++;
      G.surv++;
      floatText(p.x, p.y - 6, '+1 SURVIVOR', U.green);
      SFX.saved();
      continue;
    }
    p.x += dx / dd * CFG.station.run * dt;
    p.y += dy / dd * CFG.station.run * dt;
    p.left = dx < 0;
    p.anim += dt * 8;
  }
  st.blockedT = waiting && near ? st.blockedT + dt : 0;
  // the time is up: the train goes once nobody is out there (or at the door), at most 8 s later
  if (st.t >= H0.T && ((!out && !waiting) || st.t >= H0.T + HOLD.extra)) trainLeaves(st);
}
// The hold now, for the HUD: null, or the station with the seconds left
function holdNow() {
  const st = G && !G.demo ? G.station : null;
  return st && st.state === 'hold' ? st : null;
}

// towers.js - what you build at a station, in the run: MG nests that shoot by themselves, sandbags
// the dead must climb over, barbed wire that slows them. Also the corn round each station (the dead
// come out of it), the sprites of all of these, and their sounds. What is built where is kept in
// SAVE.towers[station id] (the Station tab in the Depot edits it, stationtab.js).

// MG NEST: rounds per second come from the tree (G.up.nest), damage, how many zombies one round
// hits (its target and the nearest within splash px), range (px), round flight time, barrel turn
// speed. SANDBAGS: blocker radius, seconds of pushing before a zombie climbs over, and how long the
// climb takes. Prices and limits per station: a nest (the first is free), sandbags (6 free), wire.
const TOWER = {
  nest: { dmg: 1, hits: 2, splash: 5, range: 96, travel: 0.07, turn: 12, max: 4, cost: [0, 150, 300, 600], free: 1 },
  bag: { r: 11, push: 3, climb: 1, max: 24, cost: 10, free: 6 },
  wire: { max: 12, cost: 15 }
};
const TOWER_TYPES = ['nest', 'bag', 'wire'];

// ---------- what is built (the save)
// The towers at station id: [{t, c, r, paid}], the free kit until anything is changed there.
function towersOf(id) {
  const list = SAVE.towers[id];
  if (Array.isArray(list)) return list.filter((o) => o && TOWER[o.t] && o.c >= 0 && o.c < GRID_C && o.r >= 0 && o.r < GRID_R);
  const d = stopDef(id);
  return d && d.kit ? d.kit.map(([t, c, r]) => ({ t, c, r, paid: 0 })) : [];
}
// how many of type t stand at station id, and how many of them were free
const builtOf = (list, t) => list.filter((o) => o.t === t).length;
// What the next one of type t costs at station id (prices count per station; free kit slots first).
function towerPrice(list, t) {
  const n = builtOf(list, t), free = list.filter((o) => o.t === t && !o.paid).length;
  if (t === 'nest') return free < TOWER.nest.free ? 0 : TOWER.nest.cost[Math.min(n, TOWER.nest.cost.length - 1)];
  if (t === 'bag') return free < TOWER.bag.free ? 0 : TOWER.bag.cost;
  return TOWER.wire.cost;
}

// ---------- the sprites (made when first needed)
// ART.nest[i] = an MG nest with its gun turned to heading i of NEST_N (0 = north, clockwise);
// ART.bag, ART.wire, ART.corn[k] = props (sprite + anchor).
const ART = { nest: [], bag: null, wire: null, corn: [] }, NEST_N = 16;
function towerArt() {
  if (ART.bag) return ART;
  // sandbags: two rows of fat bags, lit from the north-west
  const bagRow = (r, y, n, x0) => {
    for (let i = 0; i < n; i++) {
      const x = x0 + i * 5;
      r(x, y, 5, 4, '#8f7a4e'); r(x, y, 5, 1, '#c4ad78'); r(x, y + 1, 1, 2, '#ad9662'); r(x + 4, y + 1, 1, 3, '#6e5c3a'); r(x, y + 3, 5, 1, '#5a4a2e');
    }
  };
  ART.bag = prop(outline(pix(15, 8, (r) => { bagRow(r, 4, 3, 0); bagRow(r, 0, 2, 2); r(7, 1, 1, 1, '#d9c48c'); }), '#1c160c'), 0);
  // barbed wire: two coils on short posts, barbs glinting
  ART.wire = prop(pix(16, 8, (r) => {
    r(1, 2, 1, 6, '#4a3a28'); r(14, 2, 1, 6, '#4a3a28');
    for (let i = 0; i < 4; i++) {
      const x = 1 + i * 4;
      r(x, 2, 4, 1, '#8b919c'); r(x, 6, 4, 1, '#5d616b'); r(x, 3, 1, 3, '#7a7f89'); r(x + 3, 3, 1, 3, '#4b4f5a');
      r(x + 1, 2, 1, 1, '#d6d9de'); r(x + 2, 4, 1, 1, '#b4b9c1');
    }
  }), 0);
  // corn: a clump of stalks with leaves and pale tassels (3 kinds)
  for (let k = 0; k < 3; k++) {
    const rng = mulberry(77 + k);
    ART.corn.push(prop(pix(11, 19, (r) => {
      for (let s = 0; s < 3; s++) {
        const x = 2 + s * 3 + ((rng() * 2) | 0), h = 13 + ((rng() * 5) | 0), y0 = 19 - h;
        r(x, y0, 1, h, s === 1 ? '#5f6b2c' : '#4c5726');
        for (let y = y0 + 3; y < 17; y += 3 + ((rng() * 2) | 0)) {
          const d = rng() < 0.5 ? -1 : 1;
          r(x + d, y, 1, 1, '#76823a'); r(x + d * 2, y + 1, 1, 1, '#56622a');
        }
        r(x, y0 - 1, 1, 1, '#c9b56a'); r(x - 1, y0, 1, 1, '#9a8c4a'); r(x + 1, y0, 1, 1, '#9a8c4a');
      }
    }), 0));
  }
  // the MG nest: a ring of sandbags round a pit, the gun on a post in the middle
  for (let i = 0; i < NEST_N; i++) {
    const a = i / NEST_N * TAU, sx = Math.sin(a), sy = -Math.cos(a) * FORE;
    const spr = pix(22, 18, (r) => {
      // the pit and the ring
      r(4, 9, 14, 6, '#2a241a');
      for (let k = 0; k < 6; k++) {
        r(2 + k * 3, 13, 4, 4, '#8f7a4e'); r(2 + k * 3, 13, 4, 1, '#c4ad78'); r(5 + k * 3, 14, 1, 3, '#6e5c3a');
      }
      r(1, 9, 3, 5, '#8f7a4e'); r(1, 9, 3, 1, '#b8a16c'); r(18, 9, 3, 5, '#7d6a42'); r(18, 9, 3, 1, '#a8925e');
      for (let k = 0; k < 4; k++) { r(4 + k * 4, 7, 4, 3, '#7d6a42'); r(4 + k * 4, 7, 4, 1, '#b8a16c'); }
      // the gunner's helmet behind the gun
      const hx = Math.round(11 - sx * 3), hy = Math.round(10 - sy * 3);
      r(hx - 1, hy - 1, 3, 2, '#4a5732'); r(hx - 1, hy - 1, 2, 1, '#6a7a48');
      // the gun: a body and a barrel turned to heading a
      r(10, 8, 2, 3, '#3a3e48');
      for (let t = 0; t <= 9; t += 0.5) {
        const x = Math.round(11 + sx * t), y = Math.round(9 + sy * t);
        r(x, y, 1, 1, t < 3 ? '#626875' : '#2a2d33');
      }
      const mx = Math.round(11 + sx * 9), my = Math.round(9 + sy * 9);
      r(mx, my, 1, 1, '#8b919c');
    });
    const p = prop(outline(spr, '#141210'), 0);
    p.mx = 12 + sx * 10;
    p.my = 10 + sy * 10;
    ART.nest.push(p);
  }
  return ART;
}
const nestIdx = (ang) => mod(Math.round(ang / TAU * NEST_N), NEST_N);

// ---------- the towers in a run
// Put station st's towers into the world, where the grid says (they bend with the rails).
function buildTowers(st) {
  const A = towerArt(), up = G.up;
  for (const o of towersOf(st.id)) {
    if (o.t === 'wire' && !up.wire) continue;
    const p = gridToWorld(o.c, o.r, st.s), x = Math.round(p.x), y = Math.round(p.y);
    const t = { t: o.t, c: o.c, r: o.r, x, y };
    st.towers.push(t);
    if (o.t === 'nest') {
      Object.assign(t, { ang: st.side > 0 ? -Math.PI / 2 : Math.PI / 2, cd: rnd(0.3), tgt: null, look: 0, flash: 0 });
      t.sp = { d: A.nest[nestIdx(t.ang)], x, y: y + 4, k: y + 4 };
      G.statics.push(t.sp);
      st.nests.push(t);
    } else if (o.t === 'bag') {
      G.statics.push({ d: A.bag, x, y: y + 3, k: y + 3 });
      st.bags.push(t);
    } else {
      // (wire lies flat: the dead on it are drawn over it)
      G.statics.push({ d: A.wire, x, y: y + 3, k: y - 6 });
      st.wires.push(t);
    }
  }
}
// The corn: two strips on both sides of the station, 120 to 200 px out from the rails.
function buildCorn(st) {
  const A = towerArt();
  for (let a = -86; a <= 104; a += 8) for (const side of [-1, 1]) for (let u = 122; u <= 198; u += 10) {
    const p = gridToWorld(6.5 + side * (u + rnd(-3, 3)) / TILE, 3.5 + (a + rnd(-2, 2)) / TILE, st.s);
    if (Math.random() < 0.18) continue;
    G.statics.push({ d: pick(A.corn), x: Math.round(p.x), y: Math.round(p.y), k: Math.round(p.y) });
  }
}
// Every station near the train: its nests shoot, its sandbags hold the dead back, its wire slows them.
function updateTowers(dt) {
  const tr = G.tr;
  for (const st of G.stations) {
    if (!st.towers.length) continue;
    // towers wake when the train is 400 px away, and sleep once it is far past
    const d = tr.s - st.stopS;
    if (!st.awake && d < 400 && d > -400) st.awake = true;
    if (st.awake && d < -600) st.awake = false;
    if (st.awake) for (const n of st.nests) updateNest(n, dt);
    for (const b of st.bags) holdBack(b, dt);
    for (const w of st.wires) slowDown(w, dt);
  }
  updateTowerRounds(dt);
}
// The best target for a nest: the dead holding a survivor, then the dead on the train, then on
// the rails, then the nearest. (Not one the rounds in the air will already kill.)
function nestTarget(n) {
  let best = null, bk = Infinity;
  const s0 = G.tr.s;
  queryEll(n.x, n.y, TOWER.nest.range, (z, d) => {
    if (z.pending >= z.hp) return;
    let k = 3000 + d;
    if (z.st === 2) k = 1000 + d;
    else if (z.st === 1) k = 2000 + d;
    if (k > 1000) for (const p of G.people) if (p.st === 'grab' && p.by === z) k = d;
    if (k < bk) {
      bk = k;
      best = z;
    }
  });
  return best;
}
function updateNest(n, dt) {
  const R = TOWER.nest;
  n.flash = Math.max(0, n.flash - dt);
  let z = n.tgt;
  if (z && (z.dead || Math.hypot(z.x - n.x, (z.y - n.y) / FORE) > R.range + 4)) z = null;
  n.look -= dt;
  if (!z || n.look <= 0) {
    z = nestTarget(n) || (z && z.pending < z.hp ? z : null);
    n.look = 0.1;
  }
  n.tgt = z;
  const want = z ? Math.atan2(z.x - n.x, -(z.y - n.y) / FORE) : n.ang, da = mod(want - n.ang + Math.PI, TAU) - Math.PI;
  n.ang = mod(n.ang + clamp(da, -R.turn * dt, R.turn * dt), TAU);
  n.sp.d = ART.nest[nestIdx(n.ang)];
  n.cd -= dt;
  if (z && Math.abs(da) < 0.35 && n.cd <= 0 && z.pending < z.hp) {
    nestFire(n, z);
    n.cd += 1 / G.up.nest;
  }
  n.cd = Math.max(0, n.cd);
}
// One round from nest n at zombie z: it lands where z will be when it gets there.
function nestFire(n, z) {
  const T = TOWER.nest.travel, A = n.sp.d;
  z.pending += TOWER.nest.dmg;
  G.trounds.push({ n, tgt: z, bx: z.x + z.vx * T, by: z.y + z.vy * T, age: 0, T,
    sx: n.sp.x - A.ax + A.mx, sy: n.sp.y - A.ay + A.my });
  n.flash = 0.05;
  part({ x: n.x + rnd(-2, 2), y: n.y + 2, z: 6, vx: rnd(-20, 20), vy: rnd(-6, 6), vz: rnd(20, 35), g: 220, life: 0.45, max: 0.45, s: 1, c: '#e3b04b' });
  SFX.nest();
}
function updateTowerRounds(dt) {
  const rs = G.trounds;
  for (let i = rs.length - 1; i >= 0; i--) {
    const r = rs[i];
    r.age += dt;
    if (r.age < r.T) continue;
    rs[i] = rs[rs.length - 1];
    rs.pop();
    nestImpact(r);
  }
}
// The round lands: its target if it is still in the spot, and the nearest other zombie within 5 px.
function nestImpact(r) {
  const T = r.tgt, R = TOWER.nest, x = r.bx, y = r.by;
  T.pending = Math.max(0, T.pending - R.dmg);
  let hits = 0, other = null, od = R.splash;
  if (!T.dead && Math.hypot(T.x - x, (T.y - y) / FORE) < 8) {
    hitZombie(T, R.dmg, 'nest');
    hits++;
  }
  queryEll(x, y, R.splash, (z, d) => {
    if (z !== T && d <= od) {
      od = d;
      other = z;
    }
  });
  if (other && hits < R.hits) hitZombie(other, R.dmg, 'nest');
  lights.push({ x, y, z: 4, r: 7, c: '#ffb060', life: 0.07, max: 0.07, a: 0.6 });
  for (let k = 0; k < 2; k++) {
    const a = rnd(TAU), s = rnd(15, 40);
    part({ x, y, z: 4, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(10, 35), g: 160, life: rnd(0.12, 0.25), max: 0.25,
      s: 1, c: pick(['#ffe2a0', '#ffb347']), add: true, drag: 1.5 });
  }
}
// Sandbags: the dead cannot walk through. One that has pushed on them for 3 s climbs over (1 s).
function holdBack(b, dt) {
  const R = TOWER.bag;
  queryEll(b.x, b.y, R.r + 6, (z, d) => {
    if (z.st === 2 || G.t < (z.climbEnd || 0)) return;
    const m = R.r + (z.big ? 6 : 3.5) * 0.6;
    if (d >= m || d < 1e-4) return;
    const dx = z.x - b.x, dy = (z.y - b.y) / FORE;
    z.x = b.x + dx / d * m;
    z.y = b.y + dy / d * m * FORE;
    if (z.pushT !== G.t) {
      if (G.t - (z.pushT || -9) > 0.3) z.push = 0;
      z.push += dt;
      z.pushT = G.t;
      if (z.push >= R.push) {
        z.push = 0;
        z.climbEnd = G.t + R.climb;
      }
    }
  });
}
// Barbed wire: the dead on it walk at 40% (this step's walk is taken back by 60%).
function slowDown(w, dt) {
  const k = 1 - CFG.wire.slow;
  queryEll(w.x, w.y, 12, (z) => {
    if (z.st === 2 || z.wireT === G.t || Math.abs(z.x - w.x) > 8 || Math.abs(z.y - w.y) > 8) return;
    z.wireT = G.t;
    z.x -= (z.vx - z.kbx) * dt * k;
    z.y -= (z.vy - z.kby) * dt * k;
  });
}

// ---------- drawing (in the world, with the glows)
// The nests' tracers and muzzle flashes.
function drawTowerFx() {
  if (G.demo || !G.trounds) return;
  for (const r of G.trounds) {
    const u = r.age / r.T, h = clamp(u * 1.2, 0, 1), t0 = Math.max(0, h - 0.5);
    const ex = r.bx, ey = r.by - 6, hx = lerp(r.sx, ex, h), hy = lerp(r.sy, ey, h);
    pl(ctx, lerp(r.sx, ex, t0), lerp(r.sy, ey, t0), hx, hy, '#c9772f');
    ctx.fillStyle = '#fff6e0';
    ctx.fillRect(Math.round(hx), Math.round(hy), 1, 1);
  }
  for (const st of G.stations) for (const n of st.nests) {
    if (n.flash <= 0) continue;
    const A = n.sp.d, mx = Math.round(n.sp.x - A.ax + A.mx), my = Math.round(n.sp.y - A.ay + A.my);
    ctx.fillStyle = '#ffd27a';
    ctx.fillRect(mx - 1, my, 3, 1);
    ctx.fillRect(mx, my - 1, 1, 3);
    ctx.fillStyle = '#fff6e0';
    ctx.fillRect(mx, my, 1, 1);
    light(mx, my, 7, '#ffb347', 0.7);
  }
}

// skills.js - the first ring of the skill tree: things you SEE in a run. CHAIN SHOT (a 25mm kill
// sparks on to more zombies), the COW CATCHER (a steel plow on the engine that throws walkers and
// runners aside), GOLDEN ZOMBIES (rare gold ones that run away and pay big) and the ARMOR plates on
// the engine. Also the 25mm's kill feel: a short hit-stop when one round kills 3 or more.

// CHAIN SHOT: how far a spark jumps (px), its damage, seconds between two jumps.
// GOLDEN ZOMBIES: 1 in every[l] new zombies is golden at level l, the scrap one pays, its speed
// (px/s), and how near the heli or the train (px) it starts to run away.
const SK = {
  chain: { reach: 40, dmg: 1, gap: 0.04 },
  gold: { every: [0, 60, 40, 25], value: 25, speed: [26, 31], fear: 190 }
};
// What a level of the new nodes gives (the tree's info box shows the same numbers).
Object.assign(UP, {
  chain: (l) => l,                          // CHAIN SHOT: zombies a kill sparks on to
  gold: (l) => SK.gold.every[l] || 0        // GOLDEN ZOMBIES: 1 in this many (0 = none)
});
// A tutorial moment for part D's prompts (nothing happens when they are not there).
function skillEvent(name, data) {
  if (typeof tutEvent === 'function') tutEvent(name, data || {});
}

// ---------- one 25mm round's kills
// After a player round lands: a short hit-stop when it killed 3 or more, and each kill sparks on
// with CHAIN SHOT.
function roundKills(list) {
  if (G.demo || !list.length) return;
  if (list.length >= 3) hitStop(0.03);
  if (G.up.chain) for (const z of list) chainFrom(z, G.up.chain, [z]);
}

// ---------- CHAIN SHOT
// zaps = the lightning lines in the air: [x0, y0, x1, y1, seed, age]
const zaps = [];
// A spark jumps from zombie z0 to the nearest living one within reach (not hit by this chain yet),
// hurts it, and jumps on while left > 1.
function chainFrom(z0, left, hit) {
  let best = null, bd = SK.chain.reach + 1;
  queryEll(z0.x, z0.y, SK.chain.reach, (z, d) => {
    if (d < bd && !hit.includes(z)) { bd = d; best = z; }
  });
  if (!best) return;
  hit.push(best);
  const x0 = z0.x, y0 = z0.y - z0.S.h * 0.5, x1 = best.x, y1 = best.y - best.S.h * 0.5;
  zaps.push({ x0, y0, x1, y1, seed: (Math.random() * 1e6) | 0, t: 0, T: 0.18 });
  // a small flash and sparks where it lands
  lights.push({ x: x1, y: best.y, z: best.S.h * 0.5, r: 12, c: '#ffd24a', life: 0.12, max: 0.12, a: 0.9 });
  for (let k = 0; k < 4; k++) {
    const a = rnd(TAU), s = rnd(20, 50);
    part({ x: x1, y: best.y, z: best.S.h * 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(10, 40), g: 120,
      life: rnd(0.15, 0.3), max: 0.3, s: 1, c: pick(['#fff6c0', '#ffd24a']), add: true, drag: 2 });
  }
  SFX.zap();
  if (hitZombie(best, SK.chain.dmg, 'chain') && !G.chainSeen) {
    G.chainSeen = true;
    skillEvent('chain_first');
  }
  if (left > 1) later(SK.chain.gap, () => chainFrom(best, left - 1, hit));
}
// The lightning: a jagged 1 px line that flickers (its kinks move every 0.04 s), white in the
// middle of a yellow glow, gone in 0.18 s.
function drawZaps() {
  ctx.globalCompositeOperation = 'source-over';
  drawPlow();
  for (const z of zaps) {
    const u = z.t / z.T, f = (z.t / 0.04) | 0, dx = z.x1 - z.x0, dy = z.y1 - z.y0, l = Math.hypot(dx, dy) || 1;
    const n = Math.max(2, Math.round(l / 6)), px = -dy / l, py = dx / l;
    let ax = z.x0, ay = z.y0;
    ctx.globalAlpha = 1 - u * 0.7;
    for (let i = 1; i <= n; i++) {
      const o = i === n ? 0 : (hrnd(z.seed, i, f) - 0.5) * 7;
      const bx = z.x0 + dx * i / n + px * o, by = z.y0 + dy * i / n + py * o;
      pl(ctx, ax, ay, bx, by, u < 0.4 ? '#ffffff' : '#ffe27a');
      ax = bx;
      ay = by;
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const z of zaps) light((z.x0 + z.x1) / 2, (z.y0 + z.y1) / 2, 10, '#ffd24a', 0.4 * (1 - z.t / z.T));
  ctx.globalAlpha = 1;
}

// ---------- the COW CATCHER and the ARMOR plates
// The plow throws a walker or runner aside: it dies, and the train loses no health and no speed.
function plow(z) {
  kill(z, 'train', 0, 0, 0);
  for (let k = 0; k < 3; k++) part({ x: z.x, y: z.y, z: 2, vx: rnd(-40, 40), vy: rnd(-20, 10), vz: rnd(15, 45), g: 160,
    life: rnd(0.15, 0.3), max: 0.3, s: 1, c: pick(['#ffffff', '#ffe2a0']), add: true, drag: 2 });
  if (!G.demo) {
    addShake(0.04);
    SFX.clang();
  }
}
// Drawn on the engine (car c) after its sprite, at its heading: steel plates down both sides with
// rivets (from ARMOR 1; longer with more levels).
const KIT = (thermal) => (thermal ? ['#141414', '#3a3a3a', '#5a5a5a', '#3a3a3a'] : ['#16181c', '#5d636e', '#b8bec8', '#c8432e']);
const kpx = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
function drawEngineKit(c) {
  const up = G.up, k = kpx, st = KIT(thermal);
  if (up.armor) {
    const len = 4 + Math.min(5, up.armor) * 2;
    for (const s of [-1, 1]) for (let al = -len; al <= len; al++) {
      const x = c.cx + c.dx * al + c.nx * s * 8.5, y = c.cy + c.dy * al + c.ny * s * 8.5;
      k(x, y - 2, st[0]);
      k(x, y - 3, st[1]);
      k(x, y - 4, al % 5 === 0 ? st[2] : st[1]);
      k(x, y - 5, st[0]);
    }
  }
}

// The COW CATCHER: a steel plow round the engine's nose, a wedge of bars with its tip 10 px ahead
// and red on top at the point. (Drawn over the headlights' glow, so it always reads.)
function drawPlow() {
  if (!G.up.cow) return;
  const c = G.tr.cars[0], k = kpx, st = KIT(thermal);
  for (let u = -9; u <= 9; u += 0.5) {
    const f = 2 + (9 - Math.abs(u)) * 0.95, x = c.x0 + c.dx * f + c.nx * u, y = c.y0 + c.dy * f + c.ny * u;
    const bar = (Math.round(u * 2) & 3) < 2;
    k(x, y, st[0]);
    k(x, y - 1, bar ? st[2] : st[1]);
    k(x, y - 2, bar ? st[2] : st[1]);
    k(x, y - 3, Math.abs(u) < 3 ? st[3] : st[0]);
  }
}

// ---------- GOLDEN ZOMBIES
// A new zombie z is golden 1 time in G.up.gold (never a brute, never in the demo). Returns z.
function goldRoll(z) {
  if (G.demo || !G.up.gold || z.big || Math.random() * G.up.gold >= 1) return z;
  return makeGold(z);
}
// Turn zombie z golden. Returns z.
function makeGold(z) {
  z.gold = true;
  z.value = SK.gold.value;
  z.run = true;
  z.hp = z.max = 1;
  z.sp = rnd(SK.gold.speed[0], SK.gold.speed[1]);
  return z;
}
// Where a golden zombie runs: away from the heli (the middle of the view) and from the rails, when
// either is near; else it strolls out into the field. [x, y] on the ground.
const GF = [0, 0];
function goldFlee(z) {
  const F = SK.gold.fear, hx = G.camX + W / 2, hy = G.camY + H / 2;
  const ax = z.x - hx, ay = (z.y - hy) / FORE, ad = Math.hypot(ax, ay) || 1, side = z.x < trackX(z.y) ? -1 : 1;
  const rd = Math.abs(z.x - trackX(z.y));
  let vx = side * (rd < F ? 1.2 * (1 - rd / F) + 0.2 : 0.15), vy = -0.15;
  if (ad < F) {
    const w = 1.6 * (1 - ad / F) + 0.3;
    vx += ax / ad * w;
    vy += ay / ad * w;
  }
  GF[0] = z.x + vx * 60;
  GF[1] = z.y + vy * 60 * FORE;
  return GF;
}
// A golden zombie dies: a gold ring, a burst of gold, a shower of coins to the counter and a chime.
function goldKill(z, sc) {
  rings.push({ x: z.x, y: z.y, r0: 3, r1: 26, t: 0, T: 0.4, c: '#ffd24a', w: 2 });
  lights.push({ x: z.x, y: z.y, z: 6, r: 30, c: '#ffd24a', life: 0.3, max: 0.3, a: 0.9 });
  for (let k = 0; k < 16; k++) {
    const a = rnd(TAU), s = rnd(25, 80);
    part({ x: z.x, y: z.y, z: 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(30, 90), g: 200, life: rnd(0.4, 0.8),
      max: 0.8, s: 1, c: pick(['#fff6c0', '#ffd24a', '#e3b04b']), add: true, drag: 1.5 });
  }
  if (!sc) return;
  for (let k = 0; k < 10 && coins.length < 60; k++) coins.push({ x0: z.x - G.camX + rnd(-5, 5), y0: z.y - G.camY - 8 + rnd(-4, 4), t: -k * 0.04, T: rnd(0.55, 0.8) });
  SFX.gold();
}
// A gold statue copy of sprite src: each pixel's brightness picks a shade of gold; the dark
// outline stays dark.
const GOLDS = [[42, 26, 6], [122, 84, 24], [184, 134, 42], [232, 184, 74], [255, 224, 138]];
function goldSpr(src) {
  const [c, g] = mk(src.width, src.height, true);
  g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const L = d[i] * 0.3 + d[i + 1] * 0.55 + d[i + 2] * 0.15, col = GOLDS[L < 34 ? 0 : L < 70 ? 1 : L < 110 ? 2 : L < 160 ? 3 : 4];
    d[i] = col[0];
    d[i + 1] = col[1];
    d[i + 2] = col[2];
  }
  g.putImageData(im, 0, 0);
  return c;
}
// The gold look: a golden copy of its frame (made once per clothes), and sparkles round it.
// Returns false when the plain frame must show (the white hit flash, the thermal camera).
function drawGold(z) {
  if (z.flash > 0 || thermal) return false;
  const S = z.S, f = (z.anim | 0) & 1;
  if (!S.gold) S.gold = S.walk.map((fr) => [goldSpr(fr.n), goldSpr(fr.nf)]);
  blit(S.gold[f][z.left ? 1 : 0], Math.round(z.x - S.ax), Math.round(z.y - S.ay));
  // two sparkles that blink round it
  for (let i = 0; i < 2; i++) {
    const p = (realT * 3 + i * 0.5 + (z.wob % 1)) % 1;
    if (p > 0.45) continue;
    const sx = Math.round(z.x + (hrnd(i, (realT * 3) | 0, z.sp * 100) - 0.5) * 12), sy = Math.round(z.y - S.h * hrnd(i + 7, (realT * 3) | 0, 3));
    ctx.fillStyle = '#fff6c0';
    ctx.fillRect(sx, sy, 1, 1);
    if (p < 0.25) {
      ctx.fillRect(sx - 1, sy, 3, 1);
      ctx.fillRect(sx, sy - 1, 1, 3);
    }
  }
  return true;
}

// ---------- each step
function updateSkills(dt) {

// render.js - draws one frame of the world: ground and its marks, tufts, the helicopter's shadow and
// the other shadows, then trees, props, the train, the station, the safe zone, survivors and the
// dead sorted by depth (the dead behind a tree show through it), fires, particles, explosions,
// flying bodies, tracers and glows (headlights, lamps, searchlights), the mist and cloud shadows,
// then the color grade and vignette, or the thermal camera look (grey, hot things white).

let VIG = null, GRADE = null, HAZE = null, SCAN = null, GRAIN = null, MIST = null, BODYSH = null;
const CLOUDSPR = [];

// Smooth noise on a grid of cell px from a seeded rng, for a w x h area (from Ball x Archers).
function makeNoise(rng, cell, w, h) {
  const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2, v = new Float32Array(gw * gh);
  for (let i = 0; i < v.length; i++) v[i] = rng();
  return (x, y) => {
    const fx = x / cell, fy = y / cell, ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty), o = iy * gw + ix;
    return lerp(lerp(v[o], v[o + 1], sx), lerp(v[o + gw], v[o + gw + 1], sx), sy);
  };
}
// Made once: the mist band, 2 cloud shadows, the shadow under a flying body.
function bakeStatic() {
  const fr = mulberry(404);
  let g;
  [MIST, g] = mk(640, 48);
  const nm = makeNoise(fr, 22, 1280, 48);
  g.fillStyle = '#8b9894';
  for (let y = 0; y < 48; y++) for (let x = 0; x < 640; x++) {
    // the noise wraps round at 640 px, so the band tiles without a seam
    const t = Math.sin(y / 48 * Math.PI), n = lerp(nm(x, y), nm(x + 640, y), x / 640);
    if ((n * 1.3 - 0.35) * t > bayer(x, y)) g.fillRect(x, y, 1, 1);
  }
  const cr = mulberry(21);
  CLOUDSPR.length = 0;
  for (let k = 0; k < 2; k++) {
    const cw = 200, ch = 110, n = makeNoise(cr, 18, cw, ch);
    const [cc, cg] = mk(cw, ch);
    cg.fillStyle = '#000';
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const dx = (x - cw / 2) / (cw / 2), dy = (y - ch / 2) / (ch / 2);
      if ((1 - Math.sqrt(dx * dx + dy * dy)) * 1.4 + n(x, y) * 0.8 - 0.55 > bayer(x, y)) cg.fillRect(x, y, 1, 1);
    }
    CLOUDSPR.push(cc);
  }
  BODYSH = shadowSpr(9);
}
// Made again for every size of the picture: vignette, color grade, sun haze, thermal grain and lines.
function bakeOverlays() {
  let g, gr;
  [VIG, g] = mk(W, H);
  gr = g.createRadialGradient(W * 0.5, H * 0.46, H * 0.3, W * 0.5, H * 0.5, Math.max(W, H) * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // warm top left to cool bottom right
  [GRADE, g] = mk(W, H);
  gr = g.createLinearGradient(0, 0, W, H);
  gr.addColorStop(0, 'rgba(255,186,120,1)');
  gr.addColorStop(0.45, 'rgba(128,128,128,1)');
  gr.addColorStop(1, 'rgba(70,96,150,1)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // warm sun haze from above the top edge
  [HAZE, g] = mk(W, H);
  gr = g.createRadialGradient(W * 0.47, -60, 10, W * 0.47, -60, Math.max(330, W * 0.52));
  gr.addColorStop(0, 'rgba(255,196,130,0.16)');
  gr.addColorStop(1, 'rgba(255,196,130,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  // thermal: sensor noise and faint scan lines
  [GRAIN, g] = mk(W + 64, H + 64);
  const rg = mulberry(9);
  for (let i = 0; i < (W + 64) * (H + 64) * 0.18; i++) {
    g.fillStyle = rg() < 0.5 ? '#ffffff' : '#000000';
    g.fillRect((rg() * (W + 64)) | 0, (rg() * (H + 64)) | 0, 1, 1);
  }
  [SCAN, g] = mk(W, H);
  g.fillStyle = 'rgba(0,0,0,0.1)';
  for (let y = 0; y < H; y += 2) g.fillRect(0, y, W, 1);
}

// ---------- what is in view
// DL = everything standing, sorted by depth (k: the ground y of its front, or just in front of the
// car for the dead holding on to the train). CARS = the train's cars as draw-list entries.
const DL = [], TREES = [], VZ = [], FIRES = [], CARS = [];
const byK = (a, b) => a.k - b.k;
// Collect the props (from the chunk plans and the safe zone), the train and the living dead in
// view, sorted by depth.
function gather(ci0, cj0, ci1, cj1) {
  DL.length = 0;
  TREES.length = 0;
  VZ.length = 0;
  FIRES.length = 0;
  const x0 = G.camX - 8, x1 = G.camX + W + 8, y0 = G.camY - 8, y1 = G.camY + H + 8;
  for (let j = cj0 - 1; j <= cj1 + 1; j++) for (let i = ci0 - 1; i <= ci1 + 1; i++) {
    const pl = plan(i, j);
    for (const p of pl.props) {
      const d = p.d, l = p.x - d.ax, t = p.y - d.ay;
      if (l > x1 || l + d.spr.width < x0 || t > y1 || p.y + 1 < y0) continue;
      DL.push(p);
      if (d.tree) TREES.push(p);
    }
    for (const f of pl.fires) if (f.x > x0 - 30 && f.x < x1 + 30 && f.y > y0 - 30 && f.y < y1 + 30) FIRES.push(f);
  }
  for (const p of G.statics) {
    const d = p.d, l = p.x - d.ax;
    if (l > x1 || l + d.spr.width < x0 || p.y - d.ay > y1 || p.y + 1 < y0) continue;
    DL.push(p);
  }
  for (let i = 0; i < CAR.n; i++) {
    const c = CARS[i] || (CARS[i] = { isCar: true, i, k: 0 }), tc = G.tr.cars[i];
    c.k = tc.k;
    if (tc.cx > x0 - 30 && tc.cx < x1 + 30 && tc.cy > y0 - 30 && tc.cy < y1 + 40) DL.push(c);
  }
  for (const p of G.people) {
    if ((p.st === 'wait' || p.st === 'run' || p.st === 'grab') && p.x > x0 && p.x < x1 && p.y > y0 && p.y < y1 + 10) DL.push(p);
  }
  for (const z of G.zombies) {
    if (z.dead || z.x < x0 - 10 || z.x > x1 + 10 || z.y < y0 || z.y > y1 + 24) continue;
    DL.push(z);
    VZ.push(z);
  }
  DL.sort(byK);
}

// ---------- pieces
function zImg(z) {
  const fr = z.S.walk[(z.anim | 0) & 1];
  if (z.flash > 0) return z.left ? fr.wf : fr.w;
  if (thermal) return z.left ? fr.hf : fr.h;
  return z.left ? fr.nf : fr.n;
}
function drawZombie(z) {
  const S = z.S;
  if (z.gold && drawGold(z)) return;
  blit(zImg(z), Math.round(z.x - S.ax), Math.round(z.y - S.ay));
  if (z.big && z.hp < z.max) {
    const w = 14, x = Math.round(z.x - w / 2), y = Math.round(z.y - S.ay - 4);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x - 1, y - 1, w + 2, 4);
    ctx.fillStyle = '#3a1210';
    ctx.fillRect(x, y, w, 2);
    ctx.fillStyle = '#c8432e';
    ctx.fillRect(x, y, Math.max(1, Math.round(w * z.hp / z.max)), 2);
  }
}
// A car of the train, turned to its heading on the rails (red while it takes damage). The
// survivors ride on the flatcar, standing on its deck; with the flatcar gun, it stands at the front
// and two of them stay at the back. While the Turbo Ram runs the engine glows orange.
function drawCar(i) {
  const t = TRAIN[i], c = G.tr.cars[i], a = angIdx(c.ang);
  const img = thermal ? t.h[a] : G.tr.hit[i] > 0 ? carRed(t, a) : t.n[a], x0 = Math.round(c.cx) - img.ox, y0 = Math.round(c.cy) - img.oy;
  blit(img, x0, y0);
  if (i === 0) drawEngineKit(c);
  if (i === 0 && G.ram.on && !thermal) {
    ctx.globalAlpha = ramK() * (0.3 + 0.08 * Math.sin(realT * 18));
    blit(carGlow(t, a), x0, y0);
    ctx.globalAlpha = 1;
  }
  if (i !== 2) return;
  const gun = G.up.gun > 0, R = gun ? RIDERS_GUN : RIDERS;
  if (gun) drawCannon();
  for (let k = 0; k < R.length; k++) {
    const [u, al] = R[k], s = SURV[k], bob = Math.sin(realT * 5 + k * 1.7) > 0.6 ? 1 : 0;
    const x = c.cx + c.dx * al + c.nx * u, y = c.cy + c.dy * al + c.ny * u;
    blit(thermal ? s.h : s.n, Math.round(x) - 2, Math.round(y) - 10 - bob);
  }
}
// The deck's height over the rails (the rail cannon stands on it).
const DECK = 3;
// The train's shadow: each car's footprint, moved away from the sun by its height.
function drawTrainShadow() {
  for (let i = 0; i < CAR.n; i++) {
    const c = G.tr.cars[i], h = TRAIN[i].tall;
    blit(FOOT[angIdx(c.ang)], Math.round(c.cx + h * SUNX) - 18, Math.round(c.cy + h * SUNY) - 18);
