// The 105 lands: everything near dies, the edge of the blast throws the rest back. Too close to
// the train, the blast hurts the train as well; it kills survivors on foot too.
function explode(x, y, player) {
  let killed = 0, value = 0;
  queryEll(x, y, CFG.he.hurt, (z, d) => {
    if (d >= CFG.he.kill) {
      z.hp -= 4;
      z.flash = 0.25;
      if (z.st !== 2) {
        const dx = z.x - x, dy = (z.y - y) / FORE, l = Math.hypot(dx, dy) || 1;
        z.kbx += dx / l * 60;
        z.kby += dy / l * 60 * FORE;
      }
      if (z.hp > 0) return;
    }
    killed++;
    kill(z, 'he', x, y, d);
    value += z.paid;
  });
  boomFx(x, y, true);
  if (!G.demo) {
    addShake(0.75);
    hitStop(killed >= 12 ? 0.1 : 0.04, 0.25);
    SFX.boom();
  }
  for (const p of G.people) if ((p.st === 'run' || p.st === 'grab') && Math.hypot(p.x - x, (p.y - y) / FORE) < CFG.he.kill) catchPerson(p);
  const td = trainDist(x, y);
  if (player && td < CFG.he.close && !G.demo && !G.result) {
    const a = Math.round(14 * (1 - td / CFG.he.close)) + 3, k = carNear(x, y), c = G.tr.cars[k];
    hurtTrain(a, k, 'shell');
    floatText(c.cx, c.cy - 8, '-' + a, U.red);
    banner('CHECK FIRE!', 'YOUR SHELL HIT THE TRAIN', U.red, 3);
    SFX.radio();
  }
  if (player && scoring()) {
    G.bestBlast = Math.max(G.bestBlast, killed);
    if (value > 0) addTotal(x, y - 10, value, U.blue, scrapPopScale(true));
    if (killed >= 4) {
      const name = killed >= 25 ? 'MASSACRE' : killed >= 12 ? 'CARNAGE' : 'MULTI KILL';
      banner(name + ' ×' + killed, '+' + value + ' SCRAP', killed >= 12 ? '#ff7a4a' : U.amber, 2);
    }
  }
}
// Bodies in the air: they fall, bounce once if they come down hard, then lie as corpses.
function updateBodies(dt) {
  const bs = G.bodies;
  for (let i = bs.length - 1; i >= 0; i--) {
    const b = bs[i];
    b.age += dt;
    b.vz -= 320 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    b.rot += b.spin * dt;
    if (b.z > 0) continue;
    b.z = 0;
    if (b.vz < -70) {
      b.vz *= -0.3;
      b.vx *= 0.5;
      b.vy *= 0.5;
      b.spin *= 0.5;
      part({ x: b.x, y: b.y, z: 0, vx: 0, vy: 0, vz: 4, g: 0, life: 0.5, max: 0.5, s: 3, c: 'rgba(90,80,64,0.45)', grow: 4, smoke: true });
    } else {
      stampCorpse(b.S, b.x, b.y);
      bs[i] = bs[bs.length - 1];
      bs.pop();
    }
  }
}
// Burning wrecks and farms in view: smoke columns and embers.
function updateFireSpots(dt) {
  const [i0, j0, i1, j1] = viewChunks();
  for (let j = j0 - 1; j <= j1 + 1; j++) for (let i = i0 - 1; i <= i1 + 1; i++) {
    for (const f of plan(i, j).fires) {
      const k = f.big ? 1 : 0.6;
      if (Math.random() < dt * 2.2 * k) part({ x: f.x + rnd(-2, 2), y: f.y + rnd(-1, 1), z: f.big ? 9 : 5, vx: rnd(4, 9), vy: rnd(-2, 1),
        vz: rnd(8, 14), g: 0, life: rnd(2.2, 3.6), max: 3.6, s: rnd(2, 4) * k + 1,
        c: pick(['rgba(44,40,38,0.6)', 'rgba(58,52,48,0.55)', 'rgba(36,33,31,0.6)']), grow: 3.5, drag: 0.35, smoke: true });
      if (Math.random() < dt * 5 * k) part({ x: f.x + rnd(-3, 3), y: f.y, z: rnd(4, 9), vx: rnd(-4, 6), vy: rnd(-2, 2), vz: rnd(14, 30),
        g: -4, life: rnd(0.5, 1.1), max: 1.1, s: 1, c: pick(['#ffc27a', '#ff8a3a', '#e2552f']), add: true, drag: 1.2 });
    }
  }
}

// ---------- the autopilot (the title demo, and tests through window.__sr.bot)
// It shoots the dead on the train first, then the ones near the survivors, then the ones on the
// rails nearest the engine, then whoever is nearest the train. The Turbo Ram tackles a Dead Wall
// or a crowd on the rails.
function autopilot(dt) {
  G.botT -= dt;
  if (G.botT <= 0 || !G.botZ || G.botZ.dead) {
    G.botT = 0.2;
    let bestZ = null, bs = 1e9;
    for (const z of G.zombies) {
      if (z.dead) continue;
      const sx = z.x - G.camX, sy = z.y - G.camY;
      if (sx < 6 || sx > W - 6 || sy < 26 || sy > H - 6) continue;
      let s;
      const prey = preyNear(z, 50);
      if (prey && prey.by === z) s = -100;
      else if (z.st === 2) s = 0;
      else if (prey) s = 100;
      else if (z.st === 1) s = 300 + Math.max(0, trackLocal(z.x, z.y, TL).a - G.tr.s + 400);
      else s = 900 + trainDist(z.x, z.y);
      if (s < bs) { bs = s; bestZ = z; }
    }
    G.botZ = bestZ;
  }
  // the Turbo Ram: at a Dead Wall, or when 6 or more dead stand on the rails ahead (but
  // not when a Dead Wall is less than 600 m ahead: it saves the Ram for that)
  if (ramState() === 'ready' && (wallAhead(130) || G.railAhead >= 6 && !wallAhead(1200))) tryRam(true);
  return { z: G.botZ && !G.botZ.dead ? G.botZ : null };
}
// The title demo: the heli fights by itself and the bot handles the Ram.
function attract(dt) {
  autopilot(dt);
}
// In play with the bot on: the heli fights by itself and the bot handles the Ram.
function botPlay(dt) {
  autopilot(dt);
}

// ---------- the ride
// Distance is only route bookkeeping. Riding alone never creates scrap.
function ride(d) {
  G.ride += d;
  G.maxKm = Math.max(G.maxKm, DK());
}

// ---------- one step of the game (STEP seconds)
function step(dt) {
  G.t += dt;
  const tr = G.tr, st = G.station;
  // The train recovers after bumps, brakes at its goal, and remains parked after winning.
  if (G.result === 'lost') tr.v = Math.max(0, tr.v - 30 * dt);
  else if (G.result === 'won') tr.v = 0;
  else if (st && st.state === 'braking') {
    // A zombie impact can slow the train below its stopping curve. Recover gently so an
    // approach does not become a permanent crawl, while the same curve still prevents overshoot.
    tr.v = Math.min(CFG.train.cruise, tr.v + CFG.train.accel * dt,
      Math.sqrt(2 * CFG.train.brake * Math.max(0, tr.s - st.stopS)) + 1.5);
    if (tr.s - st.stopS < 0.6) {
      tr.v = 0;
      trainStops(st);
    }
  } else {
    // the Turbo Ram: up to its top speed in 0.4 s, then back down to the cruise over 1 s (also after
    // a Ram cut short). Otherwise the train gets back up to its cruise.
    const R = CFG.ram, cr = CFG.train.cruise, up = (R.speed - cr) / R.rise, down = (R.speed - cr) / R.ease;
    if (G.ram.on && G.ram.t < G.ram.dur) tr.v = Math.min(R.speed, tr.v + up * dt);
    else if (tr.v > cr) tr.v = Math.max(cr, tr.v - down * dt);
    else tr.v = Math.min(cr, tr.v + CFG.train.accel * dt);
  }
  updateRam(dt);
  tr.s -= tr.v * dt;
  layoutTrain();
  if (!G.demo && !G.result) ride(tr.v * dt);
  for (let k = 0; k < CAR.n; k++) if (tr.hit[k] > 0) tr.hit[k] -= dt;
  tr.hpShown = Math.max(tr.hp, tr.hpShown - dt * 12);
  // the little fires it runs over go out
  for (const f of flames) if (Math.abs(f.x - trackX(f.y)) < CAR.half + 2 && trainDist(f.x, f.y) < 1) f.life = 0;
  // wheels over the rail joints, and smoke from the stack
  tr.clack += tr.v * dt;
  if (tr.clack > 30) {
    tr.clack -= 30;
    if (!G.demo && mode !== 'summary') SFX.clack();
  }
  tr.smokeT -= dt;
  if (tr.smokeT <= 0 && G.result !== 'lost') {
    // (the Turbo Ram: thick black smoke, fast)
    const c = tr.cars[0], k = ramK();
    tr.smokeT = tr.v > 1 ? 0.16 - k * 0.11 : 0.4;
    part({ x: c.x0 - c.dx * 15 + rnd(-1, 1), y: c.y0 - c.dy * 15, z: 10, vx: rnd(-3, 3) + 3 + k * rnd(8, 16), vy: rnd(-2, 2), vz: rnd(14, 22) + k * 18, g: 0,
      life: rnd(1.6, 2.6) - k * 0.6, max: 2.6, s: rnd(2, 3) + k, c: k > 0.5 ? pick(['rgba(20,18,18,0.7)', 'rgba(32,30,28,0.65)'])
        : pick(['rgba(40,38,36,0.6)', 'rgba(56,52,48,0.55)']), grow: 3 + k * 2, drag: 0.8, smoke: true });
  }
  updateHelis(dt);
  placeCamera();
  if (G.up.gun && !G.result) updateCannon(dt);
  for (let i = G.timers.length - 1; i >= 0; i--) {
    const tm = G.timers[i];
    tm.t -= dt;
    if (tm.t <= 0) {
      G.timers.splice(i, 1);
      tm.f();
    }
  }
  if (mode === 'play') {
    G.run += dt;
    if (G.bot) botPlay(dt);
    // (the mouse: where the 105 goes)
    G.aimSX = clamp(M.x, 0, W - 1);
    G.aimSY = clamp(M.y, 0, H - 1);
  } else {
    G.aimSX = W / 2;
    G.aimSY = H / 2;
    if (mode === 'title' || mode === 'depot') attract(dt);
    else if (mode === 'ending') {
      G.endT += dt;
      if (G.endT > 3.4) endGame();
    }
  }
  G.hitT = Math.max(0, G.hitT - dt);
  G.muzzle[0] = Math.max(0, G.muzzle[0] - dt);
  G.muzzle[1] = Math.max(0, G.muzzle[1] - dt);
  G.killBump = Math.max(0, G.killBump - dt * 6);
  G.cashPulse = Math.max(0, G.cashPulse - dt * 3);
  updateStation(dt);
  if (!G.demo) updateWalls();
  updateZombies(dt);
  updateRounds(dt);
  updateBurn(dt);
  updateBodies(dt);
  updateFireSpots(dt);
  updateSkills(dt);
  updatePlanes(dt);
  if (!G.demo) updateLoot(dt);
  updateJuice(dt);
  updateScenery(dt);
  updateFX(dt);
  // every 3 s the marks on the ground fade a little
  G.decalT += dt;
  if (G.decalT > 3) {
    G.decalT = 0;
    const [i0, j0, i1, j1] = viewChunks();
    fadeDecals(i0, j0, i1, j1);
  }
}

// horde.js - the dead, the Orc Problem way: many small, weak, easy-to-see zombies that come in
// streams and waves from the edges of the screen and flow round each other to the train, and die
// in a red pop that stays on the ground (a red carpet after a big fight).
// Inside: the zombie art (pale sickly bodies, a dark outline, a dark head, a red mouth), the
// horde by distance (HORDE) and the spawner (streams, waves, crowds on the rails), the step of
// every zombie (updateZombies, with the railway looked up from a cache of rows), the fast pixel
// layer that draws a crowd of hundreds in one go (gatherHorde, drawHorde), the kill pop, silver
// zombies (G.up.silver: they shine and pay more), explosive zombies (G.up.boom, G.up.boomR: they
// blow up when they die and trigger neighbouring explosions), the hit sparks where a
// heli round lands and the heli's muzzle flash.

// 0 and 2 = a stride (the near leg ahead, then behind), 1 and 3 = the legs together, the body 1 px
// up. They face right; the outline is added after.
const ZOUT = '#0c0f09', ZRED = '#c4261c', ZWOUND = '#7e1712';
// colours: body [shade, mid, light], head [dark, mid], legs [dark, mid], wound = a red smear on it
const ZPAL = {

    { body: ['#8c9864', '#b0bc86', '#d0d9a6'], head: ['#20231a', '#363b2b'], leg: ['#2e2c22', '#4a4636'], wound: true }
  ],

    { body: ['#9a9f80', '#c3c7a6', '#e2e4cc'], head: ['#20211c', '#37382f'], leg: ['#2f2e29', '#4a4840'], wound: true }
  ],

    if (z.dead) continue;
    if (z.flash > 0) z.flash -= dt;
    if (z.st === 2) {
      // holding on: it rides along and claws at the car
      onTrain++;
      const c = tr.cars[z.car];
      z.bang += dt * (z.run ? 11 : 8);
      const lunge = Math.sin(z.bang) > 0.5 ? 1 : 0;
      if (z.side === 0) {
        z.x = c.x0 + c.dx * (3 - lunge) + c.nx * z.ox;
        z.y = c.y0 + c.dy * (3 - lunge) + c.ny * z.ox;
      } else {
        const o = (hw + 2 + z.ox - lunge) * z.side;
        z.x = c.cx + c.dx * z.al + c.nx * o;
        z.y = c.cy + c.dy * z.al + c.ny * o;
      }
      z.k = c.k + 0.5;
      z.vx = c.dx * tr.v;
      z.vy = c.dy * tr.v;
      z.anim += dt * 5;
      z.dmg += z.dps * dt;
      if (z.dmg >= 1) {
        z.dmg -= 1;
        hurtTrain(1, z.car, 'claw');
      }
      continue;
    }
    railLocal(z.x, z.y, L);
    const ds = L.a - tr.s, side = L.u < 0 ? -1 : 1;
    // where to walk: after a survivor, down the rails, onto the rails ahead, to the train's side,
    // or after the train (runners hunt survivors from further away; golden zombies only run)
    let tx, ty;
    const prey = hunt && z.st === 0 && !z.gold ? preyNear(z, z.run ? 120 : 70) : null;
    if (z.gold) {
      const g = goldFlee(z);
      tx = g[0];
      ty = g[1];
    } else if (prey) {
      tx = prey.x;
      ty = prey.y;
      if (Math.abs(prey.x - z.x) < 4 && Math.abs(prey.y - z.y) < 3) grabPerson(prey, z);
    } else if (z.st === 1) { ty = z.y + 24; tx = railX(ty) + z.rx; }
    else if (ds < -6) { tx = L.x + z.rx; ty = z.y + 4; }
    else if (ds <= TRAIN_LEN + 6) { tx = L.x + side * (hw + 3) / L.c; ty = z.y; }
    else { const c = tr.cars[CAR.n - 1]; tx = c.x1 + side * (hw + 3); ty = c.y1; }
    const dx = tx - z.x, dy = (ty - z.y) / FORE, d = Math.sqrt(dx * dx + dy * dy) || 1;
    z.wob += dt * (z.run ? 2 : 0.8);
    // (a slow sway round the way: the crowd does not walk in lock step)
    const w = z.st === 1 ? 0 : Math.sin(z.wob) * (z.run ? 0.25 : 0.4), cw = Math.cos(w), sw = Math.sin(w);
    const ux = (dx * cw - dy * sw) / d, uy = (dx * sw + dy * cw) / d;
    // (the dead of a Dead Wall stand still until the train is near; a hit one staggers)
    const sp = z.still ? 0 : z.sp * (z.st === 1 ? 0.7 : 1) * (z.flash > 0 ? 0.3 : 1);
    z.vx = ux * sp + z.kbx;
    z.vy = uy * sp * FORE + z.kby;
    z.x += z.vx * dt;
    z.y += z.vy * dt;
    z.kbx *= kb;
    z.kby *= kb;
    z.k = z.y;
    if (ux > 0.3) z.left = false;
    else if (ux < -0.3) z.left = true;
    z.anim += dt * (z.still ? 0.3 : 0.6 + sp / 3.2);
    if (z.st === 0 && !z.gold && ds < -6 && Math.abs(L.u - z.rx) < 2.5) z.st = 1;
    // the engine runs it down, or (too slow to crush it) it climbs onto the nose; beside the train
    // it climbs on. Not once the train is safe.
    if (!safe) {
      const au = L.u < 0 ? -L.u : L.u;
      if (ram && au < R.band && ds > -R.front && ds < R.back) {
        ramKill(z);
        continue;
      }
      if (au < hw + 2 && ds > -5 && ds < 6) {
        if (tr.v > 7 && !G.result) crush(z);
        else attach(z, 0, ds, L.u);
        continue;
      }
      if (ds >= 0 && ds <= TRAIN_LEN && au < hw + 4) {
        attach(z, side, ds, L.u);
        continue;
      }
    }
    if (z.st === 1 && ds < 0) {
      if (-ds < ahead) ahead = -ds;
      if (ds > -260) railN++;
    }
    // far from the train and out of view: gone
    if (Math.abs(z.x - mid.cx) + Math.abs(z.y - mid.cy) > 900 && offView(z.x, z.y, 40)) z.gone = true;
  }
  G.onTrain = onTrain;
  G.railAhead = railN;
  // the dead on the track ahead: a warning, and the train sounds its horn
  G.blocked = ahead < 170;
  tr.hornT -= dt;
  if (ahead < 150 && tr.hornT <= 0 && !G.demo && !G.result) {
    tr.hornT = 7;
    SFX.horn();
  }
  gridBuild();
  spread(dt);
  // drop the dead and the lost
  let j = 0;
  for (let i = 0; i < zs.length; i++) if (!zs[i].dead && !zs[i].gone) zs[j++] = zs[i];
  zs.length = j;
}
// The crowd flows like a liquid: each one pushes its near neighbours apart a little (brutes push
// harder), walks round trees and walls, and never into the train or past the safe zone wall.
function spread(dt) {
  const zs = G.zombies, tr = G.tr, hw = CAR.half, stops = G.stops, L = ZL, gy = G.goalY + 8;
  for (let n = 0; n < zs.length; n++) {
    const a = zs[n];
    if (a.dead || a.st === 2) continue;
    const ra = a.big ? 5 : 2.8, i0 = Math.floor(a.x / GC), j0 = Math.floor(a.y / GC);
    for (let j = j0 - 1; j <= j0 + 1; j++) for (let i = i0 - 1; i <= i0 + 1; i++) {
      const list = GRID.get(gk(i, j));
      if (!list) continue;
      for (let q = 0; q < list.length; q++) {
        const b = list[q];
        if (b === a || b.st === 2) continue;
        const dx = a.x - b.x, dy = (a.y - b.y) / FORE, d2 = dx * dx + dy * dy, rr = ra + (b.big ? 5 : 2.8);
        if (d2 < rr * rr && d2 > 1e-6) {
          const d = Math.sqrt(d2), p = (rr - d) * 0.22 / d;
          a.x += dx * p;
          a.y += dy * p * FORE;
          b.x -= dx * p;
          b.y -= dy * p * FORE;
        }
      }
    }
    a.blockT -= dt;
    if (a.blockT <= 0) {
      blockersNear(a.x, a.y, a.block);
      a.blockT = rnd(0.5, 0.8);
    }
    for (let k = 0; k < a.block.length; k += 3) {
      const dx = a.x - a.block[k], dy = (a.y - a.block[k + 1]) / FORE, d = Math.sqrt(dx * dx + dy * dy), m = a.block[k + 2] + ra * 0.6;
      if (d < m && d > 1e-4) {
        a.x = a.block[k] + dx / d * m;
        a.y = a.block[k + 1] + dy / d * m * FORE;
      }
    }
    for (let k = 0; k < stops.length; k++) {
      const hs = stops[k].house, dx = a.x - hs.x, dy = (a.y - hs.y + 6) / FORE;
      if (dx > 16 || dx < -16) continue;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 16 && d > 1e-4) {
        a.x = hs.x + dx / d * 16;
        a.y = hs.y - 6 + dy / d * 16 * FORE;
      }
    }
    const rx = railX(a.y);
    if (Math.abs(a.x - rx) < 26) {
      railLocal(a.x, a.y, L);
      const ds = L.a - tr.s;
      if (ds > 0 && ds < TRAIN_LEN && Math.abs(L.u) < hw + 2) a.x = rx + (L.u < 0 ? -1 : 1) * (hw + 2) / L.c;
    }
    if (a.y < gy) a.y = gy;
  }
}

// ---------- the crowd layer
// Drawing hundreds of small sprites one by one is slow, so most of the dead are written straight
// into the picture's pixels in one go, back to front, each with its shadow. Layer A goes under
// everything standing (the dead in the open, and those with only things in front of them), layer B
// over it (those with only things behind them). The rest (between two things, holding on to the
// train, golden) are sorted in with everything standing (render). For that the screen is cut into
// 8 px cells, and each cell keeps the nearest and furthest depth (k) of what stands over it.
const OC = 8, CROWD = { a: [], b: [], ghost: [], list: [], kmin: new Float32Array(0), kmax: new Float32Array(0), tree: new Uint8Array(0),
  cols: 0, rows: 0, x0: 0, y0: 0, head: new Int32Array(0), next: new Int32Array(0), force: null };
// (force = 'a' or 'one': every zombie into layer A, or every one drawn one by one; tests only)
// the cells under a box (world px): CC = [first column, last column, first row, last row]
const CC = [0, 0, 0, 0];
function occBox(l, t, w, h) {
  CC[0] = Math.max(0, Math.floor((l - CROWD.x0) / OC));
  CC[1] = Math.min(CROWD.cols - 1, Math.floor((l + w - CROWD.x0) / OC));
  CC[2] = Math.max(0, Math.floor((t - CROWD.y0) / OC));
  CC[3] = Math.min(CROWD.rows - 1, Math.floor((t + h - CROWD.y0) / OC));
}
function occMark(l, t, w, h, k, tree) {
  occBox(l, t, w, h);
  const C = CROWD;
  for (let r = CC[2]; r <= CC[3]; r++) for (let c = CC[0]; c <= CC[1]; c++) {
    const i = r * C.cols + c;
    if (k < C.kmin[i]) C.kmin[i] = k;
    if (k > C.kmax[i]) C.kmax[i] = k;
    if (tree) C.tree[i] = 1;
  }
}
// After gather() has put everything else standing in view into DL: the dead in view go to layer A,
// layer B, or DL and VZ (drawn one by one). x0..y1 = the view in world px.
function gatherHorde(x0, x1, y0, y1) {
  const C = CROWD;
  C.x0 = x0 - 16;
  C.y0 = y0 - 24;
  const cols = Math.ceil((x1 - x0 + 32) / OC) + 1, rows = Math.ceil((y1 - y0 + 56) / OC) + 1, n = cols * rows;
  if (C.kmin.length < n) {
    C.kmin = new Float32Array(n);
    C.kmax = new Float32Array(n);
    C.tree = new Uint8Array(n);
  }
  C.cols = cols;
  C.rows = rows;
  C.kmin.fill(Infinity);
  C.kmax.fill(-Infinity);
  C.tree.fill(0);
  for (let i = 0; i < DL.length; i++) {
    const o = DL[i];
    if (o.isCar) {
      // (a car is long and often turned: marked as five boxes along it, each as tall as the car)
      const c = G.tr.cars[o.i], tall = TRAIN[o.i].tall + 4;
      for (let f = 0; f <= 1; f += 0.25) occMark(lerp(c.x1, c.x0, f) - 11, lerp(c.y1, c.y0, f) - tall - 4, 22, tall + 10, o.k, false);
    } else if (o.person) occMark(o.x - 3, o.y - 16, 7, 18, o.k, false);
    else if (o.d) occMark(o.x - o.d.ax, o.y - o.d.ay, o.d.spr.width, o.d.spr.height, o.k, !!o.d.tree);
  }
  C.a.length = C.b.length = C.ghost.length = 0;
  for (const z of G.zombies) {
    if (z.dead || z.x < x0 - 10 || z.x > x1 + 10 || z.y < y0 || z.y > y1 + 24) continue;
    const S = z.S;
    occBox(z.x - S.ax, z.y - S.ay, S.w, S.h + 1);
    let mn = Infinity, mx = -Infinity, tree = 0;
    for (let r = CC[2]; r <= CC[3]; r++) for (let c = CC[0]; c <= CC[1]; c++) {
      const i = r * cols + c;
      if (C.kmin[i] < mn) mn = C.kmin[i];
      if (C.kmax[i] > mx) mx = C.kmax[i];
      tree |= C.tree[i];
    }
    if (C.force) {
      if (C.force === 'a') C.a.push(z);
      else { DL.push(z); VZ.push(z); }
    } else if (mn === Infinity && !z.gold) C.a.push(z);
    else if (z.gold || z.st === 2 || (mn <= z.k && mx >= z.k)) {
      DL.push(z);
      VZ.push(z);
    } else if (mx < z.k) C.b.push(z);
    else {
      C.a.push(z);
      if (tree) C.ghost.push(z);
    }
  }
  // (CROWD.list = all the dead drawn in the layers, for tests)
  C.list.length = 0;
  for (const z of C.a) C.list.push(z);
  for (const z of C.b) C.list.push(z);
}
// Layer A, drawn over the ground and under everything standing. sx, sy = the shake.
function drawHorde(sx, sy) {
  drawStreamMarks();
  crowdPass(CROWD.a, sx, sy);
}
// Layer B, over everything standing, and the dead behind a tree showing faintly through it.
function drawHordeTop(sx, sy) {
  crowdPass(CROWD.b, sx, sy);
  if (!CROWD.ghost.length) return;
  ctx.globalAlpha = thermal ? 0.6 : 0.45;
  for (const z of CROWD.ghost) blit(zImg(z), Math.round(z.x - z.S.ax), Math.round(z.y - z.S.ay));
  ctx.globalAlpha = 1;
}
// Draw list L of the dead: a few as sprites; a crowd written into the pixels (back to front by a
// bucket per screen row, so there is no sort).
function crowdPass(L, sx, sy) {
  const n = L.length;
  if (!n) return;
  const ox = sx - G.camX, oy = sy - G.camY;
  if (n < 40) {
    L.sort(byK);
    for (const z of L) {
      const S = z.S, fr = S.walk[(z.anim | 0) & 3];
      ctx.globalAlpha = thermal ? 0.2 : 0.32;
      blit(fr.s, Math.round(z.x - (fr.s.width >> 1)), Math.round(z.y - (fr.s.height >> 1)));
      ctx.globalAlpha = 1;
      blit(zImg(z), Math.round(z.x - S.ax), Math.round(z.y - S.ay));
    }
    return;
  }
  const R = H + 64;
  if (CROWD.head.length < R) CROWD.head = new Int32Array(R);
  if (CROWD.next.length < n) CROWD.next = new Int32Array(n * 2);
  const head = CROWD.head, next = CROWD.next;
  head.fill(-1, 0, R);
  for (let i = 0; i < n; i++) {
    const r = clamp(Math.round(L[i].y + oy) + 24, 0, R - 1);
    next[i] = head[r];
    head[r] = i;
  }
  const im = ctx.getImageData(0, 0, W, H), D = new Uint32Array(im.data.buffer);
  for (let r = 0; r < R; r++) {
    for (let i = head[r]; i >= 0; i = next[i]) {
      const z = L[i], S = z.S, fr = S.walk[(z.anim | 0) & 3], P = fr.px;
      const p = thermal ? (z.left ? P.hf : P.h) : z.flash > 0 ? (z.left ? P.wf : P.w) : z.left ? P.nf : P.n;
      const X = Math.round(z.x - S.ax + ox), Y = Math.round(z.y - S.ay + oy), pw = p.w, ph = p.h, pd = p.d;
      const xa = X < 0 ? -X : 0, xb = X + pw > W ? W - X : pw, ya = Y < 0 ? -Y : 0, yb = Y + ph > H ? H - Y : ph;
      for (let y = ya; y < yb; y++) {
        let o = (Y + y) * W + X + xa, q = y * pw + xa;
        for (let x = xa; x < xb; x++, o++, q++) {
          const c = pd[q];
          if (c === 0) continue;
          if (c === 1) {
            const g = D[o];
            D[o] = (((g >>> 1) & 0x7f7f7f) + ((g >>> 2) & 0x3f3f3f) | 0xff000000) >>> 0;
          } else D[o] = c;
        }
      }
    }
  }
  ctx.putImageData(im, 0, 0);
}
// The streams coming in: a red ! at the edge where each one enters (screen px, under the HUD).
function drawStreamMarks() {
  if (G.demo || thermal) return;
  for (const s of STREAMS) {
    if (s.age > 2.5 || (realT * 4 | 0) % 2) continue;
    const x = Math.round(clamp(s.sx, 4, W - 6)), y = Math.round(clamp(s.sy, 30, H - 30));
    ctx.fillStyle = '#0c0f09';
    ctx.fillRect(x - 2, y - 5, 5, 11);
    ctx.fillStyle = s.fast ? '#ff3a2a' : '#c8432e';
    ctx.fillRect(x - 1, y - 4, 3, 6);
    ctx.fillRect(x - 1, y + 3, 3, 2);
  }
}

// ---------- kills: the pop, silver, explosive
// A gun kill: the body bursts into a red splat that stays (the corpse in it now and then), a few
// drops fly, now and then a limb, a quick red puff.
function popKill(z, cause) {
  const S = z.S;
  JUICE.from = null;
  const room = Math.random() < 0.35;
  if (room) stampSpr(S.corpses[(Math.random() * S.corpses.length) | 0], z.x - S.cax, z.y - S.cay, 1);
  else { const s = S.splats[(Math.random() * S.splats.length) | 0]; stampSpr(s, z.x - (s.width >> 1), z.y - (s.height >> 1), 1); }
  if (offView(z.x, z.y, 30)) return;
  const [dx, dy] = hitDir(z, cause), n = z.big ? 10 : 5;
  for (let k = 0; k < n; k++) {
    const v = rnd(25, 85), s = rnd(-0.8, 0.8);
    part({ x: z.x + rnd(-1, 1), y: z.y, z: rnd(2, S.h * 0.7), vx: (dx - dy * s) * v, vy: (dy + dx * s) * v * FORE, vz: rnd(20, 70),
      g: 260, life: 1.2, max: 1.2, s: Math.random() < 0.25 ? 2 : 1, c: pick(BLOOD), land: 1 });
  }
  part({ x: z.x, y: z.y, z: S.h * 0.5, vx: dx * 10, vy: dy * 10 * FORE, vz: 5, g: 0, life: 0.28, max: 0.28, s: z.big ? 4 : 3,
    c: 'rgba(196,38,28,0.6)', grow: 12, drag: 4, smoke: true });
  if (Math.random() < (z.big ? 1 : 0.22)) gib(z, dx, dy, 1);
  if (z.big) {
    gib(z, dx, dy, 1.2);
    bloodPool(z.x, z.y, S);
  }
}
// Scrap for a silver zombie, regardless of its base type. (proposal)
const SILVER_PAY = 15;
// Called by makeZombie: roll silver (never in the demo, never a brute).
function silverRoll(z) {
  const c = G && !G.demo && G.up ? G.up.silver || 0 : 0;
  if (c > 0 && !z.big && Math.random() < c) {
    z.silver = true;
    z.S = silverSet(z.S);
    z.value = SILVER_PAY;
  }
  return z;
}
// A silver one dies: a white ring, silver sparks, coins.
function silverKill(z, sc) {
  rings.push({ x: z.x, y: z.y, r0: 2, r1: 16, t: 0, T: 0.3, c: '#e6eef8', w: 1 });
  lights.push({ x: z.x, y: z.y, z: 5, r: 18, c: '#dfe8ff', life: 0.2, max: 0.2, a: 0.8 });
  for (let k = 0; k < 8; k++) {
    const a = rnd(TAU), s = rnd(20, 60);
    part({ x: z.x, y: z.y, z: 5, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(20, 60), g: 180, life: rnd(0.3, 0.6), max: 0.6,
      s: 1, c: pick(['#ffffff', '#dfe8ff', '#a8b8d0']), add: true, drag: 1.5 });
  }
  if (sc) for (let k = 0; k < 3 && coins.length < 60; k++) coins.push({ x0: z.x - G.camX + rnd(-4, 4), y0: z.y - G.camY - 8, t: -k * 0.05, T: rnd(0.55, 0.8) });
}
// The shine of the silver ones in view: a soft glow and a glint now and then.
function silverShine() {
  if (!G.up.silver || thermal) return;
  let n = 0;
  for (const z of G.zombies) {
    if (!z.silver || z.dead || offView(z.x, z.y, 0)) continue;
    if (++n > 40) break;
    lights.push({ x: z.x, y: z.y, z: 5, r: 8, c: '#cfe0ff', life: 0.03, max: 0.03, a: 0.3 });
    if (Math.random() < 0.06) part({ x: z.x + rnd(-3, 3), y: z.y, z: rnd(3, z.S.h), vx: 0, vy: 0, vz: rnd(6, 12), g: 0, life: 0.35, max: 0.35,
      s: 1, c: '#ffffff', add: true });
  }
}
// Explosive zombies: BOOMS = blasts to come ({x, y, t}); at most BOOM_STEP go off in one step.
const BOOMS = [], BOOM_STEP = 6;
// Called by kill(): 1 in G.up.boom of the dead blow up a moment after they fall.
function boomRoll(z) {
  const c = G.up.boom || 0;
  if (c > 0 && Math.random() < c && BOOMS.length < 80) BOOMS.push({ x: z.x, y: z.y, t: rnd(0.06, 0.12) });
}
function updateBooms(dt) {
  let n = 0;
  for (let i = 0; i < BOOMS.length && n < BOOM_STEP; i++) {
    const b = BOOMS[i];
    b.t -= dt;
    if (b.t > 0) continue;
    BOOMS.splice(i--, 1);
    n++;
    zombieBlast(b.x, b.y);
  }
}
// One explosive zombie blows up at (x, y): a fat white-yellow puff, smoke, sparks; every zombie in
// G.up.boomR px dies (and may blow up in turn).
function zombieBlast(x, y) {
  const R = G.up.boomR || 18;
  lights.push({ x, y, z: 4, r: R * 1.6, c: '#ffb060', life: 0.2, max: 0.2, a: 0.55 });
  lights.push({ x, y, z: 4, r: R * 0.6, c: '#fff6e0', life: 0.07, max: 0.07, a: 0.8 });
  addBoom(x, y, Math.round(R * 0.7), 5, 0.45, Math.max(5, Math.round(R * 0.4)));
  rings.push({ x, y, r0: 4, r1: R * 1.2, t: 0, T: 0.25, c: '#fff1c2', w: 2 });
  for (let k = 0; k < 10; k++) {
    const a = rnd(TAU), s = rnd(30, 90);
    part({ x, y, z: 3, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(20, 80), g: 160, life: rnd(0.25, 0.5), max: 0.5,
      s: 1, c: pick(['#fff6e0', '#ffd27a', '#ff9a3a']), add: true, drag: 1.4 });
  }
  for (let k = 0; k < 4; k++) part({ x: x + rnd(-5, 5), y: y + rnd(-3, 3), z: rnd(3, 8), vx: rnd(-8, 8) + 3, vy: rnd(-4, 4), vz: rnd(8, 18),

// HITS = the sparks where rounds land: {x, y, t, s (seed), scale (this bullet's damage multiplier)}.
// An optional scale keeps Viper damage upgrades from changing other weapons' hit effects.
const HITS = [];
function hitSpark(x, y, scale = 1) {
  scale = Math.max(1, scale);
  if (HITS.length < 60) HITS.push({ x, y, t: 0, s: (Math.random() * 1e6) | 0, scale });
  for (let k = 0; k < 3; k++) {
    const a = rnd(TAU), s = rnd(25, 70);
    part({ x, y, z: 3, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(20, 60), g: 180, life: rnd(0.12, 0.28), max: 0.28,
      s: 1, c: pick(['#fff6e0', '#ffd27a', '#ffb347']), add: true, drag: 1.5 });
  }
  part({ x: x + rnd(-1, 1), y, z: 1, vx: rnd(-6, 6), vy: rnd(-3, 3), vz: rnd(4, 9), g: 0, life: rnd(0.35, 0.6), max: 0.6, s: 2,
    c: pick(['rgba(150,128,96,0.45)', 'rgba(124,106,80,0.45)']), grow: 4, drag: 2, smoke: true });
}
function updateHits(dt) {
  for (let i = HITS.length - 1; i >= 0; i--) if ((HITS[i].t += dt) > 0.09) HITS.splice(i, 1);
}
// A star of light: a white core and n rays of lengths from len0 to len1 (seeded by s), drawn with
// the 'lighter' blend. k = 0..1 strength.
function starFlash(x, y, s, len0, len1, k) {
  x = Math.round(x);
  y = Math.round(y);
  const n = 4 + (s & 3);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + hrnd(s, i, 1) * 0.5, l = Math.round(lerp(len0, len1, hrnd(s, i, 2)) * k), ca = Math.cos(a), sa = Math.sin(a) * FORE;
    for (let j = 1; j <= l; j++) {
      const f = j / l;
      ctx.globalAlpha = 1 - f * 0.7;
      ctx.fillStyle = f < 0.35 ? '#fff6e0' : f < 0.7 ? '#ffd27a' : '#ff9a3a';
      ctx.fillRect(Math.round(x + ca * j), Math.round(y + sa * j), 1, 1);
    }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - 1, y - 1, 3, 3);
}
// The sparks of the hits (with 'lighter').
function drawHits() {
  for (const h of HITS) {
    const k = 1 - h.t / 0.09, scale = h.scale;
    light(h.x, h.y - 2, 9 * scale, '#ffd27a', 0.6 * k);
    starFlash(h.x, h.y - 2, h.s, 2 * scale, 5 * scale, k);
  }
}
// Heli h's muzzle flash: a big star of light at its nose, longest along the barrel, and a glow
// round it (with 'lighter'). It is new for every shot (h.fs) and fades in 0.07 s.
function drawMuzzle(h) {
  const k = clamp(h.flash / 0.07, 0, 1), [nx, ny] = turnXY(h.hd, 0, -HC.nose - 3), x = h.sx + nx, y = h.sy + ny;
  const [fx, fy] = turnXY(h.hd, 0, -1);
  light(x, y, 40, '#ff9a3a', 0.9 * k);
  light(x, y, 18, '#fff1c2', k);
  starFlash(x, y, h.fs || 1, 6, 16, 0.5 + 0.5 * k);
  // the blast out of the barrel: a fat streak forward
  const L = Math.round((9 + (h.fs & 7)) * (0.5 + 0.5 * k));
  for (let j = 0; j < L; j++) {
    const f = j / L, w = f < 0.5 ? 1 : 0;
    ctx.globalAlpha = 1 - f * 0.8;
    ctx.fillStyle = f < 0.3 ? '#ffffff' : f < 0.65 ? '#ffe2a0' : '#ffb347';
    ctx.fillRect(Math.round(x + fx * j) - w, Math.round(y + fy * j * FORE) - w, 1 + w * 2, 1 + w * 2);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(Math.round(x) - 2, Math.round(y) - 1, 5, 3);
  ctx.fillRect(Math.round(x) - 1, Math.round(y) - 2, 3, 5);
}

// station.js - the stops on the fixed line. Each leg builds its departure and destination, and

const DEPOT = { id: 'depot', name: 'DEPOT', km: 0 };
// Spacing of the stop's scenery in world px. The positions still bend with the railway.
const TILE = 16;
// px from a stop's house along the rails to the engine's stopping point: car 1 lines up with it.

// Stop km is the engine nose's rail position; the house/platform sits STOP_OFF behind it.
function stopRailS(def) { return sAtKm(def.km); }

// Scenery coordinates around a stop -> the world. The rails lie between columns 6 and 7, and the
// house lies beside rows 3 and 4. dressStop() also uses these positions for its props.
function gridToWorld(c, r, s) {
  const a = s + (r - 3.5) * TILE, y0 = yAtS(a, yOfS(a)), fp = trackSlope(y0), k = 1 / Math.sqrt(1 + fp * fp);
  const u = (c - 6.5) * TILE;
  return { x: trackX(y0) + k * u, y: y0 - fp * k * u };
}

// Corn sprites are made before boot so their first use never writes to the late atlas pages.

for (let k = 0; k < 3; k++) {

// Corn stays on both sides of the station. Only its near edge stands up; land.js paints the field
// flat so the zombies walking through it remain easy to see.
function buildCorn(st) {
  for (let a = -84; a <= 102; a += 6) for (const side of [-1, 1]) {
    const p = gridToWorld(6.5 + side * (CORN_U0 + 2 + rnd(-1, 1)) / TILE, 3.5 + (a + rnd(-1, 1)) / TILE, st.s);
    G.statics.push({ d: pick(STATION_CORN), x: Math.round(p.x), y: Math.round(p.y), k: Math.round(p.y) });

// A leg has two visible stops. Only its destination is active; walls will be leg events.
function buildLine(leg) {
  const from = buildStop(leg.from, stopHouseS(leg.from), leg.from.side);
  from.state = 'done';
  from.start = true;
  const to = buildStop(leg.to, stopHouseS(leg.to), leg.to.side);
  G.stations.push(to);

}

// A platform, house and lamps on one side of the rails, dressed with the same scenery as before.
function buildStop(def, s, side) {
  const y = yOfS(s), col = (c) => 6.5 + side * (c - 6.5);
  const hp = gridToWorld(col(11.5), 4.1, s), hx = hp.x, hy = hp.y;
  const st = { def, id: def.id, name: def.name, s, stopS: s - STOP_OFF, y, side, state: 'ahead',
    start: false, house: { x: hx, y: hy }, door: { x: hx, y: hy + 3 } };
  for (let r = 0.75; r <= 7.3; r += 0.75) {
    const p = gridToWorld(col(8), r, s);
    G.statics.push({ d: STATION.slab, x: Math.round(p.x), y: Math.round(p.y), k: Math.round(p.y) - 4 });
  }
  for (const r of [2, 6]) {
    const p = gridToWorld(col(8), r, s);
    G.statics.push({ d: STATION.lamp, x: Math.round(p.x), y: Math.round(p.y), k: Math.round(p.y), lamp: true });
  }
  G.statics.push({ d: STATION.house, x: Math.round(hx), y: Math.round(hy), k: Math.round(hy) });
  if (def !== DEPOT) buildCorn(st);

// No trees or poles on a station's platform, yard or corn field.
const SZ = { u: 0, a: 0, c: 1 };
function stationZone(x, y) {

}

const STATIONS = STOPS.slice(1);
// A leg record is made only when progress needs to be stored.
function legSave(n) {
  return SAVE.legs[n] || (SAVE.legs[n] = { won: false, stars: [false, false, false], paid: {} });
}

// Every gold source has a stable id within its leg. Retries keep the receipt; replays pay only
// the supplied scrap alternative. Paying immediately protects rewards even if the train is lost.
function payGold(itemId, amount, scrapIfNot) {
  const out = { gold: 0, scrap: 0 };
  if (!G || G.demo || G.result || typeof itemId !== 'string' || !itemId) return out;
  amount = Number(amount);
  scrapIfNot = Number(scrapIfNot);
  if (!Number.isFinite(amount) || !Number.isFinite(scrapIfNot)) return out;
  amount = Math.max(0, Math.floor(amount));
  scrapIfNot = Math.max(0, Math.floor(scrapIfNot));
  const record = legSave(G.leg);
  if (G.replay || record.won || Object.prototype.hasOwnProperty.call(record.paid, itemId)) {
    out.scrap = payLootScrap(scrapIfNot);
  } else if (amount) {
    Object.defineProperty(record.paid, itemId, { value: true, enumerable: true, writable: true, configurable: true });
    out.gold = amount;
    G.gold += amount;
    if (G.leg >= 3 && !SAVE.flags.goldShown) {
      SAVE.flags.goldShown = true;
      if (SAVE.chest === 1) {
        SAVE.chest = 2;
        G.gold += 6;
        const h = G.helis[0];
        floatText(h.x, h.y - h.alt - 12, '+6 GOLD: CHEST OPENED', U.gold);
        currencyCoins('gold', h.x, h.y - h.alt, 8);
        SFX.golden();
      }
    }
  }
  bankRun();
  return out;
}

// Where a golden zombie runs: away from the nearest heli and from the rails, when either is near;
// else it strolls out into the field. [x, y] on the ground.
const GF = [0, 0];
function goldFlee(z) {
  let hx = 1e9, hy = 1e9;
  for (const h of G.helis) if (Math.hypot(h.x - z.x, h.y - z.y) < Math.hypot(hx - z.x, hy - z.y)) [hx, hy] = [h.x, h.y];

  const rd = Math.abs(z.x - trackX(z.y));

// helis.js - the Viper escorts the train and its nose gun continuously shoots the closest threat
// (the dead on the train first, then the dead on the rails ahead, then the nearest). It is always
// selected: right click a zombie to focus it, the ground to fly there, or the train to escort it.
// Multiple-unit selection and 105mm helpers remain for the full game, disabled in this demo.
// The model is a pile of top-down slices like the train cars, made at HN headings; the main rotor is
// a baked blur disc with blade flicks, the tail rotor flickers, the shadow falls south-east.

const HZ = 9;
function heliSlices() {

// the body's half width in row y, and the height of its top
const bodyHW = (y) => (y < 3 ? 0 : y < 7 ? [1.5, 2, 2.5, 3][y - 3] : y < 15 ? 3 : y < 25 ? 3.5 : y < 27 ? 3 : y < 31 ? 2 : y < 45 ? 1 : 0);

  if (y <= 4 && ax <= 1.5 && (z === 1 || z === 2)) return z === 2 && y === 3 && dx > 0 ? '#ff6a3a' : '#24272c';
  // the rocket pods: their front face full of tubes, a lit top

    if (z < 3) return '#26282c';
    return roundTop(Math.abs(ax - 11) / 1.5, POD);

  if (ax >= 6.5 && ax < 8.5 && y >= 15 && y <= 20 && z === 2) return y === 15 ? '#c9772f' : y === 20 ? '#2d3036' : '#4d5442';
  // the stub wings: lit leading edge, a pale mark near each tip
  if (ax < 9.5 && y >= 17 && y <= 19 && z === 3 && ax > 2) {
    if (y === 18 && ax >= 7 && ax < 8) return '#c9cdb8';
    return y === 17 ? '#7c885a' : y === 18 ? '#5d6844' : '#3c4430';
  }
  // the tail planes and the fin (red at its top end)
  if (y >= 38 && y <= 39 && ax <= 5 && z === 3) return y === 38 ? '#6b7650' : '#3c4430';
  if (x === 14 && y >= 39 && z >= 3 && z <= 7) return z === 7 ? (y >= 44 ? '#b8402e' : '#5d6844') : '#3c4430';
  // the engines on each side behind the cockpit: dark intakes in front, exhausts behind
  if (ax >= 2.5 && ax < 5.5 && y >= 15 && y <= 25 && z >= 3 && z <= 6) {

    if (y === 15) return '#121316';

    return roundTop(Math.abs(ax - 4) / 1.5, OLIVE);

// A pile of slices drawn flat (no height): the heli's outline seen from right above, for its shadow.
function flatSpr(slices, ang, box) {
  const [c, g] = mk(box, box, true), sw = slices[0].width / 2, sh = slices[0].height / 2;
  g.translate(box / 2, box / 2);
  g.rotate(ang);
  for (const s of slices) g.drawImage(s, -sw, -sh);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const im = g.getImageData(0, 0, box, box), d = im.data;
  for (let i = 0; i < d.length; i += 4) {

    d[i] = d[i + 1] = d[i + 2] = 0;
    d[i + 3] = on ? 255 : 0;

// One frame of the main rotor, its 4 blades at angle th: a see-through pale disc, a blur trailing

function rotorFrame(th) {
  const R = ROTOR_R, ry = ROTOR_RY;
  return pix(R * 2 + 1, ry * 2 + 1, (r) => {
    for (let y = -ry; y <= ry; y++) for (let x = -R; x <= R; x++) {
      const u = x / R, v = y / ry, d = Math.hypot(u, v);
      if (d > 1 || d < 0.14) continue;
      const a = Math.atan2(v, u);
      let near = 9;
      for (let k = 0; k < 4; k++) near = Math.min(near, mod(th + k * Math.PI / 2 - a, TAU));
      let col;
      if (near * d * R < 0.6) col = d > 0.84 ? '#e0c050' : 'rgba(20,22,26,0.7)';
      else if (d > 0.94) col = 'rgba(226,230,234,' + (u + v < -0.3 ? 0.55 : 0.22) + ')';
      else if (near < 0.9) col = 'rgba(206,212,218,' + (0.05 + 0.24 * Math.pow(1 - near / 0.9, 2)).toFixed(2) + ')';
      else col = 'rgba(206,212,218,0.05)';
      r(x + R, y + ry, 1, 1, col);
    }

}
// Build the heli at every heading, its rotor frames and its card icon. Called once at startup.
function bakeHelis() {

  HSPR.n.length = HSPR.h.length = HSPR.sh.length = 0;
  for (let i = 0; i < HN; i++) {
    const a = i / HN * TAU, raw = stackSpr(sl, a, B);
    const nn = selOut(rimLight(raw, '#f0ead4', 0.32)), hh = outline(hotSpr(raw, 150), '#161616');
    nn.ox = hh.ox = B / 2 + 1;
    nn.oy = hh.oy = B / 2 + n + 1;
    HSPR.n.push(nn);
    HSPR.h.push(hh);
    HSPR.sh.push(flatSpr(sl, a, B));
  }
  HSPR.n0 = n;
  ROTOR.length = 0;
  for (let k = 0; k < 8; k++) ROTOR.push(rotorFrame(k / 8 * Math.PI / 2));
  HICON = outline(strSpr(['.....m.....', '....xvx....', '....vBv....', '....vBv....', 'xx..vvv..xx', 'vVvvvVvvvVv',
    'xx..vvv..xx', '....xvx....', '.....v.....', '.....v.....', '...vvvvv...', '.....v.....'], NPAL), P.out);
  for (const c of [...HSPR.n, ...HSPR.h, ...ROTOR, HICON]) atl(c);

// ---------- the units
// A point on the heli at (dx, dy) from its middle (slice px: +y = to the tail), turned to heading a.
const turnXY = (a, dx, dy) => [dx * Math.cos(a) - dy * Math.sin(a), dx * Math.sin(a) + dy * Math.cos(a)];
// the helis to command now: the selected ones, or all of them when none is
const selHelis = () => (G.helis.some((h) => h.sel) ? G.helis.filter((h) => h.sel) : G.helis);
// A sole Viper never needs selection. Input also calls this before its next simulation step.
function selectSingleHeli() {
  if (G.helis.length !== 1) return false;
  G.helis[0].sel = true;
  HUI.box = null;
  return true;
}
// Where heli i flies when it escorts the train: its slot round the engine, drifting a little.
function escortAt(i) {
  const c = G.tr.cars[0], s = SLOTS[i % SLOTS.length], t = G.t;
  const a = s[0] + Math.sin(t * 0.37 + i * 2.1) * 10, u = s[1] + Math.sin(t * 0.29 + i * 1.3) * 8;
  return [c.x0 + c.dx * a + c.nx * u, c.y0 + c.dy * a + c.ny * u];
}
// The run's helis (G.up.helis of them), in their escort slots.
function makeHelis() {
  HUI.arm = false;
  HUI.box = null;
  HUI.cards.length = 0;
  G.helis = [];
  for (let i = 0; i < G.up.helis; i++) {
    const [x, y] = escortAt(i);
    G.helis.push({ i, name: HC.names[i] || 'VIPER ' + (i + 1), x, y, vx: 0, vy: 0, hd: G.tr.cars[0].ang, alt: HC.alt, ph: rnd(TAU),
      heat: 0, hot: false, firing: false, cd: rnd(0.15), tgt: null, look: 0, order: null, sel: G.up.helis === 1, flash: 0, heR: 0, kick: 0,
      cmdT: -9, spin: rnd(8), dust: 0, smoke: rnd(0.2), lean: 0, podFlash: [0, 0] });

// how far the heli guns reach this run (HELI RANGE makes it more)
const hRange = () => HC.range * (G.up.heliRange || 1);
// A short range preview at departure, and while right click is held.
const heliRangeVisible = () => mode === 'play' && !G.demo && !G.result && (G.run < HRING.time || M.right);
// ground distance from heli h to zombie z (round the ellipse the view squashes, like queryEll)
const hDist = (h, z) => Math.hypot(z.x - h.x, (z.y - h.y) / FORE);
// The best target in reach of heli h (one the rounds in the air will not already kill), or null:
// the dead on the train, then the dead on the rails ahead, then the nearest. (The dead at the Depot
// gate are left for the first run's Ram.)
function heliTarget(h) {
  let best = null, bk = Infinity;
  const s0 = G.tr.s;
  queryEll(h.x, h.y, hRange(), (z, d) => {
    if (z.pending >= z.hp || z.gate && z.still) return;
    const k = z.st === 2 ? d : z.st === 1 && trackLocal(z.x, z.y, TL).a < s0 ? 1000 + d : 2000 + d;
    if (k < bk) {
      bk = k;
      best = z;
    }

}
// Each step: every heli flies to its order (or its escort slot), turns, picks a target and shoots.
function updateHelis(dt) {
  const hs = G.helis, c0 = G.tr.cars[0], tv = G.tr.v, sp = G.up.fly, live = !G.result;
  selectSingleHeli();
  let rel = 0, readyNow = false;
  for (const h of hs) {
    // Retain safe zero values for the existing debug stats; heat no longer gates the gun.
    h.heat = 0;
    h.hot = false;
    let o = h.order;
    if (o && o.kind === 'attack' && (o.z.dead || o.z.gone)) o = h.order = null;
    // where it wants to be: its slot over the train, its spot, or in reach of its target
    let tx, ty, fx = 0, fy = 0;
    if (!o) {
      [tx, ty] = escortAt(h.i);
      fx = c0.dx * tv;
      fy = c0.dy * tv;
    } else if (o.kind === 'move') [tx, ty] = [o.x, o.y];
    else {

    }
    h.tgt = z;

    const own = Math.hypot(h.vx - fx, h.vy - fy);

    if (inR) aim = Math.atan2(z.x - h.x, -(z.y - h.y));

    h.firing = false;

    for (let k = 0; k < h.podFlash.length; k++) h.podFlash[k] = Math.max(0, h.podFlash[k] - dt);
    h.spin += dt;

  G.heReload = rel;

    ctx.globalAlpha = thermal ? 0.05 : 0.09;

      const hw = Math.round(R * Math.sqrt(1 - (dy * dy) / (ry * ry)));

    }

  for (const h of G.helis) {

    if (!h.sel || !o) continue;
    const tx = o.kind === 'move' ? o.x : o.z.x, ty = o.kind === 'move' ? o.y : o.z.y, col = o.kind === 'move' ? '#8fd18a' : '#ff5a3a';
    const n = Math.floor(Math.hypot(tx - h.x, ty - h.y) / 4), fresh = realT - h.cmdT < 0.8;

    ctx.fillStyle = col;

    if (o.kind === 'move') {

  // up to it

    const R = 13, a0 = realT * 1.2;
    ctx.fillStyle = 'rgba(143,209,138,0.55)';
    for (let y = Math.round(h.y - h.alt + 6); y < h.y - 3; y += 2) ctx.fillRect(Math.round(h.x), y, 1, 1);
    for (let k = 0; k < 44; k++) {

    const u = (realT - m.t) / 0.7;
    if (m.kind === 'move' || m.kind === 'train') {
      ctx.globalAlpha = 1 - u;
      const r = lerp(16, 3, ease(u)), col = '#8fd18a';

      pell(m.x, m.y, r + 4, (r + 4) * FORE, 'rgba(143,209,138,0.4)');
    } else if (!m.z.dead) {

// The helis, over everything on the ground (back to front): the body leaning into its speed, the
// muzzle flash at the nose, the tail rotor, the main rotor's blur and the hub.
const HORD = [];
function drawHelis() {
  HORD.length = 0;

  HORD.sort((a, b) => a.y - b.y);
  for (const h of HORD) {
    const i = mod(Math.round(h.hd / TAU * HN), HN), img = (thermal ? HSPR.h : HSPR.n)[i];
    // it bobs gently; the lean moves the body a little and the rotor more, the way it flies
    const bob = Math.sin(G.t * 2.2 + h.ph) * 1.2, sp = Math.hypot(h.vx, h.vy) || 1;
    const lx = h.vx / sp * h.lean, ly = h.vy / sp * h.lean;
    const X = Math.round(h.x + lx), Y = Math.round(h.y - h.alt + bob + ly);
    blit(img, X - img.ox, Y - img.oy);
    // the tail rotor: a flicker on the fin's right side
    const [tx, ty] = turnXY(h.hd, 3, 19), f = Math.floor(h.spin * 40) % 3;
    const ux = Math.sin(h.hd), uy = -Math.cos(h.hd);

    else if (f === 1) ctx.fillRect(qx, qy - 3, 1, 7);

    const rx = Math.round(X + mx + lx * 2.5), ry = Math.round(Y + my - HSPR.n0 - 1 + ly * 2.5);
    blit(fr, rx - ROTOR_R, ry - ROTOR_RY);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(rx - 1, ry - 1, 3, 3);
    ctx.fillStyle = '#8b919c';
    ctx.fillRect(rx, ry - 1, 1, 1);
    // the gun's muzzle flash: a star at the nose, longer forward

      ctx.fillStyle = '#ffd27a';

      ctx.fillRect(px, py - 1, 1, 3);
      ctx.fillStyle = '#fff6e0';

    h.sy = Y;
  }
}

    for (let k = 0; k < BURNC.flames; k++) {
      const a = (k - 1) / (BURNC.flames - 1) * TAU + p.seed;
      const r = k ? p.R * BURNC.spread : 0;
      drawFlame(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r * FORE, false, p.seed + k);
    }
  }
  ctx.globalAlpha = 1;
}
// Called in the existing additive pass. It uses the scenery-fire glow colour already cached.
function drawBurnFx() {
  for (const p of BURN) {
    if (offView(p.x, p.y, p.R)) continue;
    const fade = Math.min(1, p.time / BURNC.fade);
    light(p.x, p.y - 3, p.R * BURNC.glow, '#ff9a4a',
      (BURNC.alpha + Math.sin(realT * 13 + p.seed) * BURNC.flicker) * fade);
  }
  ctx.globalAlpha = 1;
}

// juice.js - the extra kick of every hit, in the same pixel style as fx.js: blood sprayed away from
// the shot and a small knock back, torn bits (gibs) that tumble, leave a trail and stay on the
// ground, pools of blood that spread under the dead, the 105's full blast (a hot core, a shock ring
// of dust, smoking debris, a column of smoke with embers, a crater with rays), the Turbo Ram's bow
// wave, coins that pop out and bounce, the golden zombie's glints and a short flash of the screen.
// Hooks: juiceHit (hitZombie), juiceKill (kill), bloodPool (stampCorpse), juiceBoom (boomFx),
// juiceRamFx (ramFx), juiceGold (goldKill), juicePop / coinPop (loot), updateJuice (step),
// drawJuice (render, after the flying bodies) and drawJuiceTop (render, over the glows).

// from = where the next hit comes from ([x, y] on the ground; a gun may set it before it hits, or
// the hit comes from below the screen, where the gunship is); flash = screen flash left (s)
const JUICE = { g: null, from: null, flash: 0, emit: [], gibs: [], debris: [], pools: [], coins: [] };
const BLOOD = [P.bl0, P.bl1, P.bl2, P.bl2, '#821f1a'];
const DUSTC = ['rgba(150,128,96,0.55)', 'rgba(124,106,80,0.55)', 'rgba(170,150,116,0.45)'];
const JD = [0, 0];
// The unit direction [x, y] a hit on z travels (away from its source), y on the flat ground.
function hitDir(z, cause, out) {
  out = out || JD;
  let sx, sy;
  if (JUICE.from) [sx, sy] = JUICE.from;
  else if (cause === 'gun' && G.up.gun && typeof gunXY === 'function') [sx, sy] = gunXY();
  else { sx = G.camX + W / 2; sy = G.camY + H + 40; }
  const dx = z.x - sx, dy = (z.y - sy) / FORE, l = Math.hypot(dx, dy) || 1;
  out[0] = dx / l;
  out[1] = dy / l;
  return out;
}
// n drops of blood thrown along (dx, dy) from (x, y) at height up to zh, and a red mist puff.
// k = force. They land and stay on the ground.
function spray(x, y, dx, dy, n, zh, k) {
  k = k || 1;
  for (let i = 0; i < n; i++) {
    const v = rnd(30, 105) * k, s = rnd(-0.55, 0.55);
    part({ x: x + rnd(-1, 1), y, z: rnd(zh * 0.4, zh), vx: (dx - dy * s) * v, vy: (dy + dx * s) * v * FORE, vz: rnd(5, 45) * k,
      g: 260, life: 1.4, max: 1.4, s: Math.random() < 0.18 * k ? 2 : 1, c: pick(BLOOD), land: 1 });
  }
  part({ x: x + dx * 2, y: y + dy * 2 * FORE, z: zh * 0.7, vx: dx * 22 * k, vy: dy * 22 * k * FORE, vz: 4, g: 0, life: 0.32, max: 0.32,
    s: 2, c: 'rgba(150,24,18,0.55)', grow: 9, drag: 4, smoke: true });
}
// A hit that does not kill (and the first part of one that does): blood out of the far side, a
// small push back. Brutes take it heavy: more blood, dust at their feet, a longer flash, a nudge
// of the view.
function juiceHit(z, cause) {
  const [dx, dy] = hitDir(z, cause), big = z.big, S = z.S;
  if (z.hp > 0) {
    spray(z.x, z.y, dx, dy, big ? 8 : 4, S.h * 0.65, big ? 1.1 : 0.9);
    if (z.st !== 2) {
      z.kbx += dx * (big ? 7 : 16);
      z.kby += dy * (big ? 7 : 16) * FORE;
    }
  }
  if (big) {
    z.flash = 0.14;
    for (let i = 0; i < 3; i++) part({ x: z.x + rnd(-4, 4), y: z.y, z: 1, vx: rnd(-14, 14), vy: rnd(-4, 4), vz: rnd(3, 8), g: 0,
      life: rnd(0.4, 0.6), max: 0.6, s: 2, c: pick(DUSTC), grow: 5, drag: 3, smoke: true });
    if (!G.demo && !offView(z.x, z.y, 0)) addShake(0.035);
  }
}
// A kill: more blood along the blow, and for the big blows (the 105, the train, the Ram, a brute)
// torn bits that tumble and stay. cause and the blast centre (cx, cy) as in kill().
function juiceKill(z, cause, cx, cy) {
  const S = z.S, big = z.big;
  let dx, dy;
  if (cause === 'he') {
    const ex = z.x - cx, ey = (z.y - cy) / FORE, l = Math.hypot(ex, ey) || 1;
    dx = ex / l;
    dy = ey / l;
  } else if (cause === 'train' || cause === 'ram') {
    const c = G.tr.cars[0], s = trackLocal(z.x, z.y, TL).u < 0 ? -1 : 1;
    dx = c.nx * s * 0.8 + c.dx * 0.6;
    dy = (c.ny * s * 0.8 + c.dy * 0.6) / FORE;
  } else [dx, dy] = hitDir(z, cause);
  JUICE.from = null;
  if (offView(z.x, z.y, 40)) return;
  const hard = cause === 'he' || cause === 'train' || cause === 'ram';
  spray(z.x, z.y, dx, dy, hard ? 9 : big ? 10 : 6, S.h * 0.6, hard ? 1.25 : 1.1);
  // torn bits: always from the 105, the Ram and the train, and from a brute; now and then from a gun
  const n = cause === 'he' ? rndi(2, 4) : cause === 'ram' ? rndi(1, 3) : cause === 'train' ? rndi(1, 2) : big ? 3 : Math.random() < 0.15 ? 1 : 0;
  for (let i = 0; i < n + (big && hard ? 2 : 0); i++) gib(z, dx, dy, hard ? 1.4 : 1);
  if (cause === 'ram' || cause === 'train') {
    // the smack on the nose: a hot white spark and a smear of blood on the rails
    const c = G.tr.cars[0];
    if (realT - (JUICE.smack || 0) > 0.12) {
      JUICE.smack = realT;
      lights.push({ x: c.x0, y: c.y0, z: 4, r: 10, c: '#fff1d8', life: 0.07, max: 0.07, a: 0.55 });
    }
    for (let i = 0; i < 4; i++) stampPix(z.x + rnd(-3, 3), z.y + rnd(-2, 2), pick(BLOOD), Math.random() < 0.3 ? 2 : 1);
  }
}
// One torn bit of zombie z (an arm, a leg, a piece of shirt, a bone), thrown along (dx, dy).
function gib(z, dx, dy, k) {
  if (JUICE.gibs.length >= 60) return;
  const p = z.S.pal, kind = rndi(0, 3), v = rnd(40, 100) * k, s = rnd(-0.7, 0.7);
  const c = kind === 0 ? p.sk[2] : kind === 1 ? p.pa[1] : kind === 2 ? p.sh[1] : P.bone;
  JUICE.gibs.push({ x: z.x, y: z.y, z: z.S.h * 0.5, vx: (dx - dy * s) * v, vy: (dy + dx * s) * v * FORE, vz: rnd(50, 110) * k,
    rot: rnd(TAU), spin: rnd(-18, 18), c, c2: kind === 3 ? '#8a826f' : P.bl2, len: kind === 2 ? 2 : 3, trail: 0 });
}

// ---------- pools of blood that spread under the dead
// POOL[r] = a dark red puddle r px across (lumpy, dithered at its edge).
const POOL = [];
function poolSpr(r) {
  if (!POOL[r]) {
    const ry = Math.max(1, Math.round(r * FORE)), rg = mulberry(r * 13 + 5);
    POOL[r] = pix(r * 2 + 3, ry * 2 + 3, (R) => {
      for (let y = -ry - 1; y <= ry + 1; y++) for (let x = -r - 1; x <= r + 1; x++) {
        const d = Math.hypot(x / r, y / ry) + (rg() - 0.5) * 0.3;
        if (d > 1) continue;
        R(x + r + 1, y + ry + 1, 1, 1, d < 0.45 ? '#3a0c0a' : d < 0.8 ? '#4a1210' : (x + y) & 1 ? '#5a1612' : '#401010');
      }
      R(r - 1, ry - 1, 2, 1, '#7a2a24');
    });
  }
  return POOL[r];
}
// Paint spr under what is already on the ground there (so a pool grows round a body, not over it).
function stampUnder(spr, x, y, a) {
  x = Math.round(x);
  y = Math.round(y);
  const ci0 = Math.floor(x / CH), ci1 = Math.floor((x + spr.width - 1) / CH), cj0 = Math.floor(y / CH), cj1 = Math.floor((y + spr.height - 1) / CH);
  for (let cj = cj0; cj <= cj1; cj++) for (let ci = ci0; ci <= ci1; ci++) {
    const d = decalChunk(ci, cj);
    d.g.globalCompositeOperation = 'destination-over';
    d.g.globalAlpha = a;
    d.g.drawImage(spr, x - ci * CH, y - cj * CH);
    d.g.globalAlpha = 1;
    d.g.globalCompositeOperation = 'source-over';
  }
}
// A body came to rest at (x, y): its pool spreads out under it over a second or so.
function bloodPool(x, y, S) {
  if (JUICE.pools.length >= 50 || offView(x, y, 30)) return;
  JUICE.pools.push({ x, y: y - 1, r: 2, max: S.h > 18 ? 8 : rndi(4, 6), t: 0 });
}

// ---------- the 105's blast
// BLASTR = scorched rays round the crater, stamped once per blast.
let BLASTR = null;
function blastRays() {
  if (!BLASTR) {
    const R = 38, Ry = Math.round(R * FORE), rg = mulberry(77);
    const rays = [];
    for (let i = 0; i < 13; i++) rays.push([rg() * TAU, 0.55 + rg() * 0.45]);
    BLASTR = pix(R * 2 + 1, Ry * 2 + 1, (r) => {
      for (const [a, len] of rays) for (let t = 0.35; t < len; t += 0.012) {
        const w = (1 - t / len) * 2.2;
        for (let s = -w; s <= w; s += 1) {
          const x = Math.round(R + Math.cos(a) * t * R - Math.sin(a) * s), y = Math.round(Ry + (Math.sin(a) * t * R + Math.cos(a) * s) * FORE);
          if ((1 - t / len) * 1.4 > bayer(x, y) + 0.15) r(x, y, 1, 1, t < 0.6 ? 'rgba(14,10,8,0.7)' : 'rgba(30,22,16,0.55)');
        }
      }
    });
  }
  return BLASTR;
}
// The full look of a big blast, over boomFx's: a white-hot core, a flash of the screen, a ring of
// dust racing out over the ground, chunks that fly trailing smoke, then a column of smoke and
// embers that rises from the crater for a few seconds, the crater glowing, rays of scorch and
// rubble round it. It also scares the crows.
function juiceBoom(x, y, big) {
  if (!offView(x, y, 20)) JUICE.flash = Math.max(JUICE.flash, big ? 0.1 : 0.06);
  addBoom(x, y - 2, big ? 30 : 22, 8, big ? 1.1 : 0.9, big ? 13 : 10, 0.02);
  lights.push({ x, y, z: 10, r: big ? 60 : 46, c: '#ffb060', life: 0.45, max: 0.45, a: 0.35 });
  lights.push({ x, y, z: 1, r: big ? 26 : 18, c: '#ff6a28', life: 3, max: 3, a: 0.5 });
  rings.push({ x, y, r0: 4, r1: big ? 72 : 48, t: 0, T: 0.2, c: '#fff6e0', w: 2 });
  // the shock ring of dust along the ground
  const nd = big ? 22 : 14;
  for (let i = 0; i < nd; i++) {
    const a = i / nd * TAU + rnd(-0.1, 0.1), s = rnd(110, 170);
    part({ x: x + Math.cos(a) * 6, y: y + Math.sin(a) * 6 * FORE, z: 1, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(2, 8), g: 0,
      life: rnd(0.6, 0.9), max: 0.9, s: rnd(3, 4), c: pick(DUSTC), grow: 7, drag: 3.6, smoke: true });
  }
  // chunks that fly trailing smoke (some of them burning)
  for (let i = 0; i < (big ? 7 : 4) && JUICE.debris.length < 24; i++) {
    const a = rnd(TAU), s = rnd(40, 120);
    JUICE.debris.push({ x, y, z: 4, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(90, 190), fire: Math.random() < 0.5, trail: 0,
      c: pick(['#2a241d', '#3a3027', '#4c4032']) });
  }
  // the smoke column and embers, then the crater's rays and rubble
  JUICE.emit.push({ x, y, t: 0, T: big ? 4.5 : 3, smoke: 0, ember: 0 });
  stampSpr(blastRays(), x - (BLASTR.width >> 1), y - (BLASTR.height >> 1), 0.8);
  stampScorch(x, y, 3);
  for (let i = 0; i < 14; i++) {
    const a = rnd(TAU), r = rnd(16, 30);
    stampPix(x + Math.cos(a) * r, y + Math.sin(a) * r * FORE, pick(['#5e5140', '#2a241d', '#6d6a62', '#463b2f']), Math.random() < 0.3 ? 2 : 1);
  }
  if (typeof scareBirds === 'function') scareBirds(x, y, 220);
}

// ---------- the Turbo Ram
// Each step while it runs: clods of earth and gravel thrown off both sides of the nose (a bow wave)
// and dust rolling out over the ground beside the rails.
function juiceRamFx() {
  const tr = G.tr, k = ramK(), c = tr.cars[0];
  if (Math.random() < k * 0.9) for (const s of [-1, 1]) {
    const v = rnd(50, 120);
    part({ x: c.x0 + c.nx * s * 6 + c.dx * 2, y: c.y0 + c.ny * s * 6 + c.dy * 2, z: 2, vx: c.nx * s * v + c.dx * tr.v * rnd(0.6, 1.2),
      vy: c.ny * s * v + c.dy * tr.v * rnd(0.6, 1.2), vz: rnd(30, 75), g: 300, life: 1.2, max: 1.2, s: Math.random() < 0.3 ? 2 : 1,
      c: pick(['#4c4032', '#362d24', '#5e5140', '#555047']), land: 1 });
  }
  if (Math.random() < k * 0.5) {
    const s = Math.random() < 0.5 ? -1 : 1;
    part({ x: c.x0 + c.nx * s * 9, y: c.y0 + c.ny * s * 9, z: 1, vx: c.nx * s * rnd(40, 70) + c.dx * tr.v * 0.5, vy: c.ny * s * rnd(40, 70) + c.dy * tr.v * 0.5,
      vz: rnd(4, 10), g: 0, life: rnd(0.6, 0.9), max: 0.9, s: 3, c: pick(DUSTC), grow: 8, drag: 2.5, smoke: true });
  }
  if (typeof scareBirds === 'function' && Math.random() < 0.1) scareBirds(c.x0, c.y0, 110);
}

// ---------- coins
// A golden zombie falls: its coins burst out over the ground, and a ring of gold.
function juiceGold(z) {
  coinPop(z.x, z.y, 14, 1.2);
  rings.push({ x: z.x, y: z.y, r0: 6, r1: 40, t: 0, T: 0.55, c: '#fff1c2' });
  JUICE.flash = Math.max(JUICE.flash, 0.03);
}
// n coins pop out of (x, y), bounce twice with a clink of light and wink out.
function coinPop(x, y, n, k) {
  k = k || 1;
  for (let i = 0; i < n && JUICE.coins.length < 70; i++) {
    const a = rnd(TAU), s = rnd(14, 46) * k;
    JUICE.coins.push({ x, y, z: 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s * FORE, vz: rnd(70, 120) * k, t: 0, T: rnd(0.9, 1.3), b: 0, f: rnd(3) });
  }
}
// A find leaves the ground: a puff of dust, a ring and a few coins.
function juicePop(x, y, big) {
  rings.push({ x, y, r0: 3, r1: big ? 28 : 18, t: 0, T: 0.3, c: '#ffe2a0', w: 2 });
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU;
    part({ x, y, z: 1, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40 * FORE, vz: rnd(3, 8), g: 0, life: 0.5, max: 0.5, s: 2, c: pick(DUSTC), grow: 6, drag: 4, smoke: true });
  }
  coinPop(x, y, big ? 8 : 4, 0.8);
}

// ---------- each step
function updateJuice(dt) {
  const J = JUICE;
  // (a new run, or the demo behind the menus, starts with nothing left over)
  if (J.g !== G) {
    J.g = G;
    J.emit.length = J.gibs.length = J.debris.length = J.pools.length = J.coins.length = 0;
    J.flash = 0;
    J.from = null;
  }
  J.flash = Math.max(0, J.flash - dt);
  // smoke columns and embers over the craters
  for (let i = J.emit.length - 1; i >= 0; i--) {
    const e = J.emit[i];
    e.t += dt;
    if (e.t >= e.T) { J.emit.splice(i, 1); continue; }
    const k = 1 - e.t / e.T;
    e.smoke += dt * (2 + 4 * k);
    while (e.smoke >= 1) {
      e.smoke--;
      const dark = Math.random() < k;
      part({ x: e.x + rnd(-6, 6), y: e.y + rnd(-3, 3), z: rnd(2, 8), vx: rnd(2, 9), vy: rnd(-3, 1), vz: rnd(12, 24) * (0.6 + k * 0.6), g: 0,
        life: rnd(2.2, 3.4), max: 3.4, s: rnd(3, 6), c: dark ? pick(['rgba(66,62,58,0.7)', 'rgba(84,80,76,0.65)']) : pick(['rgba(128,124,118,0.5)', 'rgba(156,152,146,0.45)']),
        grow: 4.5, drag: 0.5, smoke: true });
    }
    e.ember += dt * 5 * k;
    while (e.ember >= 1) {
      e.ember--;
      part({ x: e.x + rnd(-8, 8), y: e.y + rnd(-4, 4), z: rnd(1, 4), vx: rnd(-6, 8), vy: rnd(-3, 3), vz: rnd(18, 40), g: -6,
        life: rnd(0.6, 1.4), max: 1.4, s: 1, c: pick(['#ffd27a', '#ff8a3a', '#e2552f']), add: true, drag: 1.2 });
    }
  }
  // torn bits: they fly, turn, leave a trail of drops, bounce once and lie where they stop
  for (let i = J.gibs.length - 1; i >= 0; i--) {
    const b = J.gibs[i];
    b.vz -= 300 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    b.rot += b.spin * dt;
    b.trail -= dt;
    if (b.trail <= 0 && b.z > 2) {
      b.trail = 0.07;
      part({ x: b.x, y: b.y, z: b.z, vx: b.vx * 0.2, vy: b.vy * 0.2, vz: 0, g: 260, life: 1, max: 1, s: 1, c: pick(BLOOD), land: 1 });
    }
    if (b.z > 0) continue;
    b.z = 0;
    if (b.vz < -60) {
      b.vz *= -0.3;
      b.vx *= 0.5;
      b.vy *= 0.5;
      b.spin *= 0.5;
      continue;
    }
    const [ox, oy] = gibOff(b.rot);
    for (let k = 0; k < b.len; k++) stampPix(b.x + ox * k, b.y + oy * k, k ? b.c : b.c2);
    stampPix(b.x + rnd(-1, 1), b.y + 1, P.bl1);
    J.gibs[i] = J.gibs[J.gibs.length - 1];
    J.gibs.pop();
  }
  // chunks of the blast: a trail of smoke (or fire), a puff where they land
  for (let i = J.debris.length - 1; i >= 0; i--) {
    const b = J.debris[i];
    b.vz -= 320 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    b.trail -= dt;
    if (b.trail <= 0) {
      b.trail = 0.05;
      part({ x: b.x, y: b.y, z: b.z, vx: rnd(-2, 2), vy: rnd(-2, 2), vz: rnd(2, 6), g: 0, life: rnd(0.4, 0.7), max: 0.7, s: 2,
        c: b.fire ? 'rgba(60,50,44,0.55)' : 'rgba(80,72,64,0.45)', grow: 3, drag: 1, smoke: true });
      if (b.fire) part({ x: b.x, y: b.y, z: b.z, vx: 0, vy: 0, vz: 0, g: 0, life: 0.18, max: 0.18, s: 1, c: pick(['#ffd27a', '#ff8a3a']), add: true });
    }
    if (b.z > 0) continue;
    stampPix(b.x, b.y, b.c, 2);
    part({ x: b.x, y: b.y, z: 0, vx: 0, vy: 0, vz: 4, g: 0, life: 0.6, max: 0.6, s: 3, c: pick(DUSTC), grow: 5, smoke: true });
    if (b.fire && flames.length < 30 && Math.random() < 0.5) flames.push({ x: b.x, y: b.y, life: rnd(1, 2.2), seed: rnd(100) });
    J.debris[i] = J.debris[J.debris.length - 1];
    J.debris.pop();
  }
  // pools grow one pixel every 0.12 s up to their size
  for (let i = J.pools.length - 1; i >= 0; i--) {
    const p = J.pools[i];
    p.t += dt;
    if (p.t < 0.12) continue;
    p.t = 0;
    const s = poolSpr(p.r);
    stampUnder(s, p.x - (s.width >> 1), p.y - (s.height >> 1), 0.8);
    if (++p.r > p.max) {
      J.pools[i] = J.pools[J.pools.length - 1];
      J.pools.pop();
    }
  }
  // coins bounce and wink out
  for (let i = J.coins.length - 1; i >= 0; i--) {
    const c = J.coins[i];
    c.t += dt;
    if (c.t >= c.T) {
      part({ x: c.x, y: c.y, z: c.z + 2, vx: 0, vy: 0, vz: 10, g: 0, life: 0.25, max: 0.25, s: 1, c: '#fff6c0', add: true });
      J.coins[i] = J.coins[J.coins.length - 1];
      J.coins.pop();
      continue;
    }
    c.vz -= 340 * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.z += c.vz * dt;
    if (c.z <= 0 && c.vz < 0) {
      c.z = 0;
      c.vz = c.b < 2 ? -c.vz * 0.45 : 0;
      c.vx *= 0.55;
      c.vy *= 0.55;
      c.b++;
      if (c.b <= 2) lights.push({ x: c.x, y: c.y, z: 1, r: 4, c: '#ffd24a', life: 0.08, max: 0.08, a: 0.7 });
    }
  }
  // golden zombies glint: a spark now and then rises off them
  if (G.up.gold) for (const z of G.zombies) {
    if (!z.gold || z.dead || Math.random() > dt * 9 || offView(z.x, z.y, 0)) continue;
    part({ x: z.x + rnd(-4, 4), y: z.y, z: rnd(2, z.S.h), vx: 0, vy: 0, vz: rnd(8, 16), g: 0, life: 0.5, max: 0.5, s: 1,
      c: pick(['#fff6c0', '#ffd24a']), add: true });
  }
}
// the pixel step of a gib turned to angle a (it lies along it)
function gibOff(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [Math.abs(c) > 0.38 ? Math.sign(c) : 0, Math.abs(s) > 0.38 ? Math.sign(s) : 0];
}

// ---------- drawing
// Torn bits, blast chunks and coins in the air (with their shadows), over the bodies.
function drawJuice() {
  const J = JUICE;
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000';
  for (const b of J.gibs) ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y), 3, 1);
  for (const c of J.coins) ctx.fillRect(Math.round(c.x) - 1, Math.round(c.y), 3, 1);
  ctx.globalAlpha = 1;
  for (const b of J.gibs) {
    const [ox, oy] = gibOff(b.rot), x = Math.round(b.x), y = Math.round(b.y - b.z);
    for (let k = 0; k < b.len; k++) {
      ctx.fillStyle = k ? (thermal ? '#e0e0e0' : b.c) : (thermal ? '#c0c0c0' : b.c2);
      ctx.fillRect(x + ox * k, y + oy * k, 1, 1);
    }
  }
  for (const b of J.debris) {
    ctx.fillStyle = b.fire && !thermal ? '#ff8a3a' : b.c;
    ctx.fillRect(Math.round(b.x), Math.round(b.y - b.z), 2, 2);
  }
  for (const c of J.coins) {
    const x = Math.round(c.x), y = Math.round(c.y - c.z) - 2, wob = ((realT * 14 + c.f) | 0) % 3;
    ctx.fillStyle = '#5a3e10';
    ctx.fillRect(x - 1, y - 1, wob === 1 ? 1 : 3, 3);
    ctx.fillStyle = '#e3b04b';
    ctx.fillRect(x - (wob === 1 ? 1 : 1), y - 1, wob === 1 ? 1 : 2, 2);
    ctx.fillStyle = '#fff1c2';
    ctx.fillRect(x - 1, y - 1, 1, 1);
  }
}
// The flash of a big blast, over everything in the world (drawn with 'lighter').
function drawJuiceTop() {
  if (JUICE.flash <= 0 || thermal) return;
  ctx.globalAlpha = Math.min(0.35, JUICE.flash * 3.5);
  ctx.fillStyle = '#ffcf9a';
  ctx.fillRect(G.camX - 16, G.camY - 16, W + 32, H + 32);
  ctx.globalAlpha = 1;
}
