<title>Sky Reaper</title>
<style>
  /* One pixel-art canvas that fills the window at a whole-number zoom. Everything, the menus too,
     is drawn inside it, so there is a single dark colour to set here. */
  :root { --bg: #060708; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { overflow: hidden; }
  #c { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: var(--bg); outline: none; touch-action: none; }
  #c:focus-visible { box-shadow: inset 0 0 0 2px #b8862f; }
</style>
<canvas id="c" width="640" height="360" tabindex="0" role="application" aria-label="Sky Reaper. A pixel-art gunship game over an endless field full of zombies. Aim with the mouse, hold left click for the 25mm gun, right click or Space for the 105mm cannon, WASD to move, T for the thermal camera."></canvas>
<script>
(() => {
'use strict';
// core.js - the canvas and its whole-number zoom, small helpers, the sprite atlas, seeded random,
// dither and world noise. The game is drawn at about 640 x 360 pixels and scaled up by a whole
// number, so every pixel stays a crisp square (the look and most tools follow Ball x Archers).

// ---------- screen and canvas
// STEP = fixed update step. FORE = how much round things on the ground are squashed (the view is
// three-quarters from above). W x H = the picture in game pixels, SCALE = screen pixels per game pixel.
const STEP = 1 / 60, TAU = Math.PI * 2, FORE = 0.72;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let W = 640, H = 360, SCALE = 2, zoomStep = 0;

// Fit the canvas to the window: the zoom is a whole number of screen pixels per game pixel, and the
// picture is as big as it needs to be to fill the window.
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const dw = Math.max(320, Math.round(innerWidth * dpr)), dh = Math.max(180, Math.round(innerHeight * dpr));
  // about 360 rows (one zoom step more or less), but never under 240 or over 560 rows, and at
  // least 320 columns so the top bar fits on a narrow window
  const hi = Math.max(1, Math.min(Math.floor(dh / 240), Math.floor(dw / 320))), lo = Math.min(hi, Math.max(1, Math.ceil(dh / 560)));
  const s = clamp(Math.round(dh / 360) + zoomStep, lo, hi);
  const w = Math.ceil(dw / s), h = Math.ceil(dh / s);
  const changed = w !== W || h !== H || s !== SCALE;
  W = w; H = h; SCALE = s;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  cv.style.width = (W * s / dpr) + 'px';
  cv.style.height = (H * s / dpr) + 'px';
  ctx.imageSmoothingEnabled = false;
  return changed;
}

// ---------- utils
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
// rnd(a) = random 0..a, rnd(a, b) = random a..b. rndi(a, b) = whole number a..b.
const rnd = (a, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (a) => a[(Math.random() * a.length) | 0];
const inR = (px, py, x, y, w, h) => px >= x && py >= y && px < x + w && py < y + h;
// ease-out (cubic): fast at the start, slow at the end
const ease = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
// 0 below a, 1 above b, a smooth S-curve in between
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// Make an offscreen canvas (no smoothing). Returns [canvas, context]. rf = its pixels will be read
// back (sprite making), which is faster on a canvas kept in memory.
function mk(w, h, rf) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  const g = c.getContext('2d', rf ? { willReadFrequently: true } : undefined);
  g.imageSmoothingEnabled = false;
  return [c, g];
}

// ---------- sprite atlas
// Small sprites are copied once into one big canvas and drawn from there, so a crowd of hundreds
// is hundreds of copies out of a single image. ATL maps a sprite to its {x, y} in the atlas.
const ATLAS = document.createElement('canvas');
ATLAS.width = 2048;
ATLAS.height = 2048;
const AG = ATLAS.getContext('2d');
AG.imageSmoothingEnabled = false;
const ATL = new Map();
let atX = 0, atY = 0, atH = 0;
function atl(src) {
  let s = ATL.get(src);
  if (s !== undefined) return s;
  s = null;
  const w = src.width, h = src.height;
  if (w * h <= 4096 || (h <= 12 && w <= 512)) {
    if (atX + w + 1 > 2048) { atX = 0; atY += atH + 1; atH = 0; }
    if (atY + h <= 2048) {
      AG.drawImage(src, atX, atY);
      s = { x: atX, y: atY };
      atX += w + 1;
      if (h > atH) atH = h;
    }
  }
  ATL.set(src, s);
  return s;
}
// Draw a sprite, from the atlas when it is there. w, h are optional (stretched size).
function blit(src, x, y, w, h) {
  const s = atl(src);
  if (!s) {
    if (w == null) ctx.drawImage(src, x, y);
    else ctx.drawImage(src, x, y, w, h);
    return;
  }
  ctx.drawImage(ATLAS, s.x, s.y, src.width, src.height, x, y, w == null ? src.width : w, h == null ? src.height : h);
}

// ---------- colours, numbers, random, dither, noise
function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
// Short number text: 1,234 / 1.23M
function fmt(n) {
  n = Math.floor(Math.max(0, n));
  if (n < 1e6) return n.toLocaleString('en-US');
  return (n / 1e6).toFixed(2) + 'M';
}
// Seeded random generator (mulberry32): a function that gives 0..1.
function mulberry(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash32(x) {
  x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
  x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
  return (x ^ (x >>> 16)) >>> 0;
}
// a random 0..1 fixed by three whole numbers: the same answer every time for the same place
const hrnd = (a, b, c) => hash32(Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 982451653)) / 4294967296;
// 4x4 ordered dither (Bayer): bayer(x, y) gives a 0..1 threshold for pixel (x, y), negative x and y too
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const bayer = (x, y) => BAY[((y & 3) << 2) | (x & 3)];
// Smooth value noise over the endless world (grid of 1, seed s): the same value for the same (x, y)
// wherever and whenever it is asked, so the world can be built in pieces that meet without seams.
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), tx = x - xi, ty = y - yi;
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const a = hrnd(xi, yi, s), b = hrnd(xi + 1, yi, s), c = hrnd(xi, yi + 1, s), d = hrnd(xi + 1, yi + 1, s);
  return a + (b - a) * sx + (c - a + (a - b - c + d) * sx) * sy;
}
// Draw a 1-pixel line from (x0, y0) to (x1, y1) on context g (Bresenham).
function pl(g, x0, y0, x1, y1, col) {
  g.fillStyle = col;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx - dy;
  for (;;) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 > -dy) { e -= dy; x0 += sx; }
    if (e2 < dx) { e += dx; y0 += sy; }
  }
}

// art.js - tools that make pixel-art sprites, the bitmap font and the drawing primitives.
// Sprite helpers: pix() paints a new sprite with rectangles. outline(), selOut(), tint(), flipH(),
// rot90(), castShadow(), shadowSpr(), unitShadow(), corpseSpr(), rimLight(), hotSpr() and scaleSpr()
// each make a new canvas from an existing one.
// Font: a 5x7 pixel font, baked once into a white strip. text() draws a string and caches it.
// Primitives: glow sprites and light(), pixel circles and ellipses, frame(), panel(), bar().

// ---------- sprite helpers
// Make a w x h sprite. fn gets r(x, y, w, h, color) to fill rectangles, and the context g.
function pix(w, h, fn) {
  const [c, g] = mk(w, h, true);
  fn((x, y, ww, hh, col) => {
    g.fillStyle = col;
    g.fillRect(x, y, ww, hh);
  }, g);
  return c;
}
// Copy of src, 1 px bigger on each side, with a solid outline in color col.
function outline(src, col) {
  const sw = src.width, sh = src.height, w = sw + 2, h = sh + 2;
  const [c, g] = mk(w, h, true);
  const sd = src.getContext('2d').getImageData(0, 0, sw, sh).data;
  const im = g.createImageData(w, h), od = im.data;
  const [R, G, B] = hexRgb(col);
  const A = (x, y) => (x < 0 || y < 0 || x >= sw || y >= sh) ? 0 : sd[(y * sw + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const sx = x - 1, sy = y - 1, i = (y * w + x) * 4, a = A(sx, sy);
    if (a > 0) {
      const j = (sy * sw + sx) * 4;
      od[i] = sd[j]; od[i + 1] = sd[j + 1]; od[i + 2] = sd[j + 2]; od[i + 3] = a;
    } else if (A(sx - 1, sy) || A(sx + 1, sy) || A(sx, sy - 1) || A(sx, sy + 1)) {
      od[i] = R; od[i + 1] = G; od[i + 2] = B; od[i + 3] = 255;
    }

}
// Selective outline ("sel-out"): each outline pixel is a darkened copy of the sprite pixel next to
// it; top and left edges a little lighter (k = 0.42), right and bottom edges darker (k = 0.2).
function selOut(src) {

  const [c, g] = mk(w, h, true);
  const sd = src.getContext('2d').getImageData(0, 0, sw, sh).data;
  const im = g.createImageData(w, h), od = im.data;
  const A = (x, y) => (x < 0 || y < 0 || x >= sw || y >= sh) ? 0 : sd[(y * sw + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const sx = x - 1, sy = y - 1, i = (y * w + x) * 4;
    if (A(sx, sy)) {
      const j = (sy * sw + sx) * 4;
      od[i] = sd[j]; od[i + 1] = sd[j + 1]; od[i + 2] = sd[j + 2]; od[i + 3] = 255;
      continue;
    }
    let nx = -1, ny = -1, lit = false;
    if (A(sx, sy + 1)) { nx = sx; ny = sy + 1; lit = true; }
    else if (A(sx + 1, sy)) { nx = sx + 1; ny = sy; lit = true; }
    else if (A(sx - 1, sy)) { nx = sx - 1; ny = sy; }
    else if (A(sx, sy - 1)) { nx = sx; ny = sy - 1; }
    if (nx < 0) continue;
    const j = (ny * sw + nx) * 4, k = lit ? 0.42 : 0.2;
    od[i] = sd[j] * k + 5; od[i + 1] = sd[j + 1] * k + 6; od[i + 2] = sd[j + 2] * k + 10; od[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  return c;
}
// Copy of src with color col laid over it ('source-atop' = only the sprite pixels). alpha = strength.
function tint(src, col, alpha, mode) {
  const [c, g] = mk(src.width, src.height);
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = mode || 'source-atop';
  g.globalAlpha = alpha == null ? 1 : alpha;
  g.fillStyle = col;
  g.fillRect(0, 0, c.width, c.height);

}
// Mirror image (left <-> right).
function flipH(src) {
  const [c, g] = mk(src.width, src.height);
  g.translate(src.width, 0);
  g.scale(-1, 1);
  g.drawImage(src, 0, 0);
  return c;
}
// Copy of src turned 90 degrees clockwise.
function rot90(src) {
  const [c, g] = mk(src.height, src.width);
  g.translate(src.height, 0);
  g.rotate(Math.PI / 2);
  g.drawImage(src, 0, 0);
  return c;
}
// The sun is low in the north-west: every shadow falls this way (shear per pixel of height).
const SUNX = 0.55, SUNY = 0.32;
// Cast shadow: a black silhouette of src, flattened onto the ground and slanted away from the sun.
function castShadow(src, kx, ky) {
  kx = kx == null ? SUNX : kx;
  ky = ky == null ? SUNY : ky;
  const w = src.width, h = src.height;
  const [c, g] = mk(Math.ceil(w + (h - 1) * kx) + 1, Math.ceil((h - 1) * ky) + 2);
  const sil = tint(src, '#000', 1, 'source-in');
  g.setTransform(1, 0, -kx, -ky, (h - 1) * kx, (h - 1) * ky + 1);
  g.drawImage(sil, 0, 0);
  return c;
}
// Round black ground shadow (an ellipse), w px wide.
function shadowSpr(w) {
  const h = Math.max(2, Math.round(w * 0.42));
  return pix(w, h, (r) => {
    for (let y = 0; y < h; y++) {
      const yy = (y + 0.5) / h * 2 - 1;
      const hw = Math.round(Math.sqrt(1 - yy * yy) * w / 2);
      r(Math.round(w / 2 - hw), y, hw * 2, 1, '#000');
    }
  });
}
// Shadow for a unit: its cast shadow plus a round ground shadow shw px wide at its feet.
// c.pad = rows added on top.
function unitShadow(src, shw) {
  const cs = castShadow(src);
  const eh = Math.max(2, Math.round(shw * 0.42)), pad = (eh >> 1) + 1, ax = src.width >> 1;
  const [c, g] = mk(Math.max(cs.width, ax + shw), cs.height + pad);
  g.drawImage(cs, 0, pad);
  g.drawImage(shadowSpr(shw), ax - (shw >> 1), pad + 1 - (eh >> 1));
  c.pad = pad;
  return c;
}
// Dead body on the ground: the drawing turned on its side, squashed and darkened, with a dark red
// pool behind it. flip = mirror left/right.
function corpseSpr(base, flip) {
  const d = rot90(base);
  const w = d.width, h = Math.max(3, Math.round(d.height * 0.55));
  const [c, g] = mk(w + 2, h + 3);
  if (flip) { g.translate(w + 2, 0); g.scale(-1, 1); }
  g.drawImage(d, 1, 1, w, h);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(22,17,14,0.55)';
  g.fillRect(0, 0, w + 2, h + 3);
  g.globalCompositeOperation = 'destination-over';
  g.fillStyle = 'rgba(64,12,10,0.7)';
  const cx = (w + 2) / 2, cy = h * 0.6 + 1, rx = w * 0.4, ry = h * 0.55 + 1;
  for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    g.fillRect(Math.round(cx - hw + ((y * 7) % 3) - 1), Math.round(cy + y), hw * 2, 1);
  }

}
// Rim light: move the top-edge pixels of a sprite toward color col (strength a), the left edge half as much.
function rimLight(src, col, a) {
  const w = src.width, h = src.height;
  const [c, g] = mk(w, h, true);
  g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, w, h), d = im.data, s = new Uint8ClampedArray(d);
  const [R, G, B] = hexRgb(col);
  const A = (x, y) => x < 0 || y < 0 || x >= w || y >= h ? 0 : s[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (!s[i + 3]) continue;
    const k = !A(x, y - 1) ? a : !A(x - 1, y) ? a * 0.5 : 0;
    if (k) {
      d[i] = s[i] + (R - s[i]) * k;
      d[i + 1] = s[i + 1] + (G - s[i + 1]) * k;
      d[i + 2] = s[i + 2] + (B - s[i + 2]) * k;
    }
  }
  g.putImageData(im, 0, 0);
  return c;
}
// The same sprite as a thermal camera sees it: a warm body glows white, its clothes a little cooler.
function hotSpr(src, base) {
  const w = src.width, h = src.height;
  const [c, g] = mk(w, h, true);
  g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const l = (d[i] * 0.3 + d[i + 1] * 0.55 + d[i + 2] * 0.15) / 255;
    const v = Math.round((base == null ? 200 : base) + 55 * l);
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  g.putImageData(im, 0, 0);
  return c;
}
// Copy of src scaled by k (nearest pixel).
function scaleSpr(src, k) {
  const [c, g] = mk(Math.round(src.width * k), Math.round(src.height * k));
  g.drawImage(src, 0, 0, c.width, c.height);
  return c;
}

// ---------- bitmap font (5x7)
// One entry per character = 7 rows, top to bottom; each row is 5 bits (16 = leftmost pixel).
const GL = {
  ' ': [0,0,0,0,0,0,0],
  A: [14,17,17,31,17,17,17], B: [30,17,17,30,17,17,30], C: [14,17,16,16,16,17,14], D: [30,17,17,17,17,17,30],
  E: [31,16,16,30,16,16,31], F: [31,16,16,30,16,16,16], G: [14,17,16,23,17,17,15], H: [17,17,17,31,17,17,17],
  I: [14,4,4,4,4,4,14], J: [7,2,2,2,2,18,12], K: [17,18,20,24,20,18,17], L: [16,16,16,16,16,16,31],
  M: [17,27,21,21,17,17,17], N: [17,17,25,21,19,17,17], O: [14,17,17,17,17,17,14], P: [30,17,17,30,16,16,16],
  Q: [14,17,17,17,21,18,13], R: [30,17,17,30,20,18,17], S: [15,16,16,14,1,1,30], T: [31,4,4,4,4,4,4],
  U: [17,17,17,17,17,17,14], V: [17,17,17,17,17,10,4], W: [17,17,17,21,21,21,10], X: [17,17,10,4,10,17,17],
  Y: [17,17,10,4,4,4,4], Z: [31,1,2,4,8,16,31],
  '0': [14,17,19,21,25,17,14], '1': [4,12,4,4,4,4,14], '2': [14,17,1,2,4,8,31], '3': [30,1,1,14,1,1,30],
  '4': [2,6,10,18,31,2,2], '5': [31,16,30,1,1,17,14], '6': [6,8,16,30,17,17,14], '7': [31,1,2,4,8,8,8],
  '8': [14,17,17,14,17,17,14], '9': [14,17,17,15,1,2,12],
  '.': [0,0,0,0,0,4,4], ',': [0,0,0,0,4,4,8], ':': [0,4,4,0,4,4,0], '!': [4,4,4,4,4,0,4], '?': [14,17,1,2,4,0,4],
  '+': [0,4,4,31,4,4,0], '-': [0,0,0,14,0,0,0], '/': [1,1,2,4,8,16,16], '%': [24,25,2,4,8,19,3],
  "'": [4,4,8,0,0,0,0], '(': [2,4,8,8,8,4,2], ')': [8,4,2,2,2,4,8], '>': [8,4,2,1,2,4,8], '<': [2,4,8,16,8,4,2],
  '=': [0,0,31,0,31,0,0], '#': [10,10,31,10,31,10,10], '*': [0,4,21,14,21,4,0], '[': [14,8,8,8,8,8,14],
  ']': [14,2,2,2,2,2,14], '&': [12,18,20,8,21,18,13], '$': [4,15,20,14,5,30,4], '×': [0,17,10,4,10,17,0]

// FONT[char] = {x, w}: where the character sits in the white strip, and its width.
const FONT = {};
let FATLAS = null;
const TINTS = new Map();
(function () {
  const ch = Object.keys(GL);
  const [c, g] = mk(ch.length * 6, 7);
  g.fillStyle = '#fff';
  ch.forEach((k, i) => {
    let mn = 5, mx = -1;
    GL[k].forEach((bits, y) => {
      for (let x = 0; x < 5; x++) if (bits & (16 >> x)) {
        g.fillRect(i * 6 + x, y, 1, 1);
        if (x < mn) mn = x;
        if (x > mx) mx = x;
      }

    if (mx < 0) { mn = 0; mx = 2; }
    if (k >= '0' && k <= '9') { mn = 0; mx = 4; }
    FONT[k] = { x: i * 6 + mn, w: mx - mn + 1 };

})();
function fontT(col) {
  let t = TINTS.get(col);
  if (!t) { t = tint(FATLAS, col, 1, 'source-in'); TINTS.set(col, t); }
  return t;
}

function tw(s, sc) {
  sc = sc || 1;
  s = String(s).toUpperCase();
  let w = 0;
  for (const ch of s) { const f = FONT[ch] || FONT['?']; w += (f.w + 1) * sc; }
  return Math.max(0, w - sc);

const TXC = new Map();

// ---------- drawing primitives
// A 64x64 round glow in color col: bright centre, dithered steps to the edge (made on first use).
const GLOWS = new Map();
function glow(col) {
  let c = GLOWS.get(col);
  if (!c) {
    const [cc, g] = mk(64, 64);
    const [R, G, B] = hexRgb(col);
    const im = g.createImageData(64, 64), d = im.data;
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      const t = Math.hypot(x - 31.5, y - 31.5) / 32;
      if (t >= 1) continue;
      const q = Math.floor(Math.pow(1 - t, 1.7) * 5 + bayer(x, y) * 0.9) / 5;
      if (q <= 0) continue;
      const i = (y * 64 + x) * 4;
      d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = Math.round(Math.min(0.9, q) * 255);
    }
    g.putImageData(im, 0, 0);
    c = cc;
    GLOWS.set(col, c);
  }
  return c;
}
// A glow of radius rad at (x, y), strength a (call it with the 'lighter' blend mode).
function light(x, y, rad, col, a) {
  if (rad < 1) return;
  ctx.globalAlpha = clamp(a == null ? 1 : a, 0, 1);
  blit(glow(col), Math.round(x - rad), Math.round(y - rad), Math.round(rad * 2), Math.round(rad * 2));
}
// Filled pixel circle.
function pcirc(x, y, r, col) {
  if (r < 0.5) return;
  ctx.fillStyle = col;
  x = Math.round(x); y = Math.round(y);
  const R = Math.round(r);
  for (let dy = -R; dy <= R; dy++) {
    const w = Math.floor(Math.sqrt(R * R - dy * dy + R * 0.5));
    ctx.fillRect(x - w, y + dy, w * 2 + 1, 1);
  }
}
// Pixel ellipse outline, drawn as dots.
function pell(x, y, rx, ry, col) {
  ctx.fillStyle = col;
  const n = Math.max(16, Math.ceil((rx + ry) * 1.7));
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    ctx.fillRect(Math.round(x + Math.cos(a) * rx), Math.round(y + Math.sin(a) * ry), 1, 1);
  }
}
// 1-pixel rectangle outline without the corner pixels.
function frame(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x + 1, y, w - 2, 1);
  ctx.fillRect(x + 1, y + h - 1, w - 2, 1);
  ctx.fillRect(x, y + 1, 1, h - 2);
  ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}
// UI panel: fill, frame, a light top line and a dark bottom line.
function panel(x, y, w, h, bg) {
  ctx.fillStyle = bg || '#101115';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, '#2e3139');
  ctx.fillStyle = '#1c1e24';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  ctx.fillStyle = '#07080a';
  ctx.fillRect(x + 2, y + h - 2, w - 4, 1);
}
// Bar with a dark border. f = filled part 0..1, hi = optional 1 px highlight on top of the fill.
function bar(x, y, w, h, f, bg, fg, hi) {
  ctx.fillStyle = '#07080a';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  const fw = Math.round(w * clamp(f, 0, 1));
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, fw, h);
  if (hi) { ctx.fillStyle = hi; ctx.fillRect(x, y, fw, 1); }
}

// ---------- zombie frame sets
// Every frame has n = normal, w = white (hit flash), h = hot (thermal camera), s = shadow, each also
// mirrored (nf, wf, hf, sf) for a zombie that walks left. Plus the body turned on its side (dead),
// the 4 turns of a thrown body (spin) and two corpses with a pool of blood.
function makeZSet(w, h, draw, pal, shw) {
  const S = { walk: [] };
  for (let f = 0; f < 2; f++) {
    const raw = pix(w, h, (r) => draw(r, f, pal));
    const n = selOut(rimLight(raw, '#e8e2cc', 0.22));
    const hot = outline(hotSpr(raw), '#161616');
    const nf = flipH(n), hf = flipH(hot);
    S.walk.push({
      n, nf, w: tint(n, '#fff3dc', 0.75), wf: tint(nf, '#fff3dc', 0.75), h: hot, hf,
      s: unitShadow(n, shw), sf: unitShadow(nf, shw)
    });
  }
  const c0 = S.walk[0].n;
  S.ax = c0.width >> 1;
  S.ay = c0.height - 1;
  S.h = c0.height;
  S.shp = S.walk[0].s.pad || 0;
  S.dead = rot90(c0);
  S.deadH = rot90(S.walk[0].h);
  // a body thrown by a blast turns over in the air: 4 quarter turns (normal and hot)
  S.spin = [c0, S.dead, rot90(S.dead), rot90(rot90(S.dead))];
  S.spinH = [S.walk[0].h, S.deadH, rot90(S.deadH), rot90(rot90(S.deadH))];
  S.dax = S.dead.width >> 1;
  S.day = S.dead.height - 1;
  const raw0 = pix(w, h, (r) => draw(r, 0, pal));
  S.corpses = [corpseSpr(raw0, false), corpseSpr(raw0, true)];
  S.cax = S.corpses[0].width >> 1;
  S.cay = S.corpses[0].height - 2;
  return S;
}

// Pine, h px tall. pal = [dark, mid, light]; the lit side is on the left (from Ball x Archers).
function pineSpr(h, rng, pal) {
  const w = (Math.round(h * 0.62) | 1);

    const cx = w >> 1;
    r(cx, h - 4, 1, 4, '#24180f');
    const tiers = h > 22 ? 4 : 3, bot = h - 3;
    for (let t = 0; t < tiers; t++) {
      const y0 = Math.round(bot * t / tiers * 0.78), y1 = Math.min(bot, Math.round(bot * (t + 1) / tiers * 0.78 + bot * 0.24));
      const maxw = Math.round((w / 2) * (0.45 + 0.55 * (t + 1) / tiers));
      for (let y = y0; y < y1; y++) {
        const u = (y - y0) / Math.max(1, y1 - y0 - 1), hw = Math.max(0, Math.round(u * maxw));
        for (let x = cx - hw; x <= cx + hw; x++) {
          const side = (x - cx) / (hw + 0.01);
          let c = side < -0.3 ? pal[2] : side < 0.35 ? pal[1] : pal[0];
          if (y === y1 - 1 && rng() < 0.5) c = pal[0];
          if (rng() < 0.06) c = pal[0];

}

function oakSpr(h, rng, autumn) {
  const w = Math.round(h * 0.95) | 1, cr = w / 2 - 0.5, th = Math.round(h * 0.32);
  const pal = autumn ? ['#2a1a10', '#4a2a16', '#6e3f1e', '#94582a'] : ['#18240f', '#26361a', '#384d25', '#506633'];
  const lumps = [];
  for (let k = 0; k < 6; k++) lumps.push([rng() * TAU, 0.18 + rng() * 0.16]);
  return pix(w, h, (r) => {
    const cx = (w - 1) / 2, cy = (h - th) / 2;
    r(Math.round(cx) - 1, h - th - 2, 2, th + 2, '#2a1d13'); r(Math.round(cx) - 1, h - th - 2, 1, th + 2, '#3b2a1c');
    r(Math.round(cx) + 1, h - 3, 1, 1, '#2a1d13'); r(Math.round(cx) - 2, h - 1, 1, 1, '#2a1d13');
    for (let y = 0; y < h - th + 1; y++) for (let x = 0; x < w; x++) {
      const dx = (x - cx) / cr, dy = (y - cy) / (cy + 0.5), a = Math.atan2(dy, dx);
      let rim = 0.86;
      for (const [la, lr] of lumps) rim += lr * Math.max(0, Math.cos(a - la)) * 0.45;
      const d = Math.hypot(dx, dy);

      r(x, y, 1, 1, l > 0.62 ? pal[3] : l > 0.12 ? pal[2] : l > -0.45 ? pal[1] : pal[0]);
    }
  });

// world.js - the countryside the railway runs through, built in 128 px chunks as the camera moves.
// Every chunk has a plan (its trees, wrecks, ruins, rocks, poles, tufts and fires, from a seed made
// of its coordinates, so the same place always holds the same things) and a baked ground image:
// painted grass and dirt from warped noise in world coordinates (so chunks meet without seams), farm
// tracks, ploughed fields, the railway, specks, pebbles, flowers, and the cast shadows of everything
// standing on it. Decals (blood, bodies, scorch, craters) are painted onto a second image per chunk
// and slowly fade.

const CH = 128;
// hue-shifted ramps (darks lean teal, lights lean warm olive), from Ball x Archers
const GR = ['#1e2a24', '#243226', '#2b3928', '#323f29', '#3a472b', '#44502e'].map(hexRgb);
const DR = ['#2a2521', '#332b24', '#3c3229', '#463b2f', '#514435'].map(hexRgb);
const PLOW = ['#251e19', '#2f2620', '#3a3027', '#46392d'].map(hexRgb);
// ---------- the railway
// It winds north for ever: its middle is at x = trackX(y), two gentle waves added together (the
// steepest bend is under 30 degrees from north). trackSlope(y) = dx/dy, trackS(y) = the distance
// along the rails from y = 0 (from the first terms of the arc-length integral: off by far less
// than a pixel per sleeper).
const TK = { a1: 140, l1: 520, p1: 0.7, a2: 50, l2: 190, p2: 2.1 };
function trackX(y) {
  return TK.a1 * Math.sin(y / TK.l1 + TK.p1) + TK.a2 * Math.sin(y / TK.l2 + TK.p2);
}
function trackSlope(y) {
  return TK.a1 / TK.l1 * Math.cos(y / TK.l1 + TK.p1) + TK.a2 / TK.l2 * Math.cos(y / TK.l2 + TK.p2);
}
function trackS(y) {
  const a1 = TK.a1 / TK.l1, a2 = TK.a2 / TK.l2, k1 = 1 / TK.l1, k2 = 1 / TK.l2, km = k1 - k2, kp = k1 + k2;
  const i1 = y / 2 + Math.sin(2 * (y * k1 + TK.p1)) / (4 * k1);
  const i2 = y / 2 + Math.sin(2 * (y * k2 + TK.p2)) / (4 * k2);
  const i12 = 0.5 * (Math.sin(km * y + TK.p1 - TK.p2) / km + Math.sin(kp * y + TK.p1 + TK.p2) / kp);
  return y + 0.5 * (a1 * a1 * i1 + a2 * a2 * i2 + 2 * a1 * a2 * i12);
}
// The y where the distance along the rails is s (Newton's method from a nearby guess).
function yAtS(s, guess) {
  let y = guess;
  for (let i = 0; i < 3; i++) {
    const fp = trackSlope(y);
    y -= (trackS(y) - s) / (1 + 0.5 * fp * fp);
  }
  return y;
}
// A point in the railway's own terms: u = px to the right of its middle (east), a = distance along it.
function trackLocal(x, y, out) {
  const fp = trackSlope(y), c = 1 / Math.sqrt(1 + fp * fp), off = x - trackX(y);
  out.u = off * c;
  out.a = trackS(y) + off * fp * c;
  out.c = c;
  return out;
}
// true when (x, y) is closer than m (across) to the middle of the railway
const nearRail = (x, y, m) => Math.abs(x - trackX(y)) < m;
// the colours: gravel, wooden sleepers, steel rails (shadow, top)
const BAL = ['#2e2b27', '#3b3732', '#47423b', '#555047'].map(hexRgb);
const SLP = ['#2a1f17', '#3d2d20', '#4f3b29'].map(hexRgb);
const RAILC = ['#24262b', '#8f959e'].map(hexRgb);
// the railway at the row being painted (groundPix goes row by row)
let tkY = NaN, tkX = 0, tkP = 0, tkC = 1, tkS = 0;

// farm tracks: a warped grid, about 1400 x 1000 px
function roadDist(x, y) {
  const wx = x + 60 * Math.sin(y * 0.004) + 25 * Math.sin(y * 0.011 + 1.3);
  const wy = y + 50 * Math.sin(x * 0.0035 + 0.7) + 20 * Math.sin(x * 0.009 + 2.1);
  return Math.min(Math.abs(mod(wx, 1400) - 700), Math.abs(mod(wy, 1000) - 500));
}
// ploughed fields: big patches, each with its own furrow direction
const fieldAt = (x, y) => vnoise(x / 260, y / 260, 35);
const fieldDir = (x, y) => Math.floor(vnoise(x / 520 + 9, y / 520 - 4, 36) * 4) * Math.PI / 4;

// The colour of the ground at one world pixel, written into out[0..2].
function groundPix(X, Y, out) {
  const th = bayer(X, Y);
  // domain warp: organic patches, no grid-aligned squares
  const n2 = vnoise(X / 16, Y / 16, 31), n2b = vnoise(X / 16 + 37.1, Y / 16 - 11.3, 32);
  const wx = X + (n2 - 0.5) * 48, wy = Y + (n2b - 0.5) * 36;
  const gv = vnoise(wx / 56, wy / 56, 33) * 0.7 + n2 * 0.3;
  const dirt = vnoise(wx / 40, wy / 40, 34) + (th - 0.5) * 0.1;
  let col;
  if (dirt > 0.74) col = DR[clamp(Math.floor((gv - 0.3) / 0.4 * 2.5 + 1.2 + th - 0.5), 0, DR.length - 1)];
  else col = GR[clamp(Math.floor((gv - 0.3) / 0.4 * 2.5 + 1.5 + (dirt > 0.68 ? -1 : 0) + th - 0.5), 0, GR.length - 1)];
  // ploughed fields: furrows every 3 px, softened at the field edge
  const fv = fieldAt(X, Y);
  if (fv > 0.63 + (th - 0.5) * 0.02) {
    const a = fieldDir(X, Y), u = X * Math.cos(a) + Y * Math.sin(a);
    const row = mod(Math.floor(u), 4) === 0 ? 0 : 1, edge = fv < 0.66;
    col = PLOW[clamp(row + (gv > 0.5 ? 1 : 0) + (edge ? 1 : 0) + (th > 0.85 ? 1 : 0), 0, 3)];
    if (row && vnoise(X / 5, Y / 5, 37) > 0.74) col = GR[2];          // a few sprouts
  }
  // farm tracks: a grassy crown, two muddy ruts, worn earth, a dithered edge
  const rd = roadDist(X, Y);
  if (rd < 8.5 + (th - 0.5) * 2) {
    if (rd < 1.4) col = GR[1];
    else if (Math.abs(rd - 3.6) < 1.1) col = DR[0];
    else col = DR[clamp(2 + (gv > 0.5 ? 1 : 0) + (th > 0.75 ? 1 : 0) - (rd > 6.5 ? 1 : 0), 0, 4)];
  }
  // the railway: a bed of gravel with a ragged edge, a sleeper every 6 px along the rails (lit
  // side, shadow), and the two rails (bright tops, their shadow on the east side)
  if (Y !== tkY) {
    tkY = Y;
    tkX = trackX(Y);
    tkP = trackSlope(Y);
    tkC = 1 / Math.sqrt(1 + tkP * tkP);
    tkS = trackS(Y);
  }
  const off = X - tkX, ru = Math.floor(off * tkC);
  if (ru >= -13 && ru <= 12) {
    const edge = ru < 0 ? -ru - 10 : ru - 9;
    if (edge <= 0 || th * 3 > edge) {
      col = BAL[clamp(Math.floor(hrnd(X, Y, 91) * 2.4 + gv * 1.5 - (edge > 0 ? 1 : 0)), 0, 3)];
      const sy = mod(Math.floor(tkS + off * tkP * tkC), 6);
      if (ru >= -8 && ru <= 7 && sy < 2) col = SLP[sy === 0 ? 2 : 1];
      else if (ru >= -8 && ru <= 7 && sy === 2) col = SLP[0];
      if (ru === -5 || ru === 4) col = RAILC[1];
      else if (ru === -4 || ru === 5) col = RAILC[0];
    }
  }
  out[0] = col[0]; out[1] = col[1]; out[2] = col[2];
}

/* ------------------------------------------------------------------ plans */
const PLANS = new Map();
const ckey = (ci, cj) => ci * 100003 + cj;
// Everything that stands in chunk (ci, cj). props are drawn standing (sorted with the dead),
// flats are painted into the ground, block = flat triples x, y, r the dead walk round.
function plan(ci, cj) {
  const key = ckey(ci, cj);
  let pl = PLANS.get(key);
  if (pl) return pl;
  const rng = mulberry(hash32(Math.imul(ci, 73856093) ^ Math.imul(cj, 19349663) ^ 0x5eed));
  const X0 = ci * CH, Y0 = cj * CH;
  pl = { props: [], flats: [], tufts: [], fires: [], block: [] };
  const take = (list) => list[(rng() * list.length) | 0];
  const put = (def, x, y, o) => {
    // (nothing stands on a station's ground)
    if (stationZone(x, y)) return null;
    const p = Object.assign({ d: def, x: Math.round(x), y: Math.round(y) }, o || {});
    p.k = p.y;
    pl.props.push(p);
    if (def.block) pl.block.push(p.x, p.y, def.block);
    return p;
  };
  // groves where the noise is high, a lone tree now and then
  for (let k = 0; k < 30; k++) {
    const x = X0 + rng() * CH, y = Y0 + rng() * CH;
    if (roadDist(x, y) < 16 || fieldAt(x, y) > 0.61 || nearRail(x, y, 40)) continue;
    const gv = vnoise(x / 110, y / 110, 41);
    if (gv > 0.68 ? rng() < (gv - 0.68) * 4.5 : rng() < 0.01) {
      const r = rng();
      put(take(r < 0.55 ? PROPS.pine : r < 0.78 ? PROPS.oak : r < 0.9 ? PROPS.fall : PROPS.dead), x, y);
    }
  }
  // wrecks on the tracks, a third of them still burning
  if (rng() < 0.4) {
    for (let k = 0; k < 12; k++) {
      const x = X0 + 12 + rng() * (CH - 24), y = Y0 + 8 + rng() * (CH - 16);
      if (roadDist(x, y) > 5 || nearRail(x, y, 60)) continue;
      const burning = rng() < 0.35;
      put(take(burning ? PROPS.burnt : rng() < 0.4 ? PROPS.burnt : PROPS.wreck), x, y);
      if (burning) pl.fires.push({ x: Math.round(x) + 1, y: Math.round(y) - 7, seed: (rng() * 1000) | 0, big: true });
      if (rng() < 0.5) put(take(PROPS.barrel), x + 16 + rng() * 6, y + 4 + rng() * 6);
      break;
    }
  }
  // now and then a burnt-out farm: broken walls, rubble, a barrel or crate, a smouldering fire
  if (hrnd(ci, cj, 5) < 0.05 && roadDist(X0 + 64, Y0 + 64) > 40 && fieldAt(X0 + 64, Y0 + 64) < 0.6 && !nearRail(X0 + 64, Y0 + 64, 220)) {
    const cx = X0 + 40 + rng() * 48, cy = Y0 + 40 + rng() * 48;
    for (let k = 0; k < 3 + ((rng() * 3) | 0); k++) {
      const w = take(PROPS.wall), x = cx + (rng() - 0.5) * 50, y = cy + (k - 1.5) * 12 + (rng() - 0.5) * 4;
      put(w, x, y);
      for (let s = -w.spr.width / 2 + 2; s < w.spr.width / 2; s += 4) pl.block.push(Math.round(x + s), Math.round(y), 3);
    }
    for (let k = 0; k < 2 + ((rng() * 3) | 0); k++) put(take(rng() < 0.6 ? PROPS.barrel : PROPS.crate), cx + (rng() - 0.5) * 44, cy + (rng() - 0.5) * 30);
    if (rng() < 0.6) put(take(PROPS.dead), cx + (rng() - 0.5) * 60, cy - 20 - rng() * 10);
    if (rng() < 0.5) pl.fires.push({ x: Math.round(cx), y: Math.round(cy), seed: (rng() * 1000) | 0, big: false });
  }
  // bushes, rocks, stumps
  for (let k = 0; k < 3; k++) if (rng() < 0.5) {
    const x = X0 + rng() * CH, y = Y0 + rng() * CH;
    if (roadDist(x, y) > 10 && fieldAt(x, y) < 0.62 && !nearRail(x, y, 24)) put(take(PROPS.bush), x, y);
  }
  if (rng() < 0.25) { const x = X0 + rng() * CH, y = Y0 + rng() * CH; if (roadDist(x, y) > 12 && !nearRail(x, y, 28)) put(take(PROPS.big), x, y); }
  for (let k = 0; k < 8; k++) {
    const x = X0 + rng() * CH, y = Y0 + rng() * CH;
    if (roadDist(x, y) < 7 || nearRail(x, y, 17)) continue;
    pl.flats.push({ d: rng() < 0.1 ? PROPS.stump[0] : take(PROPS.rock), x: Math.round(x), y: Math.round(y) });
  }
  // telegraph poles beside the railway, one every 72 px
  for (let y = Math.ceil(Y0 / 72) * 72; y < Y0 + CH; y += 72) {
    const px = trackX(y) + 27;
    if (px >= X0 && px < X0 + CH) put(PROPS.pole[0], px, y);
  }
  // grass tufts (they sway, so they are drawn live)
  for (let k = 0; k < 40 && pl.tufts.length < 16; k++) {
    const x = X0 + ((rng() * CH) | 0), y = Y0 + ((rng() * CH) | 0);
    if (vnoise(x / 16, y / 16, 31) < 0.5 && rng() < 0.8) continue;
    if (roadDist(x, y) < 9 || fieldAt(x, y) > 0.62 || nearRail(x, y, 17)) continue;
    pl.tufts.push({ x, y, h: 2 + ((rng() * 3) | 0), c: rng() < 0.5 ? '#5c6a3d' : '#4a5732', p: rng() * TAU });
  }
  pl.props.sort((a, b) => a.y - b.y);
  if (PLANS.size > 4000) PLANS.clear();
  PLANS.set(key, pl);
  return pl;
}

/* ------------------------------------------------------------------ ground */
const GROUND = new Map();
const PIX = [0, 0, 0];
function bakeChunk(ci, cj) {
  const [c, g] = mk(CH, CH);
  const X0 = ci * CH, Y0 = cj * CH;
  const im = g.createImageData(CH, CH), d = im.data;
  for (let y = 0; y < CH; y++) for (let x = 0; x < CH; x++) {
    groundPix(X0 + x, Y0 + y, PIX);
    const i = (y * CH + x) * 4;
    d[i] = PIX[0]; d[i + 1] = PIX[1]; d[i + 2] = PIX[2]; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  const rng = mulberry(hash32(Math.imul(ci, 2654435761) ^ Math.imul(cj, 40503) ^ 0xb4e));
  const r = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  // grass specks in clusters, pebbles on bare earth, a few pale flowers
  for (let k = 0; k < 160; k++) {
    const x = (rng() * CH) | 0, y = (rng() * CH) | 0;
    if (vnoise((X0 + x) / 16, (Y0 + y) / 16, 31) < 0.52) continue;
    r(x, y, 1, rng() < 0.5 ? 2 : 1, rng() < 0.6 ? '#56613a' : '#1c2519');
  }
  for (let k = 0; k < 40; k++) {
    const x = (rng() * CH) | 0, y = (rng() * CH) | 0;
    if (vnoise((X0 + x) / 40, (Y0 + y) / 40, 34) < 0.6 && roadDist(X0 + x, Y0 + y) > 8 || nearRail(X0 + x, Y0 + y, 14)) continue;
    r(x, y, 1, 1, '#6d6a62'); r(x, y + 1, 1, 1, '#1d1b18');
  }
  for (let k = 0; k < 10; k++) {
    const x = (rng() * CH) | 0, y = (rng() * CH) | 0;
    if (vnoise((X0 + x) / 16, (Y0 + y) / 16, 31) < 0.6 || fieldAt(X0 + x, Y0 + y) > 0.62) continue;
    r(x, y, 1, 1, rng() < 0.5 ? '#a99b6e' : '#8f6f7a');
  }
  // cast shadows of everything standing here or nearby, and the flat things themselves
  for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
    const pn = plan(ci + di, cj + dj);
    g.globalAlpha = 0.42;
    for (const p of pn.props) g.drawImage(p.d.sh, p.x - p.d.ax - X0, p.y - 1 - Y0);
    for (const f of pn.flats) g.drawImage(f.d.sh, f.x - f.d.ax - X0, f.y - 1 - Y0);
    g.globalAlpha = 1;
    for (const f of pn.flats) g.drawImage(f.d.spr, f.x - f.d.ax - X0, f.y - f.d.ay - Y0);
  }
  return c;
}
// Chunks waiting to be baked: a few per frame, the ones in view first.
function groundChunk(ci, cj, now) {
  const key = ckey(ci, cj);
  let c = GROUND.get(key);
  if (!c && now) { c = bakeChunk(ci, cj); GROUND.set(key, c); }
  return c;
}
function bakeSome(cx0, cy0, cx1, cy1, budget) {
  for (let cj = cy0 - 1; cj <= cy1 + 1 && budget > 0; cj++) for (let ci = cx0 - 1; ci <= cx1 + 1 && budget > 0; ci++) {
    if (!GROUND.has(ckey(ci, cj))) { GROUND.set(ckey(ci, cj), bakeChunk(ci, cj)); budget--; }
  }
  // forget chunks far away
  if (GROUND.size > 160) for (const k of GROUND.keys()) {
    const ci = Math.round(k / 100003), cj = k - ci * 100003;
    if (ci < cx0 - 5 || ci > cx1 + 5 || cj < cy0 - 5 || cj > cy1 + 5) GROUND.delete(k);
  }
}

/* ------------------------------------------------------------------ decals */
const DECALS = new Map();
function decalChunk(ci, cj) {
  const key = ckey(ci, cj);
  let d = DECALS.get(key);
  if (!d) { const [c, g] = mk(CH, CH); d = { c, g, ci, cj }; DECALS.set(key, d); }
  return d;
}
// Paint one pixel (or an s x s square) of color c onto the ground.
function stampPix(x, y, c, s) {
  x = Math.round(x); y = Math.round(y);
  const ci = Math.floor(x / CH), cj = Math.floor(y / CH), d = decalChunk(ci, cj);
  d.g.globalAlpha = 0.85;
  d.g.fillStyle = c;
  d.g.fillRect(x - ci * CH, y - cj * CH, s || 1, s || 1);
  d.g.globalAlpha = 1;
}
// Paint a sprite onto the ground, top left at (x, y), in every chunk it touches.
function stampSpr(spr, x, y, a) {
  x = Math.round(x); y = Math.round(y);
  const ci0 = Math.floor(x / CH), ci1 = Math.floor((x + spr.width - 1) / CH), cj0 = Math.floor(y / CH), cj1 = Math.floor((y + spr.height - 1) / CH);
  for (let cj = cj0; cj <= cj1; cj++) for (let ci = ci0; ci <= ci1; ci++) {
    const d = decalChunk(ci, cj);
    d.g.globalAlpha = a == null ? 0.85 : a;
    d.g.drawImage(spr, x - ci * CH, y - cj * CH);
    d.g.globalAlpha = 1;
  }
}
// Every few seconds the marks fade a little; chunks far from the view are dropped.
function fadeDecals(cx0, cy0, cx1, cy1) {
  for (const [k, d] of DECALS) {
    if (d.ci < cx0 - 4 || d.ci > cx1 + 4 || d.cj < cy0 - 4 || d.cj > cy1 + 4) { DECALS.delete(k); continue; }
    d.g.globalCompositeOperation = 'destination-out';
    d.g.fillStyle = 'rgba(0,0,0,0.05)';
    d.g.fillRect(0, 0, CH, CH);
    d.g.globalCompositeOperation = 'source-over';
  }
}
function clearDecals() { DECALS.clear(); }

// Solid things near (x, y) the dead walk round: flat triples x, y, radius.
function blockersNear(x, y, out) {
  out.length = 0;
  const i0 = Math.floor((x - 16) / CH), i1 = Math.floor((x + 16) / CH), j0 = Math.floor((y - 16) / CH), j1 = Math.floor((y + 16) / CH);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const b = plan(i, j).block;
    for (let k = 0; k < b.length; k += 3) if (Math.abs(b[k] - x) < 16 && Math.abs(b[k + 1] - y) < 16) out.push(b[k], b[k + 1], b[k + 2]);
  }
  return out;
}

// fx.js - the effects, in the Ball x Archers style: particles (dirt and blood land and stay on the
// ground as decal pixels), fire explosions made of pixel puffs, rings, glows, floating numbers,
// coins that fly to the cash counter, banners, screen shake and hit-stop, and the scorch marks.
// Positions are world pixels (x, y on the ground, z = height), except coins and banners (screen).

// ---------- shake, kick and hit-stop
const cam = { trauma: 0, t: 0, kx: 0, ky: 0 };
let shakeReq = 0, slowT = 0, slowK = 1;
// Ask for screen shake of strength a (weaker with reduced motion).
function addShake(a) {
  shakeReq = Math.max(shakeReq, a * (REDUCED ? 0.3 : 1));
}
// Slow motion for d seconds at time scale k (default 0.12). Off with reduced motion.
function hitStop(d, k) {
  if (REDUCED) return;
  slowT = Math.max(slowT, d);
  slowK = Math.min(slowK, k == null ? 0.12 : k);
}
// Knock the view by (x, y) pixels; it springs back fast. A gun's recoil.
function kick(x, y) {
  if (REDUCED) return;
  cam.kx = clamp(cam.kx + x, -3, 3);
  cam.ky = clamp(cam.ky + y, -3, 3);
}
function updateCam(dt) {
  cam.t += dt;
  cam.trauma = Math.min(1, cam.trauma + shakeReq * (1 - cam.trauma * 0.6));
  shakeReq = 0;
  cam.trauma = Math.max(0, cam.trauma - dt * 2);
  const k = Math.exp(-16 * dt);
  cam.kx *= k;
  cam.ky *= k;
}
// Screen shake offset [x, y]. Strength = trauma squared; two sine waves per axis, plus the kick.
function shakeOff() {
  const s = cam.trauma * cam.trauma * 5;
  return [Math.round((Math.sin(cam.t * 71.3) + Math.sin(cam.t * 37.9) * 0.6) * s * 0.6 + cam.kx),
    Math.round((Math.sin(cam.t * 53.1 + 1.3) + Math.sin(cam.t * 29.7) * 0.6) * s * 0.6 + cam.ky)];
}

// ---------- effect lists
const parts = [], lights = [], booms = [], rings = [], texts = [], banners = [], coins = [], flames = [];
function clearFX() {
  for (const a of [parts, lights, booms, rings, texts, banners, coins, flames]) a.length = 0;
  clearDecals();
}

// Add one particle (o itself becomes the particle). Returns null when a limit is hit: 2600
// particles in all and about 260 glowing ("add") ones. o = {x, y, z, vx, vy, vz, g (gravity),
// life, max, s (size), c (color), add (glows), land (1 = becomes a ground pixel when it lands),
// drag, grow, smoke (fades softly)}.
let ADD = 0;
function part(o) {
  if (parts.length >= 2600) return null;
  if (o.add) {
    if (ADD >= 260) return null;
    ADD++;
  }
  if (o.land === undefined) o.land = 0;
  parts.push(o);
  return o;
}

// A fire explosion: R = size in px, n puffs, T seconds, cap = biggest puff radius,
// delay = seconds before it starts.
function addBoom(x, y, R, n, T, cap, delay) {
  const pf = [];
  for (let i = 0; i < n; i++) pf.push({ a: i * TAU / n + rnd(-0.5, 0.5), d: rnd(0.2, 0.45), s: rnd(0.42, 0.6), up: rnd(0.3, 0.6) });
  booms.push({ x, y, r: R, t: -(delay || 0), T, cap: cap || 7, pf });
}

// A floating "+N" over (x, y) ("-N" when neg: damage). A total close to a recent one of the same
// color adds up instead.
function addTotal(x, y, v, c, big, neg) {
  const sign = neg ? '-' : '+';
  for (const t of texts) {
    if (t.tot && t.c === c && t.sign === sign && t.life > t.max * 0.35 && Math.abs(t.x - x) < 24 && Math.abs(t.y - y) < 18) {
      t.val += v;
      t.v = sign + fmt(t.val);
      t.life = t.max;
      t.hot = 0.05;
      if (t.val >= 20) t.s = 2;
      return;
    }
  }
  if (texts.length >= 40) return;
  texts.push({ tot: true, sign, x, y, z: 16, vz: big ? 40 : 28, vx: 0, s: big ? 2 : 1, c, val: v, v: sign + fmt(v),
    life: big ? 1 : 0.75, max: big ? 1 : 0.75, hot: 0.06 });
}
// A word that floats up from (x, y), like OVERHEAT.
function floatText(x, y, s, c) {
  if (texts.length >= 40) return;
  texts.push({ x, y, z: 18, vz: 22, vx: 0, s: 1, c, v: s, life: 0.9, max: 0.9, hot: 0.05 });
}

// A big banner: a = title, b = subtitle, c = color. pri = priority: a newer banner does not
// replace a young one (under 0.6 s) with a higher priority.
function banner(a, b, c, pri) {
  pri = pri || 0;
  const o = banners[0];
  if (o && o.t < 0.6 && (o.pri || 0) > pri) return;
  banners.length = 0;
  banners.push({ a, b: b || '', c: c || U.ink, t: 0, T: 2.2, pri });
  SFX.banner();
}

// ---------- update
function updateFX(dt) {
  ADD = 0;
  // particles: gravity, drag, growth. A falling particle with land = 1 becomes a ground pixel
  // when it lands; the others stop and slide.
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) {
      parts[i] = parts[parts.length - 1];
      parts.pop();
      continue;
    }
    if (p.add) ADD++;
    p.vz -= (p.g || 0) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    if (p.drag) {
      const k = Math.exp(-p.drag * dt);
      p.vx *= k;
      p.vy *= k;
      if (!p.g) p.vz *= k;
    }
    if (p.grow) p.s += p.grow * dt;
    if (p.g > 0 && p.z <= 0 && p.vz < 0) {
      p.z = 0;
      if (p.land === 1) {
        stampPix(p.x, p.y, p.c, p.s | 0 || 1);
        parts[i] = parts[parts.length - 1];
        parts.pop();
        continue;
      }
      p.vz = 0;
      p.vx *= 0.6;
      p.vy *= 0.6;
    }
  }
  // lights, explosions and rings only age and go
  for (let i = lights.length - 1; i >= 0; i--) {
    lights[i].life -= dt;
    if (lights[i].life <= 0) {
      lights[i] = lights[lights.length - 1];
      lights.pop();
    }
  }
  for (let i = booms.length - 1; i >= 0; i--) {
    booms[i].t += dt;
    if (booms[i].t >= booms[i].T) booms.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].t += dt;
    if (rings[i].t >= rings[i].T) rings.splice(i, 1);
  }
  // floating texts rise and slow down
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    if (t.hot > 0) t.hot -= dt;
    t.z += t.vz * dt;
    t.vz -= 70 * dt;
    t.x += t.vx * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }
  // coins fly to the cash counter; when one gets there the counter jumps
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.t += dt;
    if (c.t >= c.T) {
      coins.splice(i, 1);
      if (G) G.cashPulse = 1;
      if (G && !G.demo) SFX.coin();
    }
  }
  // small fires left by the 105: tongues of flame, embers and smoke
  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];
    f.life -= dt;
    if (f.life <= 0) {
      flames.splice(i, 1);
      continue;
    }
    if (Math.random() < dt * 5) part({ x: f.x + rnd(-1.5, 1.5), y: f.y, z: rnd(2, 4), vx: rnd(-4, 4), vy: rnd(-2, 2), vz: rnd(14, 26),
      g: -4, life: rnd(0.4, 0.8), max: 0.8, s: 1, c: pick(['#ffc27a', '#ff8a3a', '#e2552f']), add: true, drag: 1.5 });
    if (Math.random() < dt * 1.6) part({ x: f.x + rnd(-1, 1), y: f.y, z: 5, vx: rnd(3, 8), vy: rnd(-2, 2), vz: rnd(7, 12),
      g: 0, life: rnd(1.4, 2.2), max: 2.2, s: rnd(2, 3), c: pick(['rgba(52,46,42,0.6)', 'rgba(70,62,56,0.5)']), grow: 2.5, drag: 0.4, smoke: true });
  }
}

// ---------- marks on the ground
// SCORCH[k]: a dark dithered ellipse, radius 4 (a 25mm round), 9, 16 and 24 (the 105 crater with
// a rim of thrown-up earth).
const SCORCH = [];
function bakeScorch() {
  SCORCH.length = 0;
  for (const R of [4, 9, 16, 24]) {
    const Ry = Math.round(R * FORE), rg = mulberry(R * 7 + 1), w = R * 2 + 3, h = Ry * 2 + 3;
    SCORCH.push(pix(w, h, (r) => {
      for (let y = -Ry - 1; y <= Ry + 1; y++) for (let x = -R - 1; x <= R + 1; x++) {
        const d = Math.hypot(x / R, y / Ry) + (rg() - 0.5) * 0.2, X = x + R + 1, Y = y + Ry + 1;
        if (d > 1.08) continue;
        if (d > 0.88) {
          if (R > 8 && rg() < 0.6) r(X, Y, 1, 1, rg() < 0.5 ? 'rgba(96,80,58,0.85)' : 'rgba(64,53,41,0.85)');
          continue;
        }
        if (R > 8 && d < 0.55) r(X, Y, 1, 1, d < 0.3 ? 'rgba(8,6,5,0.82)' : 'rgba(16,12,9,0.72)');
        else if ((1 - d) * 1.8 > bayer(X, Y) + 0.1) r(X, Y, 1, 1, d < 0.45 ? 'rgba(12,9,7,0.62)' : 'rgba(26,19,13,0.5)');
      }
    }));
  }
}
function stampScorch(x, y, k) {
  const s = SCORCH[k];
  stampSpr(s, x - (s.width >> 1), y - (s.height >> 1), 1);
}
// One of the 2 corpse images of zombie sprite set S, with its pool of blood.
function stampCorpse(S, x, y) {
  stampSpr(S.corpses[(Math.random() * 2) | 0], x - S.cax, y - S.cay, 0.9);
}

// ---------- drawing (world layer, under the camera transform)
// Explosion colors, from hot to smoke.
const BC = ['#fff6e0', '#ffd27a', '#ff9a3a', '#e2552f', '#9a3320', '#4a2418', '#2e2320'];

// Particles. add = true: only the glowing ones (drawn with 'lighter'), false: only the others.
function drawParts(add) {
  for (const p of parts) {
    if (!!p.add !== add) continue;
    const a = p.smoke ? Math.min(1, p.life / p.max * 1.5) : p.life / p.max;
    ctx.globalAlpha = clamp(add || p.smoke ? a : 1, 0, 1);
    ctx.fillStyle = p.c;
    const s = Math.max(1, Math.round(p.s));
    ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - p.z - s / 2), s, s);
  }
  ctx.globalAlpha = 1;
}
// Fire explosions: a white flash, then puffs that grow, rise and turn to smoke.
function drawBooms() {
  const many = booms.length > 10;
  for (const b of booms) {
    if (b.t < 0) continue;
    const u = b.t / b.T, e = 1 - Math.pow(1 - u, 3);
    if (u < 0.06) {
      pcirc(b.x, b.y - 3, Math.min(b.cap * 0.75, b.r * 0.35), '#fff6e0');
      continue;
    }
    const ci = Math.min(6, (u * 9) | 0), fade = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
    const n = many ? Math.min(2, b.pf.length) : b.pf.length;
    for (let i = 0; i < n; i++) {
      const p = b.pf[i], k = 0.55 + 0.7 * e;
      const px = b.x + Math.cos(p.a) * b.r * p.d * k,
        py = b.y - 3 + Math.sin(p.a) * b.r * p.d * k * FORE - b.r * p.up * e,
        pr = Math.min(b.cap, b.r * p.s * (0.5 + 0.3 * e)) * (0.6 + 0.4 * fade);
      if (pr < 1) continue;
      ctx.globalAlpha = ci < 3 ? 1 : 0.55 * fade;
      if (ci < 3) pcirc(px, py + 1, pr, '#140e0c');
      pcirc(px, py, pr, BC[ci]);
      ctx.globalAlpha = 1;
      if (ci < 4) pcirc(px - pr * 0.3, py - pr * 0.35, pr * 0.5, BC[Math.max(0, ci - 1)]);
    }
  }
}
// Rings that grow on the ground and fade (draw with 'lighter').
function drawRings() {
  for (const r of rings) {
    const u = r.t / r.T, rr = lerp(r.r0, r.r1, 1 - Math.pow(1 - u, 2));
    ctx.globalAlpha = 1 - u;
    pell(r.x, r.y, rr, rr * FORE, r.c);
    if (r.w > 1) pell(r.x, r.y, rr - 1, (rr - 1) * FORE, r.c);
  }
  ctx.globalAlpha = 1;
}
// Effect glows (draw with 'lighter').
function drawLights() {
  for (const l of lights) light(l.x, l.y - l.z, l.r, l.c, l.a * (l.life / l.max));
  ctx.globalAlpha = 1;
}
// Floating numbers and words.
function drawTexts() {
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life / t.max * 2, 0, 1);
    text(t.v, t.x, t.y - t.z, t.hot > 0 ? '#ffffff' : t.c, { align: 'center', scale: t.s });
  }
  ctx.globalAlpha = 1;
}
// A small fire: a flickering flame of a few pixels (big = a burning wreck).
function drawFlame(x, y, big, seed) {
  const f = Math.sin(realT * 19 + seed) * 0.5 + Math.sin(realT * 31 + seed * 1.7) * 0.5;
  const g = Math.sin(realT * 23 + seed * 3.1);
  x = Math.round(x);
  y = Math.round(y);
  if (big) {
    ctx.fillStyle = '#c9772f';
    ctx.fillRect(x - 4, y - 1, 9, 1);
    ctx.fillStyle = '#e2552f';
    ctx.fillRect(x - 3, y - 5, 7, 4);
    ctx.fillStyle = '#ff8a3a';
    ctx.fillRect(x - 2, y - 7 - (f > 0 ? 1 : 0), 5, 6);
    ctx.fillStyle = '#ffcf6a';
    ctx.fillRect(x - 1, y - 5, 3, 4);
    ctx.fillStyle = '#fff1c2';
    ctx.fillRect(x, y - 3, 1, 2);
    ctx.fillStyle = '#ff8a3a';
    ctx.fillRect(x - 1 + (f > 0.2 ? 1 : 0), y - 10 - (g > 0 ? 1 : 0), 2, 3);
    ctx.fillStyle = '#e2552f';
    ctx.fillRect(x + (f < -0.2 ? -2 : 2), y - 12 - (g > 0.5 ? 1 : 0), 1, 2);
    ctx.fillRect(x + (g < 0 ? -3 : 3), y - 8, 1, 1);
  } else {
    ctx.fillStyle = '#c9772f';
    ctx.fillRect(x - 2, y - 1, 5, 1);
    ctx.fillStyle = '#ffcf6a';
    ctx.fillRect(x - 1, y - 3, 3, 2);
    ctx.fillStyle = '#ff8a3a';
    ctx.fillRect(x - 1 + (f > 0.2 ? 1 : 0), y - 5 - (f > 0 ? 1 : 0), 2, 2);
    ctx.fillStyle = '#e2552f';
    ctx.fillRect(x + (f < -0.2 ? -1 : 1), y - 7, 1, 1);
  }
}

// ---------- drawing (screen layer)
// Coins on a curve from where the zombie fell to the cash counter (top left).
function drawCoins() {
  for (const c of coins) {
    if (c.t < 0) continue;
    const u = ease(c.t / c.T);
    const x = lerp(c.x0, 9, u) + Math.sin(u * Math.PI) * -20, y = lerp(c.y0, 8, u) - Math.sin(u * Math.PI) * 30;
    // one step in three the coin is drawn thin, so it seems to spin
    const wob = ((realT * 16 + c.x0) | 0) % 3;
    ctx.fillStyle = '#7a5a1c';
    ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, wob === 1 ? 1 : 3, 3);
    ctx.fillStyle = '#f6dc8e';
    ctx.fillRect(Math.round(x) - (wob === 1 ? 0 : 1), Math.round(y) - 1, 1, 1);
  }
}
// Banners fade in and slide down, stay, then fade out (timed with the real frame time).
function drawBanners() {
  for (let i = banners.length - 1; i >= 0; i--) {
    const b = banners[i];
    b.t += frameDt;
    const u = b.t / b.T;
    if (u >= 1) {
      banners.splice(i, 1);
      continue;
    }
    const a = u < 0.1 ? u / 0.1 : u > 0.75 ? (1 - u) / 0.25 : 1;
    const dy = Math.round(u < 0.1 ? (1 - u / 0.1) * -6 : 0), y = 58 + dy, h = b.b ? 40 : 28;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,6,8,0.55)';
    ctx.fillRect(0, y, W, h);
    ctx.fillStyle = b.c;
    ctx.globalAlpha = a * 0.6;
    ctx.fillRect(0, y, W, 1);
    ctx.fillRect(0, y + h - 1, W, 1);
    ctx.globalAlpha = a;
    text(b.a, W / 2, y + 6, b.c, { align: 'center', scale: 2, drop: true });
    if (b.b) text(b.b, W / 2, y + 26, U.dim, { align: 'center' });
  }
  ctx.globalAlpha = 1;
}

// audio.js - all sound, made live with the Web Audio API (no sound files). The engine follows
// Ball x Archers: audioInit builds the graph (master -> compressor, plus a light reverb), voice and
// gap limit how often a sound can play, tone and nz make one synth note or one noise burst.
// SFX holds every game sound; drone() is the helicopter's rotor under everything.

const Au = { ctx: null, master: null, noise: null, muted: false, last: {}, hum: null, roar: null };

function audioInit() {
  if (Au.ctx) {
    if (Au.ctx.state === 'suspended') Au.ctx.resume();
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const a = new AC();
    Au.ctx = a;
    Au.master = a.createGain();
    Au.master.gain.value = 0.5;
    const comp = a.createDynamicsCompressor();
    Au.master.connect(comp);
    comp.connect(a.destination);
    comp.threshold.value = -16;
    comp.ratio.value = 4;
    // reverb: 1.3 s of fading noise as the impulse response
    const ir = a.createBuffer(2, a.sampleRate * 1.3 | 0, a.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    }
    const rv = a.createConvolver();
    rv.buffer = ir;
    const wet = a.createGain();
    wet.gain.value = 0.15;
    Au.master.connect(rv);
    rv.connect(wet);
    wet.connect(comp);
    // 1 second of white noise, shared by all noise sounds
    const b = a.createBuffer(1, a.sampleRate, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    Au.noise = b;
  } catch (e) {
    Au.ctx = null;
  }
}

// voice: at most max copies of sound id at once (each copy lasts dur seconds).
const VO = {};
function voice(id, max, dur) {
  const t = Au.ctx ? Au.ctx.currentTime : 0, a = (VO[id] || []).filter((x) => x > t);
  VO[id] = a;
  if (a.length >= max) return false;
  a.push(t + dur);
  return true;
}
// gap: sound id again only after ms milliseconds.
function gap(id, ms) {
  const t = performance.now();
  if (Au.last[id] && t - Au.last[id] < ms) return false;
  Au.last[id] = t;
  return true;
}

// One synth note: frequency f, duration d (s), wave type, volume v, optional slide to f2, delay (s).
function tone(f, d, type, v, f2, delay) {
  const a = Au.ctx;
  if (!a || Au.muted) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g);
  g.connect(Au.master);
  o.start(t);
  o.stop(t + d + 0.03);
}
// One noise burst: duration d, volume v, filter type ft at frequency f with Q q, optional filter
// sweep to f2, delay (s).
function nz(d, v, ft, f, q, f2, delay) {
  const a = Au.ctx;
  if (!a || Au.muted || !Au.noise) return;
  const t = a.currentTime + (delay || 0);
  const s = a.createBufferSource();
  s.buffer = Au.noise;
  const fl = a.createBiquadFilter();
  fl.type = ft || 'lowpass';
  fl.frequency.setValueAtTime(f || 1000, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d);
  fl.Q.value = q || 0.8;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl);
  fl.connect(g);
  g.connect(Au.master);
  s.start(t, Math.random() * 0.4, d + 0.05);
}

// The helicopter: rotor noise through a low-pass filter, chopped by the blades (an LFO on its
// loudness), and a faint turbine whine. v = loudness 0..1 (0 = silent); it glides to the new level.
// k = 0..1: how much higher it all plays (the Turbo Ram).
function drone(v, k) {
  const a = Au.ctx;
  if (!a || !Au.noise) return;
  if (!Au.hum) {
    try {
      const out = a.createGain(), chop = a.createGain(), f = a.createBiquadFilter(), src = a.createBufferSource();
      out.gain.value = 0;
      src.buffer = Au.noise;
      src.loop = true;
      f.type = 'lowpass';
      f.frequency.value = 340;
      f.Q.value = 0.9;
      chop.gain.value = 0.55;
      const lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = 6.4;
      lg.gain.value = 0.5;
      lfo.connect(lg);
      lg.connect(chop.gain);
      src.connect(f);
      f.connect(chop);
      chop.connect(out);
      const whine = a.createOscillator(), wg = a.createGain();
      whine.frequency.value = 1850;
      wg.gain.value = 0.01;
      whine.connect(wg);
      wg.connect(out);
      out.connect(Au.master);
      src.start();
      lfo.start();
      whine.start();
      Au.hum = out;
      Au.humP = [f.frequency, lfo.frequency, whine.frequency];
    } catch (e) {
      return;
    }
  }
  const t = a.currentTime;
  k = k || 0;
  Au.hum.gain.setTargetAtTime(Au.muted ? 0 : v * 0.18, t, 0.5);
  Au.humP[0].setTargetAtTime(340 * (1 + 0.7 * k), t, 0.25);
  Au.humP[1].setTargetAtTime(6.4 + 3.6 * k, t, 0.25);
  Au.humP[2].setTargetAtTime(1850 * (1 + 0.3 * k), t, 0.25);
}

// Every game sound, built from tone() and nz().
const SFX = {
  mg() {
    // the 25mm: a hard, punchy thump with a crack on top
    if (!gap('mg', 55)) return;
    nz(0.12, 0.1, 'lowpass', 2400, 0.9, 220);
    tone(150, 0.09, 'square', 0.032, 46);
    nz(0.025, 0.035, 'highpass', 3200);
  },
  pop() {
    // a 25mm round bursts on the ground
    if (!gap('pop', 32)) return;
    nz(0.13, 0.04, 'bandpass', rnd(480, 900), 1.1, 150);
    tone(rnd(160, 220), 0.06, 'triangle', 0.016, 70);
  },
  cannon() {
    // the 105 fires: a deep blast
    tone(64, 0.55, 'sine', 0.24, 28);
    nz(0.4, 0.17, 'lowpass', 750, 0.7, 90);
    nz(0.08, 0.06, 'highpass', 2600);
  },
  whistle(d) {
    // the shell falling
    tone(1700, d, 'sine', 0.009, 520);
  },
  boom() {
    if (!voice('boom', 3, 1)) return;
    const p = rnd(0.85, 1.15);
    nz(1.1, 0.27, 'lowpass', 1000 * p, 0.7, 45);
    tone(50 * p, 0.8, 'sine', 0.24, 24);
    nz(0.6, 0.05, 'highpass', 2600, 0.7, 900, 0.06);
  },
  splat() {
    // a kill: a wet smack and a short knock
    if (!gap('splat', 28)) return;
    nz(0.07, 0.05, 'bandpass', rnd(260, 520), 1.6, 140);
    tone(rnd(300, 360), 0.05, 'triangle', 0.02, 110);
  },
  hit() {
    if (!gap('hit', 45)) return;
    nz(0.04, 0.045, 'bandpass', rnd(650, 1100), 2, 260);
  },
  coin() {
    if (!gap('coin', 70)) return;
    const f = rnd(2500, 2900);
    tone(f, 0.05, 'sine', 0.012);
    tone(f * 1.49, 0.035, 'sine', 0.007, null, 0.012);
    nz(0.02, 0.01, 'highpass', 6500);
  },
  lock() {
    if (!gap('lock', 120)) return;
    tone(2300, 0.03, 'square', 0.007);
  },
  ready() {
    // the 105 is loaded again
    tone(1250, 0.04, 'square', 0.014);
    tone(1650, 0.05, 'square', 0.014, null, 0.05);
  },
  overheat() {
    tone(900, 0.35, 'square', 0.02, 300);
    nz(0.45, 0.04, 'highpass', 4000, 0.7, 1500);
  },
  ui() {
    tone(620, 0.035, 'square', 0.022);
  },
  banner() {
    tone(392, 0.14, 'triangle', 0.045);
    tone(587, 0.22, 'triangle', 0.045, null, 0.1);
  },
  fanfare() {
    tone(523, 0.1, 'triangle', 0.04);
    tone(659, 0.1, 'triangle', 0.04, null, 0.08);
    tone(784, 0.22, 'triangle', 0.045, null, 0.16);
  },
  warn() {
    // the train is nearly lost: two low, urgent notes
    if (!gap('warn', 250)) return;
    tone(196, 0.16, 'square', 0.03, 185);
    tone(196, 0.2, 'square', 0.03, 165, 0.2);
  },
  horn(k, delay, len) {
    // the train's horn: three sawtooth notes of a chord, a little flat at first, through a low-pass
    // filter. k = pitch (1 = normal), delay (s), len = how long it blows (s)
    const a = Au.ctx;
    if (!a || Au.muted) return;
    k = k || 1;
    len = len || 1.1;
    const t = a.currentTime + (delay || 0), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'lowpass';
    f.frequency.value = 1400 * k;
    f.Q.value = 0.8;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.08);
    g.gain.setValueAtTime(0.05, t + len - 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    for (const fr of [311, 370, 466]) {
      const o = a.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(fr * k * 0.97, t);
      o.frequency.linearRampToValueAtTime(fr * k, t + 0.12);
      o.connect(f);
      o.start(t);
      o.stop(t + len + 0.05);
    }
    f.connect(g);
    g.connect(Au.master);
  },
  ramGo(d) {
    // TURBO RAM: the horn twice (the second higher), a burst, and the roar for d s
    SFX.horn(1, 0, 0.45);
    SFX.horn(1.26, 0.42, 0.8);
    nz(0.7, 0.14, 'lowpass', 2400, 0.7, 160);
    SFX.roar(d, true);
  },
  roar(d, fresh) {
    // the Ram's roar for d s: it rises from low (fresh), or comes straight back at full pitch (after a
    // pause), holds, and dies away over its last second. Au.roar keeps it, so ramStop can cut it.
    SFX.ramStop(0.05);
    const a = Au.ctx;
    if (!a || Au.muted || d < 0.1) return;
    const t = a.currentTime, f = a.createBiquadFilter(), g = a.createGain(), os = [];
    const rise = fresh ? Math.min(1.4, d * 0.5) : 0.1, fall = Math.min(1, d * 0.5), hold = Math.max(rise, d - fall);
    f.type = 'lowpass';
    f.Q.value = 1.4;
    f.frequency.setValueAtTime(fresh ? 260 : 1300, t);
    f.frequency.exponentialRampToValueAtTime(1300, t + rise);
    f.frequency.setValueAtTime(1300, t + hold);
    f.frequency.exponentialRampToValueAtTime(300, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055, t + Math.min(0.25, rise));
    g.gain.setValueAtTime(0.055, t + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    for (const [fr, type] of [[46, 'sawtooth'], [69.5, 'square'], [92.5, 'sawtooth']]) {
      const o = a.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(fresh ? fr : fr * 2.2, t);
      o.frequency.exponentialRampToValueAtTime(fr * 2.2, t + rise);
      o.frequency.setValueAtTime(fr * 2.2, t + hold);
      o.frequency.exponentialRampToValueAtTime(fr * 1.2, t + d);
      o.connect(f);
      o.start(t);
      o.stop(t + d + 0.05);
      os.push(o);
    }
    f.connect(g);
    g.connect(Au.master);
    Au.roar = { g, os };
  },
  ramStop(fade) {
    // the roar fades out over fade s (the Ram was cut short, the game paused, the train was lost)
    const a = Au.ctx, R = Au.roar;
    if (!a || !R) return;
    Au.roar = null;
    const t = a.currentTime, p = R.g.gain, e = fade || 0.25;
    p.cancelScheduledValues(t);
    p.setValueAtTime(Math.max(0.0001, p.value), t);
    p.exponentialRampToValueAtTime(0.0001, t + e);
    for (const o of R.os) {
      try { o.stop(t + e + 0.05); } catch (err) { /* it has stopped already */ }
    }
  },
  crunch(n) {
    // the Ram smashes one: a crunch that climbs with the count
    if (!gap('crunch', 34)) return;
    const p = Math.min(2.4, 1 + n * 0.045);
    nz(0.12, 0.1, 'lowpass', 900 * p, 0.8, 150);
    tone(84 * p, 0.09, 'triangle', 0.06, 44 * p);
    nz(0.05, 0.05, 'bandpass', 620 * p, 1.6);
  },
  hiss() {
    // a long hiss of steam
    nz(1.6, 0.075, 'highpass', 4200, 0.7, 1800);
    nz(1.3, 0.04, 'bandpass', 2600, 0.6, 1400, 0.05);
  },
  ramReady() {
    // the Ram is full again: a rising beep and a chime

    tone(1175, 0.1, 'square', 0.02, null, 0.08);

  },
  crack() {

  slow() {

  gun() {

  buy(big) {
