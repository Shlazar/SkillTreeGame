// ---------- stations and the Depot
// Dress stop st (side 1 = the house east of the rails): a water tower and a name board north of
// the platform, sandbag walls and a lamp past each end of it, picket fences, a bench on it, crates
// and a barrel by the house. The Depot gets an engine shed, a fuel tank, coal, tyres and more lamps
// and sandbags. All of it stands off the grid's free tiles, and casts a shadow (cast).
function dressStop(st) {
  const side = st.side, col = (c) => 6.5 + side * (c - 6.5), at = (c, r) => gridToWorld(col(c), r, st.s);
  const add = (d, c, r, o) => {
    const p = at(c, r), x = Math.round(p.x), y = Math.round(p.y);
    G.statics.push(Object.assign({ d, x, y, k: y, cast: true }, o || {}));
  };
  const depot = st.def === DEPOT;
  add(SCN.tower, 9.8, -2.3);
  add(depot ? SCN.boardD : SCN.board, 10.6, -0.8);
  add(SCN.bench, 8, 2.9, { k: Math.round(at(8, 2.9).y) + 1 });
  // a barrel and crates against the house
  add(PROPS.barrel[0], 12.9, 3.3);
  add(PROPS.crate[0], 10.9, 3.25);
  // picket fences past the ends, sandbags and a lamp at each end of the platform
  for (const r of [-0.7, 8.7]) add(SCN.picket, 12.4, r);
  for (const r of [-1.3, 9.3]) add(SCN.bags, 8.1, r);
  for (const r of [-2.4, 10.4]) add(STATION.lamp, 8.3, r, { lamp: true });
  if (!depot && st.def.kind === 'big') {
    add(SCN.campTents[0], 12.4, 0);
    add(SCN.campTents[1], 12.9, 7);
    add(SCN.campFire[0], 11.9, 6, { campFire: 0.4 });
    for (const [i, c, r] of [[0, 10.3, 6.9], [1, 13.3, 4.8], [2, 10.8, 0.1]]) {
      add(SCN.campPeople[i][0], c, r, { campWave: i });
    }
  }
  if (!depot) return;
  // the Depot: an engine shed across the rails, a fuel tank, coal, crates, more lamps and sandbags
  add(SCN.shed, 3.2, 1.2);
  add(SCN.fuel, 11.8, 7.2);
  add(SCN.coal, 10.4, 7.8);
  add(PROPS.crate[0], 12.4, 1.2);
  add(PROPS.crate[0], 12.9, 1.5);
  add(PROPS.misc[3], 2.6, 6.8);
  add(PROPS.barrel[1], 3.6, 7.4);
  for (const r of [3, 5.8]) add(STATION.lamp, 4.8, r, { lamp: true });
  for (let r = -1; r <= 9; r += 2.2) add(SCN.bags, 0.6, r);
}
// true when (x, y) is on the Depot's ground (no telegraph poles there; stations have stationZone)
function depotZone(x, y) {
  trackLocal(x, y, SZ);
  return Math.abs(SZ.a - stopHouseS(DEPOT)) < 130 && Math.abs(SZ.u) < 150;
}
// Where each stop's yard is: [s of its house, side] for the Depot and every station.
function yards() {
  return [[stopHouseS(DEPOT), 1], [stopHouseS(DEPOT), -1], ...STATIONS.map((d) => [stopHouseS(d), d.side])];
}

// ---------- the wires between the telegraph poles
const POLE_GAP = 72, POLE_U = 27, WIRE_Z = 20;
// SPANS: each span of wire (by the y of its north pole) drawn once: {x, y, w = the two wires,
// s = their shadow on the ground}, or null where a pole is missing (stations, the Depot).
const SPANS = new Map();
function span(y) {
  let s = SPANS.get(y);
  if (s !== undefined) return s;
  if (SPANS.size > 200) SPANS.clear();
  const ya = y + POLE_GAP, xa = Math.round(trackX(ya) + POLE_U), xb = Math.round(trackX(y) + POLE_U);
  s = null;
  if (!(stationZone(xa, ya) || stationZone(xb, y) || depotZone(xa, ya) || depotZone(xb, y))) {
    const ox = Math.round(WIRE_Z * SUNX), oy = Math.round(WIRE_Z * SUNY), x0 = Math.min(xa, xb) - 4, y0 = y - WIRE_Z - 2;
    const w = Math.max(xa, xb) + 6 + ox - x0, h = POLE_GAP + WIRE_Z + oy + 4;
    const [wc, wg] = mk(w, h), [sc, sg] = mk(w, h);
    wireLine(wg, xa - 2 - x0, ya - y0, xb - 2 - x0, y - y0, WIRE_Z, 4, '#16171a');
    wireLine(wg, xa + 2 - x0, ya - y0, xb + 2 - x0, y - y0, WIRE_Z, 5, '#16171a');
    pl(sg, xa + ox - 2 - x0, ya + oy - y0, xb + ox - 2 - x0, y + oy - y0, '#000');
    pl(sg, xa + ox + 2 - x0, ya + oy - y0, xb + ox + 2 - x0, y + oy - y0, '#000');
    s = { x: x0, y: y0, w: wc, s: sc };
  }
  SPANS.set(y, s);
  return s;
}
// Call fn(span) for each span of wire in view.
function eachSpan(fn) {
  const y0 = Math.floor((G.camY - 40) / POLE_GAP) * POLE_GAP, y1 = G.camY + H + 80;
  for (let y = y0; y < y1; y += POLE_GAP) {
    const s = span(y);
    if (s) fn(s);
  }
}
// A wire sagging from pole to pole on context g (oz = the height, sag in px).
function wireLine(g, x0, y0, x1, y1, oz, sag, col) {
  const n = 10;
  let px = x0, py = y0 - oz;
  for (let i = 1; i <= n; i++) {
    const t = i / n, x = lerp(x0, x1, t), y = lerp(y0, y1, t) - oz + Math.sin(t * Math.PI) * sag;
    pl(g, px, py, x, y, col);
    px = x;
    py = y;
  }
}

// ---------- the couplings between the cars
// Car i's front is hooked to the back of the car ahead: a short dark bar with a lit top, at the
// height of the frames (drawn just before car i, so it sits under it and over the car ahead).
function drawCoupler(i) {
  const a = G.tr.cars[i - 1], b = G.tr.cars[i];
  ctx.globalAlpha = 1;
  if (!(Math.abs(a.x1 - b.x0) < 20 && Math.abs(a.y1 - b.y0) < 20)) return;
  pl(ctx, a.x1, a.y1 - 3, b.x0, b.y0 - 3, thermal ? '#3a3a3a' : '#16181c');
  pl(ctx, a.x1, a.y1 - 4, b.x0, b.y0 - 4, thermal ? '#6a6a6a' : '#4b4f5a');
}

// ---------- crows
// BIRDS: crows. sit = on the ground (pecking), else flying away (vx, vy, vz) with flapping wings.
const BIRDS = [];
let birdG = null, birdCd = 0;
function addFlock(x, y) {
  const n = rndi(3, 5);
  for (let i = 0; i < n; i++) BIRDS.push({ x: x + rnd(-12, 12), y: y + rnd(-8, 8), z: 0, vx: 0, vy: 0, vz: 0, sit: true, peck: rnd(3), left: Math.random() < 0.5, f: rnd(2), wait: rnd(0, 0.25) });
}
// Everything within r of (x, y) takes off, away from it.
function scareBirds(x, y, r) {
  for (const b of BIRDS) {
    if (!b.sit || Math.hypot(b.x - x, (b.y - y) / FORE) > r) continue;
    b.sit = false;
    const dx = b.x - x, dy = b.y - y, l = Math.hypot(dx, dy) || 1, s = rnd(40, 60);
    b.vx = dx / l * s + rnd(-12, 12);
    b.vy = dy / l * s * 0.7 - rnd(10, 25);
    b.vz = rnd(28, 40);
    b.left = b.vx < 0;
  }
}
function updateScenery(dt) {
  if (birdG !== G) {
    birdG = G;
    BIRDS.length = 0;
    birdCd = 0;
    // a flock or two in the fields at the start
    for (let k = 0; k < 2; k++) {
      const x = G.camX + rnd(40, W - 40), y = G.camY + rnd(30, H - 40);
      if (!nearRail(x, y, 50)) addFlock(x, y);
    }
  }
  // new flocks land in the fields ahead (just over the top of the view)
  birdCd -= dt;
  if (birdCd <= 0) {
    birdCd = rnd(5, 9);
    if (BIRDS.length < 16) {
      const x = G.camX + rnd(20, W - 20), y = G.camY - rnd(8, 30);
      if (!nearRail(x, y, 50) && !stationZone(x, y)) addFlock(x, y);
    }
  }
  const tr = G.tr, c = tr.cars[0];
  for (let i = BIRDS.length - 1; i >= 0; i--) {
    const b = BIRDS[i];
    if (b.sit) {
      b.peck += dt;
      // the train coming, or the dead walking through them
      if (Math.abs(b.x - trackX(b.y)) < 46 && Math.abs(b.y - c.y0) < 70) scareBirds(c.x0, c.y0, 90);
      if (b.y > G.camY + H + 40 || b.y < G.camY - 300) BIRDS.splice(i, 1);
      continue;
    }
    if (b.wait > 0) { b.wait -= dt; continue; }
    b.f += dt * 11;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z = Math.min(60, b.z + b.vz * dt);
    b.vz = Math.max(4, b.vz - dt * 12);
    if (offView(b.x, b.y - b.z, 60)) BIRDS.splice(i, 1);
  }
  // a crowd of the dead walking into a flock scares it too (one zombie checked a step)
  const zs = G.zombies;
  if (zs.length && BIRDS.length) {
    const z = zs[(Math.random() * zs.length) | 0];
    if (!z.dead) for (const b of BIRDS) if (b.sit && Math.abs(b.x - z.x) < 14 && Math.abs(b.y - z.y) < 10) { scareBirds(z.x, z.y, 40); break; }
  }
}

// ---------- drawing
// On the ground: the wires' shadows and the crows sitting (they peck and turn now and then).
function drawGroundLife() {
  if (thermal) return;
  ctx.globalAlpha = 0.3;
  for (const p of G.statics) {
    if (!p.cast && p.d !== STATION.house && p.d !== STATION.lamp || Math.abs(p.y - G.camY - H / 2) > H) continue;
    blit(p.d.sh, p.x - p.d.ax, p.y - 1);
  }
  ctx.globalAlpha = 0.07;
  eachSpan((s) => ctx.drawImage(s.s, s.x, s.y));
  ctx.globalAlpha = 1;
  for (const b of BIRDS) {
    if (!b.sit) continue;
    const x = Math.round(b.x), y = Math.round(b.y), dn = (b.peck * 2.3 + b.x) % 3 < 0.5 ? 1 : 0, d = b.left ? -1 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x - 1, y, 4, 1);
    ctx.fillStyle = '#121214';
    ctx.fillRect(x - 1, y - 2, 3, 2);
    ctx.fillRect(x + d * 2, y - 3 + dn, 1, 1);
    ctx.fillStyle = '#34363e';
    ctx.fillRect(x - 1, y - 2, 1, 1);
    ctx.fillStyle = '#6a5a3a';
    ctx.fillRect(x + d * 3, y - 3 + dn + (dn ? 1 : 0), 1, 1);
  }
}
// Up in the air: the wires from pole to pole, the crows flying (and their shadows), the flash.
function drawSky() {
  ctx.globalAlpha = thermal ? 0.4 : 0.5;
  eachSpan((s) => ctx.drawImage(s.w, s.x, s.y));
  ctx.globalAlpha = 1;
  for (const b of BIRDS) {
    if (b.sit || b.wait > 0) continue;
    const x = Math.round(b.x), y = Math.round(b.y - b.z), up = (b.f | 0) & 1;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(Math.round(b.x + b.z * SUNX) - 1, Math.round(b.y + b.z * SUNY), 3, 1);
    ctx.fillStyle = thermal ? '#bbbbbb' : '#101012';
    ctx.fillRect(x - 1, y, 3, 1);
    if (up) { ctx.fillRect(x - 2, y - 1, 1, 1); ctx.fillRect(x + 2, y - 1, 1, 1); ctx.fillRect(x - 3, y - 2, 1, 1); ctx.fillRect(x + 3, y - 2, 1, 1); }
    else { ctx.fillRect(x - 2, y + 1, 1, 1); ctx.fillRect(x + 2, y + 1, 1, 1); ctx.fillRect(x - 3, y + 1, 1, 1); ctx.fillRect(x + 3, y + 1, 1, 1); }
  }
}

// render.js - draws one frame of the world: the baked ground and its marks, the helicopters' shadows
// and the other shadows, then trees, props, the train, the station, the safe zone, survivors and
// the dead sorted by depth (the dead behind a tree show through it), fires, particles, explosions,
// flying bodies, the helicopters (helis.js), tracers and glows (headlights, lamps, searchlights),
// then a light vignette (clear daylight), or the thermal camera look (grey, hot things white).

let VIG = null, SCAN = null, GRAIN = null, BODYSH = null;
// Made once: the shadow under a flying body.
function bakeStatic() {
  BODYSH = shadowSpr(9);
}
// Made again for every size of the picture: a light vignette (only its edges are ever drawn, see
// drawVignette), thermal grain and lines.
function bakeOverlays() {
  let g, gr;
  [VIG, g] = mk(W, H);
  g.setTransform(1, 0, 0, H / W, 0, 0);
  gr = g.createRadialGradient(W * 0.5, W * 0.5, W * 0.38, W * 0.5, W * 0.5, W * 0.62);
  gr.addColorStop(0, 'rgba(10,20,12,0)');
  gr.addColorStop(1, 'rgba(10,20,12,0.3)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, W);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // thermal: sensor noise and faint scan lines
  [GRAIN, g] = mk(W + 64, H + 64);
  const rg = mulberry(9);
  for (let i = 0; i < (W + 64) * (H + 64) * 0.18; i++) {
    g.fillStyle = rg() < 0.5 ? '#ffffff' : '#000000';
    g.fillRect((rg() * (W + 64)) | 0, (rg() * (H + 64)) | 0, 1, 1);
  }
  [SCAN, g] = mk(W, H);
  g.fillStyle = 'rgba(0,0,0,0.1)';
  for (let y = 0; y < H; y += 2) g.fillRect(0, y, W, 1);
}

// ---------- what is in view
// DL = everything standing, sorted by depth (k: the ground y of its front, or just in front of the
// car for the dead holding on to the train). CARS = the train's cars as draw-list entries.
const DL = [], TREES = [], VZ = [], FIRES = [], CARS = [];
// One reward actor is reused while a survivor boards or the locked chest is presented.
const STATION_REWARD_DRAW = { stationReward: true, x: 0, y: 0, k: 0, z: 0, age: 0, kind: '' };
const byK = (a, b) => a.k - b.k;
// Collect the props (from the chunk plans and the safe zone), the train and the living dead in
// view, sorted by depth.
function gather(ci0, cj0, ci1, cj1) {
  DL.length = 0;
  TREES.length = 0;
  VZ.length = 0;
  FIRES.length = 0;
  const x0 = G.camX - 8, x1 = G.camX + W + 8, y0 = G.camY - 8, y1 = G.camY + H + 8;
  for (let j = cj0 - 1; j <= cj1 + 1; j++) for (let i = ci0 - 1; i <= ci1 + 1; i++) {
    const pl = plan(i, j);
    for (const p of pl.props) {
      const d = p.d, l = p.x - d.ax, t = p.y - d.ay;
      if (l > x1 || l + d.spr.width < x0 || t > y1 || p.y + 1 < y0) continue;
      DL.push(p);
      if (d.tree) TREES.push(p);
    }
    for (const f of pl.fires) if (f.x > x0 - 30 && f.x < x1 + 30 && f.y > y0 - 30 && f.y < y1 + 30) FIRES.push(f);
  }
  for (const p of G.statics) {
    const d = p.d, l = p.x - d.ax;
    if (l > x1 || l + d.spr.width < x0 || p.y - d.ay > y1 || p.y + 1 < y0) continue;
    DL.push(p);
  }
  for (let i = 0; i < CAR.n; i++) {
    const c = CARS[i] || (CARS[i] = { isCar: true, i, k: 0 }), tc = G.tr.cars[i];
    c.k = tc.k;
    if (tc.cx > x0 - 30 && tc.cx < x1 + 30 && tc.cy > y0 - 30 && tc.cy < y1 + 40) DL.push(c);
  }
  for (const p of G.people) {
    if ((p.st === 'wait' || p.st === 'run' || p.st === 'grab') && p.x > x0 && p.x < x1 && p.y > y0 && p.y < y1 + 10) DL.push(p);
  }
  gatherStationReward();
  // the dead: a crowd in the open is drawn in one go (drawHorde), the rest sorted in here (horde.js)
  gatherHorde(x0, x1, y0, y1);
  DL.sort(byK);
}

// Station rewards age with game time so the boarding moment can be frozen for a picture.
function gatherStationReward() {
  const q = G.stationReward;
  if (!q || G.demo) return;
  const age = G.t - q.t, o = STATION_REWARD_DRAW;
  if (age < 0 || q.kind === 'surv' && age >= 1 || q.kind === 'chest' && age >= 2) return;
  if (q.kind !== 'surv' && q.kind !== 'chest') return;
  o.kind = q.kind; o.age = age; o.z = 0;
  o.d = q.kind === 'chest' ? LART.gold : SCN.campPeople[0][0];
  if (q.kind === 'surv') {
    const c = G.tr.cars[1], side = G.station.side, u = clamp(age, 0, 1);
    o.x = lerp(q.x, c.cx + c.nx * side * 9, u);
    o.y = lerp(q.y, c.cy + c.ny * side * 9, u);
    o.z = 3 * clamp((u - 0.75) / 0.25, 0, 1);
  } else { o.x = q.x; o.y = q.y; }
  o.k = o.y + 1;
  DL.push(o);
}

// ---------- pieces
function zImg(z) {
  const fr = z.S.walk[(z.anim | 0) & 3];
  if (z.flash > 0) return z.left ? fr.wf : fr.w;
  if (thermal) return z.left ? fr.hf : fr.h;
  return z.left ? fr.nf : fr.n;
}
function drawZombie(z) {
  const S = z.S;
  if (z.gold && drawGold(z)) return;
  ctx.drawImage(zImg(z), Math.round(z.x - S.ax), Math.round(z.y - S.ay));
  if (z.big && z.hp < z.max) {
    const w = 14, x = Math.round(z.x - w / 2), y = Math.round(z.y - S.ay - 4);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x - 1, y - 1, w + 2, 4);
    ctx.fillStyle = '#3a1210';
    ctx.fillRect(x, y, w, 2);
    ctx.fillStyle = '#c8432e';
    ctx.fillRect(x, y, Math.max(1, Math.round(w * z.hp / z.max)), 2);
  }
}
// A car of the train, turned to its heading on the rails (red while it takes damage). The
// survivors ride on the flatcar, standing on its deck; with the flatcar gun, it stands at the front
// and two of them stay at the back. While the Turbo Ram runs the engine glows orange.
function drawCar(i) {
  if (i) drawCoupler(i);
  const t = TRAIN[i], c = G.tr.cars[i], a = angIdx(c.ang);
  const img = thermal ? t.h[a] : G.tr.hit[i] > 0 ? carRed(t, a) : t.n[a], x0 = Math.round(c.cx) - img.ox, y0 = Math.round(c.cy) - img.oy;
  blit(img, x0, y0);
  if (i === 0) drawEngineKit(c);
  if (i === 0 && G.ram.on && !thermal) {
    ctx.globalAlpha = ramK() * (0.3 + 0.08 * Math.sin(realT * 18));
    blit(carGlow(t, a), x0, y0);
    ctx.globalAlpha = 1;
  }
  if (i !== 2) return;
  const gun = G.up.gun > 0, R = gun ? RIDERS_GUN : RIDERS;
  if (gun) drawCannon();
  for (let k = 0; k < R.length; k++) {
    const [u, al] = R[k], s = SURV[k], bob = Math.sin(realT * 5 + k * 1.7) > 0.6 ? 1 : 0;
    const x = c.cx + c.dx * al + c.nx * u, y = c.cy + c.dy * al + c.ny * u;
    blit(thermal ? s.h : s.n, Math.round(x) - 2, Math.round(y) - 10 - bob);
  }
}
// The deck's height over the rails (the rail cannon stands on it).
const DECK = 3;
// The train's shadow: each car's footprint, moved away from the sun by its height.
function drawTrainShadow() {
  for (let i = 0; i < CAR.n; i++) {
    const c = G.tr.cars[i];
    blit(TRAIN[i].foot[angIdx(c.ang)], Math.round(c.cx) - 18, Math.round(c.cy) - 18);
  }
}
// A survivor on foot: waiting by the station house, running for the train (a green marker over
// them), or held by the dead (a red marker, and they shake).
function drawPerson(p) {
  const sv = p.sv, run = p.st === 'run', grab = p.st === 'grab';
  const x = Math.round(p.x) + (grab && Math.sin(realT * 40) > 0 ? 1 : 0), y = Math.round(p.y);
  blit(run ? sv.run[(p.anim | 0) & 1][thermal ? 1 : 0] : thermal ? sv.h : sv.n, x - 2, y - 8);
  if (run || grab) {
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x - 2, y - 15, 5, 4);
    ctx.fillStyle = thermal ? '#ffffff' : grab ? (Math.sin(realT * 18) > 0 ? '#ff3a2a' : '#a8241a') : '#8fd18a';
    ctx.fillRect(x - 1, y - 14, 3, 1);
    ctx.fillRect(x, y - 13, 1, 1);
  }
}

// The new passenger walks to the coach; Cornfield Halt presents its locked gold chest.
function drawStationReward(o) {
  const x = Math.round(o.x), y = Math.round(o.y);
  if (o.kind === 'surv') {
    const sv = SURV[4], f = (o.age * 8 | 0) & 1;
    blit(sv.run[f][thermal ? 1 : 0], x - 2, y - 8 - Math.round(o.z));
  } else {
    const d = LART.gold;
    ctx.globalAlpha = Math.min(1, (2 - o.age) / 0.25);
    blit(d.spr, x - d.ax, y - d.ay);
    blit(ICON.lock, x - (ICON.lock.width >> 1), y - 8);
    ctx.globalAlpha = 1;
  }
}
// Bodies in the air: knocked over (fall) or thrown and turning (spin).
function drawBodies() {
  for (const b of G.bodies) {
    const S = b.S;
    if (b.fall) {
      if (b.age < 0.07) blit(S.walk[0].w, Math.round(b.x - S.ax), Math.round(b.y - S.ay - b.z));
      else if (b.age < 0.16 && !thermal) blit(S.tilt, Math.round(b.x - S.tilt.width / 2), Math.round(b.y - S.tilt.height * 0.7 - b.z));
      else blit(thermal ? S.deadH : S.dead, Math.round(b.x - S.dax), Math.round(b.y - S.day - b.z));
    } else {
      const n = S.spin.length, img = (thermal ? S.spinH : S.spin)[mod(Math.round(b.rot / (TAU / n)), n)];
      blit(img, Math.round(b.x - img.width / 2), Math.round(b.y - b.z - 5 - img.height / 2));
    }
  }
}
// Where a 105 shell will land: a blinking ring that closes on the spot (red when it will hit the
// train too).
function drawShellMarks() {
  for (const r of G.rounds) {
    if (r.kind !== 'he' || !r.player) continue;
    const u = r.age / r.T, rr = lerp(CFG.he.kill * 1.5, CFG.he.kill, ease(u));
    const col = thermal ? '#ffffff' : trainDist(r.bx, r.by, G.tr.v * (r.T - r.age)) < CFG.he.close ? '#ff2a1a' : '#ff6a28';
    ctx.globalAlpha = 0.35 + 0.3 * (Math.sin(realT * 22) > 0 ? 1 : 0);
    pell(r.bx, r.by, rr, rr * FORE, col);
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(r.bx) - 1, Math.round(r.by), 3, 1);
    ctx.fillRect(Math.round(r.bx), Math.round(r.by) - 1, 1, 3);
  }
  ctx.globalAlpha = 1;
}
// Rounds in the air. They leave the gunship below the screen and fall into their spot: seen from
// the gun, a round streaks out fast, then shrinks to a point as it drops away (perspective).
const Z0 = 110, ZD = 1250;
const persp = (u) => (1 - u) * Z0 / (Z0 + u * (ZD - Z0));
// the gun's muzzle, below the bottom edge of the screen (25mm right, 105 left), in world px
const muzzleX = (side) => G.camX + W * (side > 0 ? 0.7 : 0.36);
const muzzleY = (side) => G.camY + H + (side > 0 ? 26 : 36);
const TRC = [['#fff1c2', '#ffd27a', '#ff9a3a', '#c9772f'], ['#fff6e0', '#ffd27a', '#ff9a3a', '#e2552f']];
function drawRounds() {
  for (const r of G.rounds) {
    if (r.h) {
      drawHeliRound(r);
      continue;
    }
    const u = r.age / r.T, he = r.kind === 'he';
    const mx = muzzleX(r.side) + r.j * 8, my = muzzleY(r.side);
    const g1 = persp(u), g0 = persp(Math.max(0, u - (he ? 0.07 : 0.06)));
    const hx = r.bx + (mx - r.bx) * g1, hy = r.by + (my - r.by) * g1;
    const dx = (r.bx + (mx - r.bx) * g0) - hx, dy = (r.by + (my - r.by) * g0) - hy;
    const n = Math.min(160, Math.ceil(Math.hypot(dx, dy))), cols = TRC[he ? 1 : 0];
    for (let i = 1; i <= n; i++) {
      const f = i / n, w = he && f < 0.5 ? 2 : 1;
      ctx.globalAlpha = 1 - f * 0.75;
      ctx.fillStyle = cols[Math.min(3, (f * 4) | 0)];
      // near the camera the streak is wider
      const s = g1 + (g0 - g1) * f > 0.22 ? w + 1 : w;
      ctx.fillRect(Math.round(hx + dx * f), Math.round(hy + dy * f), s, s);
    }
    ctx.globalAlpha = 1;
    const s = he ? (g1 > 0.12 ? 3 : 2) : (g1 > 0.25 ? 2 : 1);
    ctx.fillStyle = '#fff6e0';
    ctx.fillRect(Math.round(hx - (s >> 1)), Math.round(hy - (s >> 1)), s, s);
    light(hx, hy, he ? 10 : 5, he ? '#ffd27a' : '#ffb347', he ? 0.7 : 0.45);
  }
  // the gun flashes below the screen edge
  if (G.muzzle[0] > 0) light(muzzleX(1), muzzleY(1) - 10, 46, '#ffc27a', G.muzzle[0] / 0.05 * 0.5);
  if (G.muzzle[1] > 0) light(muzzleX(-1), muzzleY(-1) - 14, 80, '#ffb060', G.muzzle[1] / 0.12 * 0.8);
  ctx.globalAlpha = 1;
}
// While the Turbo Ram runs: its kills so far beside the engine's nose (white for a moment at each one;
// amber from 15, red from 30, the counts of its ranks).
function drawRamCount() {
  const r = G.ram;
  if (!r.on || !r.kills || G.demo) return;
  const c = G.tr.cars[0], n = r.kills, col = realT - r.killT < 0.07 ? '#ffffff' : n >= 30 ? '#ff7a4a' : n >= 15 ? U.amber : U.gold;
  text('×' + n, c.x0 + 13, c.y0 - 10, col, { scale: 2, drop: true });
}
// The vignette: only the bands along the edges where it is not clear (the middle is skipped).
function drawVignette() {
  const bx = Math.round(W * 0.14), by = Math.round(H * 0.16);
  ctx.drawImage(VIG, 0, 0, W, by, 0, 0, W, by);
  ctx.drawImage(VIG, 0, H - by, W, by, 0, H - by, W, by);
  ctx.drawImage(VIG, 0, by, bx, H - 2 * by, 0, by, bx, H - 2 * by);
  ctx.drawImage(VIG, W - bx, by, bx, H - 2 * by, W - bx, by, bx, H - 2 * by);
}

// ---------- the frame (world layer)
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#060708';
  ctx.fillRect(0, 0, W, H);
  // (the skill tree covers the whole world: nothing to draw under it)
  if (treeCovers()) return;
  const [sx, sy] = shakeOff();
  const ci0 = Math.floor((G.camX - 8) / CH), ci1 = Math.floor((G.camX + W + 8) / CH);
  const cj0 = Math.floor((G.camY - 8) / CH), cj1 = Math.floor((G.camY + H + 8) / CH);
  // the ground in view is baked now; one more chunk round it per frame, before it is needed

  bakeSome(ci0, cj0, ci1, cj1, 1);
  gather(ci0, cj0, ci1, cj1);
  ctx.save();
  ctx.translate(sx - G.camX, sy - G.camY);
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) {
    ctx.drawImage(GROUND.get(ckey(i, j)), i * CH, j * CH);
    const d = DECALS.get(ckey(i, j));
    if (d) ctx.drawImage(d.c, i * CH, j * CH);
  }
  // the thermal camera sees the ground cooler than anything alive
  if (thermal) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(G.camX - 8, G.camY - 8, W + 16, H + 16);
  }
  drawGroundLife();
  drawShellMarks();
  drawHorde(sx, sy);
  // shadows of the dead, and of bodies in the air
  ctx.globalAlpha = thermal ? 0.2 : 0.32;
  for (const z of VZ) {
    const S = z.S, fr = S.walk[(z.anim | 0) & 3];
    ctx.drawImage(fr.s, Math.round(z.x - S.ax), Math.round(z.y - 1 - S.shp));
  }
  drawTrainShadow();
  if (DL.includes(STATION_REWARD_DRAW)) {

    blit(d.sh, Math.round(o.x) - d.ax, Math.round(o.y) - 1);
  }
  ctx.globalAlpha = 0.25;
  for (const b of G.bodies) blit(BODYSH, Math.round(b.x - 4), Math.round(b.y - 2));
  ctx.globalAlpha = 1;
  drawHeliGround();
  drawPlaneShadows();
  // trees, props, the train and the dead, back to front. A tree under the sight fades so you can
  // see past it.
  const ax = G.camX + G.aimSX, ay = G.camY + G.aimSY, aiming = mode === 'play';
  for (const o of DL) {
    if (o.stationReward) {
      drawStationReward(o);
      continue;
    }
    if (o.isCar) {
      drawCar(o.i);
      continue;
    }
    if (o.person) {
      drawPerson(o);
      continue;
    }
    if (o.S) {
      drawZombie(o);
      continue;
    }
    const d = o.campWave != null ? SCN.campPeople[o.campWave][(G.t * 2 + o.campWave * 0.7 | 0) & 1]
      : o.campFire != null ? SCN.campFire[(G.t * 6 + o.campFire | 0) & 1] : o.d;
    if (thermal && d.h) {

      continue;
    }
    if (aiming && d.tree && Math.abs(o.x - ax) < d.spr.width / 2 + 10 && ay > o.y - d.spr.height - 10 && ay < o.y + 6) {

      blit(d.spr, o.x - d.ax, o.y - d.ay);

  }

  drawHordeTop(sx, sy);

    for (const z of VZ) {
      const S = z.S, zl = z.x - S.ax, zt = z.y - S.ay, zw = S.walk[0].n.width;
      for (const t of TREES) {
        if (t.y <= z.y) continue;
        const d = t.d, tl = t.x - d.ax;
        if (zl + zw <= tl || zl >= tl + d.spr.width || zt >= t.y || z.y < t.y - d.ay) continue;
        blit(zImg(z), Math.round(zl), Math.round(zt));
        break;
      }
    }
    ctx.globalAlpha = 1;
  }
  // fires, smoke and dirt, explosions, flying bodies
  for (const f of FIRES) drawFlame(f.x, f.y, f.big, f.seed);
  for (const f of flames) drawFlame(f.x, f.y, false, f.seed);
  drawBurn();
  drawParts(false);
  drawBooms();
  drawBodies();
  drawJuice();
  drawHelis();
  // glows (added light)
  ctx.globalCompositeOperation = 'lighter';
  drawLights();
  drawBurnFx();
  for (const f of FIRES) light(f.x, f.y - (f.big ? 6 : 3), f.big ? 22 : 14, '#ff9a4a', 0.45 + Math.sin(realT * 13 + f.seed) * 0.08);
  for (const o of DL) if (o.campFire != null) light(o.x, o.y - 7, 12, '#ff9a4a', 0.25 + Math.sin(G.t * 13) * 0.04);
  // the train's headlights (in daylight their beam on the rails ahead only shows while the Turbo
  // Ram runs: bigger lights, beams that follow the bends, and the engine glows orange)
  if (G.result !== 'lost') {
    const tr = G.tr, c = tr.cars[0], k = ramK(), hr = 6 + 4 * k;
    light(c.x0 - c.nx * 4, c.y0 - c.ny * 4 - 7, hr, '#fff1c2', 0.8);
    light(c.x0 + c.nx * 3, c.y0 + c.ny * 3 - 7, hr, '#fff1c2', 0.8);
    if (k > 0) for (const [ds, r, a] of [[24, 22, 0.3 * k], [56, 30, 0.18 * k], [90, 34, 0.16 * k]]) {
      const y = yAtS(tr.s - ds, tr.fy - ds);
      light(trackX(y), y, r, '#ffe2a0', a);
    }
    if (k > 0 && !thermal) light(c.cx, c.cy - 6, 24, '#ff8a3a', 0.2 * k + 0.05 * Math.sin(realT * 18));
  }
  // station lamps (lit by day, just a glint)
  for (const p of G.statics) if (p.lamp && Math.abs(p.y - G.camY - H / 2) < H) light(p.x, p.y - 17, 5, '#ffe2a0', 0.6);
  // the searchlights of the safe zone sweep the ground in front of the wall
  for (const p of G.statics) if (p.tower && Math.abs(p.y - (G.camY + H / 2)) < H) {
    light(p.x + 5, p.y - 26, 5, '#fff1c2', 0.9);
    light(p.x + Math.sin(realT * 0.7 + p.tower) * 70, p.y + 46 + Math.cos(realT * 0.9 + p.tower * 2) * 18, 28, '#fff1c2', 0.22);
  }
  ctx.globalAlpha = 1;
  drawRings();
  drawParts(true);
  drawRounds();
  drawHeliFx();
  drawCannonFx();
  // Draw the steel plow over the headlights with solid colours.
  ctx.globalCompositeOperation = 'source-over';
  drawPlow();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  drawJuiceTop();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  drawSky();
  // the names of the safe zone (past the gate), the Depot and the stations, over everything on the ground
  if (G.safeZone && G.goalY > G.camY - 80 && G.goalY < G.camY + H + 80) text('SAFE ZONE', trackX(G.goalY) + 96, G.goalY - 30, '#8fd18a', { align: 'center', scale: 2 });
  for (const st of G.stops) {
    const hs = st.house;
    if (Math.abs(hs.y - G.camY - H / 2) < H) text(st.name, hs.x, hs.y - 36, st.id === 'depot' ? U.gold : U.blue, { align: 'center' });
  }
  drawLoot();
  drawHeliTop();
  drawPlanes();
  drawTexts();
  drawRamCount();
  ctx.restore();
  // the camera's look over everything
  if (!thermal) drawVignette();
  else {
    // grey (the color's saturation taken out), turned over for black hot, then grain and lines
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, W, H);
    if (thermal === 2) {
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.06;
    ctx.drawImage(GRAIN, -((Math.random() * 64) | 0), -((Math.random() * 64) | 0));
    ctx.globalAlpha = 1;
    ctx.drawImage(SCAN, 0, 0);
    ctx.drawImage(VIG, 0, 0);
  }
}

// ui.js - everything drawn over the world, in screen pixels: the top bar (three currencies, kills, the train's health, the route up the line), warnings, arrows on
// the screen edge to the train and to trouble out of view, the radar, the weapon cards, coins,
// banners, hints, the red edge when the train is nearly lost, and the screens (title, pause,
// summary; the Depot is in depot.js). Buttons are drawn in the canvas too (from Ball x Archers).

// M = the mouse in game pixels. pressed / released are true for one frame; px, py = where the
// press started; right = the right button is held; used = this click was already handled;
// inside = the mouse is over the game.
const M = { x: -99, y: -99, down: false, right: false, pressed: false, released: false, px: 0, py: 0, used: false, inside: false };
let cursor = 'default';

// True when a button at (x, y, w, h) was clicked this frame.
function clicked(x, y, w, h) {
  if (M.released && !M.used && inR(M.px, M.py, x, y, w, h) && inR(M.x, M.y, x, y, w, h)) {
    M.used = true;
    SFX.ui();
    return true;
  }
  return false;
}
// Draw a button (o.primary = gold, o.danger = red, o.off = greyed out, never clicked). Returns true
// when it is clicked.
function button(x, y, w, h, label, o) {
  o = o || {};
  const hov = !o.off && inR(M.x, M.y, x, y, w, h), pr = hov && M.down;
  ctx.fillStyle = pr ? '#0b0c0f' : hov ? '#1d1f25' : '#131419';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, o.off ? '#24272e' : o.primary ? (hov ? '#f0c264' : '#b8862f') : o.danger ? (hov ? '#e0705a' : '#8a3a2c') : (hov ? '#6a6f7b' : '#3a3e48'));
  ctx.fillStyle = o.primary ? 'rgba(227,176,75,0.12)' : '#22252c';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  const col = o.off ? U.faint : o.primary ? U.gold : o.danger ? U.red : U.ink;
  text(label, x + w / 2, y + Math.round(h / 2) - 3 + (pr ? 1 : 0), col, { align: 'center' });
  if (o.off) return false;
  if (hov) cursor = 'pointer';
  return clicked(x, y, w, h);
}

// ---------- corners (the skill tree, a helis' attack mark)
// L-shaped corners round a box, with dark edges.
function corners(x, y, w, h, col) {
  const L = 3;
  ctx.fillStyle = '#07080a';
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w - 1, y, -1, 1], [x, y + h - 1, 1, -1], [x + w - 1, y + h - 1, -1, -1]]) {
    ctx.fillRect(Math.min(cx, cx + sx * (L - 1)) - 1, cy - 1, L + 2, 3);
    ctx.fillRect(cx - 1, Math.min(cy, cy + sy * (L - 1)) - 1, 3, L + 2);
  }
  ctx.fillStyle = col;
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w - 1, y, -1, 1], [x, y + h - 1, 1, -1], [x + w - 1, y + h - 1, -1, -1]]) {
    ctx.fillRect(Math.min(cx, cx + sx * (L - 1)), cy, L, 1);
    ctx.fillRect(cx, Math.min(cy, cy + sy * (L - 1)), 1, L);
  }
}
// ---------- in play
// A weapon card: icon, name (nc = its colour), a tag on the right (the key, READY, a %...) and a bar.
function card(x, y, w, h, icon, name, tag, tagc, f, fc, nc) {
  ctx.fillStyle = 'rgba(12,13,17,0.86)';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, '#2e3139');
  ctx.fillStyle = '#1c1e24';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  ctx.drawImage(icon, x + 5, y + Math.round((h - icon.height) / 2));
  text(name, x + 17, y + 5, nc || U.ink);
  text(tag, x + w - 5, y + 5, tagc, { align: 'right', outline: false });
  if (f != null) bar(x + 17, y + 16, w - 23, 4, f, '#1a1716', fc);
}
// Counters share their spacing with flying rewards. Hidden currencies have no target yet.
function currencyIcon(key) {
  return key === 'scrap' ? ICON.scrap : key === 'surv' ? ICON.surv : ICON.goldS;
}
function currencyLayout(values, left = 4) {
  if (!values) {
    if (mode === 'depot') values = Object.fromEntries(['scrap', 'surv', 'gold'].map((key) => [key, SHOWN[key] < 0 ? SAVE[key] : SHOWN[key]]));
    else if (mode === 'title') values = SAVE;
    else values = { scrap: G.shownCash, surv: G.surv, gold: G.gold || 0 };
  }
  const layout = { scrap: null, surv: null, gold: null, end: left, items: [] };
  for (const key of ['scrap', 'surv', 'gold']) {
    if (key === 'surv' && !SAVE.flags.survShown || key === 'gold' && !SAVE.flags.goldShown) continue;
    const icon = currencyIcon(key), label = fmt(Math.round(values[key] || 0));
    const x = layout.end, textX = x + icon.width + 3;
    layout[key] = x + Math.floor(icon.width / 2);
    layout.items.push({ key, left: x, textX, label, color: key === 'scrap' ? U.blue : key === 'surv' ? U.amber : U.gold });
    layout.end = textX + Math.max(key === 'scrap' ? 18 : 6, tw(label)) + 8;
  }
  return layout;
}
function currencyX(key) {
  return currencyLayout()[key] ?? null;
}
function drawCurrencyCounters(layout, y = 0, pulses = {}, outline = true) {
  for (const item of layout.items) {
    const icon = currencyIcon(item.key), pulse = !!pulses[item.key];
    blit(icon, item.left, y + Math.round(8 - icon.height / 2) - (pulse ? 1 : 0));
    const bright = item.key === 'scrap' ? '#d5efff' : item.key === 'surv' ? '#ffd2a1' : '#ffe39a';
    text(item.label, item.textX, y + 6, pulse ? bright : item.color, { outline });
  }
}
function drawHUD() {
  ctx.fillStyle = 'rgba(6,7,9,0.88)';
  ctx.fillRect(0, 0, W, 18);
  ctx.fillStyle = '#24272e';
  ctx.fillRect(0, 18, W, 1);
  // This run's money; survivors and gold appear only after their teaching moment.
  const counters = currencyLayout();

  const kills = fmt(G.kills), kx = counters.end;

  // the train's health: green, then amber, then red; the part just lost shows pale for a moment
  const tr = G.tr, f = tr.hp / tr.max, hx = kx + 10 + tw(kills) + 24, hw = clamp(Math.round(W * 0.16), 44, 100);
  blit(ICON.train, hx - 12, 5);

  ctx.fillStyle = f < 0.35 ? '#b8402e' : f < 0.65 ? '#c9862f' : '#6f9a4f';
  ctx.fillRect(hx, 6, Math.round(hw * clamp(f, 0, 1)), 6);
  ctx.fillStyle = f < 0.35 ? '#e06a4f' : f < 0.65 ? '#e8b05a' : '#9cc777';
  ctx.fillRect(hx, 6, Math.round(hw * clamp(f, 0, 1)), 1);
  // and as a number
  text(Math.ceil(tr.hp), hx + hw + 4, 6, f < 0.35 ? U.red : f < 0.65 ? U.amber : U.dim);
  if (!G.demo) drawRoute(hx + hw + 10 + tw(String(Math.ceil(tr.hp))), W - 28);
  if (mode === 'play' && button(W - 23, 1, 21, 16, paused ? '>' : 'II')) setPaused(!paused);
  if (Au.muted) text('MUTE', W - 4, 22, U.faint, { align: 'right' });

// The destination for this leg, with metres left to the train's actual stopping point.
function nextLabel() {
  const st = G.station, to = legDef(G.leg).to;
  if (G.result === 'won') return ['ARRIVED: ' + to.name, U.green];
  const distance = Math.max(0, G.tr.s - (st ? st.stopS : G.goalS));
  return ['NEXT: ' + to.name + ' ' + Math.round(distance / 2 / 10) * 10 + ' M', U.blue];
}
// This leg alone, between x0 and x1: start, destination, any Dead Walls, and the train's progress.
function drawRoute(x0, x1) {
  let [lab, lc] = nextLabel();
  let lw = tw(lab), w = x1 - x0 - lw - 20;
  if (w < 60 && lab.startsWith('NEXT: ')) {
    lab = lab.slice(6);
    lw = tw(lab);
    w = x1 - x0 - lw - 20;
  }
  text(lab, x1, 6, lc, { align: 'right' });
  if (w < 40) return;
  const start = G.tr.startS, end = G.goalS, len = Math.max(1, start - end);
  const X = (s) => x0 + Math.round(w * clamp((start - s) / len, 0, 1)), y = 9;
  ctx.fillStyle = '#3a3e48';
  ctx.fillRect(x0, y, w, 1);
  for (let i = 1; i < 4; i++) ctx.fillRect(x0 + Math.round(w * i / 4), y - 1, 1, 3);
  // this run's ride
  ctx.fillStyle = '#b8862f';
  ctx.fillRect(x0, y, Math.max(0, X(G.tr.s) - x0), 1);
  // Only walls inside this leg belong on its route.
  for (const wl of G.walls) {
    if (wl.s >= start || wl.s <= end) continue;
    ctx.fillStyle = '#07080a';
    ctx.fillRect(X(wl.s) - 2, y - 3, 5, 7);
    ctx.fillStyle = U.red;
    ctx.fillRect(X(wl.s) - 1, y - 2, 3, 5);
  }
  for (const [s, got] of [[start, true], [end, G.result === 'won']]) {
    const sx = X(s);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(sx - 2, y - 4, 5, 9);
    ctx.fillStyle = got ? U.green : U.blue;
    ctx.fillRect(sx - 1, y - 3, 3, 7);
  }
  blit(ICON.flag, X(end) + 3, 3);
  // The train is a pale block on the route.
  const tx = X(G.tr.s);
  ctx.fillStyle = '#07080a';
  ctx.fillRect(tx - 2, y - 3, 5, 7);
  ctx.fillStyle = '#e8dfc8';
  ctx.fillRect(tx - 1, y - 2, 3, 5);
}
// Warnings under the top bar: the dead on the track or on the train.
function drawWarnings() {
  if (G.result) return;
  const red = Math.floor(realT * 3) % 2 === 0 ? U.red : '#a8241a', L = [];
  if (G.blocked) L.push(['THE DEAD ARE ON THE TRACK AHEAD' + (G.railAhead >= 4 && ramState() === 'ready' ? '  (E: RAM)' : ''), red]);
  if (G.onTrain > 0) L.push([G.onTrain + (G.onTrain > 1 ? ' ZOMBIES' : ' ZOMBIE') + ' ON THE TRAIN', red]);
  // Place the lines beside the task box, or under it when they would touch (tut.js).
  const [wx, wy] = warnAt(L);
  L.forEach(([t, c], i) => text(t, wx, wy + i * 10, c, { align: 'center' }));
}
// An arrow on the edge of the screen pointing at (wx, wy) in the world when that is out of view,
// with a label just inside it.
function edgeArrow(wx, wy, col, label) {
  const sx = wx - G.camX, sy = wy - G.camY;
  if (sx > 8 && sx < W - 8 && sy > 26 && sy < H - 8) return false;
  // the arrows keep inside a frame below the warnings: x 12..W-12, y 62..H-12
  const cx = W / 2, cy = (62 + H - 12) / 2, hw = W / 2 - 12, hh = (H - 74) / 2;
  const dx = sx - cx, dy = sy - cy, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const t = Math.min(hw / Math.max(1e-6, Math.abs(dx)), hh / Math.max(1e-6, Math.abs(dy)));
  const ax = Math.round(cx + dx * t), ay = Math.round(cy + dy * t);
  // a small triangle, tip toward the target, with a dark edge
  for (const [c, g] of [['#07080a', 1], [col, 0]]) {
    ctx.fillStyle = c;
    for (let py = -6; py <= 6; py++) for (let px = -6; px <= 6; px++) {
      const a = px * ux + py * uy, b = -px * uy + py * ux;
      if (a <= 4 + g && a >= -3 - g && Math.abs(b) <= (4 - a) * 0.62 + g * 0.9) ctx.fillRect(ax + px, ay + py, 1, 1);
    }
  }
  // the label just inside the arrow: beside it on the left and right edges, under or over it on
  // the top and bottom
  if (label) {
    const w = tw(label), side = Math.abs(dx) * hh > Math.abs(dy) * hw;
    const lx = side ? ax - Math.sign(ux) * (9 + w / 2) : ax, ly = side ? ay - 3 : ay - Math.sign(uy) * 11 - 3;
    text(label, clamp(lx, w / 2 + 4, W - w / 2 - 4), clamp(ly, 22, H - 10), col, { align: 'center' });
  }
  return true;
}
// Arrows to the train, and to trouble out of view: the dead on a car, on the track ahead, after a
// survivor.
const ON_CAR = [0, 0, 0, 0, 0];
function drawArrows() {
  drawLootUI();
  // (at PRESS E! the view shows the engine's nose and the wall ahead: that is enough of the train)
  const tr = G.tr, c = tr.cars[2];
  ON_CAR.fill(0);
  let rail = null, rd = 1e9;
  for (const z of G.zombies) {
    if (z.dead) continue;
    if (z.st === 2) ON_CAR[z.car]++;
    else if (z.st === 1) {
      const ds = tr.s - trackLocal(z.x, z.y, TL).a;
      if (ds > 0 && ds < 300 && ds < rd) { rd = ds; rail = z; }
    }
  }
  // the train (its middle): gold, red with a count when the dead are on it; or, when the train is
  // in view, an arrow to any car under attack that is not
  const n = G.result ? 0 : G.onTrain;
  if (!edgeArrow(c.cx, c.cy, n ? U.red : U.gold, 'TRAIN ' + Math.round(Math.hypot(c.cx - G.camX - W / 2, c.cy - G.camY - H / 2) / 2) + 'M' + (n ? '  ' + n + '!' : ''))) {
    if (!G.result) ON_CAR.forEach((m, k) => { if (m) edgeArrow(tr.cars[k].cx, tr.cars[k].cy, U.red, m + '!'); });
  }
  if (G.result) return;
  if (rail) edgeArrow(rail.x, rail.y, U.red, 'TRACK');
  const held = G.people.find((p) => p.st === 'grab'), out = G.people.find((p) => p.st === 'run');
  if (held) edgeArrow(held.x, held.y, U.red, 'HELP');
  else if (out) edgeArrow(out.x, out.y, '#8fd18a', 'SURVIVOR');

// The radar: the land round the helicopter, 1280 px across, north up. The railway, the train,
// the dead (bright red: on the track or the train), survivors, the station, the safe zone wall,
// and the view.
function drawRadar() {
  const R = 36, x0 = W - R * 2 - 6, y0 = H - R * 2 - 6, cx = x0 + R, cy = y0 + R, k = R / 640;
  const hx = G.camX + W / 2, hy = G.camY + H / 2;
  ctx.fillStyle = 'rgba(6,10,8,0.84)';
  ctx.fillRect(x0, y0, R * 2, R * 2);
  frame(x0 - 1, y0 - 1, R * 2 + 2, R * 2 + 2, '#2e3139');
  ctx.fillStyle = 'rgba(86,194,168,0.12)';
  ctx.fillRect(cx, y0, 1, R * 2);
  ctx.fillRect(x0, cy, R * 2, 1);
  const dot = (wx, wy, c, s) => {
    const px = Math.round(cx + (wx - hx) * k), py = Math.round(cy + (wy - hy) * k);
    if (px < x0 || py < y0 || px > x0 + R * 2 - s || py > y0 + R * 2 - s) return;
    ctx.fillStyle = c;
    ctx.fillRect(px, py, s, s);
  };
  for (let wy = hy - 640; wy <= hy + 640; wy += 14) dot(trackX(wy), wy, '#3e434c', 1);
  if (G.safeZone && G.goalY > hy - 640 && G.goalY < hy + 640) for (let dx = -560; dx <= 560; dx += 18) dot(trackX(G.goalY) + dx, G.goalY, '#8fd18a', 1);
  for (const st of G.stops) dot(st.house.x - 1, st.house.y - 1, st.id === 'depot' ? U.gold : '#9fd3f2', 2);
  for (const z of G.zombies) if (!z.dead) dot(z.x, z.y, z.st ? '#ff4a32' : '#7a2a22', 1);
  // golden zombies: a blinking gold dot
  if (realT % 0.5 < 0.32) for (const z of G.zombies) if (z.gold && !z.dead) dot(z.x - 1, z.y - 1, '#ffd24a', 2);
  for (const p of G.people) if (p.st === 'run' || p.st === 'wait' || p.st === 'grab') dot(p.x, p.y, '#8fd18a', 1);
  lootRadar(dot);
  for (const c of G.tr.cars) dot(c.cx - 1, c.cy - 1, '#e8dfc8', 2);
  for (const h of G.helis) dot(h.x - 1, h.y - 1, h.sel ? U.green : '#9fd3f2', 2);
  // the view
  const vx = Math.round(cx - W / 2 * k), vy = Math.round(cy - H / 2 * k);
  ctx.globalAlpha = 0.55;
  frame(vx, vy, Math.round(W * k) + 1, Math.round(H * k) + 1, '#9fd3f2');
  ctx.globalAlpha = 1;
  text('N', cx, y0 + 2, U.faint, { align: 'center', outline: false });
}

// The Turbo Ram's card: E in gold when it is full, the % while it fills (the bar is the charge),
// GO! while it runs (the bar is the time left), and STOP near a station (grey). A click on it rams.
// Over it, for a moment, why it can't ram now.
const RAMCARD = { x: 0, y: 0, w: 106, h: 26, on: false };
function drawRamCard(x, y) {
  const r = G.ram, C = RAMCARD, R = CFG.ram;
  const s = ramState();
  C.on = s !== 'none';
  if (!C.on) return;
  C.x = x;
  C.y = y;
  const w = C.w, h = C.h, fl = realT - r.flash;
  // it hops when it gets full
  if (fl < 0.2) y--;
  let tag, tagc, f, fc, nc = U.ink, icon = ICON.ram;
  if (s === 'on') [tag, tagc, f, fc] = ['GO!', Math.floor(realT * 8) % 2 ? '#ffe39a' : U.amber, 1 - r.t / (r.dur + R.ease), '#ff8a3a'];
  else if (s === 'ready') [tag, tagc, f, fc] = ['E', U.gold, 1, '#e3b04b'];
  else if (s === 'charge') [tag, tagc, f, fc] = [Math.floor(ramCharge() * 100) + '%', U.dim, ramCharge(), '#8a6a3a'];
  else if (s === 'stop') [tag, tagc, f, fc, nc, icon] = ['STOP', U.faint, ramCharge(), '#3a3e48', U.faint, ICON.ramOff];
  else [tag, tagc, f, fc, nc, icon] = ['TREE', U.dim, 0, '#3a3e48', U.faint, ICON.lock];
  card(x, y, w, h, icon, 'TURBO RAM', tag, tagc, f, fc, nc);

  if (s === 'ready' || s === 'on') frame(x, y, w, h, s === 'on' ? '#c96a2a' : '#b8862f');
  if (fl < 0.5) {
    ctx.globalAlpha = 1 - fl / 0.5;

}
// White speed lines streaming down the outer 30% of the screen while the Ram runs (in game time:
// they stand still on pause and slow down with the game).
function drawSpeedLines() {
  const k = ramK() * clamp(G.ram.t / 0.25, 0, 1);

  const n = REDUCED ? 7 : 14, band = W * 0.3, span = H + 40;

// red screen edge while the train is nearly lost
function drawTension() {
  const f = G.tr.hp / G.tr.max;
  if (mode !== 'play' || G.result || f >= 0.35) return;
  let a = 0.3 + 0.5 * (1 - f / 0.35);

  }

// A short leg summary: sources, the money kept, saved stars, and the way back to the Depot.
// Times are seconds after it opens; each source counts up with a tick.
function sumPlan(s) {
  const p = s.pay, rows = [['KILLS ' + fmt(s.kills), p.kills || 0]];
  for (const [label, value] of [['LOOT', p.loot], ['WALLS', p.wall ?? p.walls], ['SILVER', p.silver], ['BONUS', p.bonus]]) {
    if (value > 0) rows.push([label, value]);
  }
  const t = rows.map((r, i) => 0.3 + i * 0.18), total = t[t.length - 1] + 0.25;
  const money = [{ key: 'scrap', label: 'TOTAL SCRAP', amount: s.scrap, color: U.blue, at: total }];
  if (s.surv > 0 || SAVE.flags.survShown) money.push({ key: 'surv', label: 'SURVIVORS', amount: s.surv, color: U.amber, at: total + money.length * 0.14 });
  if (s.gold > 0 || SAVE.flags.goldShown) money.push({ key: 'gold', label: 'GOLD', amount: s.gold, color: U.gold, at: total + money.length * 0.14 });
  const stars = money[money.length - 1].at + 0.18, lines = stars + (s.hasStars ? 0.15 : 0);
  const ev = t.map((x) => [x, 'tick']).concat([[total, 'total']]);
  for (const row of money) if (row.key !== 'scrap' && row.amount > 0) ev.push([row.at, row.key === 'surv' ? 'saved' : 'gold']);
  if (s.hasStars && s.stars.some(Boolean)) ev.push([stars, 'tick']);
  return { rows, t, money, total, stars, lines, end: lines + 0.35, ev };
}
// Geometry is shared with click tests. On short screens the row spacing tightens before notes
// are bounded, so the money, stars and button always fit. Notes wrap at the panel's inner width.
function summaryLayout(s, pl) {
  const compact = H < 300, w = Math.min(W - 24, compact ? 288 : 264), inner = w - 32;
  const heading = wrap('LEG ' + s.leg + ': ' + s.destination, inner);
  const messages = [];
  if (s.near) messages.push([s.near, U.amber]);
  if (s.replay) messages.push(['REPLAY: SCRAP ONLY. NO NEW STARS.', U.blue]);
  messages.push(['YOU KEEP EVERYTHING YOU EARNED.', U.dim]);
  for (const line of s.wall || []) messages.push(line);
  messages.push(...summaryGoal());
  let notes = messages.flatMap(([message, color]) => wrap(message, inner).map((line) => [line, color]));
  const rowStep = compact ? 10 : 12, moneyStep = compact ? 12 : 15, noteStep = compact ? 9 : 11;
  const sources = 32 + heading.length * 10, money = sources + pl.rows.length * rowStep + 7;
  const stars = money + pl.money.length * moneyStep, noteTop = stars + (s.hasStars ? 15 : 0) + 6;
  const maxNotes = Math.max(1, Math.floor((H - 26 - noteTop - 28) / noteStep));
  if (notes.length > maxNotes) {
    notes = notes.slice(0, maxNotes);
    let line = notes[notes.length - 1][0];
    while (tw(line + '...') > inner) line = line.slice(0, -1);
    notes[notes.length - 1][0] = line + '...';
  }
  const h = noteTop + notes.length * noteStep + 28;
  const x = Math.round((W - w) / 2), y = Math.max(20, Math.round((H - h) / 2));
  return { x, y, w, h, heading, notes, rowStep, moneyStep, noteStep,
    sourcesY: y + sources, moneyY: y + money, starsY: y + stars, notesY: y + noteTop,
    button: { x: Math.round(x + w / 2 - 70), y: y + h - 25, w: 140, h: 20 } };
}
// Enter or a click before the count is done shows it all at once.
function sumSkip() {
  const s = G.sum, pl = s.plan || (s.plan = sumPlan(s));
  if (realT - sumStart >= pl.end) return false;
  sumStart = realT - pl.end;

}
function drawSummary() {
  ctx.fillStyle = 'rgba(5,6,8,0.66)';

  });

  pl.money.forEach((row, i) => {
    if (t < row.at) return;
    const ry = layout.moneyY + i * layout.moneyStep, icon = currencyIcon(row.key), u = ease(clamp((t - row.at) / 0.3, 0, 1));
    blit(icon, x + 16, ry + Math.round((layout.moneyStep - icon.height) / 2));

  });

  layout.notes.forEach(([line, color], i) => text(line, cx, layout.notesY + i * layout.noteStep, color, { align: 'center' }));
  ctx.globalAlpha = 1;
  const b = layout.button;

}

// depot.js - the save, and the Depot: the screen between runs. SAVE is everything kept from run to
// run, one object in this browser's storage. The Depot shows revealed money, the station line,
// the skill tree, and a button to ride the next leg or replay an old one for scrap.

// ---------- the save
const SAVE_KEY = 'sky-reaper-save-1', SAVE_V = 2;
// v = version. scrap, surv, gold = money. leg = next ride (13 means the demo is complete).
// legs keeps wins, three stars and paid gold item ids by leg. rescues are lifted survivors;
// rescueDue are missed survivors waiting to wave again. chest = none/locked/opened (0/1/2).
// hangar holds the two plane slot ids, or null for an empty slot. nodes = skill tree levels by id.
// runs = rides started. seen = tutorial prompts already shown. flags = one-off things done.
function freshSave() {
  return {
    v: SAVE_V, scrap: 0, surv: 0, gold: 0, leg: 1, legs: {}, rescues: [], rescueDue: [], chest: 0,
    hangar: [null, null], nodes: { root: 1 }, runs: 0, seen: {}, flags: {}
  };
}
let SAVE = freshSave();
// Read the save. A missing, broken or older one starts fresh. True when a save was found.
function loadSave() {
  SAVE = freshSave();
  let o = null;
  try {
    o = JSON.parse(localStorage.getItem(SAVE_KEY));
  } catch (e) {
    o = null;
  }
  if (!o || typeof o !== 'object' || Array.isArray(o) || o.v !== SAVE_V) return false;
  const obj = (m) => (m && typeof m === 'object' && !Array.isArray(m) ? m : {});
  const integer = (v, min, max, fallback) => typeof v === 'number' && isFinite(v) ? clamp(Math.floor(v), min, max) : fallback;
  const money = (v) => integer(v, 0, Number.MAX_SAFE_INTEGER, 0);
  // Null-prototype maps safely keep arbitrary stable ids, including keys such as __proto__.
  const boolMap = (value, trueOnly = false) => {
    const map = Object.create(null);
    for (const [id, flag] of Object.entries(obj(value))) {
      if (id && typeof flag === 'boolean' && (!trueOnly || flag)) map[id] = flag;
    }
    return map;
  };
  const rescueIds = (a) => Array.isArray(a) ? [...new Set(a.filter((id) => typeof id === 'string' && id.length > 0))] : [];
  SAVE.scrap = money(o.scrap);
  SAVE.surv = money(o.surv);
  SAVE.gold = money(o.gold);
  SAVE.leg = integer(o.leg, 1, 13, 1);
  for (const [id, value] of Object.entries(obj(o.legs))) {
    if (!/^(?:[1-9]|1[0-2])$/.test(id) || !value || typeof value !== 'object' || Array.isArray(value)) continue;
    SAVE.legs[id] = {
      won: value.won === true,
      stars: [0, 1, 2].map((i) => Array.isArray(value.stars) && value.stars[i] === true),
      paid: boolMap(value.paid, true)
    };
  }
  SAVE.rescues = rescueIds(o.rescues);
  SAVE.rescueDue = rescueIds(o.rescueDue).filter((id) => !SAVE.rescues.includes(id));
  SAVE.chest = integer(o.chest, 0, 2, 0);
  const planes = Array.isArray(o.hangar) ? o.hangar : [];
  for (let i = 0; i < SAVE.hangar.length; i++) {
    const id = planes[i];
    if (['a10', 'f4', 'b52'].includes(id) && !SAVE.hangar.includes(id)) SAVE.hangar[i] = id;
  }
  SAVE.runs = money(o.runs);
  // skill tree levels: known nodes only, never above their top level
  for (const [k, v] of Object.entries(obj(o.nodes))) {

function nodeState(n) {

  if (n.id === 'silverHunt' && !flags.silverSeen || n.id === 'boomHunt' && !flags.boomSeen ||

// ---------- into a run
// The active Viper upgrades are folded into the current gun. Weapons added in phases 3-5 use
// the new UP values above; their old runtime fields stay neutral until then.
function treeUp(L, up) {
  const hd = UP.hdmg(L('hdmg')), hr = UP.hrate(L('hrate'));
  up.dmg *= hd;
  up.rate *= hr;
  up.heat /= hr;
  return Object.assign(up, {
    heliDmg: hd, heliRate: hr, heliRange: UP.hrange(L('hrange')), rocketChance: UP.rockets(L('rockets')),
    pods: L('rocketPods') > 0, podDamage: UP.podDamage(L('podDamage')),
    podReload: UP.podReload(L('podReload')), podSalvo: UP.podSalvo(L('podSalvo')),
    napalmDuration: UP.napalm(L('napalm')),
    hellfire: L('hellfire') > 0, hellfireDamage: UP.hellfireDamage(L('hellfireDamage')),
    hellfireReload: UP.hellfireReload(L('hellfireReload')), hellfireBlast: UP.hellfireBlast(L('hellfireBlast')),
    hellfireCount: UP.doubleHellfire(L('doubleHellfire')),
    salvage: UP.salvageCrew(L('salvageCrew')),
    boom: 0, boomR: 18, silver: 0,
    ramTime: 0, ramCharge: 0, power: false,
    strafe: 0, strafeW: JETC.half, strafeD: JETC.dmg, strafeBomb: false, twin: false

// ---------- buying
// TREE = the panel's state: born[id] = when its line starts to grow (the node pops in GROW s later),
// pop[id] = when it popped in, lit[id] = when its line lit up, flash[id] = its last buy, shake[id] =
// a click that could not buy, rings, sparks and floats after a buy, hov = the node under the mouse,
// cam = the view (x, y = the cell in the middle of the panel, z = zoom; zt = the zoom it goes to,
// anchor = the point that stays under the mouse while it zooms), drag = a drag of the map,
// shown = the previous visibility snapshot, so flags revealed during play can grow new lines.
const TREE = {};
const ZOOMS = [0.25, 0.5, 0.75, 1, 1.5, 2];
function resetTree() {
  Object.assign(TREE, { born: {}, pop: {}, lit: {}, flash: {}, shake: {}, rings: [], sparks: [], floats: [], hov: null, sel: null,
    cam: { x: 0, y: 0, z: 1 }, zt: 1, anchor: null, drag: null, shown: null, lastBuy: -9, y0: 19, y1: 331 });
}
resetTree();
const GROW = 0.3;
// Buy one level of node id. True when it was bought. It is saved at once.
function buyNode(id) {
  const n = NODE[id];
  if (!n || n.k === 'tease' || nodeState(n) !== 'buy') return false;
  const before = TREE.shown || NODES.map(shownAs), p = priceOf(n);
  SAVE[n.cur || 'scrap'] -= p;
  SAVE.nodes[id] = lv(id) + 1;
  if (p > 0 && (!n.cur || n.cur === 'scrap')) SAVE.flags.survShown = true;
  saveSave();
  boughtFx(n, p);
  grew(before);
  SFX.buy(!!n.star || n.id === 'root');
  return true;
}
// The look of a buy: a white flash, glowing rings, a burst of sparks, the price floating up, the line lit.
function boughtFx(n, p) {
  const K = NODE_KIND[n.k], big = n.star || n.id === 'root';
  TREE.flash[n.id] = realT;
  TREE.rings.push({ id: n.id, t: realT, c: K.c, big });
  if (big) TREE.rings.push({ id: n.id, t: realT + 0.12, c: '#ffffff', big });
  for (let i = 0; i < (big ? 26 : 14); i++) {
    const a = rnd(TAU), v = rnd(30, big ? 110 : 75);
    TREE.sparks.push({ x: n.x * T_CELL, y: n.y * T_CELL, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: realT, T: rnd(0.35, 0.7),
      c: Math.random() < 0.35 ? '#ffffff' : K.c });
  }
  if (p) TREE.floats.push({ id: n.id, s: '-' + fmt(p), c: n.cur === 'surv' ? U.amber : n.cur === 'gold' ? U.gold : U.blue, t: realT });
  if (lv(n.id) === 1) TREE.lit[n.id] = realT;
}
// After a change, new nodes grow their line and pop in. Save the mask after purchases as well as
// flag changes, so rendering does not restart an animation that the purchase already started.
function grew(before) {
  const after = NODES.map(shownAs);
  NODES.forEach((n, i) => {
    const now = after[i], was = before[i];
    if (!now || now === was) return;
    if (was === 0) {
      const p = parentOf(n), pb = p ? TREE.born[p.id] : null;
      TREE.born[n.id] = pb != null && pb >= realT ? pb + GROW : realT;
    }
    if (now === 2) TREE.pop[n.id] = was === 0 ? TREE.born[n.id] + GROW : realT;
  });
  TREE.shown = after;
}
// Set a node's level (tests): no price, no show.
function setNode(id, l) {
  const n = NODE[id];
  if (!n || n.k === 'tease') return false;
  l = clamp(l | 0, 0, maxLv(n));
  if (l) SAVE.nodes[id] = l;
  else delete SAVE.nodes[id];
  saveSave();
  return true;
}

// ---------- the goal line under the summary
// One useful next choice, using only nodes whose currency and parent have been revealed.
function summaryGoal() {
  const demo = NODES.filter((n) => n.id !== 'root' && n.k !== 'tease');
  if (demo.every((n) => lv(n.id) >= maxLv(n))) return [['ALL DEMO UPGRADES OWNED.', U.green]];
  const choices = demo.filter((n) => ['buy', 'poor'].includes(nodeState(n)));
  const order = (a, b) => Number(canPay(b)) - Number(canPay(a)) || priceOf(a) - priceOf(b);
  const next = choices.filter((n) => n.cur === 'surv').sort(order)[0] || choices.sort(order)[0];
  if (!next) return [['RIDE TO DISCOVER MORE UPGRADES.', U.dim]];
  const price = priceOf(next), unit = next.cur === 'surv' ? (price === 1 ? 'SURVIVOR' : 'SURVIVORS') : next.cur === 'gold' ? 'GOLD' : 'SCRAP';
  const label = next.cur === 'surv' ? 'NEXT NEW UNIT: ' : 'NEXT UPGRADE: ';
  const color = next.cur === 'surv' ? U.amber : next.cur === 'gold' ? U.gold : U.blue;
  return [[label + next.name + ' (' + fmt(price) + ' ' + unit + ')', color]];
}
// The Depot's bottom bar on the tree tab: what to do here, or null.
function treeHint() {
  if (NODES.every((n) => n.k === 'tease' || lv(n.id) >= maxLv(n))) return ['ALL DEMO UPGRADES OWNED. RIDE OR REPLAY.', U.green];
  if (NODES.some((n) => nodeState(n) === 'buy')) {
    const fresh = !NODES.some((n) => n.k === 'scrap' && lv(n.id) > 0);
    return fresh ? ['CLICK A BLUE NODE TO BUY AN UPGRADE.', U.blue] : ['CLICK ANY GLOWING NODE TO BUY IT.', U.ink];
  }
  return ['RIDE FOR MORE REWARDS.', U.dim];
}

// ---------- the view
// The panel's middle on screen, and a node's place on screen.
const treeMid = () => [W / 2, Math.round((TREE.y0 + TREE.y1) / 2)];
function treeXY(tx, ty) {
  const [mx, my] = treeMid(), C = TREE.cam;
  return [Math.round(mx + (tx - C.x * T_CELL) * C.z), Math.round(my + (ty - C.y * T_CELL) * C.z)];
}
// where node id is on screen (with the tree tab open)
function nodeXY(id) {
  const n = NODE[id];
  if (!n) return null;
  const [x, y] = treeXY(n.x * T_CELL, n.y * T_CELL);
  return { x, y };
}
// half the size of a node's square at this zoom: a big node is 26 px at zoom 1, the others 20
const halfOf = (n) => Math.max(4, Math.round((n.star || n.id === 'root' ? 13 : 10) * TREE.cam.z));
// Zoom in (+1) or out (-1) one step, keeping the point under (sx, sy) where it is.
function treeZoom(dir, sx, sy) {
  const i = clamp(ZOOMS.indexOf(TREE.zt) + dir, 0, ZOOMS.length - 1);
  if (ZOOMS[i] === TREE.zt) return;
  const [mx, my] = treeMid(), C = TREE.cam;
  sx = sx ?? mx;
  sy = sy ?? my;
  TREE.zt = ZOOMS[i];
  TREE.anchor = { sx, sy, x: C.x + (sx - mx) / C.z / T_CELL, y: C.y + (sy - my) / C.z / T_CELL };
  SFX.ui();
}
// The wheel over the tree (main.js sends it here).
function treeWheel(dy) {
  treeZoom(dy < 0 ? 1 : -1, M.inside ? M.x : null, M.inside ? M.y : null);
}
// Back to VIPER in the middle, at zoom 1.
function treeCenter() {
  TREE.zt = 1;
  TREE.anchor = null;
  TREE.goTo = { x: 0, y: 0 };
}
// Move the view so node id is on the panel (tests, and the tutorial's tags).
function treeFocus(id) {
  const n = NODE[id];
  if (!n) return;
  const p = nodeXY(id), h = halfOf(n) + 30;
  if (p.x > h && p.x < W - h && p.y > TREE.y0 + h && p.y < TREE.y1 - h) return;
  TREE.cam.x = n.x;
  TREE.cam.y = n.y;
  TREE.goTo = null;
}
// Keys on the tree tab: C or HOME = centre, + / - = zoom. True when used.
function treeKey(k) {
  if (k === 'c' || k === 'Home') treeCenter();
  else if (k === '+' || k === '=') treeZoom(1);
  else if (k === '-' || k === '_') treeZoom(-1);
  else return false;
  return true;
}
// The bounds of the whole map (cells), for keeping the view on it.
const T_SPAN = (() => {
  const xs = NODES.map((n) => n.x), ys = NODES.map((n) => n.y);
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
})();
// Each frame: the zoom glides to its step (the anchor stays under the mouse), the view glides to a
// centre it was sent to, WASD moves it, and it stays near the map.
function treeView() {
  const C = TREE.cam, k = 1 - Math.exp(-14 * frameDt);
  if (Math.abs(C.z - TREE.zt) > 0.002) C.z += (TREE.zt - C.z) * k;
  else C.z = TREE.zt;
  const a = TREE.anchor;
  if (a) {
    const [mx, my] = treeMid();
    C.x = a.x - (a.sx - mx) / C.z / T_CELL;
    C.y = a.y - (a.sy - my) / C.z / T_CELL;
    if (C.z === TREE.zt) TREE.anchor = null;
  }
  const g = TREE.goTo;
  if (g) {
    C.x += (g.x - C.x) * k;
    C.y += (g.y - C.y) * k;
    if (Math.abs(g.x - C.x) + Math.abs(g.y - C.y) < 0.01) TREE.goTo = null;
  }
  const v = 9 * frameDt / C.z;
  if (KEYS.a) C.x -= v;
  if (KEYS.d) C.x += v;
  if (KEYS.w) C.y -= v;
  if (KEYS.s) C.y += v;
  C.x = clamp(C.x, T_SPAN.x0 - 1, T_SPAN.x1 + 1);
  C.y = clamp(C.y, T_SPAN.y0 - 1, T_SPAN.y1 + 1);
}

// A soft round glow (a smooth fall-off, like bloom) in colour col, made once per colour; tGlow
// draws it with radius r at (x, y), strength a (in the 'lighter' blend mode).
const T_SOFT = new Map();
function tGlow(x, y, r, col, a) {
  let c = T_SOFT.get(col);
  if (!c) {
    const [cc, g] = mk(64, 64), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32), [R, G0, B] = hexRgb(col);
    gr.addColorStop(0, 'rgba(' + R + ',' + G0 + ',' + B + ',0.9)');
    gr.addColorStop(0.25, 'rgba(' + R + ',' + G0 + ',' + B + ',0.45)');
    gr.addColorStop(0.6, 'rgba(' + R + ',' + G0 + ',' + B + ',0.12)');
    gr.addColorStop(1, 'rgba(' + R + ',' + G0 + ',' + B + ',0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    T_SOFT.set(col, (c = cc));
  }
  if (r < 1 || a <= 0) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(c, x - r, y - r, r * 2, r * 2);
  ctx.imageSmoothingEnabled = false;
}

// ---------- the backdrop
// A tile of star dust (faint dots, a few brighter ones with a cross) and a soft glow of colour, made once.
let T_STARS = null, T_NEB = null;
function bakeTreeBack() {
  const rng = mulberry(77);
  T_STARS = pix(256, 256, (r) => {
    for (let i = 0; i < 260; i++) {
      const x = Math.floor(rng() * 256), y = Math.floor(rng() * 256), q = rng();
      const col = q < 0.12 ? 'rgba(255,120,210,0.28)' : q < 0.3 ? 'rgba(110,190,255,0.32)' : 'rgba(200,215,240,' + (0.08 + rng() * 0.2).toFixed(2) + ')';
      r(x, y, 1, 1, col);
      if (rng() < 0.05) {

// ---------- the panel
// The SKILL TREE tab, between y0 and y1.
function drawTreeTab(y0, y1) {
  TREE.y0 = y0;
  TREE.y1 = y1;
  // The first visit establishes a baseline. Later visits animate flags earned during a ride.
  if (TREE.shown) grew(TREE.shown);
  else TREE.shown = NODES.map(shownAs);
  treeView();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y0, W, y1 - y0);
  ctx.clip();
  drawTreeBack(y0, y1);
  // which nodes show (vis[id] = its state); a node pops in after its line has grown
  const vis = {};
  for (const n of NODES) {
    const st = nodeState(n), b = TREE.born[n.id];
    if (st === 'off' || (b != null && realT < b + GROW)) continue;
    vis[n.id] = st;
  }
  treeInput(vis, y0, y1);
  drawTreeLines(vis);
  // (only the nodes on the panel are drawn)
  const m = 40 * TREE.cam.z;
  for (const n of NODES) {
    if (!vis[n.id]) continue;
    const p = nodeXY(n.id);
    if (p.x > -m && p.x < W + m && p.y > y0 - m && p.y < y1 + m) drawTreeNode(n, vis[n.id]);
  }
  drawTreeFx();
  drawTreeHelp(y0, y1);
  const tip = TREE.hov;
  if (tip && vis[tip.id]) drawInfo(tip, vis[tip.id], y0, y1);
  ctx.restore();
}
// The node under screen point (x, y), or null.
function treeNodeAt(vis, x, y) {
  let best = null;
  for (const n of NODES) {
    if (!vis[n.id]) continue;
    const p = nodeXY(n.id), h = halfOf(n) + 2;

  }

// The mouse: a drag moves the map; a click (no drag) on a node buys a level, or says no (a buzz

function treeInput(vis, y0, y1) {
  const inPanel = (y) => y >= y0 && y < y1;
  if (M.pressed && M.down && inPanel(M.py) && !treeOnButton(M.px, M.py)) {
    TREE.drag = { x: M.px, y: M.py, cx: TREE.cam.x, cy: TREE.cam.y, moved: false };
  }
  const d = TREE.drag;
  if (d && M.down) {
    if (Math.abs(M.x - d.x) + Math.abs(M.y - d.y) > 4) d.moved = true;
    if (d.moved) {
      TREE.goTo = TREE.anchor = null;
      TREE.cam.x = d.cx - (M.x - d.x) / TREE.cam.z / T_CELL;
      TREE.cam.y = d.cy - (M.y - d.y) / TREE.cam.z / T_CELL;

  }

  if (M.inside && inPanel(M.y) && !(d && d.moved)) TREE.hov = treeNodeAt(vis, M.x, M.y);
  if (M.released) {
    const was = TREE.drag;
    TREE.drag = null;
    if (was && was.moved) M.used = true;
    else if (!M.used && inPanel(M.py) && !treeOnButton(M.px, M.py)) {
      const n = treeNodeAt(vis, M.px, M.py);
      if (n && n === treeNodeAt(vis, M.x, M.y)) {
        M.used = true;

      }
    }
  }

}
function treeClick(n) {
  if (realT - TREE.lastBuy < 0.08) return; // the same click seen twice: one buy only
  if (buyNode(n.id)) TREE.lastBuy = realT;
  else if (nodeState(n) !== 'max') {
    TREE.shake[n.id] = realT;

  } else SFX.ui();

// The zoom buttons, top right: [-] [+] CENTER. Returns true when (x, y) is on one.
const T_BTN = () => [[W - 92, '-', 15], [W - 75, '+', 15], [W - 58, 'CENTER', 52]];
const treeOnButton = (x, y) => T_BTN().some(([bx, , bw]) => inR(x, y, bx, TREE.y0 + 4, bw, 14));
function drawTreeHelp(y0) {
  for (const [bx, s, bw] of T_BTN()) {
    if (button(bx, y0 + 4, bw, 14, s)) {
      if (s === '-') treeZoom(-1);
      else if (s === '+') treeZoom(1);

    }
  }
  text('DRAG: MOVE   WHEEL: ZOOM', 6, y0 + 7, '#3c4658', { outline: false });

// ---------- the lines
// A line from each shown node back to the one it grows from: a bright core with a glow once the
// node has a level (a spark runs along it now and then), a dim line in its colour while it is for
// sale, a faint one to a padlock. A new line grows out over GROW s and lights up over 0.3 s.
// The lines are drawn into T_LINES and reused while nothing about them changes (the view, the
// states); while one grows or lights up they are drawn each frame.
const T_LINES = { c: null, g: null, key: '' };
function drawTreeLines(vis) {
  const busy = NODES.some((n) => realT - (TREE.born[n.id] ?? -9) < GROW || realT - (TREE.lit[n.id] ?? -9) < 0.3);
  if (busy) treeLines(ctx, vis);
  else {
    const C = TREE.cam, key = [W, H, TREE.y0, TREE.y1, C.x.toFixed(4), C.y.toFixed(4), C.z.toFixed(4)].join(',') + '|' +
      NODES.map((n) => (vis[n.id] || '-') + lv(n.id)).join(',');
    if (!T_LINES.c || T_LINES.c.width !== W || T_LINES.c.height !== H) {
      [T_LINES.c, T_LINES.g] = mk(W, H);
      T_LINES.key = '';
    }
    if (key !== T_LINES.key) {
      T_LINES.key = key;
      T_LINES.g.clearRect(0, 0, W, H);
      treeLines(T_LINES.g, vis);
    }
    ctx.drawImage(T_LINES.c, 0, 0);
  }
  treeSparks(vis);
}
// Each shown line: calls fn(n, a, b, f, st) with n's parent at a, n at b on screen, f = how far it
// has grown, st = n's state (n itself may not have popped in yet).
function eachLine(vis, fn) {
  for (const n of NODES) {
    const p = parentOf(n), st = vis[n.id] || nodeState(n);
    if (!p || st === 'off' || !vis[p.id]) continue;
    const a = nodeXY(p.id), b = nodeXY(n.id);
    // (a line wholly off the panel is not drawn)
    if (Math.max(a.x, b.x) < 0 || Math.min(a.x, b.x) > W || Math.max(a.y, b.y) < TREE.y0 || Math.min(a.y, b.y) > TREE.y1) continue;
    const born = TREE.born[n.id], f = born != null ? clamp((realT - born) / GROW, 0, 1) : 1;

}
function treeLines(g, vis) {
  const z = TREE.cam.z, wide = z >= 1.4 ? 2 : 1;
  eachLine(vis, (n, a, b, f, st) => {
    const ex = lerp(a.x, b.x, f), ey = lerp(a.y, b.y, f), K = NODE_KIND[n.k];
    if (lv(n.id) > 0) {
      const lt = TREE.lit[n.id], u = lt != null ? clamp((realT - lt) / 0.3, 0, 1) : 1;
      if (u < 1) tLine(g, a.x, a.y, ex, ey, K.m, wide);
      if (u <= 0) return;
      const gx = lerp(a.x, ex, u), gy = lerp(a.y, ey, u);
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = 0.22;
      g.strokeStyle = K.g;
      g.lineWidth = Math.min(7, 5 * Math.max(0.7, z));
      g.beginPath();
      g.moveTo(a.x + 0.5, a.y + 0.5);
      g.lineTo(gx + 0.5, gy + 0.5);
      g.stroke();
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
      tLine(g, a.x, a.y, gx, gy, K.c, wide);
    } else if (st === 'tease') tLine(g, a.x, a.y, ex, ey, '#1a2232', 1);
    else tLine(g, a.x, a.y, ex, ey, st === 'buy' ? K.m : '#24324a', wide);
  });
}
// A spark that runs out along each lit line every couple of seconds.
function treeSparks(vis) {
  const z = TREE.cam.z, wide = z >= 1.4 ? 2 : 1;
  eachLine(vis, (n, a, b, f) => {
    if (f < 1 || !lv(n.id) || realT - (TREE.lit[n.id] ?? -9) < 0.3) return;
    const u = mod(realT * 0.55 + (n.x * 0.37 + n.y * 0.61), 1.6);
    if (u >= 1) return;
    const x = lerp(a.x, b.x, u), y = lerp(a.y, b.y, u);
    ctx.globalCompositeOperation = 'lighter';
    tGlow(x, y, 7 * Math.max(0.8, z), NODE_KIND[n.k].g, 0.8);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(x) - (wide >> 1), Math.round(y) - (wide >> 1), wide, wide);
  });
}
// A crisp line of pixels on g, w px wide.
function tLine(g, x0, y0, x1, y1, col, w) {
  pl(g, Math.round(x0), Math.round(y0), Math.round(x1), Math.round(y1), col);
  if (w > 1) pl(g, Math.round(x0) + 1, Math.round(y0), Math.round(x1) + 1, Math.round(y1), col);
}

// ---------- a node
// The node's glow, square, icon (a padlock while it is locked), its level as 3/10 under it, the
// flash of a buy and the pop when it opens. Nodes you can buy pulse; a big node has a double frame.
function drawTreeNode(n, st) {
  const K = NODE_KIND[n.k], l = lv(n.id), m = maxLv(n), z = TREE.cam.z, p = nodeXY(n.id);
  let x = p.x, y = p.y, h = halfOf(n);
  // a click that could not buy shakes it; a node that just opened pops out of nothing
  const sk = realT - (TREE.shake[n.id] ?? -9);
  if (sk < 0.25 && !REDUCED) x += Math.round(Math.sin(sk * 70) * 2 * (1 - sk / 0.25));
  const pp = realT - (TREE.pop[n.id] ?? -9);
  if (pp >= 0 && pp < 0.25) h = Math.max(2, Math.round(h * (0.4 + 0.6 * ease(pp / 0.25) + Math.sin(pp / 0.25 * Math.PI) * 0.2)));
  const s = h * 2, nx = x - h, ny = y - h, hov = TREE.hov === n, buy = st === 'buy', big = !!n.star || n.id === 'root';
  const pulse = 0.5 + 0.5 * Math.sin(realT * 5 + n.x);
  const lock = st === 'tease';
  // the glow round it
  const ga = lock ? 0 : st === 'max' ? 0.5 : buy ? 0.35 + 0.35 * pulse : l > 0 ? 0.4 : st === 'poor' ? 0.12 : 0.18;
  if (ga > 0 || hov) {
    ctx.globalCompositeOperation = 'lighter';
    tGlow(x, y, Math.min(h * (big ? 3 : 2.6), h + 26) + (buy ? pulse * 3 : 0), K.g, ga + (hov ? 0.15 : 0));
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  // the body
  ctx.fillStyle = st === 'max' ? K.d : '#070a10';
  ctx.fillRect(nx + 1, ny + 1, s - 2, s - 2);
  if (!lock) {
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(nx + 2, ny + 1, s - 4, 1);
  }
  // the frame: bright once it has a level or you can buy it (it pulses white), mid while you
  // cannot pay, dark grey while locked
  const fc = lock ? (hov ? '#3a4458' : '#202838') : buy ? (pulse > 0.75 ? '#ffffff' : K.c) : l > 0 ? K.c : K.m;
  frame(nx, ny, s, s, fc);
  if (big && s >= 12) {
    ctx.globalAlpha = lock ? 0.5 : 0.65;
    frame(nx + 2, ny + 2, s - 4, s - 4, fc);
    ctx.globalAlpha = 1;
  }
  if (hov) {
    ctx.globalAlpha = 0.6;
    frame(nx - 1, ny - 1, s + 2, s + 2, lock ? '#3a4458' : '#ffffff');
    ctx.globalAlpha = 1;
  }
  // the icon: crisp, 1x up to 2x and 3x as the view zooms in (none when it is very small)
  const ic = lock ? ICON.lock : NICON[n.id] || ICON.star, k = Math.max(1, Math.floor((s - 4) / Math.max(ic.width, ic.height)));
  if (s >= ic.width + 4) {
    const iw = ic.width * k, ih = ic.height * k;
    ctx.globalAlpha = lock ? 0.45 : st === 'poor' && !l ? 0.55 : 1;
    blit(ic, Math.round(x - iw / 2), Math.round(y - ih / 2), iw, ih);
    ctx.globalAlpha = 1;
  } else if (!lock) {
    ctx.fillStyle = l > 0 || buy ? K.c : K.m;
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  // just bought: a white flash; just popped in: a softer one
  const fl = realT - (TREE.flash[n.id] ?? -9);
  const wa = Math.max(fl < 0.15 ? 1 - fl / 0.15 : 0, pp >= 0 && pp < 0.2 ? 0.8 * (1 - pp / 0.2) : 0);
  if (wa > 0) {
    ctx.globalAlpha = wa;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(nx, ny, s, s);
    ctx.globalAlpha = 1;
  }

  if (lock || z < 0.7) return;
  let lab, lc;
  if (n.id === 'root') [lab, lc] = l ? ['', ''] : ['FREE', pulse > 0.5 ? '#ffe39a' : U.gold];
  else [lab, lc] = [l + '/' + m, st === 'max' ? K.c : l > 0 ? '#e6f2ff' : buy ? '#c8d4e6' : '#6c7890'];
  if (lab) text(lab, x, y + h + 2, lc, { align: 'center', outline: '#04060a' });
}
// Rings and sparks from buys, and the price floating up.
function drawTreeFx() {
  const z = TREE.cam.z;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = TREE.rings.length - 1; i >= 0; i--) {
    const r = TREE.rings[i], u = (realT - r.t) / 0.5;
    if (u >= 1) {
      TREE.rings.splice(i, 1);
      continue;
    }
    if (u < 0) continue;
    const n = NODE[r.id], p = nodeXY(r.id), e = halfOf(n) + ease(u) * (r.big ? 30 : 18) * z;
    ctx.globalAlpha = (1 - u) * 0.9;
    ctx.strokeStyle = r.c;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x + 0.5, p.y + 0.5, e, 0, TAU);
    ctx.stroke();
  }
  for (let i = TREE.sparks.length - 1; i >= 0; i--) {
    const s = TREE.sparks[i], t = realT - s.t;
    if (t >= s.T) {

      continue;
    }
    const d = 1 - Math.exp(-4 * t), [x, y] = treeXY(s.x + s.vx * d / 4 * 1.6, s.y + s.vy * d / 4 * 1.6);
    ctx.globalAlpha = 1 - t / s.T;

    ctx.fillRect(x, y, 2, 2);

  ctx.globalCompositeOperation = 'source-over';
  for (let i = TREE.floats.length - 1; i >= 0; i--) {
    const f = TREE.floats[i], u = (realT - f.t) / 0.9;
    if (u >= 1) {
      TREE.floats.splice(i, 1);
      continue;
