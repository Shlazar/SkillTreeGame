}
// A survivor on foot: waiting by the station house, running for the train (a green marker over
// them), or held by the dead (a red marker, and they shake).
function drawPerson(p) {
  const sv = p.sv, run = p.st === 'run', grab = p.st === 'grab';
  const x = Math.round(p.x) + (grab && Math.sin(realT * 40) > 0 ? 1 : 0), y = Math.round(p.y);
  blit(run ? sv.run[(p.anim | 0) & 1][thermal ? 1 : 0] : thermal ? sv.h : sv.n, x - 2, y - 8);
  if (run || grab) {
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x - 2, y - 15, 5, 4);
    ctx.fillStyle = thermal ? '#ffffff' : grab ? (Math.sin(realT * 18) > 0 ? '#ff3a2a' : '#a8241a') : '#8fd18a';
    ctx.fillRect(x - 1, y - 14, 3, 1);
    ctx.fillRect(x, y - 13, 1, 1);
  }
}
// The helicopter's shadow on the ground, south-east of the view's middle (the sun is in the
// north-west), lagging a little as it speeds up, with its rotor turning.
function drawHeliShadow() {
  const h = G.heli, alt = CFG.heli.alt;
  // (the heli is at the view's middle, less how far the camera leads the train)
  const gx = Math.round(G.camX + W / 2 - G.lead[0] + alt * SUNX - h.vx * 0.08), gy = Math.round(G.camY + H / 2 - G.lead[1] + alt * SUNY - h.vy * 0.08);
  ctx.globalAlpha = thermal ? 0.2 : 0.3;
  blit(HELI[mod(Math.round(h.hd / TAU * HELI_N), HELI_N)], gx - 20, gy - 20);
  // the faint disc the blades sweep, then the four blades
  ctx.globalAlpha = thermal ? 0.04 : 0.06;
  ctx.fillStyle = '#000';
  const R = 21, ry = Math.round(R * FORE);
  for (let dy = -ry; dy <= ry; dy++) {
    const hw = Math.round(R * Math.sqrt(1 - (dy * dy) / (ry * ry)));
    ctx.fillRect(gx - hw, gy + dy, hw * 2 + 1, 1);
  }
  ctx.globalAlpha = thermal ? 0.2 : 0.3;
  const a0 = realT * 31;
  for (let k = 0; k < 4; k++) {
    const a = a0 + k * Math.PI / 2;
    pl(ctx, gx, gy, gx + Math.cos(a) * R, gy + Math.sin(a) * R * FORE, '#000');
  }
  ctx.globalAlpha = 1;
}
// Grass tufts that sway a little.
function drawTufts(ci0, cj0, ci1, cj1) {
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) {
    for (const t of plan(i, j).tufts) {
      const sw = Math.round(Math.sin(realT * 1.6 + t.p + t.x * 0.03) * 0.8);
      ctx.fillStyle = t.c;
      ctx.fillRect(t.x, t.y - t.h + 1, 1, t.h);
      ctx.fillRect(t.x - 1 + sw, t.y - t.h, 1, 1);
      ctx.fillRect(t.x + 2, t.y - t.h + 2, 1, t.h - 1);
      ctx.fillRect(t.x + 2 + sw, t.y - t.h + 1, 1, 1);
    }
  }
}
// Bodies in the air: knocked over (fall) or thrown and turning (spin).
function drawBodies() {
  for (const b of G.bodies) {
    const S = b.S;
    if (b.fall) {
      if (b.age < 0.07) blit(S.walk[0].w, Math.round(b.x - S.ax), Math.round(b.y - S.ay - b.z));
      else blit(thermal ? S.deadH : S.dead, Math.round(b.x - S.dax), Math.round(b.y - S.day - b.z));
    } else {
      const img = (thermal ? S.spinH : S.spin)[mod(Math.round(b.rot / (TAU / 4)), 4)];
      blit(img, Math.round(b.x - img.width / 2), Math.round(b.y - b.z - 5 - img.height / 2));
    }
  }
}
// Where a 105 shell will land: a blinking ring that closes on the spot (red when it will hit the
// train too).
function drawShellMarks() {
  for (const r of G.rounds) {
    if (r.kind !== 'he' || !r.player) continue;
    const u = r.age / r.T, rr = lerp(CFG.he.kill * 1.5, CFG.he.kill, ease(u));
    const col = thermal ? '#ffffff' : trainDist(r.bx, r.by, G.tr.v * (r.T - r.age)) < CFG.he.close ? '#ff2a1a' : '#ff6a28';
    ctx.globalAlpha = 0.35 + 0.3 * (Math.sin(realT * 22) > 0 ? 1 : 0);
    pell(r.bx, r.by, rr, rr * FORE, col);
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(r.bx) - 1, Math.round(r.by), 3, 1);
    ctx.fillRect(Math.round(r.bx), Math.round(r.by) - 1, 1, 3);
  }
  ctx.globalAlpha = 1;
}
// Rounds in the air. They leave the gunship below the screen and fall into their spot: seen from
// the gun, a round streaks out fast, then shrinks to a point as it drops away (perspective).
const Z0 = 110, ZD = 1250;
const persp = (u) => (1 - u) * Z0 / (Z0 + u * (ZD - Z0));
// the gun's muzzle, below the bottom edge of the screen (25mm right, 105 left), in world px
const muzzleX = (side) => G.camX + W * (side > 0 ? 0.7 : 0.36);
const muzzleY = (side) => G.camY + H + (side > 0 ? 26 : 36);
const TRC = [['#fff1c2', '#ffd27a', '#ff9a3a', '#c9772f'], ['#fff6e0', '#ffd27a', '#ff9a3a', '#e2552f']];
function drawRounds() {
  for (const r of G.rounds) {
    const u = r.age / r.T, he = r.kind === 'he';
    const mx = muzzleX(r.side) + r.j * 8, my = muzzleY(r.side);
    const g1 = persp(u), g0 = persp(Math.max(0, u - (he ? 0.07 : 0.06)));
    const hx = r.bx + (mx - r.bx) * g1, hy = r.by + (my - r.by) * g1;
    const dx = (r.bx + (mx - r.bx) * g0) - hx, dy = (r.by + (my - r.by) * g0) - hy;
    const n = Math.min(160, Math.ceil(Math.hypot(dx, dy))), cols = TRC[he ? 1 : 0];
    for (let i = 1; i <= n; i++) {
      const f = i / n, w = he && f < 0.5 ? 2 : 1;
      ctx.globalAlpha = 1 - f * 0.75;
      ctx.fillStyle = cols[Math.min(3, (f * 4) | 0)];
      // near the camera the streak is wider
      const s = g1 + (g0 - g1) * f > 0.22 ? w + 1 : w;
      ctx.fillRect(Math.round(hx + dx * f), Math.round(hy + dy * f), s, s);
    }
    ctx.globalAlpha = 1;
    const s = he ? (g1 > 0.12 ? 3 : 2) : (g1 > 0.25 ? 2 : 1);
    ctx.fillStyle = '#fff6e0';
    ctx.fillRect(Math.round(hx - (s >> 1)), Math.round(hy - (s >> 1)), s, s);
    light(hx, hy, he ? 10 : 5, he ? '#ffd27a' : '#ffb347', he ? 0.7 : 0.45);
  }
  // the gun flashes below the screen edge
  if (G.muzzle[0] > 0) light(muzzleX(1), muzzleY(1) - 10, 46, '#ffc27a', G.muzzle[0] / 0.05 * 0.5);
  if (G.muzzle[1] > 0) light(muzzleX(-1), muzzleY(-1) - 14, 80, '#ffb060', G.muzzle[1] / 0.12 * 0.8);
  ctx.globalAlpha = 1;
}
// While the Turbo Ram runs: its kills so far beside the engine's nose (white for a moment at each one;
// amber from 15, red from 30, the counts of its ranks).
function drawRamCount() {
  const r = G.ram;
  if (!r.on || !r.kills || G.demo) return;
  const c = G.tr.cars[0], n = r.kills, col = realT - r.killT < 0.07 ? '#ffffff' : n >= 30 ? '#ff7a4a' : n >= 15 ? U.amber : U.gold;
  text('×' + n, c.x0 + 13, c.y0 - 10, col, { scale: 2, drop: true });
}
// Two bands of mist that drift over the field (they belong to the ground and move with it).
function drawMist() {
  const k0 = Math.floor((G.camY - 48) / 300), k1 = Math.floor((G.camY + H) / 300), mw = MIST.width;
  for (let k = k0; k <= k1; k++) {
    const y = k * 300 + 80, odd = k & 1;
    const off = mod(k * 217 + realT * (odd ? 3 : -2), mw);
    ctx.globalAlpha = odd ? 0.09 : 0.06;
    for (let x = Math.floor((G.camX - off) / mw) * mw + off; x < G.camX + W; x += mw) ctx.drawImage(MIST, Math.round(x), y);
  }
  ctx.globalAlpha = 1;
}
// Cloud shadows that slide over the field.
function drawClouds() {
  const dx = realT * 5, CW = 520, CL = 380;
  const i0 = Math.floor((G.camX - dx) / CW) - 1, i1 = Math.floor((G.camX + W - dx) / CW);
  const j0 = Math.floor(G.camY / CL) - 1, j1 = Math.floor((G.camY + H) / CL);
  ctx.globalAlpha = 0.13;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    if (hrnd(i, j, 77) < 0.3) continue;
    const s = CLOUDSPR[hrnd(i, j, 78) < 0.5 ? 0 : 1];
    ctx.drawImage(s, Math.round(i * CW + dx + hrnd(i, j, 79) * (CW - s.width)), Math.round(j * CL + hrnd(i, j, 80) * (CL - s.height)));
  }
  ctx.globalAlpha = 1;
}

// ---------- the frame (world layer)
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#060708';
  ctx.fillRect(0, 0, W, H);
  const [sx, sy] = shakeOff();
  const ci0 = Math.floor((G.camX - 8) / CH), ci1 = Math.floor((G.camX + W + 8) / CH);
  const cj0 = Math.floor((G.camY - 8) / CH), cj1 = Math.floor((G.camY + H + 8) / CH);
  // the ground in view is baked now; one more chunk round it per frame, before it is needed
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) groundChunk(i, j, true);
  bakeSome(ci0, cj0, ci1, cj1, 1);
  gather(ci0, cj0, ci1, cj1);
  ctx.save();
  ctx.translate(sx - G.camX, sy - G.camY);
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) {
    ctx.drawImage(GROUND.get(ckey(i, j)), i * CH, j * CH);
    const d = DECALS.get(ckey(i, j));
    if (d) ctx.drawImage(d.c, i * CH, j * CH);
  }
  // the thermal camera sees the ground cooler than anything alive
  if (thermal) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(G.camX - 8, G.camY - 8, W + 16, H + 16);
  }
  drawTufts(ci0, cj0, ci1, cj1);
  drawShellMarks();
  // shadows of the dead, and of bodies in the air
  ctx.globalAlpha = thermal ? 0.2 : 0.32;
  for (const z of VZ) {
    const S = z.S, fr = S.walk[(z.anim | 0) & 1];
    blit(z.left ? fr.sf : fr.s, Math.round(z.x - S.ax), Math.round(z.y - 1 - S.shp));
  }
  drawTrainShadow();
  ctx.globalAlpha = 0.25;
  for (const b of G.bodies) blit(BODYSH, Math.round(b.x - 4), Math.round(b.y - 2));
  ctx.globalAlpha = 1;
  drawHeliShadow();
  // trees, props, the train and the dead, back to front. A tree under the sight fades so you can
  // see past it.
  const ax = G.camX + G.aimSX, ay = G.camY + G.aimSY, aiming = mode === 'play';
  for (const o of DL) {
    if (o.isCar) {
      drawCar(o.i);
      continue;
    }
    if (o.person) {
      drawPerson(o);
      continue;
    }
    if (o.S) {
      drawZombie(o);
      continue;
    }
    const d = o.d;
    if (aiming && d.tree && Math.abs(o.x - ax) < d.spr.width / 2 + 10 && ay > o.y - d.spr.height - 10 && ay < o.y + 6) {
      ctx.globalAlpha = 0.4;
      blit(d.spr, o.x - d.ax, o.y - d.ay);
      ctx.globalAlpha = 1;
    } else blit(d.spr, o.x - d.ax, o.y - d.ay);
  }
  // the dead behind a tree show through it, faintly
  if (TREES.length) {
    ctx.globalAlpha = thermal ? 0.6 : 0.45;
    for (const z of VZ) {
      const S = z.S, zl = z.x - S.ax, zt = z.y - S.ay, zw = S.walk[0].n.width;
      for (const t of TREES) {
        if (t.y <= z.y) continue;
        const d = t.d, tl = t.x - d.ax;
        if (zl + zw <= tl || zl >= tl + d.spr.width || zt >= t.y || z.y < t.y - d.ay) continue;
        blit(zImg(z), Math.round(zl), Math.round(zt));
        break;
      }
    }
    ctx.globalAlpha = 1;
  }
  // fires, smoke and dirt, explosions, flying bodies
  for (const f of FIRES) drawFlame(f.x, f.y, f.big, f.seed);
  for (const f of flames) drawFlame(f.x, f.y, false, f.seed);
  drawParts(false);
  drawBooms();
  drawBodies();
  // glows (added light)
  ctx.globalCompositeOperation = 'lighter';
  drawLights();
  for (const f of FIRES) light(f.x, f.y - (f.big ? 6 : 3), f.big ? 30 : 18, '#ff9a4a', 0.45 + Math.sin(realT * 13 + f.seed) * 0.08);
  for (const f of flames) light(f.x, f.y - 2, 10, '#ff8a3a', 0.35 * Math.min(1, f.life));
  // the train's headlights, and their beam on the rails ahead (it follows the bends). While the
  // Turbo Ram runs: bigger lights, a third beam further out, and the engine glows orange.
  if (G.result !== 'lost') {
    const tr = G.tr, c = tr.cars[0], k = ramK(), hr = 6 + 4 * k;
    light(c.x0 - c.nx * 4, c.y0 - c.ny * 4 - 7, hr, '#fff1c2', 0.8);
    light(c.x0 + c.nx * 3, c.y0 + c.ny * 3 - 7, hr, '#fff1c2', 0.8);
    for (const [ds, r, a] of k > 0 ? [[24, 22, 0.3], [56, 30, 0.18], [90, 34, 0.16 * k]] : [[24, 22, 0.3], [56, 30, 0.16]]) {
      const y = yAtS(tr.s - ds, tr.fy - ds);
      light(trackX(y), y, r, '#ffe2a0', a);
    }
    if (k > 0 && !thermal) light(c.cx, c.cy - 6, 24, '#ff8a3a', 0.2 * k + 0.05 * Math.sin(realT * 18));
  }
  // station lamps
  for (const p of G.statics) if (p.lamp && Math.abs(p.y - G.camY - H / 2) < H) light(p.x, p.y - 17, 16, '#ffe2a0', 0.45);
  // the searchlights of the safe zone sweep the ground in front of the wall
  for (const p of G.statics) if (p.tower && Math.abs(p.y - (G.camY + H / 2)) < H) {
    light(p.x + 5, p.y - 26, 5, '#fff1c2', 0.9);
    light(p.x + Math.sin(realT * 0.7 + p.tower) * 70, p.y + 46 + Math.cos(realT * 0.9 + p.tower * 2) * 18, 28, '#fff1c2', 0.22);
  }
  ctx.globalAlpha = 1;
  drawRings();
  drawParts(true);
  drawRounds();
  drawCannonFx();
  drawZaps();
  drawTowerFx();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (!thermal) {
    drawMist();
    drawClouds();
  }
  // the names of the safe zone (past the gate), the Depot and the stations, over everything on the ground
  if (G.goalY > G.camY - 80 && G.goalY < G.camY + H + 80) text('SAFE ZONE', trackX(G.goalY) + 96, G.goalY - 30, '#8fd18a', { align: 'center', scale: 2 });
  for (const st of G.stops) {
    const hs = st.house;
    if (Math.abs(hs.y - G.camY - H / 2) < H) text(st.name, hs.x, hs.y - 36, st.id === 'depot' ? U.gold : U.blue, { align: 'center' });
  }
  drawLoot();
  drawTexts();
  drawRamCount();
  ctx.restore();
  // the camera's look over everything
  if (!thermal) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(HAZE, 0, 0);
    ctx.globalCompositeOperation = 'soft-light';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(GRADE, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(VIG, 0, 0);
  } else {
    // grey (the color's saturation taken out), turned over for black hot, then grain and lines
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, W, H);
    if (thermal === 2) {
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.06;
    ctx.drawImage(GRAIN, -((Math.random() * 64) | 0), -((Math.random() * 64) | 0));
    ctx.globalAlpha = 1;
    ctx.drawImage(SCAN, 0, 0);
    ctx.drawImage(VIG, 0, 0);
  }
}

// ui.js - everything drawn over the world, in screen pixels: the gun sight and lock brackets, the
// top bar (scrap, survivors, kills, the train's health, the route up the line), warnings, arrows on
// the screen edge to the train and to trouble out of view, the radar, the weapon cards, coins,
// banners, hints, the red edge when the train is nearly lost, and the screens (title, pause,
// summary; the Depot is in depot.js). Buttons are drawn in the canvas too (from Ball x Archers).

// M = the mouse in game pixels. pressed / released are true for one frame; px, py = where the
// press started; used = this click was already handled; inside = the mouse is over the game.
const M = { x: -99, y: -99, down: false, pressed: false, released: false, px: 0, py: 0, used: false, inside: false };
let cursor = 'default';

// True when a button at (x, y, w, h) was clicked this frame.
function clicked(x, y, w, h) {
  if (M.released && !M.used && inR(M.px, M.py, x, y, w, h) && inR(M.x, M.y, x, y, w, h)) {
    M.used = true;
    SFX.ui();
    return true;
  }
  return false;
}
// Draw a button (o.primary = gold, o.danger = red, o.off = greyed out, never clicked). Returns true
// when it is clicked.
function button(x, y, w, h, label, o) {
  o = o || {};
  const hov = !o.off && inR(M.x, M.y, x, y, w, h), pr = hov && M.down;
  ctx.fillStyle = pr ? '#0b0c0f' : hov ? '#1d1f25' : '#131419';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, o.off ? '#24272e' : o.primary ? (hov ? '#f0c264' : '#b8862f') : o.danger ? (hov ? '#e0705a' : '#8a3a2c') : (hov ? '#6a6f7b' : '#3a3e48'));
  ctx.fillStyle = o.primary ? 'rgba(227,176,75,0.12)' : '#22252c';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  const col = o.off ? U.faint : o.primary ? U.gold : o.danger ? U.red : U.ink;
  text(label, x + w / 2, y + Math.round(h / 2) - 3 + (pr ? 1 : 0), col, { align: 'center' });
  if (o.off) return false;
  if (hov) cursor = 'pointer';
  return clicked(x, y, w, h);
}

// ---------- the sight
// L-shaped corners round a box, with dark edges.
function corners(x, y, w, h, col) {
  const L = 3;
  ctx.fillStyle = '#07080a';
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w - 1, y, -1, 1], [x, y + h - 1, 1, -1], [x + w - 1, y + h - 1, -1, -1]]) {
    ctx.fillRect(Math.min(cx, cx + sx * (L - 1)) - 1, cy - 1, L + 2, 3);
    ctx.fillRect(cx - 1, Math.min(cy, cy + sy * (L - 1)) - 1, 3, L + 2);
  }
  ctx.fillStyle = col;
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w - 1, y, -1, 1], [x, y + h - 1, 1, -1], [x + w - 1, y + h - 1, -1, -1]]) {
    ctx.fillRect(Math.min(cx, cx + sx * (L - 1)), cy, L, 1);
    ctx.fillRect(cx, Math.min(cy, cy + sy * (L - 1)), 1, L);
  }
}
const TICKS = [[-8, 0, 5, 1], [4, 0, 5, 1], [0, -8, 1, 5], [0, 4, 1, 5]];
function drawSight() {
  const x = Math.round(G.aimSX), y = Math.round(G.aimSY);
  // lock brackets: they slide to the locked zombie and close round it
  const z = G.lock;
  if (z && !z.dead) {
    const S = z.S, w = S.walk[0].n.width + 4, h = S.h + 4;
    const tx = z.x - G.camX - S.ax - 2, ty = z.y - G.camY - S.ay - 2;
    const b = G.box || (G.box = { x: x - 14, y: y - 14, w: 28, h: 28 });
    const k = 1 - Math.exp(-frameDt * 28);
    b.x += (tx - b.x) * k;
    b.y += (ty - b.y) * k;
    b.w += (w - b.w) * k;
    b.h += (h - b.h) * k;
    corners(Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h), thermal ? '#ffffff' : '#ff5a3a');
  } else G.box = null;
  // the sight: 4 ticks round a gap and a dot, with dark edges so it reads on any ground
  const col = G.overheat ? U.red : thermal ? '#f4f4f4' : '#e8dfc8';
  ctx.fillStyle = '#07080a';
  for (const t of TICKS) ctx.fillRect(x + t[0] - 1, y + t[1] - 1, t[2] + 2, t[3] + 2);
  ctx.fillRect(x - 1, y - 1, 3, 3);
  ctx.fillStyle = col;
  for (const t of TICKS) ctx.fillRect(x + t[0], y + t[1], t[2], t[3]);
  ctx.fillRect(x, y, 1, 1);
  // hit marker: a white X when rounds hit
  if (G.hitT > 0) {
    ctx.fillStyle = '#ffffff';
    for (const d of [2, 3]) {
      ctx.fillRect(x - d, y - d, 1, 1);
      ctx.fillRect(x + d, y - d, 1, 1);
      ctx.fillRect(x - d, y + d, 1, 1);
      ctx.fillRect(x + d, y + d, 1, 1);
    }
  }
  // the 105 is loaded: a gold pip at the top right of the sight (once the 105mm is bought)
  const he = G.up.he && G.heReload <= 0;
  if (he) {
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x + 6, y - 9, 4, 4);
    ctx.fillStyle = thermal ? '#ffffff' : U.gold;
    ctx.fillRect(x + 7, y - 8, 2, 2);
  }
  // the 105 would hit the train too
  if (he && trainDist(G.camX + G.aimSX, G.camY + G.aimSY, G.tr.v * CFG.he.travel) < CFG.he.close + 4) {
    text('DANGER CLOSE', x, y + 17, U.red, { align: 'center' });
  }
  // gun heat: a small bar under the sight while the 25mm is warm
  if (G.heat > 0.15) {
    const hw = 13;
    ctx.fillStyle = '#07080a';
    ctx.fillRect(x - 7, y + 11, hw + 2, 3);
    ctx.fillStyle = G.overheat ? U.red : G.heat > 0.75 ? U.amber : '#8b919c';
    ctx.fillRect(x - 6, y + 12, Math.round(hw * G.heat), 1);
  }
}

// ---------- in play
// A weapon card: icon, name (nc = its colour), a tag on the right (the key, READY, a %...) and a bar.
function card(x, y, w, h, icon, name, tag, tagc, f, fc, nc) {
  ctx.fillStyle = 'rgba(12,13,17,0.86)';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  frame(x, y, w, h, '#2e3139');
  ctx.fillStyle = '#1c1e24';
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  ctx.drawImage(icon, x + 5, y + Math.round((h - icon.height) / 2));
  text(name, x + 17, y + 5, nc || U.ink);
  text(tag, x + w - 5, y + 5, tagc, { align: 'right', outline: false });
  bar(x + 17, y + 16, w - 23, 4, f, '#1a1716', fc);
}
function drawHUD() {
  ctx.fillStyle = 'rgba(6,7,9,0.88)';
  ctx.fillRect(0, 0, W, 18);
  ctx.fillStyle = '#24272e';
  ctx.fillRect(0, 18, W, 1);
  // this run's scrap: the bolt hops and the number flashes when scrap comes in
  const cp = G.cashPulse;
  blit(ICON.scrap, 4, 4 - (cp > 0.5 ? 1 : 0));
  text(fmt(G.shownCash), 14, 6, cp > 0 ? '#ffe39a' : U.gold);
  // survivors aboard this run, and kills
  blit(ICON.surv, 58, 5);
  text(G.surv, 67, 6, G.surv ? U.green : U.faint);
  blit(ICON.skull, 88, 5);
  text(fmt(G.kills), 98, 6 - (G.killBump > 0.5 ? 1 : 0), U.ink);
  // the train's health: green, then amber, then red; the part just lost shows pale for a moment
  const tr = G.tr, f = tr.hp / tr.max, hx = 150, hw = clamp(Math.round(W * 0.16), 44, 100);
  blit(ICON.train, hx - 12, 5);
  bar(hx, 6, hw, 6, tr.hpShown / tr.max, '#1a1716', '#d8cfb8');
  ctx.fillStyle = f < 0.35 ? '#b8402e' : f < 0.65 ? '#c9862f' : '#6f9a4f';
  ctx.fillRect(hx, 6, Math.round(hw * clamp(f, 0, 1)), 6);
  ctx.fillStyle = f < 0.35 ? '#e06a4f' : f < 0.65 ? '#e8b05a' : '#9cc777';
  ctx.fillRect(hx, 6, Math.round(hw * clamp(f, 0, 1)), 1);
  // and as a number
  text(Math.ceil(tr.hp), hx + hw + 4, 6, f < 0.35 ? U.red : f < 0.65 ? U.amber : U.dim);
  if (!G.demo) drawRoute(hx + hw + 30, W - 28);
  if (mode === 'play' && button(W - 23, 1, 21, 16, paused ? '>' : 'II')) setPaused(!paused);
  if (Au.muted) text('MUTE', W - 4, 22, U.faint, { align: 'right' });
}
// What comes next up the line, for the top bar: [text, color]. A Dead Wall within 150 m comes
// first; then the next station; past the last one, the safe zone.
function nextLabel() {
  const k = DK(), st = G.station;
  for (const w of G.walls) {
    const m = w.km - k;
    if (m < 0.15 && m > -CFG.wall.len / CFG.line.km) return [m > 0.005 ? 'DEAD WALL ' + fmtM(m) : 'DEAD WALL!', U.red];
  }
  if (st && st.state === 'hold') return ['AT ' + st.name, U.green];
  if (st) return ['NEXT: ' + st.name + ' ' + fmtM(Math.max(0, kmAt(st.s) - k)), U.blue];
  return ['SAFE ZONE ' + fmtM(Math.max(0, CFG.line.end - k)), U.green];
}
// The route from the Depot (0 km) to the safe zone wall, between x0 and x1 on the top bar: the
// stations (blue, green once reached), the Dead Walls (red), your best (a white tick), this run's
// ride (gold), the train, and what comes next.
function drawRoute(x0, x1) {
  let [lab, lc] = nextLabel();
  let lw = tw(lab), w = x1 - x0 - lw - 20;
  if (w < 60 && lab.startsWith('NEXT: ')) {
    lab = lab.slice(6);
    lw = tw(lab);
    w = x1 - x0 - lw - 20;
  }
  text(lab, x1, 6, lc, { align: 'right' });
  if (w < 40) return;
  const end = CFG.line.end, X = (k) => x0 + Math.round(w * clamp(k / end, 0, 1)), y = 9;
  ctx.fillStyle = '#3a3e48';
  ctx.fillRect(x0, y, w, 1);
  for (let k = 1; k < end; k++) ctx.fillRect(X(k), y - 1, 1, 3);
  // this run's ride
  const k0 = kmAt(G.tr.startS), k1 = DK();
  ctx.fillStyle = '#b8862f';
  ctx.fillRect(X(k0), y, Math.max(0, X(k1) - X(k0)), 1);
  // the walls, the best, the stations, the safe zone flag
  for (const wl of WALLS) {
    ctx.fillStyle = '#07080a';
    ctx.fillRect(X(wl.km) - 2, y - 3, 5, 7);
    ctx.fillStyle = U.red;
    ctx.fillRect(X(wl.km) - 1, y - 2, 3, 5);
  }
  if (SAVE.best > 0) {
    ctx.fillStyle = '#07080a';
    ctx.fillRect(X(SAVE.best) - 1, y - 5, 3, 11);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(X(SAVE.best), y - 4, 1, 9);
  }
  for (const d of STATIONS) {
    const sx = X(d.km), live = G.stops.find((s) => s.id === d.id);
    const got = SAVE.reached.includes(d.id) || (live && live.state !== 'ahead' && live.state !== 'braking');
    ctx.fillStyle = '#07080a';
    ctx.fillRect(sx - 2, y - 4, 5, 9);
    ctx.fillStyle = got ? U.green : U.blue;
    ctx.fillRect(sx - 1, y - 3, 3, 7);
  }
  blit(ICON.flag, X(end) + 3, 3);
  // the train: a pale block that blinks while it stands at a station
  const tx = X(k1), stop = G.station && G.station.state === 'hold';
  ctx.fillStyle = '#07080a';
  ctx.fillRect(tx - 2, y - 3, 5, 7);
  ctx.fillStyle = stop && Math.floor(realT * 3) % 2 ? U.green : '#e8dfc8';
  ctx.fillRect(tx - 1, y - 2, 3, 5);
}
// warnings under the top bar: the dead on the track or on the train, the helicopter too far away,
// the station hold
function drawWarnings() {
  if (G.result) return;
  const red = Math.floor(realT * 3) % 2 === 0 ? U.red : '#a8241a', st = G.station, L = [];
  if (G.blocked) L.push(['THE DEAD ARE ON THE TRACK AHEAD' + (G.railAhead >= 4 && ramState() === 'ready' ? '  (E: RAM)' : ''), red]);
  if (G.onTrain > 0) L.push([G.onTrain + (G.onTrain > 1 ? ' ZOMBIES' : ' ZOMBIE') + ' ON THE TRAIN', red]);
  if (G.heli.far) L.push(['RADIO RANGE LIMIT  (F: BACK)', U.amber]);
  if (st && st.state === 'hold' && st.blockedT > 0.6) L.push(['CLEAR THE DEAD FROM THE STATION DOOR', U.amber]);
  // the station hold bar comes first (stationtab.js), under the task box when they would touch;
  // then the lines, beside the task box or under it (tut.js)
  const b = taskBox();
  const y = drawHoldBar(b && holdNow() && b[0] > W / 2 - 114 ? b[1] + 4 : 24);
  const [wx, wy] = warnAt(L);
  L.forEach(([t, c], i) => text(t, wx, Math.max(wy, y) + i * 10, c, { align: 'center' }));
}
// An arrow on the edge of the screen pointing at (wx, wy) in the world when that is out of view,
// with a label just inside it.
function edgeArrow(wx, wy, col, label) {
  const sx = wx - G.camX, sy = wy - G.camY;
  if (sx > 8 && sx < W - 8 && sy > 26 && sy < H - 8) return false;
  // the arrows keep inside a frame below the warnings: x 12..W-12, y 62..H-12
  const cx = W / 2, cy = (62 + H - 12) / 2, hw = W / 2 - 12, hh = (H - 74) / 2;
  const dx = sx - cx, dy = sy - cy, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const t = Math.min(hw / Math.max(1e-6, Math.abs(dx)), hh / Math.max(1e-6, Math.abs(dy)));
  const ax = Math.round(cx + dx * t), ay = Math.round(cy + dy * t);
  // a small triangle, tip toward the target, with a dark edge
  for (const [c, g] of [['#07080a', 1], [col, 0]]) {
    ctx.fillStyle = c;
    for (let py = -6; py <= 6; py++) for (let px = -6; px <= 6; px++) {
      const a = px * ux + py * uy, b = -px * uy + py * ux;
      if (a <= 4 + g && a >= -3 - g && Math.abs(b) <= (4 - a) * 0.62 + g * 0.9) ctx.fillRect(ax + px, ay + py, 1, 1);
    }
  }
  // the label just inside the arrow: beside it on the left and right edges, under or over it on
  // the top and bottom
  if (label) {
    const w = tw(label), side = Math.abs(dx) * hh > Math.abs(dy) * hw;

// Arrows to the train, and to trouble out of view: the dead on a car, on the track ahead, after a
// survivor.
const ON_CAR = [0, 0, 0, 0, 0];
function drawArrows() {
  drawLootUI();
  // (at PRESS E! the view shows the engine's nose and the wall ahead: that is enough of the train)
  const tr = G.tr, c = G.prompt ? { cx: tr.cars[0].x0, cy: tr.cars[0].y0 } : tr.cars[2];
  ON_CAR.fill(0);
  let rail = null, rd = 1e9;
  for (const z of G.zombies) {
    if (z.dead) continue;
    if (z.st === 2) ON_CAR[z.car]++;
    else if (z.st === 1) {
      const ds = tr.s - trackLocal(z.x, z.y, TL).a;
      if (ds > 0 && ds < 300 && ds < rd) { rd = ds; rail = z; }
    }
  }
  // the train (its middle): gold, red with a count when the dead are on it; or, when the train is
  // in view, an arrow to any car under attack that is not
  const n = G.result ? 0 : G.onTrain;
  if (!edgeArrow(c.cx, c.cy, n ? U.red : U.gold, 'TRAIN ' + Math.round(Math.hypot(c.cx - G.camX - W / 2, c.cy - G.camY - H / 2) / 2) + 'M' + (n ? '  ' + n + '!' : ''))) {
    if (!G.result) ON_CAR.forEach((m, k) => { if (m) edgeArrow(tr.cars[k].cx, tr.cars[k].cy, U.red, m + '!'); });
  }
  if (G.result) return;
  if (rail) edgeArrow(rail.x, rail.y, U.red, 'TRACK');
  const held = G.people.find((p) => p.st === 'grab'), out = G.people.find((p) => p.st === 'run');
  if (held) edgeArrow(held.x, held.y, U.red, 'HELP');
  else if (out) edgeArrow(out.x, out.y, '#8fd18a', 'SURVIVOR');
}
// The radar: the land round the helicopter, 1280 px across, north up. The railway, the train,

// and the view.
function drawRadar() {
  const R = 36, x0 = W - R * 2 - 6, y0 = H - R * 2 - 6, cx = x0 + R, cy = y0 + R, k = R / 640;
  const hx = G.camX + W / 2, hy = G.camY + H / 2;

  ctx.fillRect(cx, y0, 1, R * 2);
  ctx.fillRect(x0, cy, R * 2, 1);

    const px = Math.round(cx + (wx - hx) * k), py = Math.round(cy + (wy - hy) * k);
    if (px < x0 || py < y0 || px > x0 + R * 2 - s || py > y0 + R * 2 - s) return;

  for (const z of G.zombies) if (!z.dead) dot(z.x, z.y, z.st ? '#ff4a32' : '#7a2a22', 1);

  if (realT % 0.5 < 0.32) for (const z of G.zombies) if (z.gold && !z.dead) dot(z.x - 1, z.y - 1, '#ffd24a', 2);
  for (const p of G.people) if (p.st === 'run' || p.st === 'wait' || p.st === 'grab') dot(p.x, p.y, '#8fd18a', 1);

const RAMCARD = { x: 0, y: 0, w: 106, h: 26, on: false };
function drawRamCard(x, y) {
  const r = G.ram, C = RAMCARD, R = CFG.ram;
  // (just after the first run's taste the card shows it spent, until the boiler cracks)
  let s = ramState();
  if (s === 'lock' && r.taste && r.crack < 0) s = 'charge';
  C.on = s !== 'none';
  if (!C.on) return;
  C.x = x;

  const w = C.w, h = C.h, fl = realT - r.flash, ck = realT - r.crack;

  if (fl < 0.2) y--;

  if (s === 'on') [tag, tagc, f, fc] = ['GO!', Math.floor(realT * 8) % 2 ? '#ffe39a' : U.amber, 1 - r.t / (r.dur + R.ease), '#ff8a3a'];
  else if (s === 'ready') [tag, tagc, f, fc] = ['E', U.gold, 1, '#e3b04b'];
  else if (s === 'charge') [tag, tagc, f, fc] = [Math.floor(ramCharge() * 100) + '%', U.dim, ramCharge(), '#8a6a3a'];
  else if (s === 'stop') [tag, tagc, f, fc, nc, icon] = ['STOP', U.faint, ramCharge(), '#3a3e48', U.faint, ICON.ramOff];
  else [tag, tagc, f, fc, nc, icon] = ['TREE', U.dim, 0, '#3a3e48', U.faint, ICON.lock];
  card(x, y, w, h, icon, 'TURBO RAM', tag, tagc, f, fc, nc);

  if (s === 'ready' || s === 'on') frame(x, y, w, h, s === 'on' ? '#c96a2a' : '#b8862f');

    ctx.globalAlpha = 1 - fl / 0.5;

// After the run: how it ended, then what it paid, row by row. Each row counts up with a tick, then
// the total, the survivors (an icon each), NEW BEST, a near miss, and the way back to the Depot.
// The times (s after the summary opens) are worked out once; sounds play as each time passes.
function sumPlan(s) {
  // [label, scrap, a short note on how it pays]
  const p = s.pay, rows = [['ZOMBIES ' + fmt(s.kills), p.kills, ''],
    ['DISTANCE ' + s.ride.toFixed(2) + ' KM', p.dist, '+1 PER ' + CFG.pay.dist / 2 + ' M']];
  if (p.stop) rows.push(['STATION', p.stop, s.stops.join(' + ')]);
  if (p.loot) rows.push(['LOOT', p.loot, '']);
  const t = rows.map((r, i) => 0.55 + i * 0.32), total = t[t.length - 1] + 0.45, surv = total + 0.7;
  const icons = Math.min(s.surv, 12), best = surv + (s.surv ? icons * 0.14 + 0.25 : 0) + 0.15;
  const ev = t.map((x) => [x, 'tick']).concat([[total, 'total']]);
  for (let i = 0; i < icons; i++) ev.push([surv + i * 0.14, 'saved']);
  if (s.newBest) ev.push([best, 'best']);
  return { rows, t, total, surv, icons, best, lines: best + 0.3, end: best + 0.5, ev };
}

// ---------- the UI for the current mode
function drawUI() {
  if (mode === 'title') {

    drawBanners();
    return;
  }
  if (mode === 'depot') {
    drawDepot();
    return;
  }
  const run = mode === 'play' || mode === 'ending';
  if (run) drawSpeedLines();
  drawHUD();
  drawCoins();
  if (run) {
    drawWarnings();
    drawRadar();
    drawWeapons();
    drawRadio();
    drawTut();
    // (the arrows under the banners, so a banner is never cut by an arrow's label)
    drawArrows();
    drawBanners();

// depot.js - the save, and the Depot: the screen between runs. SAVE is everything kept from run to
// run, one object in this browser's storage. The Depot screen has a top bar (your scrap and
// survivors, the SKILL TREE and STATION tabs, your best km), the open tab's panel, and a bottom bar
// (where the next run starts, and START RUN). The title demo keeps running behind it, dimmed.

// ---------- the save
const SAVE_KEY = 'sky-reaper-save-1', SAVE_V = 1;
// v = version. scrap, surv = money. nodes = skill tree levels by node id. towers, house = what is
// built at each station, and the survivors waiting in each station house. reached = stations the
// train has stopped at (a run can start there), held = stations held at least once. best = the
// furthest km. runs = runs started. start = where the next run starts. seen = tutorial prompts
// already shown. flags = one-off things done.
function freshSave() {
  return {
    v: SAVE_V, scrap: 0, surv: 0, nodes: {}, towers: {}, house: {}, reached: [], held: [], best: 0, runs: 0,
    start: 'depot', seen: {}, flags: {}
  };
}
let SAVE = freshSave();
// Read the save. A missing, broken or older one starts fresh. True when a save was found.
function loadSave() {
  SAVE = freshSave();
  let o = null;
  try {
    o = JSON.parse(localStorage.getItem(SAVE_KEY));
  } catch (e) {
    o = null;
  }
  if (!o || typeof o !== 'object' || o.v !== SAVE_V) return false;
  const num = (v) => (typeof v === 'number' && isFinite(v) && v > 0 ? v : 0);
  const obj = (m) => (m && typeof m === 'object' && !Array.isArray(m) ? m : {});
  const ids = (a) => (Array.isArray(a) ? a.filter((id, i) => STATIONS.some((d) => d.id === id) && a.indexOf(id) === i) : []);
  SAVE.scrap = Math.floor(num(o.scrap));
  SAVE.surv = Math.floor(num(o.surv));
  SAVE.best = num(o.best);
  SAVE.runs = Math.floor(num(o.runs));
  SAVE.reached = ids(o.reached);
  SAVE.held = ids(o.held);
  // a station held is a station reached
  for (const id of SAVE.held) if (!SAVE.reached.includes(id)) SAVE.reached.push(id);
  SAVE.start = typeof o.start === 'string' && stopDef(o.start) ? o.start : 'depot';
  // skill tree levels: known nodes only, never above their top level
  for (const [k, v] of Object.entries(obj(o.nodes))) if (num(v) && NODE[k]) SAVE.nodes[k] = Math.min(maxLv(NODE[k]), Math.floor(v));
  SAVE.towers = obj(o.towers);
  SAVE.house = obj(o.house);
  SAVE.seen = obj(o.seen);
  SAVE.flags = obj(o.flags);
  return true;
}
function saveSave() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
  } catch (e) { /* no storage: progress lasts until the page closes */ }
}
// Wipe everything and start over.
function newSave() {
  SAVE = freshSave();
  saveSave();
  resetTree();
}
// true once there is something to lose (the title then offers CONTINUE and NEW GAME)
const hasProgress = () => SAVE.runs > 0 || SAVE.scrap > 0 || SAVE.surv > 0 || Object.keys(SAVE.nodes).length > 0;
// the level of skill tree node id (0 = not bought)
const lv = (id) => SAVE.nodes[id] | 0;
// the STATION tab opens once Farm Stop has been held
const stationOpen = () => SAVE.held.includes(STATIONS[0].id);
// The starts on offer: the Depot, then every station reached, up the line.
function startsOpen() {
  return ['depot'].concat(STATIONS.filter((d) => SAVE.reached.includes(d.id)).map((d) => d.id));
}
function pickStart(dir) {
  const list = startsOpen(), i = Math.max(0, list.indexOf(SAVE.start));
  if (list.length < 2) return;
  SAVE.start = list[mod(i + dir, list.length)];
  saveSave();
  SFX.ui();
}

// ---------- the Depot screen
// depotTab = the open tab: 'tree' or 'station'
let depotTab = 'tree';
// Go to the Depot (from the title the demo behind it goes on; after a run a new one starts).
function toDepot(tab) {
  if (!G || !G.demo) newGame(true);
  mode = 'depot';

  SHOWN.scrap = SHOWN.surv = -1;
  if (tab) setTab(tab);

}
function setTab(t) {

    saveSave();
  }
}
// Keys on the Depot screen: TAB switches tabs, ENTER starts, left / right pick the start, ESC goes
// back to the title. (On the Station tab, 1-3 pick a tower and ESC first drops it.)
function depotKey(k) {
  if (depotTab === 'station' && stationKey(k)) return;
  if (k === 'Tab') {
    setTab(depotTab === 'tree' ? 'station' : 'tree');
    SFX.ui();
  } else if (k === 'Enter') startGame(SAVE.start);
  else if (k === 'ArrowLeft') pickStart(-1);
  else if (k === 'ArrowRight') pickStart(1);

}
function drawDepot() {

// A small box of words by the mouse, for the thing it points at. tipAt(x, y, w, h, lines) asks for
// one this frame when the mouse is in that box (lines = [[text, color], ...]); it is drawn last.
const TIP = { lines: null };
function tipAt(x, y, w, h, lines) {

}
function drawTip() {
  const L = TIP.lines, w = Math.max(...L.map((l) => tw(l[0]))) + 12, h = L.length * 10 + 5;
  const x = clamp(Math.round(M.x + 8), 2, W - w - 2), y = clamp(Math.round(M.y + 12), 20, H - h - 30);

// A tab in the top bar: gold and open at the bottom when it is the open one. Returns true on a click.
function depotTabBtn(x, w, label, on, locked, isNew) {
  const y = 2, h = 17, hov = inR(M.x, M.y, x, y, w, h);
  ctx.fillStyle = on ? '#16171c' : hov ? '#1a1c22' : '#0f1014';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 1);
  ctx.fillStyle = on ? '#b8862f' : hov ? '#6a6f7b' : '#2e3139';
  ctx.fillRect(x + 1, y, w - 2, 1);
  ctx.fillRect(x, y + 1, 1, h - 1);
  ctx.fillRect(x + w - 1, y + 1, 1, h - 1);
  if (on) {
    ctx.fillStyle = 'rgba(227,176,75,0.16)';
    ctx.fillRect(x + 1, y + 1, w - 2, 1);
  }
  const col = on ? U.gold : locked ? U.faint : hov ? U.ink : U.dim, lw = tw(label);
  // the label in the middle (with a padlock before it, or a gold NEW tag after it)
  const tag = isNew ? 24 : 0, iw = locked ? ICON.lock.width + 3 : 0, lx = Math.round(x + w / 2 - (iw + lw + tag) / 2);
  if (locked) {
    ctx.globalAlpha = on ? 1 : 0.7;
    blit(ICON.lock, lx, y + 4);
    ctx.globalAlpha = 1;
  }
  text(label, lx + iw, y + 6, col);
  if (isNew) {
    const nx = lx + iw + lw + 5;
    ctx.fillStyle = U.gold;
    ctx.fillRect(nx, y + 5, 19, 9);
    text('NEW', nx + 10, y + 6, '#1a1206', { align: 'center', outline: false });

}
// The money as the top bar shows it: after a buy it counts down to the real number.
const SHOWN = { scrap: -1, surv: -1 };
function countMoney() {
  const k = 1 - Math.exp(-9 * frameDt);
  for (const key of ['scrap', 'surv']) {
    const v = SAVE[key];
    SHOWN[key] = SHOWN[key] < 0 || Math.abs(SHOWN[key] - v) < 0.5 ? v : SHOWN[key] + (v - SHOWN[key]) * k;
  }
}
function drawDepotTop() {

  const cs = sv !== SAVE.surv, cc = Math.round(SHOWN.scrap) !== SAVE.scrap;

  blit(ICON.surv, sx, 5 - (cs ? 1 : 0));

  tipAt(sx - 2, 0, ew + 6, 18, [['SURVIVORS', U.green], ['SAVE THEM AT STATIONS.', U.dim], ['THEY BUY THE BIGGEST UPGRADES.', U.dim]]);

// the first ring: one exciting node per branch, right round LAST TRAIN
const FIRST = ['chain', 'cow', 'goldz'];
const maxLv = (n) => n.cost.length;
const parentOf = (n) => (n.needs ? NODE[n.needs[0]] : null);
const needsMet = (n) => !n.needs || lv(n.needs[0]) >= n.needs[1];
// the price of the next level, and whether you can pay it
const priceOf = (n) => n.cost[Math.min(lv(n.id), maxLv(n) - 1)];
const canPay = (n) => (n.cur === 'surv' ? SAVE.surv : SAVE.scrap) >= priceOf(n);
// "ARMOR 1", "RADIO RANGE 2": a node at a level, as NEEDS: and the goal line say it
const nodeLv = (id, l) => NODE[id].name + (maxLv(NODE[id]) > 1 ? ' ' + l : '');
// What a node is now:
//  'off'    not on the map yet (until LAST TRAIN is bought only it shows)
//  'hidden' a '?': what it grows from has no level yet (or it is from later in the game)
//  'locked' FARM STOP before Farm Stop is held
//  'soon'   shown with its price, not for sale yet
//  'goal'   a * node whose needs are not met yet
//  'poor'   for sale, but you cannot pay
//  'buy'    for sale, and you can pay
//  'max'    every level bought
function nodeState(n) {
  if (n.id !== 'root' && !lv('root')) return 'off';
  if (n.later) return 'hidden';
  if (lv(n.id) >= maxLv(n)) return 'max';
  if (n.given) return 'locked';
  if (n.star) {
    if (n.br === 'station' && !stationOpen()) return 'hidden';
    if (n.soon) return 'soon';
    if (!needsMet(n)) return 'goal';
  } else if (!needsMet(n)) return 'hidden';
  return canPay(n) ? 'buy' : 'poor';
}
// 0 = not on the map, 1 = a '?', 2 = shown
const shownAs = (n) => ({ off: 0, hidden: 1 })[nodeState(n)] ?? 2;

// ---------- buying
// TREE = the panel's state: born[id] = when its line starts to grow (the node pops in 0.3 s later),
// pop[id] = when it popped in (a NEW tag shows for 3 s), lit[id] = when its line lit up, flash[id]
// = its last buy, shake[id] = a click that could not buy, rings and floats after a buy, sel = the
// last node clicked, hov = the node under the mouse, pan = how far the map is dragged (small windows).
const TREE = {};
function resetTree() {
  Object.assign(TREE, { born: {}, pop: {}, lit: {}, flash: {}, shake: {}, rings: [], floats: [], sel: null, hov: null,
    pan: { x: 0, y: 0 }, drag: null, lastBuy: -9 });
}
resetTree();
const GROW = 0.3;
// Buy one level of node id. True when it was bought. It is saved at once.
function buyNode(id) {
  const n = NODE[id];
  if (!n || nodeState(n) !== 'buy') return false;
  const before = NODES.map(shownAs), p = priceOf(n);
  if (n.cur === 'surv') SAVE.surv -= p;
  else SAVE.scrap -= p;
  SAVE.nodes[id] = lv(id) + 1;
  saveSave();
  boughtFx(n, p);
  grew(before);
  SFX.buy(n.star || n.id === 'root');
  return true;
}
// The look of a buy: a white flash, a gold ring growing out, the price floating up, the line lit.
function boughtFx(n, p) {
  TREE.flash[n.id] = realT;
  TREE.rings.push({ id: n.id, t: realT });
  if (p) TREE.floats.push({ id: n.id, s: '-' + fmt(p), c: n.cur === 'surv' ? U.green : U.gold, t: realT });
  if (lv(n.id) === 1) TREE.lit[n.id] = realT;
}
// After a change: nodes that just came onto the map grow their line, one after another outward;
// a '?' that just showed what it is pops in with a NEW tag.
function grew(before) {
  NODES.forEach((n, i) => {
    const now = shownAs(n), was = before[i];
    if (now === was) return;
    if (was === 0) {
      const p = parentOf(n), pb = p ? TREE.born[p.id] : null;
      TREE.born[n.id] = pb != null && pb >= realT ? pb + GROW : realT;
    }
    if (now === 2) TREE.pop[n.id] = was === 0 ? TREE.born[n.id] + GROW : realT;
  });
}
// FARM STOP is given by holding Farm Stop: hand it over (with the buy look) once that has happened.
function syncGiven() {
  const n = NODE.farm;
  if (!stationOpen() || lv(n.id)) return;
  const before = NODES.map(shownAs);
  SAVE.nodes[n.id] = 1;
  saveSave();
  boughtFx(n, 0);
  grew(before);
}
// Set a node's level (tests): no price, no show.
function setNode(id, l) {
  const n = NODE[id];
  if (!n) return false;
  l = clamp(l | 0, 0, maxLv(n));
  if (l) SAVE.nodes[id] = l;
  else delete SAVE.nodes[id];
  saveSave();
  return true;
}

// ---------- the goal line under the summary
// The cheapest * node you can work toward ("NEXT GOAL: RAIL CANNON (300 SCRAP)"), with "YOU CAN BUY
// IT NOW!" when you can, or what it needs first. Once no * node is left, the cheapest next level.
// [[text, colour], ...]
function summaryGoal() {
  if (!lv('root')) return [["NEXT: OPEN THE SKILL TREE. IT'S FREE.", U.gold]];
  const unit = (n) => (n.cur === 'surv' ? ' SURVIVORS' : ' SCRAP');
  const price = (n) => (priceOf(n) ? fmt(priceOf(n)) + unit(n) : 'FREE');
  // how close you are: "YOU HAVE 120 / 300 SCRAP."
  const have = (n) => ['YOU HAVE ' + fmt(n.cur === 'surv' ? SAVE.surv : SAVE.scrap) + ' / ' + fmt(priceOf(n)) + unit(n) + '.', U.dim];
  const order = (a, b) => (a.cur === 'surv') - (b.cur === 'surv') || priceOf(a) - priceOf(b);
  const pickOf = (list, st) => list.filter((n) => st.includes(nodeState(n))).sort(order)[0];
  // the first ring (CHAIN SHOT, COW CATCHER, GOLDEN ZOMBIES) until each has a level: one you can
  // buy now first, else the cheapest
  const first = FIRST.map((id) => NODE[id]).filter((n) => !lv(n.id));
  const f1 = pickOf(first, ['buy']) || pickOf(first, ['poor']);
  if (f1) return [['NEXT GOAL: ' + f1.name + ' (' + price(f1) + ')', U.gold],
    nodeState(f1) === 'buy' ? ['YOU CAN BUY IT NOW!', U.green] : have(f1)];
  const stars = NODES.filter((n) => n.star), rest = NODES.filter((n) => !n.star && !n.given);
  const ready = pickOf(stars, ['buy']), goal = ready || pickOf(stars, ['poor', 'goal']);
  if (goal) {
    const L = [['NEXT GOAL: ' + goal.name + ' (' + price(goal) + ')', U.gold]];
    if (ready) L.push(['YOU CAN BUY IT NOW!', U.green]);
    else if (!needsMet(goal)) L.push(['IT NEEDS ' + nodeLv(goal.needs[0], goal.needs[1]) + ' FIRST.', U.dim]);
    else L.push(have(goal));
    return L;
  }
  const next = pickOf(rest, ['buy']) || pickOf(rest, ['poor']);
  if (!next) return [];
  const L = [['NEXT GOAL: ' + nodeLv(next.id, lv(next.id) + 1) + ' (' + price(next) + ')', U.gold]];
  L.push(nodeState(next) === 'buy' ? ['YOU CAN BUY IT NOW!', U.green] : have(next));
  return L;
}
// The Depot's bottom bar on the tree tab: what to do here, or null.
function treeHint() {
  if (!lv('root')) return ["CLICK THE TRAIN. IT'S FREE.", U.gold];
  if (NODES.some((n) => nodeState(n) === 'buy')) return ['CLICK A GOLD NODE TO BUY IT.', U.ink];
  return null;
}

// ---------- the map
// The cells: 32 px apart, or closer on a small window so the whole map still fits (down to 26 px
// across and 24 down; on a window smaller still, the map can be dragged). SPAN = the columns and
// rows in use. PAD = the room round the outer nodes: half a node at the sides and the top, and the
// pips, the price and the gold corners under the bottom one.
const CELL = 32;
const SPAN = (() => {
  const cs = NODES.map((n) => n.c), rs = NODES.map((n) => n.r);
  return { c0: Math.min(...cs), c1: Math.max(...cs), r0: Math.min(...rs), r1: Math.max(...rs) };
})();
const PAD = { x: 16, top: 15, bot: 31 };
// The root's place on screen and the gaps between cells. The map sits round the middle of the panel
// (half a cell left, as the right side has more nodes); on a window too small for it, it can be
// dragged (or moved with WASD) and TREE.pan says how far.
// Returns [x, y, can pan across, can pan up and down, gap across, gap down].
function treeOrigin() {
  const y0 = 19, y1 = H - 29, P = TREE.pan;
  // the panel's room for the map: 8 px in from each side, 4 under the top bar, 2 over the bottom one
  const cx = clamp(Math.floor((W - 16 - PAD.x * 2) / (SPAN.c1 - SPAN.c0)), 26, CELL);
  const cy = clamp(Math.floor((y1 - y0 - 6 - PAD.top - PAD.bot) / (SPAN.r1 - SPAN.r0)), 24, CELL);
  // one axis: the map from a to b (round the root) inside lo..hi. It sits at want when it fits;
  // else the pan moves it, and the pan is kept so the map's edges stay on screen.
  const fit = (lo, hi, a, b, want, k) => {
    const top = hi - b, bot = lo - a;
    if (bot <= top) {
      P[k] = 0;
      return [Math.round(clamp(want, bot, top)), 0];
    }
    const o = clamp(want + P[k], top, bot);
    P[k] = o - want;
    return [Math.round(o), 1];
  };
  const [ox, px] = fit(8, W - 8, SPAN.c0 * cx - PAD.x, SPAN.c1 * cx + PAD.x, W / 2 - cx / 2, 'x');
  const [oy, py] = fit(y0 + 4, y1 - 2, SPAN.r0 * cy - PAD.top, SPAN.r1 * cy + PAD.bot, (y0 + y1) / 2, 'y');
  return [ox, oy, px, py, cx, cy];
}
// where node id is on screen (with the tree tab open)
function nodeXY(id) {
  const n = NODE[id];
  if (!n) return null;
  const [ox, oy, , , cx, cy] = treeOrigin();
  return { x: ox + n.c * cx, y: oy + n.r * cy };
}
// half the size of a node's square: a * node is 26 px, the others 22
const halfOf = (n) => (n.star ? 13 : 11);
// How far below its middle a node's pips and price reach (px).
const below = (n, st) => halfOf(n) + (st === 'hidden' || st === 'max' || st === 'locked' ? 0 : 3 + (maxLv(n) > 1 ? 5 : 0) + 9);
// When a node shows up on the map (after its line has grown); 0 = it was always there.
const appearAt = (n) => (TREE.born[n.id] != null ? TREE.born[n.id] + GROW : 0);

// The SKILL TREE tab, between y0 and y1.
const RECTS = [];
function drawTreeTab(y0, y1) {
  const can = treeOrigin();
  treeInput(y0, y1, can[2] || can[3]);
  const [ox, oy, canX, canY, cx, cy] = treeOrigin();
  TREE.y0 = y0;
  // the panel: darker than the Depot round it, with a faint dot at every cell
  ctx.fillStyle = 'rgba(6,7,9,0.42)';
  ctx.fillRect(0, y0, W, y1 - y0);
  // nothing on the map draws over the top or bottom bar
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y0, W, y1 - y0);
  ctx.clip();
  ctx.fillStyle = 'rgba(232,223,200,0.06)';
  for (let y = mod(oy + cy / 2 - y0, cy) + y0; y < y1; y += cy) for (let x = mod(ox + cx / 2, cx); x < W; x += cx) ctx.fillRect(x, y, 1, 1);
  const pos = (n) => [ox + n.c * cx, oy + n.r * cy];
  // which nodes show (vis[id] = its state), and their boxes (the info box must not cover one)
  let vis = {};
  const layout = () => {
    RECTS.length = 0;
    vis = {};
    for (const n of NODES) {
      const st = nodeState(n);
      if (st === 'off' || realT < appearAt(n)) continue;
      vis[n.id] = st;
      // [x, y, w, h, how bad it is to cover it: a '?' least, a node you can buy most]
      const [x, y] = pos(n), h = halfOf(n);
      RECTS.push([x - h - 2, y - h - 2, h * 2 + 4, h + below(n, st) + 4, st === 'hidden' ? 1 : st === 'buy' ? 5 : 3]);
    }
  };
  layout();
  // the node under the mouse
  TREE.hov = null;
  if (!TREE.drag && M.inside && M.y >= y0 && M.y < y1) {
    for (const n of NODES) {
      if (!vis[n.id]) continue;
      const [x, y] = pos(n), h = halfOf(n) + 2;
      if (inR(M.x, M.y, x - h, y - h, h * 2, h * 2)) TREE.hov = n;
    }
  }
  if (TREE.hov) cursor = 'pointer';
  else if (canX || canY) cursor = TREE.drag && TREE.drag.moved ? 'grabbing' : 'grab';
  // a click on a node: buy a level, or say no (a buzz and a shake); either way its info stays up
  const hn = TREE.hov, hh = hn ? halfOf(hn) + 2 : 0, [hx, hy] = hn ? pos(hn) : [0, 0];
  if (hn && M.released && !M.used && inR(M.px, M.py, hx - hh, hy - hh, hh * 2, hh * 2)) {
    M.used = true;
    const n = hn;
    TREE.sel = n.id;
    if (realT - TREE.lastBuy < 0.08) { /* the same click seen twice: one buy only */ }
    else if (buyNode(n.id)) {
      TREE.lastBuy = realT;
      layout();
    } else if (nodeState(n) !== 'max') {
      TREE.shake[n.id] = realT;
      SFX.deny();
    } else SFX.ui();
  }
  // the faint branch names at the far end of each branch
  ctx.globalAlpha = 0.55;
  for (const [id, br, dx, dy, al] of [['feed', 'heli', 0, 33, 'center'], ['gunspd', 'train', 0, 33, 'center'],
    ['winch', 'explore', -19, -3, 'right'], ['mortar', 'station', 19, -3, '']]) {
    if (!vis[id]) continue;
    const [x, y] = pos(NODE[id]);
    text(BRANCH[br].name, x + dx, y + dy, BRANCH[br].col, { align: al, outline: false });
  }
  ctx.globalAlpha = 1;
  // the lines, under the nodes
  for (const n of NODES) {
    const p = parentOf(n);
    if (!p || nodeState(n) === 'off' || !vis[p.id]) continue;
    const [x0, y0n] = pos(p), [x1, y1n] = pos(n), b = TREE.born[n.id];
    const f = b != null ? clamp((realT - b) / GROW, 0, 1) : 1;
    if (f <= 0) continue;
    const st = nodeState(n), base = st === 'hidden' ? '#2a2d34' : '#3e424c';
    pl(ctx, x0, y0n, lerp(x0, x1, f), lerp(y0n, y1n, f), base);
    if (lv(n.id) > 0 && !n.later) {
      const lt = TREE.lit[n.id], g = lt != null ? clamp((realT - lt) / 0.25, 0, 1) : 1;
      if (g > 0) pl(ctx, x0, y0n, lerp(x0, x1, g * f), lerp(y0n, y1n, g * f), BRANCH[n.br].col);
    }
  }
  // the node whose info shows: the one under the mouse, else the last one clicked (before the tree
  // is open, LAST TRAIN). Gold corners mark it.
  let show = TREE.hov || NODE[TREE.sel] || (!lv('root') ? NODE.root : null);
  if (show && !vis[show.id]) show = null;
  if (show) {
    const [x, y] = pos(show), h = halfOf(show) + 4, b = below(show, vis[show.id]) + 4;
    corners(x - h, y - h, h * 2 + 1, h + b + 1, U.gold);
  }
  // the very first time, LAST TRAIN glows: it is all there is, and it is free
  if (!lv('root')) {
    const [x, y] = pos(NODE.root);
    ctx.globalCompositeOperation = 'lighter';
    light(x, y, 36, '#e3b04b', 0.4 + 0.2 * Math.sin(realT * TAU));
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  // the nodes
  for (const n of NODES) if (vis[n.id]) drawNode(n, ...pos(n), vis[n.id]);
  // rings and prices from buys
  drawTreeFx(pos);
  if (show) drawInfo(show, pos(show), y0, y1);
  // on a window too small for the whole map: how to move it
  if (canX || canY) {
    const t = 'DRAG OR WASD: MOVE THE MAP', tw0 = tw(t) + 8;
    ctx.fillStyle = 'rgba(6,7,9,0.85)';
    ctx.fillRect(4, y0 + 3, tw0, 11);
    text(t, 8, y0 + 5, U.dim, { outline: false });
  }
  ctx.restore();
}
// Mouse dragging and WASD move the map on a window too small to show all of it.
function treeInput(y0, y1, can) {
  const d = TREE.drag;
  if (!can) {
    TREE.drag = null;
    return;
  }
  if (M.pressed && M.down && M.y >= y0 && M.y < y1) TREE.drag = { x: M.x, y: M.y, px: TREE.pan.x, py: TREE.pan.y, moved: false };
  else if (d && M.down) {
    if (Math.abs(M.x - d.x) + Math.abs(M.y - d.y) > 4) d.moved = true;
    if (d.moved) {
      TREE.pan.x = d.px + M.x - d.x;
      TREE.pan.y = d.py + M.y - d.y;
    }
  } else if (d) {
    // the press was a drag, not a click
    if (d.moved) M.used = true;
    TREE.drag = null;
  }
  const v = 220 * frameDt;
  if (KEYS.a) TREE.pan.x += v;
  if (KEYS.d) TREE.pan.x -= v;
  if (KEYS.w) TREE.pan.y += v;
  if (KEYS.s) TREE.pan.y -= v;
}
// One node at (x, y) in state st: its square and icon, its level pips, its price, a NEW tag.
function drawNode(n, x, y, st) {
  const B = BRANCH[n.br], l = lv(n.id), m = maxLv(n), big = !!n.star, h = halfOf(n), s = h * 2;
  // a click that could not buy shakes it
  const sk = realT - (TREE.shake[n.id] ?? -9);
  if (sk < 0.25 && !REDUCED) x += Math.round(Math.sin(sk * 70) * 2 * (1 - sk / 0.25));
  const nx = x - h, ny = y - h, hov = TREE.hov === n;
  if (st === 'hidden') {
    ctx.fillStyle = '#0c0d10';
    ctx.fillRect(nx + 1, ny + 1, s - 2, s - 2);
    frame(nx, ny, s, s, hov ? '#3e424c' : '#25282f');
    if (big) frame(nx + 2, ny + 2, s - 4, s - 4, '#1c1e24');
    text('?', x + 1, y - 3, hov ? U.faint : '#3a3e48', { align: 'center', outline: false });
    return;
  }
  const buy = st === 'buy', pulse = 0.5 + 0.5 * Math.sin(realT * TAU);
  // the body: dark, a light fill of the branch colour once every level is bought
  ctx.fillStyle = '#131419';
  ctx.fillRect(nx + 1, ny + 1, s - 2, s - 2);
  if (st === 'max') {
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = B.col;
    ctx.fillRect(nx + 1, ny + 1, s - 2, s - 2);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(nx + 2, ny + 1, s - 4, 1);
  // the frame: gold and pulsing when you can buy it, the branch colour once it has a level, grey
  // before; a * node has two
  const fc = buy ? '#c99a3e' : l > 0 ? B.col : hov ? '#5d616b' : '#3a3e48';
  frame(nx, ny, s, s, fc);
  if (big) {
    ctx.globalAlpha = 0.6;
    frame(nx + 2, ny + 2, s - 4, s - 4, fc);
    ctx.globalAlpha = 1;
  }
  if (buy) {
    ctx.globalAlpha = 0.25 + 0.65 * pulse;
    frame(nx - 1, ny - 1, s + 2, s + 2, '#ffd36a');
    ctx.globalAlpha = 1;
  } else if (hov) {
    ctx.globalAlpha = 0.5;
    frame(nx - 1, ny - 1, s + 2, s + 2, '#e8dfc8');
    ctx.globalAlpha = 1;
  }
  // the icon: dim while it is only a goal, dimmer when you cannot pay for its first level
  const ic = st === 'locked' ? ICON.lock : NICON[n.id];
  ctx.globalAlpha = st === 'goal' || st === 'soon' ? 0.6 : st === 'poor' && !l ? 0.4 : st === 'locked' ? 0.75 : 1;
  blit(ic, Math.round(x - ic.width / 2), Math.round(y - ic.height / 2));
  ctx.globalAlpha = 1;
  if (big) blit(ICON.star, nx + s - 5, ny - 2);
  // just bought: a white flash; just popped in: a softer one
  const fl = realT - (TREE.flash[n.id] ?? -9), pp = realT - (TREE.pop[n.id] ?? -9);
  const wa = Math.max(fl < 0.12 ? 1 - fl / 0.12 : 0, pp >= 0 && pp < 0.2 ? 0.8 * (1 - pp / 0.2) : 0);
  if (wa > 0) {
    ctx.globalAlpha = wa;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(nx, ny, s, s);
    ctx.globalAlpha = 1;
  }
  // the level pips under it (2 x 2 each, gold when bought)
  let ly = y + h + 3;
  if (m > 1) {
    const pw = m * 3 - 1, px = Math.round(x - pw / 2);
    ctx.fillStyle = '#07080a';
    ctx.fillRect(px - 1, ly - 1, pw + 2, 4);
    for (let i = 0; i < m; i++) {
      ctx.fillStyle = i < l ? '#e3b04b' : '#3a3e48';
      ctx.fillRect(px + i * 3, ly, 2, 2);
    }
    ly += 5;
  }
  // the price of the next level: gold (or green for survivors) when you can pay, red when you cannot
  if (st === 'buy' || st === 'poor' || st === 'goal' || st === 'soon') {
    const p = priceOf(n), surv = n.cur === 'surv';
    if (!p) text('FREE', x, ly, pulse > 0.5 ? '#ffe39a' : U.gold, { align: 'center' });
    else {
      const ok = canPay(n), col = st === 'soon' ? U.faint : !ok ? U.red : st === 'goal' ? U.dim : surv ? U.green : U.gold;
      const ps = fmt(p), iw = 7, w = iw + tw(ps), px = Math.round(x - w / 2);
      // a dark backing, so a line running under it does not cut through the numbers
      ctx.fillStyle = '#07080a';
      ctx.fillRect(px - 2, ly - 1, w + 4, 9);
      if (st === 'soon' || st === 'goal') ctx.globalAlpha = 0.8;
      blit(surv ? ICON.survS : ICON.boltS, px - 1, ly);
      text(ps, px + iw, ly, col);
      ctx.globalAlpha = 1;
    }
  }
  // NEW: a gold tag over it for 3 s after it shows up (to its left when the top bar is in the way)
  const nt = realT - (TREE.pop[n.id] ?? -9);
  if (nt >= 0 && nt < 3) {
    ctx.globalAlpha = nt > 2.6 ? (3 - nt) / 0.4 : 1;
    let tx = x - 10, ty = ny - (big ? 13 : 12);
    if (ty - 1 < (TREE.y0 ?? 0) + 1) [tx, ty] = [nx - 22, y - 4];
    ctx.fillStyle = '#07080a';
    ctx.fillRect(tx - 1, ty - 1, 21, 11);
    ctx.fillStyle = U.gold;
    ctx.fillRect(tx, ty, 19, 9);
    text('NEW', tx + 10, ty + 1, '#1a1206', { align: 'center', outline: false });
    ctx.globalAlpha = 1;
  }
}

function drawTreeFx(pos) {

// ---------- the info box
// Split s into lines no wider than w px.
function wrap(s, w) {
  const out = [];
  let line = '';
  for (const word of s.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (line && tw(t) > w) {
      out.push(line);
      line = word;
    } else line = t;
  }
  if (line) out.push(line);
  return out;
}
// The NOW > NEXT line for stat [label, value at a level]: [[text, colour], ...] (just NOW when every
// level is bought, or when the next level does not change it)
function statSegs(stat, l, done) {
  const [label, val] = stat, now = String(val(l));
  if (done || now === String(val(l + 1))) return [[label, U.dim], [now, U.ink]];
  return [[label, U.dim], [now, now === 'NONE' || now === 'LOCKED' ? U.faint : U.ink], ['>', U.faint], [String(val(l + 1)), U.green]];
}
// The info box for node n: its icon, name and level, what it does, NOW > NEXT, and the price (or why
// it cannot be bought yet). [qx, qy] = where the node is. It sits in a corner of the panel where it
// covers no node.
const INFO_W = 212;
// Where the info box (w x h) for node n at (qx, qy) goes: the first corner of the panel where it
// covers no node (bottom left first). On a small window no corner may be free: then the place where
// it covers the fewest nodes (by RECTS' weights), the nearest one to the node, and never the node.
function infoSpot(n, st, qx, qy, w, h, y0, y1) {
  const hn = halfOf(n), me = [qx - hn - 2, qy - hn - 2, hn * 2 + 4, hn + below(n, st) + 4];
  const over = (r, x, y) => r[0] < x + w && r[0] + r[2] > x && r[1] < y + h && r[1] + r[3] > y;
  const cost = (x, y) => (over(me, x, y) ? 1000 : 0) + RECTS.reduce((k, r) => k + (over(r, x, y) ? r[4] : 0), 0);
  const lo = y0 + 6, hi = y1 - h - 6;
  const spots = [[8, hi], [W - w - 8, hi], [8, lo], [W - w - 8, lo]];
  for (const sp of spots) if (!cost(...sp)) return sp;
  // try right beside the node on each side, and everywhere else in small steps
  const xs = [me[0] - w - 4, me[0] + me[2] + 4, qx - w / 2], ys = [me[1] - h - 4, me[1] + me[3] + 4, qy - h / 2];
  for (let x = 4; x <= W - w - 4; x += 8) xs.push(x);
  for (let y = lo; y <= hi; y += 6) ys.push(y);
  let best = spots[0], bk = Infinity;
  for (const x0 of xs) {
    for (const y0b of ys) {
      const x = Math.round(clamp(x0, 4, W - w - 4)), y = Math.round(clamp(y0b, lo, hi));
      const k = cost(x, y) * 1000 + Math.hypot(x + w / 2 - qx, y + h / 2 - qy);
      if (k < bk) {
        bk = k;
        best = [x, y];
      }
    }

}
function drawInfo(n, [qx, qy], y0, y1) {
  const st = nodeState(n), l = lv(n.id), m = maxLv(n), B = BRANCH[n.br], hid = st === 'hidden';
  const p = parentOf(n), w = INFO_W, inner = w - 14;
  // a '?' tells only what to buy to see it (a node from later in the game: its name, and SOON)
  const named = !hid || (n.later && p && lv(p.id) > 0);
  let tag = '', tagc = U.dim;
  if (!hid) {
    if (n.id === 'root' || n.given) [tag, tagc] = l ? ['OWNED', B.col] : [n.given ? 'LOCKED' : '', U.faint];
    else if (n.star) [tag, tagc] = l ? ['OWNED', B.col] : ['BIG UNLOCK', U.gold];
    else [tag, tagc] = st === 'max' ? ['MAX', B.col] : ['LV ' + l + '/' + m, U.dim];
  }
  const desc = named ? wrap(n.desc, inner) : [p && nodeState(p) !== 'hidden' ? 'BUY ' + p.name + ' TO SEE IT.' : 'GROW THE TREE TO SEE IT.'];
  const vals = hid ? [] : [n.stat, n.stat2].filter(Boolean).map((s) => statSegs(s, l, l >= m));
  // the foot: [left text, colour, price icon, right text, colour]
  let foot = null;
  const surv = n.cur === 'surv', pr = priceOf(n), have = surv ? SAVE.surv : SAVE.scrap, icon = surv ? ICON.survS : ICON.boltS;
  const pcol = !canPay(n) ? U.red : surv ? U.green : U.gold;
  if (hid) foot = named ? ['', U.faint, null, 'COMING SOON', U.faint] : null;
  else if (st === 'locked') foot = ['HOLD FARM STOP ONCE TO GET IT.', U.amber, null, '', U.dim];
  else if (st === 'soon') foot = [fmt(pr), U.faint, icon, 'COMING SOON', U.faint];
  else if (st === 'goal') foot = [fmt(pr), canPay(n) ? U.dim : U.red, icon, 'NEEDS: ' + nodeLv(n.needs[0], n.needs[1]), U.amber];
  else if (st === 'poor') foot = [fmt(pr), U.red, icon, 'NEED ' + fmt(pr - have) + ' MORE', U.red];
  else if (st === 'buy') foot = pr ? [fmt(pr), pcol, icon, 'CLICK TO BUY', U.gold] : ['FREE', U.gold, null, 'CLICK TO TAKE IT', U.gold];
  const h = 25 + desc.length * 10 + vals.length * 10 + (foot ? 15 : 0) + 3;
  const [x, y] = infoSpot(n, st, qx, qy, w, h, y0, y1);
  panel(x, y, w, h, 'rgba(13,14,18,0.96)');
  ctx.fillStyle = hid ? '#3a3e48' : B.col;
  ctx.fillRect(x + 2, y + 1, w - 4, 1);
  // head: the icon, the name and its branch; the level on the right
  if (hid) {
    frame(x + 6, y + 5, 14, 14, '#3a3e48');
    text('?', x + 14, y + 9, U.faint, { align: 'center', outline: false });
  } else blit(st === 'locked' ? ICON.lock : NICON[n.id], x + 6 + (st === 'locked' ? 2 : 0), y + 5 + (st === 'locked' ? 2 : 0));
  text(named ? n.name : '???', x + 25, y + 5, hid ? U.dim : n.id === 'root' ? U.gold : B.col);
  text(n.id === 'root' ? 'THE ROOT' : B.name, x + 25, y + 14, U.faint, { outline: false });
  if (tag) text(tag, x + w - 7, y + 5, tagc, { align: 'right' });
  let ty = y + 24;
  for (const d of desc) {
    text(d, x + 7, ty, U.ink);
    ty += 10;
  }
  for (const segs of vals) {
    let tx = x + 7;
    for (const [s, c] of segs) tx += text(s, tx, ty, c) + 5;
    ty += 10;
  }
  if (!foot) return;
  ctx.fillStyle = '#24272e';
  ctx.fillRect(x + 6, ty + 1, w - 12, 1);
  ty += 5;
  const [lt, lc, li, rt, rc] = foot;
  let fx = x + 7;
  if (li) {
    blit(li, fx - 1, ty);
    fx += 7;
  }
  if (lt) text(lt, fx, ty, lc);
  if (rt) {
    const blink = rc === U.gold && Math.sin(realT * TAU) < -0.3;

  }

// stationtab.js - the STATION tab of the Depot: a station's 14 x 9 grid drawn with the real sprites
// (rails and the parked train, platform, lamps, house, the door path, the corn at the edges), and
// the towers you build on it. Cards on the right pick what to build (keys 1-3), an info box tells
// what it does, a waves box tells where the dead come from. Also the hold's bar in the run.

// ST = the tab's state: id = the station shown, sel = the tower type being placed, drag = a tower
// being moved {o, c, r}, flash = {c, r, t} the tile just built on, pops = little +N / -N words
const ST = { id: 'farm', sel: null, drag: null, flash: null, pops: [], paint: false };
const ST_CARDS = [

  { t: 'bag', key: '2', name: 'SANDBAGS' },
  { t: 'wire', key: '3', name: 'WIRE' },
  { t: 'mortar', key: '4', name: 'MORTAR' }

const ST_GUIDE = [
  'THIS IS FARM STOP. YOUR TOWERS WAIT HERE.',
  'WAVE 2 CAME FROM THE EAST. PUT A NEW MG NEST THERE.',
  'DRAG TO MOVE. RIGHT CLICK: SELL (FULL REFUND).'

const GUIDE_TILE = [11, 5];

// the stations you can see in the tab: Farm Stop, and the others once reached
const stTabList = () => STATIONS.filter((d, i) => i === 0 || SAVE.reached.includes(d.id));
const stDef = () => stTabList().find((d) => d.id === ST.id) || STATIONS[0];

const wireOpen = () => lv('wire') > 0;
// the guided steps: 0..2, or 3 = done
const guideStep = () => (stationOpen() ? Math.min(3, SAVE.flags.stGuide | 0) : 3);
function guideNext() {
  SAVE.flags.stGuide = guideStep() + 1;
  saveSave();
  SFX.ui();
}

// Where everything goes this frame: k = zoom (2 when the window has the room), T = tile px on
// screen, the grid at (gx, gy), the column on the right at (cx, cy) w cw.
function stLayout(y0, y1) {
  let k = 2;
  if (y1 - y0 - 18 < GRID_R * 32 || W - 14 * 32 - 26 < 150) k = 1;
  const T = TILE * k, gx = 14, gy = y0 + 15, gw = GRID_C * T, gh = GRID_R * T;
  const cx = gx + gw + 12, cw = W - cx - 6;
  return { k, T, gx, gy, gw, gh, cx, cy: gy, cw, y0, y1 };
}
let ST_L = stLayout(19, 331);
// the tile under the mouse, or null
function stTile(L) {
  const c = Math.floor((M.x - L.gx) / L.T), r = Math.floor((M.y - L.gy) / L.T);
  return M.inside && c >= 0 && r >= 0 && c < GRID_C && r < GRID_R ? { c, r } : null;
}
// screen point of a world offset round the station: u px east of the rails, a px along (south +)
const stX = (L, u) => L.gx + (u / TILE + 7) * L.T;
const stY = (L, a) => L.gy + (a / TILE + 4) * L.T;
// a sprite (with anchor ax, ay) at a screen point, at the zoom
function zblit(spr, x, y, ax, ay, k) {
  blit(spr, Math.round(x - ax * k), Math.round(y - ay * k), spr.width * k, spr.height * k);
}

// ---------- the build rules
const itemAt = (list, c, r) => list.find((o) => o.c === c && o.r === r) || null;
// why tower type t can't go on tile (c, r) now ('' = it can)
function whyNot(def, list, t, c, r, moving) {
  if (tileAt(def, c, r) !== '.') return 'BLOCKED';
  const o = itemAt(list, c, r);
  if (o && o !== moving) return 'TAKEN';
  if (moving) return '';
  if (t === 'wire' && !wireOpen()) return 'LOCKED';
  if (builtOf(list, t) >= TOWER[t].max) return 'MAX';
  if (towerPrice(list, t) > SAVE.scrap) return 'SCRAP';
  return '';
}
// Build tower type t on tile (c, r) of station id and pay for it. True when built.
function stPlace(id, t, c, r) {
  const def = stopDef(id), list = towersOf(id);
  if (!def || !TOWER[t] || whyNot(def, list, t, c, r)) return false;
  const paid = towerPrice(list, t);
  list.push({ t, c, r, paid });
  SAVE.scrap -= paid;
  SAVE.towers[id] = list;
  saveSave();
  SFX.place();
  ST.flash = { c, r, t: realT };
  stPop(c, r, paid ? '-' + paid : 'FREE', paid ? U.gold : U.green);
  if (t === 'nest' && guideStep() === 1) guideNext();
  return true;
}
// Sell what stands on tile (c, r): all of its price comes back (a free one goes back to FREE).
function stSell(id, c, r) {
  const list = towersOf(id), o = itemAt(list, c, r);
  if (!o) return false;
  list.splice(list.indexOf(o), 1);
  SAVE.scrap += o.paid;
  SAVE.towers[id] = list;
  saveSave();
  SFX.sell();
  stPop(c, r, o.paid ? '+' + o.paid : 'FREE', o.paid ? U.gold : U.green);
  return true;
}
// Move what stands on (c, r) to (c2, r2). Free.
function stMove(id, c, r, c2, r2) {
  const def = stopDef(id), list = towersOf(id), o = itemAt(list, c, r);
  if (!o || whyNot(def, list, o.t, c2, r2, o)) return false;
  o.c = c2;
  o.r = r2;
  SAVE.towers[id] = list;
  saveSave();
  SFX.place();
  ST.flash = { c: c2, r: r2, t: realT };
  return true;
}
function stPop(c, r, s, col) {
  ST.pops.push({ c, r, s, col, t: realT });
}
function stSelect(t) {
  if (!canBuild() || t === 'mortar') {
    SFX.deny();
    return;
  }
  if (t === 'wire' && !wireOpen()) {
    SFX.deny();
    return;
  }
  ST.sel = ST.sel === t ? null : t;
  ST.drag = null;
  SFX.ui();
}
// Keys on the Station tab: 1-3 pick a tower, ESC drops it (true when the key was used here).
function stationKey(k) {
  const card = ST_CARDS.find((c) => c.key === k && c.t !== 'mortar');
  if (card) {
    stSelect(card.t);
    return true;
  }
  if (k === 'Escape' && (ST.sel || ST.drag)) {
    ST.sel = null;
    ST.drag = null;
    SFX.ui();
    return true;
  }
  return false;
}
function stPick(dir) {
  const list = stTabList(), i = Math.max(0, list.findIndex((d) => d.id === ST.id));
  if (list.length < 2) return;
  ST.id = list[mod(i + dir, list.length)].id;
  ST.sel = ST.drag = null;
  SFX.ui();
}

// ---------- the tab
function drawStationTab(y0, y1) {
  const L = (ST_L = stLayout(y0, y1)), def = stDef(), list = towersOf(def.id), open = canBuild();
  ST.id = def.id;
  const tile = stTile(L);
  stHeader(L, def);
  stInput(L, def, list, tile);
  stGrid(L, def, list, tile);
  stCards(L, def, list);
  if (!open) stLocked(L, def);
  else if (guideStep() < 3 && def.id === 'farm') stGuide(L);
}
// The top line: the station picker, and the hold times.
function stHeader(L, def) {
  const y = L.y0 + 2, many = stTabList().length > 1;
  if (button(L.gx, y, 13, 12, '<', { off: !many })) stPick(-1);
  const nw = 100;
  panel(L.gx + 15, y, nw, 12, '#0b0c0f');
  text(def.name, L.gx + 15 + nw / 2 - tw(def.km.toFixed(1) + ' KM') / 2 - 3, y + 3, U.teal, { align: 'center' });
  text(def.km.toFixed(1) + ' KM', L.gx + 15 + nw / 2 + tw(def.name) / 2 + 3, y + 3, U.dim, { align: 'center' });
  if (button(L.gx + 17 + nw, y, 13, 12, '>', { off: !many })) stPick(1);
  const s = 'FIRST HOLD ' + def.first.T + ' S, LATER ' + def.later.T + ' S';
  if (L.gx + 140 + tw(s) < L.gx + L.gw) text(s, L.gx + L.gw, y + 3, U.dim, { align: 'right' });

// The mouse on the grid: place, paint wire, drag to move, right click to sell or drop.
function stInput(L, def, list, tile) {
  if (!canBuild()) return;
  if (tile && (ST.sel || itemAt(list, tile.c, tile.r))) cursor = 'pointer';
  if (M.rpressed) {
    if (tile && itemAt(list, tile.c, tile.r) && !ST.drag) stSell(def.id, tile.c, tile.r);
    else if (ST.sel || ST.drag) {
      ST.sel = ST.drag = null;
      SFX.ui();
    }
    M.rpressed = false;
    return;
  }
  if (M.pressed && tile && !M.used) {
    const o = itemAt(list, tile.c, tile.r);
    if (ST.sel) {
      if (!stPlace(def.id, ST.sel, tile.c, tile.r) && !o) SFX.deny();
      ST.paint = ST.sel === 'wire';
    } else if (o) ST.drag = { o, c: o.c, r: o.r };
    M.used = true;
  }
  // wire: hold the button and paint
  if (ST.paint && M.down && ST.sel === 'wire' && tile && !itemAt(list, tile.c, tile.r)) {
    if (!whyNot(def, list, 'wire', tile.c, tile.r)) stPlace(def.id, 'wire', tile.c, tile.r);
  }
  if (!M.down) ST.paint = false;
  if (ST.drag && M.released) {

    ST.drag = null;
