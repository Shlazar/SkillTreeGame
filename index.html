}
// warnings under the top bar: the dead on the track or on the train, the helicopter too far away,
// the survivors boarding
function drawWarnings() {
  if (G.result) return;
  const red = Math.floor(realT * 3) % 2 === 0 ? U.red : '#a8241a', st = G.station, L = [];
  if (G.blocked) L.push(['THE DEAD ARE ON THE TRACK AHEAD', red]);
  if (G.onTrain > 0) L.push([G.onTrain + (G.onTrain > 1 ? ' ZOMBIES' : ' ZOMBIE') + ' ON THE TRAIN', red]);
  if (G.heli.far) L.push(['STAY WITH THE TRAIN  (F)', U.amber]);
  if (st && st.state === 'boarding') {
    L.push(['SURVIVORS ABOARD ' + st.saved + ' / ' + G.ti.people, '#8fd18a']);
    if (st.blockedT > 0.6) L.push(['CLEAR THE DEAD FROM THE STATION DOOR', U.amber]);
  }
  L.forEach(([t, c], i) => text(t, W / 2, 24 + i * 10, c, { align: 'center' }));
}
// An arrow on the edge of the screen pointing at (wx, wy) in the world when that is out of view,
// with a label just inside it.
function edgeArrow(wx, wy, col, label) {
  const sx = wx - G.camX, sy = wy - G.camY;
  if (sx > 8 && sx < W - 8 && sy > 26 && sy < H - 8) return false;
  // the arrows keep inside a frame below the warnings: x 12..W-12, y 62..H-12
  const cx = W / 2, cy = (62 + H - 12) / 2, hw = W / 2 - 12, hh = (H - 74) / 2;
  const dx = sx - cx, dy = sy - cy, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
  const t = Math.min(hw / Math.max(1e-6, Math.abs(dx)), hh / Math.max(1e-6, Math.abs(dy)));
  const ax = Math.round(cx + dx * t), ay = Math.round(cy + dy * t);
  // a small triangle, tip toward the target, with a dark edge
  for (const [c, g] of [['#07080a', 1], [col, 0]]) {
    ctx.fillStyle = c;
    for (let py = -6; py <= 6; py++) for (let px = -6; px <= 6; px++) {
      const a = px * ux + py * uy, b = -px * uy + py * ux;
      if (a <= 4 + g && a >= -3 - g && Math.abs(b) <= (4 - a) * 0.62 + g * 0.9) ctx.fillRect(ax + px, ay + py, 1, 1);
    }
  }
  // the label just inside the arrow: beside it on the left and right edges, under or over it on
  // the top and bottom
  if (label) {
    const w = tw(label), side = Math.abs(dx) * hh > Math.abs(dy) * hw;
    const lx = side ? ax - Math.sign(ux) * (9 + w / 2) : ax, ly = side ? ay - 3 : ay - Math.sign(uy) * 11 - 3;
    text(label, clamp(lx, w / 2 + 4, W - w / 2 - 4), clamp(ly, 22, H - 10), col, { align: 'center' });
  }
  return true;
}
// Arrows to the train, and to trouble out of view: the dead on a car, on the track ahead, after a
// survivor.
const ON_CAR = [0, 0, 0, 0, 0];
function drawArrows() {
  const tr = G.tr, c = tr.cars[2];
  ON_CAR.fill(0);
  let rail = null, rd = 1e9;
  for (const z of G.zombies) {
    if (z.dead) continue;
    if (z.st === 2) ON_CAR[z.car]++;
    else if (z.st === 1) {
      const ds = tr.s - trackLocal(z.x, z.y, TL).a;
      if (ds > 0 && ds < 300 && ds < rd) { rd = ds; rail = z; }
    }
  }
  // the train (its middle): gold, red with a count when the dead are on it; or, when the train is
  // in view, an arrow to any car under attack that is not
  const n = G.result ? 0 : G.onTrain;
  if (!edgeArrow(c.cx, c.cy, n ? U.red : U.gold, 'TRAIN ' + Math.round(Math.hypot(c.cx - G.camX - W / 2, c.cy - G.camY - H / 2) / 2) + 'M' + (n ? '  ' + n + '!' : ''))) {
    if (!G.result) ON_CAR.forEach((m, k) => { if (m) edgeArrow(tr.cars[k].cx, tr.cars[k].cy, U.red, m + '!'); });
  }
  if (G.result) return;
  if (rail) edgeArrow(rail.x, rail.y, U.red, 'TRACK');
  const held = G.people.find((p) => p.st === 'grab'), out = G.people.find((p) => p.st === 'run');
  if (held) edgeArrow(held.x, held.y, U.red, 'HELP');
  else if (out) edgeArrow(out.x, out.y, '#8fd18a', 'SURVIVOR');
}
// The radar: the land round the helicopter, 1280 px across, north up. The railway, the train,
// the dead (bright red: on the track or the train), survivors, the station, the safe zone wall,
// and the view.
function drawRadar() {
  const R = 36, x0 = W - R * 2 - 6, y0 = H - R * 2 - 6, cx = x0 + R, cy = y0 + R, k = R / 640;
  const hx = G.camX + W / 2, hy = G.camY + H / 2;
  ctx.fillStyle = 'rgba(6,10,8,0.84)';
  ctx.fillRect(x0, y0, R * 2, R * 2);
  frame(x0 - 1, y0 - 1, R * 2 + 2, R * 2 + 2, '#2e3139');
  ctx.fillStyle = 'rgba(86,194,168,0.12)';
  ctx.fillRect(cx, y0, 1, R * 2);
  ctx.fillRect(x0, cy, R * 2, 1);
  const dot = (wx, wy, c, s) => {
    const px = Math.round(cx + (wx - hx) * k), py = Math.round(cy + (wy - hy) * k);
    if (px < x0 || py < y0 || px > x0 + R * 2 - s || py > y0 + R * 2 - s) return;
    ctx.fillStyle = c;
    ctx.fillRect(px, py, s, s);
  };
  for (let wy = hy - 640; wy <= hy + 640; wy += 14) dot(trackX(wy), wy, '#3e434c', 1);
  if (G.goalY > hy - 640 && G.goalY < hy + 640) for (let dx = -560; dx <= 560; dx += 18) dot(trackX(G.goalY) + dx, G.goalY, '#8fd18a', 1);
  const st = G.station;
  if (st) dot(st.house.x - 1, st.house.y - 1, '#9fd3f2', 2);
  for (const z of G.zombies) if (!z.dead) dot(z.x, z.y, z.st ? '#ff4a32' : '#7a2a22', 1);
  for (const p of G.people) if (p.st === 'run' || p.st === 'wait' || p.st === 'grab') dot(p.x, p.y, '#8fd18a', 1);
  for (const c of G.tr.cars) dot(c.cx - 1, c.cy - 1, '#e8dfc8', 2);
  // the view
  const vx = Math.round(cx - W / 2 * k), vy = Math.round(cy - H / 2 * k);
  ctx.globalAlpha = 0.55;
  frame(vx, vy, Math.round(W * k) + 1, Math.round(H * k) + 1, '#9fd3f2');
  ctx.globalAlpha = 1;
  text('N', cx, y0 + 2, U.faint, { align: 'center', outline: false });
}

// first seconds of a run: how to play
function drawHint() {

// red screen edge while the train is nearly lost
function drawTension() {
  const f = G.tr.hp / G.k.trainMax;
  if (mode !== 'play' || G.result || f >= 0.35) return;
  let a = 0.3 + 0.5 * (1 - f / 0.35);
  if (!REDUCED) a *= 0.7 + 0.3 * Math.sin(realT * 7);
  ctx.fillStyle = '#c0301f';
  for (let k = 0; k < 3; k++) {
    ctx.globalAlpha = a * (1 - k * 0.3);

    ctx.fillRect(k, H - 1 - k, W - 2 * k, 1);
    ctx.fillRect(k, k, 1, H - 2 * k);
    ctx.fillRect(W - 1 - k, k, 1, H - 2 * k);

}

// depot.js - the DEPOT between runs: spend the bank on upgrades (14 cards in 3 columns: the
// helicopter, the train and the station), pick a trip on the route, and go. The title demo runs on
// behind a dark veil. On a narrow screen the columns become tabs; on a short one the cards are
// smaller and lose their effect line.

// tab = the column shown on a narrow screen, flash[id] = time left of a bought card's flash,
// pops = rising "+1"s
const DEP = { tab: 0, flash: {}, pops: [] };
const GROUP_ICON = () => [ICON.heli, ICON.train, ICON.house];

// Where everything goes at this screen size.
function depotLayout() {
  const narrow = W < 632, short = H < 360, ch = short ? 30 : 44, gap = short ? 32 : 48;
  const top = narrow ? 42 : 38, py = H - (short ? 64 : 68), x0 = Math.floor((W - 624) / 2);
  const cards = [];
  for (const u of UPG) {
    if (narrow && u.group !== DEP.tab) continue;
    const i = cards.filter((c) => c.u.group === u.group).length;
    cards.push({ u, x: narrow ? Math.floor((W - 200) / 2) : x0 + u.group * 212, y: top + i * gap, w: 200, h: ch });
  }
  return { narrow, short, cards, x0, py, rw: narrow ? Math.max(100, W - 200) : 360 };
}

// One upgrade card. Left click buys, right click pins it (the run's top bar then counts toward it).
function depotCard(c, w, sh) {
  const u = c.u, id = u.id, L = lvl(id), max = upgMaxed(id), locked = upgLocked(id), cost = upgCost(id);
  const can = !max && !locked && cost <= w, hov = inR(M.x, M.y, c.x, c.y, c.w, c.h), fl = DEP.flash[id] > 0;
  const x = c.x, y = c.y;
  ctx.fillStyle = fl ? '#d8d2c0' : hov ? '#17191e' : '#101115';
  ctx.fillRect(x + 1, y + 1, c.w - 2, c.h - 2);
  frame(x, y, c.w, c.h, can ? (Math.sin(realT * 6) > 0 ? '#f0c264' : '#9a7228') : hov ? '#4a4f5a' : '#2e3139');
  ctx.fillStyle = '#1c1e24';
  ctx.fillRect(x + 2, y + 1, c.w - 4, 1);
  ctx.globalAlpha = locked ? 0.35 : 1;
  ctx.drawImage(ICON.up[id], x + 6, y + (sh ? 9 : 6));
  ctx.globalAlpha = 1;
  text(locked ? '???' : u.name, x + 24, y + 5, locked ? U.faint : U.ink);
  if (!locked) text(max ? 'MAX' : 'LV ' + L, x + 194, y + 5, max ? '#8fd18a' : U.dim, { align: 'right' });
  if (!sh && !locked) {
    const fx = max ? u.val(L) + ' ' + u.unit : u.group === 2 && id !== 'pads' && !L ? 'NOT BUILT > BUILD' : u.val(L) + ' > ' + u.val(L + 1) + ' ' + u.unit;
    text(fx, x + 24, y + 17, U.dim, { outline: false });
  }
  const ry = y + (sh ? 17 : 30), pyy = y + (sh ? 15 : 27);
  if (!locked) text(u.role, x + 24, ry, '#4e525b', { outline: false });
  if (locked) text('REACH TRIP ' + u.trip, x + 194, pyy + 3, U.faint, { align: 'right', outline: false });
  else if (!max) {
    ctx.fillStyle = can ? '#2e2310' : '#17181c';
    ctx.fillRect(x + 137, pyy + 1, 56, 11);
    frame(x + 136, pyy, 58, 13, can ? U.gold : '#3a3e48');
    text('$' + fmt(cost), x + 165, pyy + 3, can ? U.gold : U.faint, { align: 'center', outline: false });
  }
  if (META.pin === id) ctx.drawImage(ICON.pin, x + 2, y + 2);
  if (hov && !locked) cursor = 'pointer';
  if (hov && M.rpressed && !locked && !max) {
    META.pin = META.pin === id ? null : id;
    saveMeta();
    SFX.ui();
  }
  if (M.released && !M.used && inR(M.px, M.py, x, y, c.w, c.h) && hov) {
    M.used = true;
    if (buyUpg(id)) {
      DEP.flash[id] = 0.15;
      DEP.pops.push({ x: x + 165, y: y + 4, t: 0 });
      SFX.buy();
    } else if (!locked && !max) SFX.ui();
  }
  return hov;
}

// Pick the trip: one step back or on (only up to the farthest one unlocked).
function depotTrip(d) {
  const t = clamp(META.trip + d, 1, META.maxTrip);
  if (t !== META.trip) {
    META.trip = t;
    saveMeta();
    SFX.ui();
  }
}
// The longest of the strings that fits in width w.
const fitText = (list, w) => list.find((s) => tw(s) <= w) || list[list.length - 1];
// Split a long line into lines no wider than w.
function wrapText(s, w) {
  const out = [];
  let line = '';
  for (const word of s.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (line && tw(t) > w) {
      out.push(line);
      line = word;
    } else line = t;
  }
  if (line) out.push(line);
  return out;
}

function depotGo() {

}
// keys in the depot: Enter goes, Esc to the title, A / D (or the arrows) pick the trip, Tab
// changes the column on a narrow screen
function depotKey(k) {
  if (k === 'Enter') depotGo();
  else if (k === 'Escape') toTitle();
  else if (k === 'a' || k === 'ArrowLeft') depotTrip(-1);
  else if (k === 'd' || k === 'ArrowRight') depotTrip(1);
  else if (k === 'Tab') DEP.tab = (DEP.tab + 1) % 3;

// main.js - input (mouse, keys, wheel), the camera mode, the main loop (fixed steps with hit-stop)
// and the start-up. window.__sr is a small API for tests and the browser console.

// ---------- camera mode
function setThermal(k) {
  thermal = k;
  if (mode === 'play' || mode === 'ending') banner('CAMERA', CAMS[thermal], thermal ? '#e8e8e8' : U.ink, 3);
}

// ---------- input
// Browser pointer position -> game pixels.
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
});
cv.addEventListener('pointerleave', () => { M.inside = false; });
cv.addEventListener('pointerdown', (e) => {
  audioInit();
  try { cv.focus({ preventScroll: true }); } catch (_) { /* old browsers */ }
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  M.inside = true;
  // right click: the 105 in play, a UI click (pin, empty a pad) elsewhere
  if (e.button === 2) {
    M.rpressed = true;
    if (mode === 'play' && !paused) tryHE();
    return;
  }
  if (e.button !== 0) return;
  M.down = true;
  M.pressed = true;
  M.px = p.x;
  M.py = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* fine without */ }
  if (mode !== 'play' || p.y < 19 || paused) return;
  G.trigger = true;
});
cv.addEventListener('pointerup', (e) => {
  const p = toCanvas(e);
  M.x = p.x;
  M.y = p.y;
  if (e.button !== 0) return;
  if (M.down) {
    M.down = false;
    M.released = true;
  }
  if (G) G.trigger = false;
});
cv.addEventListener('pointercancel', () => {
  M.down = false;
  if (G) G.trigger = false;
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());
// the wheel zooms in and out one step (bigger or smaller pixels)
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const z = clamp(zoomStep + (e.deltaY < 0 ? 1 : -1), -1, 1);
  if (z !== zoomStep) {
    zoomStep = z;
    onResize();
  }
}, { passive: false });

// KEYS[k] = true while key k is held. keyAxis() = the way WASD / the arrow keys push, [x, y].
const KEYS = {};
const keyName = (e) => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
function keyAxis() {
  return [(KEYS.d || KEYS.ArrowRight ? 1 : 0) - (KEYS.a || KEYS.ArrowLeft ? 1 : 0),
    (KEYS.s || KEYS.ArrowDown ? 1 : 0) - (KEYS.w || KEYS.ArrowUp ? 1 : 0)];
}
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = keyName(e);
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  KEYS[k] = true;
  if (e.repeat) return;
  audioInit();
  if (k === 'm') {
    Au.muted = !Au.muted;
    droneLevel = -1;
    return;
  }
  if (k === 't') {
    setThermal((thermal + 1) % 3);
    return;
  }
  if (mode === 'play') {
    if (k === ' ') tryHE();
    else if (k === 'f') G.heli.home = true;
    else if (k === 'Escape' || k === 'p') {
      paused = !paused;
      G.trigger = false;
    }
  } else if (mode === 'title') {
    if (k === 'Enter' || k === ' ') playTitle();
  } else if (mode === 'depot') {
    if (k === 'Tab') e.preventDefault();
    depotKey(k);
  } else if (mode === 'summary') {
    if (k === 'Enter') toDepot();
    else if (k === 'Escape') toTitle();
  }
});
addEventListener('keyup', (e) => { KEYS[keyName(e)] = false; });
// pause when the window loses focus or the tab is hidden; let go of every key and the trigger
function lostFocus() {
  for (const k in KEYS) KEYS[k] = false;
  if (G) G.trigger = false;
  M.down = false;
  if (mode === 'play') paused = true;
}
addEventListener('blur', lostFocus);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  lostFocus();
  if (G && !G.demo) bankRun();
});
// the page is closing: the run's cash goes in the bank
addEventListener('pagehide', () => { if (G && !G.demo) bankRun(); });
function onResize() {
  if (resize()) {
    bakeOverlays();
    if (G) placeCamera();
  }
}
addEventListener('resize', onResize);

// ---------- main loop
// last = time of the last frame, acc = game time still to step. FPS = stats for the debug API.
// hold = time stands still (tests take close-up pictures this way)
let last = performance.now(), acc = 0, droneLevel = -1, hold = false;
const FPS = { n: 0, sum: 0, worst: 0, t: 0, avg: 0, lastWorst: 0 };
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = (now - last) / 1000;
  last = now;
  const dt = Math.min(0.1, Math.max(0, rdt));
  realT += dt;
  frameDt = dt;
  FPS.n++;
  FPS.sum += rdt;
  FPS.worst = Math.max(FPS.worst, rdt);
  FPS.t += rdt;
  if (FPS.t > 1) {
    FPS.avg = FPS.n / FPS.sum;
    FPS.lastWorst = FPS.worst;
    FPS.n = FPS.sum = FPS.worst = FPS.t = 0;
  }
  // hit-stop: slow motion while slowT lasts
  let ts = 1;
  if (slowT > 0) {
    slowT -= dt;
    ts = slowK;
    if (slowT <= 0) slowK = 1;
  }
  // fixed steps of STEP seconds, at most 8 a frame
  if (!(mode === 'play' && paused) && !hold) {
    acc += dt * ts;
    let n = 0;
    try {
      while (acc >= STEP && n < 8) {
        step(STEP);
        acc -= STEP;
        n++;
      }
    } catch (err) {
      acc = 0;
      if (!loop.errs) {
        loop.errs = 1;
        console.error(err);
      }
    }
    if (n >= 8) acc = 0;
  }
  updateCam(dt);
  const wl = wallet();
  G.shownCash = Math.abs(G.shownCash - wl) < 1 ? wl : lerp(G.shownCash, wl, 1 - Math.exp(-10 * dt));
  // the engine hum: loud in play, quiet behind the menus
  const dl = mode === 'play' && !paused ? 1 : mode === 'ending' ? 0.7 : 0.4;
  if (Au.ctx && dl !== droneLevel) {
    droneLevel = dl;
    drone(dl);
  }
  cursor = 'default';
  try {
    render();
    drawUI();
  } catch (err) {
    if (!loop.rerr) {
      loop.rerr = 1;
      console.error(err);
    }
  }
  // the game draws its own sight, so the mouse pointer hides in play
  cv.style.cursor = mode === 'play' && !paused && M.y >= 19 && cursor === 'default' ? 'none' : cursor;
  M.pressed = false;
  M.released = false;
  M.rpressed = false;
  M.used = false;
}

// ---------- start
function boot() {
  initSprites();
  bakeScorch();
  resize();
  bakeStatic();
  bakeOverlays();
  loadMeta();
  newGame(true);
  mode = 'title';
  window.__sr = {
    get G() { return G; },
    get mode() { return mode; },
    FPS,
    CFG,
    // the sprites, for a test sheet
    art: () => ({ TRAIN, FOOT, HELI, STATION, SURV, ZS }),
    start: (trip) => startGame(trip),
    title: toTitle,
    depot: toDepot,
    // the save: meta() = it, setMeta(o) = change it (lv merges), resetMeta() = erase it,
    // buy(id) = buy one level, trip(n) = unlock trip n and start it
    meta: () => META,
    setMeta: (o) => {
      const lv = o.lv;
      Object.assign(META, o);
      if (lv) META.lv = Object.assign(metaDefaults().lv, lv);
      saveMeta();
      return META;
    },
    resetMeta: () => { resetMeta(); return META; },
    buy: (id) => buyUpg(id),
    trip: (n) => {
      META.maxTrip = Math.max(META.maxTrip, n);
      startGame(n);
    },
    // sim(sec): run the game for sec seconds at once, without drawing
    sim: (sec) => {
      const n = Math.round(sec / STEP);
      for (let i = 0; i < n; i++) step(STEP);
    },
    aim: (x, y) => {
      M.x = x;
      M.y = y;
      M.inside = true;
    },
    trigger: (on) => { G.trigger = !!on && mode === 'play'; },
    he: () => tryHE(),
    thermal: (k) => setThermal(k),
    // hp(v): set the train's health. jump(px): move the train on to px before where it brakes for
    // the station (or, after the station, before the safe zone); the dead are left behind.
    hp: (v) => { G.tr.hp = G.tr.hpShown = v; },
    jump: (px) => {
      const st = G.station, to = (st && st.state === 'ahead' ? st.stopS : G.goalS) + px;
      G.tr.s = Math.min(G.tr.s, to);
      for (const z of G.zombies) z.gone = true;
      layoutTrain();
      placeCamera();
    },
    keys: (k, on) => { KEYS[k] = !!on; },
    // bot(on): the autopilot plays (it aims and pulls the triggers)
    bot: (on) => { G.bot = !!on; if (!on) G.trigger = false; },
    pause: (p) => { paused = !!p; },
    hold: (h) => { hold = !!h; },
    // bench(n): draw n frames at once; the average ms per frame
    bench: (n) => {
      const t = performance.now();
      for (let i = 0; i < n; i++) {
        render();
        drawUI();
      }
      return (performance.now() - t) / n;
    },
    stats: () => ({
      mode, result: G.result, kills: G.kills, cash: Math.round(G.cash), hp: Math.round(G.tr.hp), speed: +G.tr.v.toFixed(1),
      trip: G.trip, wallet: Math.round(wallet()), bank: Math.round(META.cash), mult: +G.mult.toFixed(2), camp: META.camp,
      left: Math.round(G.tr.s - G.goalS), onTrain: G.onTrain, t: +G.run.toFixed(1), zombies: G.zombies.length, bodies: G.bodies.length,
      station: G.station ? G.station.state + ' ' + G.station.saved + '/' + G.station.lost : '-',
      heli: [Math.round(G.heli.ox), Math.round(G.heli.oy)],
      rounds: G.rounds.length, parts: parts.length, texts: texts.length, chunks: GROUND.size, decals: DECALS.size,
      W, H, SCALE, fps: Math.round(FPS.avg), worstMs: Math.round(FPS.lastWorst * 1000), lock: !!G.lock, heat: +G.heat.toFixed(2)
    })
  };
  requestAnimationFrame((t) => {
    last = t;
    requestAnimationFrame(loop);
  });
}
boot();

})();
</script>
