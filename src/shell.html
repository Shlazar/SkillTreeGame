<title>Sky Reaper</title>
<style>
  /* One pixel-art canvas that fills the window at a whole-number zoom. Everything, the menus too,
     is drawn inside it, so there is a single dark colour to set here. */
  :root { --bg: #060708; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { overflow: hidden; }
  #c { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: var(--bg); outline: none; touch-action: none; }
  #c:focus-visible { box-shadow: inset 0 0 0 2px #b8862f; }
</style>
<canvas id="c" width="640" height="360" tabindex="0" role="application" aria-label="Sky Reaper. Protect a train through twelve station legs. Right click to move your Viper or focus an enemy. Q or W arms an equipped plane; left click confirms, drag to turn, and right click cancels. Press a plane key twice for a smart strike. Space uses an owned Turbo Ram. T changes the thermal camera, M toggles sound, and Escape or P pauses. Enter starts or continues from menus. The Depot holds upgrades and plane assignments."></canvas>
